/* ============================================================
   DAILY CHALLENGE — word + verb of the day, streak, calendar
   ============================================================ */
const pad2 = n => String(n).padStart(2, "0");
const keyOf = (y, m, d) => `${y}-${pad2(m + 1)}-${pad2(d)}`;          // local calendar date
const keyOfDate = dt => keyOf(dt.getFullYear(), dt.getMonth(), dt.getDate());
// Everything daily — word, verb, phrase, streak — rolls over at 7:00 AM
// New York time (EST/EDT, daylight saving handled), wherever you are.
const RESET_TZ = "America/New_York", RESET_HOUR = 7;
let NY_FMT = null;
function nyParts(t){
  NY_FMT = NY_FMT || new Intl.DateTimeFormat("en-US", { timeZone: RESET_TZ, hourCycle: "h23",
    year:"numeric", month:"2-digit", day:"2-digit", hour:"2-digit", minute:"2-digit", second:"2-digit" });
  const p = {}; NY_FMT.formatToParts(new Date(t)).forEach(x => p[x.type] = x.value);
  return { y:+p.year, m:+p.month, d:+p.day, h:(+p.hour) % 24, mi:+p.minute, s:+p.second };
}
function learningDayKey(t){
  const p = nyParts(t == null ? Date.now() : t);
  const dt = new Date(Date.UTC(p.y, p.m - 1, p.d));
  if(p.h < RESET_HOUR) dt.setUTCDate(dt.getUTCDate() - 1);    // before 7am it's still yesterday
  return `${dt.getUTCFullYear()}-${pad2(dt.getUTCMonth() + 1)}-${pad2(dt.getUTCDate())}`;
}
const todayKey = () => learningDayKey();
function nextResetMs(t){
  const now = t == null ? Date.now() : t;
  const [y, m, d] = learningDayKey(now).split("-").map(Number);
  const target = Date.UTC(y, m - 1, d + 1, RESET_HOUR, 0, 0);   // 07:00 tomorrow, as wall-clock
  let guess = target;
  for(let i = 0; i < 3; i++){                                     // converge on the real instant
    const p = nyParts(guess);
    guess += target - Date.UTC(p.y, p.m - 1, p.d, p.h, p.mi, p.s);
  }
  return guess;
}
const keyOfIndex = i => { const d = new Date(i * 864e5); return `${d.getUTCFullYear()}-${pad2(d.getUTCMonth() + 1)}-${pad2(d.getUTCDate())}`; };
const dayIndex = k => { const [y, m, d] = k.split("-").map(Number); return Math.floor(Date.UTC(y, m - 1, d) / 864e5); };

const MONTHS_HR = ["siječanj","veljača","ožujak","travanj","svibanj","lipanj","srpanj","kolovoz","rujan","listopad","studeni","prosinac"];
const MONTHS_EN = ["January","February","March","April","May","June","July","August","September","October","November","December"];

let WORD_POOL = null;
function wordPool(){
  if(WORD_POOL) return WORD_POOL;
  const seen = new Set(), out = [];
  const add = (hr, en) => {
    const w = String(hr).trim();
    if(!/^[a-zčćđšž]{3,12}$/i.test(w)) return;          // single real words only
    if(/(ti|ći)$/i.test(w)) return;                        // verbs have their own slot
    const k = w.toLowerCase();
    if(seen.has(k)) return;
    seen.add(k); out.push([w, en]);
  };
  const ok = x => !/vocative|\(\+[GDALI]\)/i.test(x[1]);       // skip vocative forms and bare prepositions
  PACKS.forEach(p => p.w.filter(ok).forEach(x => add(x[0], x[1])));
  UNITS.forEach(u => u.vocab.filter(ok).forEach(x => add(x[0], x[1])));
  WORD_POOL = out;
  return out;
}
function wordOfDay(k){ const p = wordPool(); return p[(dayIndex(k || todayKey()) * 7919) % p.length]; }
function verbOfDay(k){ return VERBS[(dayIndex(k || todayKey()) * 104729) % VERBS.length]; }

function todayRec(){ S.daily = S.daily || {}; const k = todayKey(); return S.daily[k] = S.daily[k] || {}; }
function dayDone(k){ const r = (S.daily || {})[k]; return !!(r && r.word && r.verb); }

function dailyStreak(){
  let i = dayIndex(todayKey());
  if(!dayDone(keyOfIndex(i))) i--;                                // an unfinished today doesn't break it
  let n = 0;
  while(dayDone(keyOfIndex(i))){ n++; i--; }
  return n;
}
function bestStreak(){
  const idx = Object.keys(S.daily || {}).filter(dayDone).map(dayIndex).sort((a, b) => a - b);
  let best = 0, run = 0, prev = null;
  idx.forEach(i => { run = (prev !== null && i === prev + 1) ? run + 1 : 1; best = Math.max(best, run); prev = i; });
  return best;
}

/* ---- does the sentence actually use the word? ---- */
function tokens(s){ return norm(s).split(/[^a-z]+/).filter(Boolean); }
const SHORT_FORMS = {
  taj:["taj","ta","to","tu","tog","toga","tom","toj","te","ti","tim"], to:["taj","ta","to","tu","tog","toga","tom","toj","te","ti","tim"],
  ovaj:["ovaj","ova","ovo","ovu","ovog","ovom","ovoj","ove","ovi","ovim"], ovo:["ovaj","ova","ovo","ovu","ovog","ovom","ovoj","ove","ovi","ovim"],
  onaj:["onaj","ona","ono","onu","onog","onom","onoj","one","oni","onim"]
};
function usesWord(sentence, word){
  const w = norm(word), stem = w.slice(0, Math.max(3, w.length - 2));
  const extra = SHORT_FORMS[w];
  if(extra && tokens(sentence).some(t => extra.includes(t))) return true;
  return tokens(sentence).some(t => t.startsWith(stem) || (t.length >= 3 && editDistance(t, w) <= 2));
}
function verbForms(v){
  const strip = s => s.replace(/ se$/, "").replace(/ ću( se)?$/, "");
  const f = new Set([strip(v.i), ...v.p.map(strip), v.pm, v.pf, strip(v.fu)]);
  f.add(v.pf.replace(/la$/, "li")); f.add(v.pf.replace(/la$/, "le")); f.add(v.pf.replace(/la$/, "lo"));
  return [...f].map(norm);
}
function usesVerb(sentence, v){
  const forms = verbForms(v);
  return tokens(sentence).some(t => forms.includes(t) || (t.length >= 4 && forms.some(f => f.length >= 4 && editDistance(t, f) <= 1)));
}

/* ---- Today's word and verb are pinned the first time you see them, and a
   finished day keeps the exact word you did, even if the lists change later. ---- */
function todayWord(){
  const r = (S.daily || {})[todayKey()] || {};
  return r.wordHr ? [r.wordHr, r.wordEn || ""] : wordOfDay();
}
function todayVerb(){
  const r = (S.daily || {})[todayKey()] || {};
  if(r.verbI){ const v = VERBS.find(x => x.i === r.verbI); if(v) return v; }
  return verbOfDay();
}
function pinToday(){
  const r = todayRec(); let ch = false;
  if(!r.wordHr){ const w = wordOfDay(); r.wordHr = w[0]; r.wordEn = w[1]; ch = true; }
  if(!r.verbI){ const v = verbOfDay(); r.verbI = v.i; r.verbEn = v.en; ch = true; }
  return ch;
}

// Days finished before words were pinned: recover which word that day really
// used. Try the formula as it was before the lists grew, then the current one,
// and only keep a match the learner's own sentence confirms.
function legacyPool(){
  const seen = new Set(), out = [];
  const add = (hr, en) => {
    const w = String(hr).trim();
    if(!/^[a-zčćđšž]{3,12}$/i.test(w) || /(ti|ći)$/i.test(w)) return;
    const k = w.toLowerCase(); if(seen.has(k)) return; seen.add(k); out.push([w, en]);
  };
  PACKS.forEach(p => p.w.forEach(x => add(x[0], x[1])));
  UNITS.forEach(u => u.vocab.forEach(x => add(x[0], x[1])));
  return out;
}
function migrateDaily(){
  let ch = false, old = null;
  Object.keys(S.daily || {}).forEach(k => {
    const r = S.daily[k], di = dayIndex(k);
    if(r.word && !r.wordHr && r.wordS){
      old = old || legacyPool();
      const tries = [old[(di * 7919) % old.length], wordPool()[(di * 7919) % wordPool().length]];
      const hit = tries.find(w => w && usesWord(r.wordS, w[0]));
      if(hit){ r.wordHr = hit[0]; r.wordEn = hit[1]; ch = true; }
    }
    if(r.verb && !r.verbI && r.verbS){
      const tries = [VERBS[(di * 104729) % 46], VERBS[(di * 104729) % VERBS.length]];
      const hit = tries.find(v => v && usesVerb(r.verbS, v));
      if(hit){ r.verbI = hit.i; r.verbEn = hit.en; ch = true; }
    }
  });
  return ch;
}

function inCards(hr, en){ return !!(S.cards || {})[cardKey(hr, en)]; }
function toggleDailyCard(kind){
  const v = todayVerb(), w = todayWord();
  const hr = kind === "word" ? w[0] : v.i, en = kind === "word" ? w[1] : v.en;
  S.cards = S.cards || {};
  const k = cardKey(hr, en);
  if(S.cards[k]) dropCard(k); else putCard(k, { src: kind === "word" ? "Word of the day" : "Verb of the day" });
  save(); vHome();
}
function cardToggleHTML(kind){
  const v = todayVerb(), w = todayWord();
  const on = kind === "word" ? inCards(w[0], w[1]) : inCards(v.i, v.en);
  return `<button class="btn ${on ? "ghost" : ""} sm" style="margin-top:10px" onclick="toggleDailyCard('${kind}')">${
    on ? "\u2605 In your flashcards" : "\u2606 Add to flashcards"}</button>${
    on ? `<span style="font-size:12px;color:var(--stone-dim);margin-left:8px">tap to remove</span>` : ""}`;
}

// A plain-English note on what the word really means and when it's used,
// because one English translation often covers several different senses.
const NOTE_BUSY = new Set(), NOTE_FAIL = new Set();
// Words that change with gender: a fixed, checked note instead of an AI one.
const FORM_NOTES = {
  taj:   {f:"taj · ta · to", m:"“That” — it matches the noun: taj (masculine), ta (feminine), to (neuter). On its own, with no noun after it, always use to: Što je to? = What’s that?", ex:"Taj auto je nov, ali to nije moj auto.", exEn:"That car is new, but that’s not my car."},
  to:    {f:"taj · ta · to", m:"The everyday “that” when it stands on its own: To je dobro. Before a noun it matches the noun: taj (m), ta (f), to (n).", ex:"Što je to? To je moja knjiga.", exEn:"What’s that? That’s my book."},
  ovaj:  {f:"ovaj · ova · ovo", m:"“This” (near me). It matches the noun: ovaj (m), ova (f), ovo (n). On its own, use ovo: Ovo je super.", ex:"Ova kava je odlična.", exEn:"This coffee is great."},
  ovo:   {f:"ovaj · ova · ovo", m:"The everyday “this” on its own: Ovo je moj brat. Before a noun it matches the noun: ovaj (m), ova (f), ovo (n).", ex:"Ovo je moj brat.", exEn:"This is my brother."},
  onaj:  {f:"onaj · ona · ono", m:"“That one over there” — further away than taj. It matches the noun: onaj (m), ona (f), ono (n).", ex:"Vidiš onu kuću?", exEn:"Do you see that house over there?"},
  moj:   {f:"moj · moja · moje", m:"“My” — it matches the thing you own, not you: moj brat, moja mama, moje auto.", ex:"Moja sestra živi u Splitu.", exEn:"My sister lives in Split."},
  tvoj:  {f:"tvoj · tvoja · tvoje", m:"“Your” for one person you’re casual with. It matches the thing owned: tvoj, tvoja, tvoje.", ex:"Je li ovo tvoja jakna?", exEn:"Is this your jacket?"},
  njegov:{f:"njegov · njegova · njegovo", m:"“His”. It matches the thing owned: njegov auto, njegova kuća.", ex:"Njegova mama je jako draga.", exEn:"His mom is really nice."},
  njezin:{f:"njezin · njezina · njezino", m:"“Her”. It matches the thing owned: njezin brat, njezina kuća. You’ll also hear the shorter njen.", ex:"Njezin brat igra nogomet.", exEn:"Her brother plays football."},
  "naš": {f:"naš · naša · naše", m:"“Our”. It matches the thing owned: naš stan, naša ulica.", ex:"Naša kuća je blizu mora.", exEn:"Our house is near the sea."},
  "vaš": {f:"vaš · vaša · vaše", m:"“Your” for more than one person, or polite to one. It matches the thing owned: vaš stol, vaša narudžba.", ex:"Evo vaše kave.", exEn:"Here’s your coffee."},
  njihov:{f:"njihov · njihova · njihovo", m:"“Their”. It matches the thing owned: njihov pas, njihova djeca.", ex:"Njihov pas je ogroman.", exEn:"Their dog is huge."},
  svoj:  {f:"svoj · svoja · svoje", m:"“My / your / his own” — used when the owner is the person doing the action: Uzmi svoju torbu = Take your (own) bag.", ex:"Ana voli svoj posao.", exEn:"Ana loves her job."},
  koji:  {f:"koji · koja · koje", m:"“Which” or “that/who” joining two ideas. It matches the noun: koji film, koja knjiga, koje vino.", ex:"Koja ti je omiljena hrana?", exEn:"What’s your favorite food?"},
  "čiji": {f:"čiji · čija · čije", m:"“Whose”. It matches the thing owned: čiji je ovo mobitel? čija je ova torba?", ex:"Čija je ova torba?", exEn:"Whose bag is this?"},
  kakav: {f:"kakav · kakva · kakvo", m:"“What kind of / what’s it like”. It matches the noun: kakav film, kakva kuća, kakvo vrijeme.", ex:"Kakvo je vrijeme danas?", exEn:"What’s the weather like today?"},
  jedan: {f:"jedan · jedna · jedno", m:"“One” — it matches the noun: jedan sok, jedna kava, jedno pivo.", ex:"Jedna kava i jedan sok, molim.", exEn:"One coffee and one juice, please."}
};
function formNote(){ return FORM_NOTES[todayWord()[0].toLowerCase()] || null; }

const NOTE_RETRIED = new Set();
function retryNote(kind){ NOTE_FAIL.delete(kind); NOTE_RETRIED.delete(kind); if(CUR === "home") vHome(); fetchNote(kind); }
async function fetchNote(kind){
  const r = todayRec();
  if(r[kind + "Note"] || NOTE_BUSY.has(kind) || NOTE_FAIL.has(kind)) return;
  if(kind === "word" && formNote()) return;
  NOTE_BUSY.add(kind);
  const w = todayWord(), v = todayVerb();
  const prompt = kind === "word"
    ? `Croatian word: "${w[0]}" (rough English: "${w[1]}").
In ONE or TWO very simple English sentences, explain what it actually means and when Croatians use it — so a learner knows which sense of the English word it covers, and not to confuse it with other senses. If it's an adjective or other word whose ending changes for masculine / feminine / neuter, give the three forms in a few words (e.g. "nov, nova, novo"). No other grammar jargon.
Then give one short, natural, everyday Croatian sentence using it, with its English translation.
Return ONLY JSON, no markdown: {"meaning":"...","ex":"...","exEn":"..."}`
    : `Croatian verb: "${v.i}" (rough English: "${v.en}").
In ONE or TWO very simple English sentences, explain what it actually means and when Croatians use it — which sense of the English verb it covers, and anything a learner might confuse it with. No grammar jargon.
Return ONLY JSON, no markdown: {"meaning":"..."}`;
  try{
    const txt = await ask(STYLE_RULES + "You explain Croatian vocabulary to beginners, simply and briefly.", [{role:"user", content:prompt}], 400);
    const j = parseJSON(txt);
    if(!j || !j.meaning) throw new Error("no meaning");
    r[kind + "Note"] = { meaning:String(j.meaning), ex:String(j.ex || ""), exEn:String(j.exEn || "") };
    save();
  }catch(e){
    NOTE_BUSY.delete(kind);
    if(!NOTE_RETRIED.has(kind)){                     // one quiet automatic retry first
      NOTE_RETRIED.add(kind);
      setTimeout(() => fetchNote(kind), 4000);
      return;
    }
    NOTE_FAIL.add(kind);
  }
  NOTE_BUSY.delete(kind);
  if(CUR === "home") vHome();
}
function noteHTML(kind){
  const fn = kind === "word" ? formNote() : null;
  if(fn) return `<div class="dmean"><b>Forms:</b> <span style="font-family:var(--display);font-size:16px">${esc(fn.f)}</span><div style="margin-top:6px"><b>Meaning:</b> ${esc(fn.m)}</div>
    <div style="margin-top:6px"><span style="font-family:var(--display);font-size:16px">${esc(fn.ex)}</span> ${spk(fn.ex)}<br><span style="color:var(--stone-dim);font-style:italic;font-size:13px">${esc(fn.exEn)}</span></div></div>`;
  const n = ((S.daily || {})[todayKey()] || {})[kind + "Note"];
  if(NOTE_FAIL.has(kind) && !n) return `<div class="dmean"><span style="color:var(--stone-dim)">Couldn't load the meaning — the AI was busy.</span>
    <button class="btn ghost sm" style="margin-left:6px" onclick="retryNote('${kind}')">↻ ${dual("Retry","Opet")}</button></div>`;
  if(!n) return `<div class="dmean"><span class="spin"></span> <span style="color:var(--stone-dim)">Looking up how it's used…</span></div>`;
  return `<div class="dmean"><b>Meaning:</b> ${esc(n.meaning)}${n.ex
    ? `<div style="margin-top:6px"><span style="font-family:var(--display);font-size:16px">${esc(n.ex)}</span> ${spk(n.ex)}<br><span style="color:var(--stone-dim);font-style:italic;font-size:13px">${esc(n.exEn)}</span></div>` : ""}</div>`;
}

function unlockDaily(kind){
  const input = $("#dc-" + kind), msg = $("#dcm-" + kind);
  const s = (input && input.value || "").trim();
  const target = kind === "word" ? todayWord()[0] : todayVerb().i;
  if(tokens(s).length < 3){ msg.innerHTML = `<span style="color:var(--madder)">Write a full sentence — at least 3 words.</span>`; return; }
  const ok = kind === "word" ? usesWord(s, target) : usesVerb(s, todayVerb());
  if(!ok){
    msg.innerHTML = `<span style="color:var(--madder)">Use <b>${esc(target)}</b> in your sentence — any form counts.</span>`;
    return;
  }
  const r = todayRec();
  const wasDone = dayDone(todayKey());
  r[kind] = true; r[kind + "S"] = s;
  if(!wasDone && dayDone(todayKey())){
    const n = dailyStreak();
    if(STREAK_MILESTONES.includes(n)) pushEvent(`🔥 ${n}-day streak!`, `${n} days in a row of Croatian. Svaka čast!`);
    setTimeout(() => pushSync(true), 2000);                  // stop today's streak reminders
  }
  // learning it once = it goes into your flashcards automatically (unstar any time)
  const w = todayWord(), v = todayVerb();
  if(kind === "word"){ r.wordHr = w[0]; r.wordEn = w[1]; }
  else { r.verbI = v.i; r.verbEn = v.en; }
  const hr = kind === "word" ? w[0] : v.i, en = kind === "word" ? w[1] : v.en;
  S.cards = S.cards || {};
  if(!S.cards[cardKey(hr, en)]) putCard(cardKey(hr, en), { src: kind === "word" ? "Word of the day" : "Verb of the day" });
  addXP(10);
  save();
  vHome();                                                  // wireDaily() starts the AI check
}

const DC_BUSY = new Set();
/* Tells the AI which unit the learner is on, so a correction that needs later
   grammar says "you'll learn this in Unit N" instead of throwing jargon at them. */
/* The same judging rules for every AI sentence check in the app — the daily word/verb,
   "Write a sentence", and anything added later. */
const CHECK_RULES = `How to judge:
- Missing or wrong accents (c/č/ć, s/š, z/ž, d/đ) NEVER make a sentence wrong. Treat "isli" as "išli", "secera" as "šećera". Don't mention accents in the note; just write "fixed" with the proper accents.
- Small slips are fine if the sentence is understandable.
- Never mark a sentence wrong for grammar from a unit the learner hasn't reached yet. If they used later grammar, accept it; if it's slightly off, set ok to true, put the correct version in "fixed" and mention the unit in a few words.
- Set ok to false only for a real mistake in what's being practised, or a sentence that doesn't make sense.
- Write "note" and "en" in ENGLISH only, never in Croatian — the learner is a beginner. Croatian words appear only as the examples you're explaining.`;
function courseContext(){
  const cur = unitNo(firstOpen());
  return `The learner is currently on Unit ${cur} of a ${UNITS.length}-unit grammar course. The units, in order:
${UNITS.map(u => unitNo(u) + ". " + u.title).join("; ")}.
When you explain a correction: use plain everyday English. Don't use grammar terms like "accusative" or "genitive" on their own — describe what's happening instead (e.g. "here the wolves are the thing being seen, so the ending changes"). If the correction depends on something taught in a unit AFTER Unit ${cur}, end the explanation with: "You'll learn this in Unit N (Title) — no need to worry about it yet." using the right unit from the list.`;
}

const DC_RETRIED = new Set();
function retryDailyCheck(kind){ DC_RETRIED.delete(kind); DC_BUSY.delete(kind); checkDailySentence(kind); }
async function checkDailySentence(kind){
  const r = todayRec(), slot = $("#dcf-" + kind);
  if(!slot || !r[kind + "S"]) return;
  if(r[kind + "F"] || DC_BUSY.has(kind)) return;            // already checked, or in flight
  DC_BUSY.add(kind);
  const target = kind === "word" ? todayWord()[0] : todayVerb().i;
  slot.innerHTML = `<span class="spin"></span> <span style="font-size:13px;color:var(--stone-dim)">Checking your sentence…</span>`;
  try{
    const txt = await ask(STYLE_RULES + "You are a friendly Croatian teacher checking a single learner sentence. Be encouraging and brief.",
      [{role:"user", content:`The learner had to write a sentence using the ${kind === "word" ? "word" : "verb"} "${target}". They wrote: "${r[kind + "S"]}".
${CHECK_RULES}
${courseContext()}
Return ONLY JSON, no markdown: {"ok":true or false,"fixed":"<the corrected sentence, or identical if already fine>","en":"<English translation>","note":"<1–2 short, kind English sentences: what changed and why, in plain words, plus the unit pointer if it's later material>"}`}], 600);
    const j = parseJSON(txt);
    r[kind + "F"] = { ok: !!j.ok, fixed: String(j.fixed || ""), en: String(j.en || ""), note: String(j.note || "") };
    save();
  }catch(e){
    DC_BUSY.delete(kind);
    if(!DC_RETRIED.has(kind)){                       // one quiet automatic retry first
      DC_RETRIED.add(kind);
      const s1 = $("#dcf-" + kind);
      if(s1) s1.innerHTML = `<span class="spin"></span> <span style="font-size:13px;color:var(--stone-dim)">The AI is busy — trying again…</span>`;
      setTimeout(() => checkDailySentence(kind), 4000);
      return;
    }
    const s2 = $("#dcf-" + kind);
    if(s2) s2.innerHTML = `<span style="font-size:13px;color:var(--stone-dim)">Couldn't check it right now — it still counts.</span>
      <button class="btn ghost sm" style="margin-left:6px" onclick="retryDailyCheck('${kind}')">↻ ${dual("Retry AI feedback","Pokušaj opet")}</button>`;
    return;
  }
  DC_BUSY.delete(kind);
  if(CUR === "home") vHome();
}

function feedbackHTML(r, kind){
  const f = r[kind + "F"];
  const mine = `<div style="margin-top:8px;font-size:14px"><span style="color:var(--stone-dim)">Your sentence:</span> <span style="font-family:var(--display);font-size:17px">${esc(r[kind + "S"] || "")}</span></div>`;
  if(!f) return mine + `<div id="dcf-${kind}" style="margin-top:6px"></div>`;
  const changed = norm(f.fixed) !== norm(r[kind + "S"] || "");

      ${f.en ? `<div style="font-size:13px;color:var(--stone-dim);font-style:italic;margin-top:3px">${esc(f.en)}</div>` : ""}
      ${f.note ? `<div style="font-size:13px;margin-top:4px">${esc(f.note)}</div>` : ""}
    </div>`;
}

let CAL_OFFSET = 0;
function calendarHTML(){
  const now = new Date();
  const base = new Date(now.getFullYear(), now.getMonth() + CAL_OFFSET, 1);
  const y = base.getFullYear(), m = base.getMonth();
  const lead = (base.getDay() + 6) % 7;                    // Monday-first, like Croatian calendars
  const days = new Date(y, m + 1, 0).getDate();
  const tk = todayKey(), ti = dayIndex(tk);
  let cells = ["Pon","Uto","Sri","Čet","Pet","Sub","Ned"].map(d => `<div class="cal-h">${d}</div>`).join("");
  for(let i = 0; i < lead; i++) cells += `<div></div>`;
  for(let d = 1; d <= days; d++){
    const k = keyOf(y, m, d), r = (S.daily || {})[k] || {};
    const n = (r.word ? 1 : 0) + (r.verb ? 1 : 0);
    const cls = n === 2 ? "full" : n === 1 ? "half" : "";
    cells += `<div class="cal-d ${cls} ${k === tk ? "today" : ""} ${dayIndex(k) > ti ? "future" : ""}">${d}</div>`;
  }
  return `<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
      <button class="btn ghost sm" onclick="CAL_OFFSET--;vHome()">\u2190</button>
      <div style="text-align:center"><b style="font-family:var(--display);font-size:18px">${MONTHS_EN[m]} ${y}</b>
        <div style="font-size:11px;color:var(--stone-dim);letter-spacing:.06em">${MONTHS_HR[m]}</div></div>
      <button class="btn ghost sm" onclick="CAL_OFFSET=Math.min(0,CAL_OFFSET+1);vHome()" ${CAL_OFFSET >= 0 ? "disabled" : ""}>\u2192</button>
    </div>

/* ============================================================
   GRAMMAR IN STEPS — each unit is a few short steps: one small
   idea, then 2–3 quick questions on it straight away. After the
   steps, a words page and a big quiz (at most 1 mistake unlocks the next unit).
   ============================================================ */
/* A quiz is passed with at most ONE wrong answer. Units passed under the
   old 60% rule stay passed — nobody gets locked out of work already done. */
function quizPassed(score, total){ return total - score <= 1; }
function unitPassed(d){ d = d || {}; return !!d.pass || (d.v !== 2 && d.drill != null && d.drill >= 60); }
function unitNo(x){ const id = typeof x === "object" ? x.id : Number(x); return UNITS.findIndex(u => u.id === id) + 1; }
function unitAfter(id){ return UNITS[UNITS.findIndex(u => u.id === id) + 1] || null; }
function unitBefore(id){ return UNITS[UNITS.findIndex(u => u.id === id) - 1] || null; }
function fillUnitRefs(html){ return String(html).replace(/\{u(\d+)\}/g, (m, id) => unitNo(Number(id))); }
function unitRec(id){ S.done[id] = S.done[id] || {}; return S.done[id]; }
function stepCount(u){ return u.grammar.length + 1; }               // grammar steps + words page
function stepDone(u, k){
  const d = S.done[u.id] || {};
  return !!((d.st || {})[k]) || unitPassed(d);  // finished units count as all done
}
function stepsDoneN(u){ let n = 0; for(let k = 0; k < stepCount(u); k++) if(stepDone(u, k)) n++; return n; }
function stepOpen(u, k){ for(let j = 0; j < k; j++) if(!stepDone(u, j)) return false; return true; }
function nextStepK(u){ for(let k = 0; k < stepCount(u); k++) if(!stepDone(u, k)) return k; return -1; }
function allStepsDone(u){ return stepsDoneN(u) === stepCount(u); }
function shuffleOpts(q){
  if(q.t === "build") return Object.assign({}, q, { bank: shuffle(q.w.concat(q.x || [])) });
  if(q.t !== "mc") return Object.assign({}, q);
  const idx = shuffle(q.o.map((_, i) => i));
  return Object.assign({}, q, { o: idx.map(i => q.o[i]), a: idx.indexOf(q.a) });
}

function vUnit(id){

  const n = stepCount(u), rec = S.done[u.id] || {};
  const row = (k, title, sub, onclick) => {
    const done = stepDone(u, k), open = stepOpen(u, k);
    const cur = !done && open;
    return `<button class="steprow ${done ? "done" : cur ? "cur" : "locked"}" ${open ? `onclick="${onclick}"` : "disabled"}>

      <span class="stxt"><b>${title}</b><span>${sub}</span></span>
      ${cur ? `<span class="sgo">${k === 0 && !stepsDoneN(u) ? "Start" : "Continue"} →</span>` : ""}
    </button>`;
  };
  const steps = u.grammar.map((g, k) => row(k, g.h, `Step ${k + 1} · about 2 minutes`, `go('step','${u.id}:${k}')`)).join("")
    + row(u.grammar.length, "Words and phrases", "Star the ones you want in your cards", `go('step','${u.id}:${u.grammar.length}')`);
  const ready = allStepsDone(u);
  const best = rec.drill != null ? `Best score: ${rec.drill}%` : "";
  const next = unitAfter(id);
  const done = unitState(u) === "done";
  shell(`unit ${unitNo(u)} of ${UNITS.length}`, esc(u.title), esc(u.goal),
    `<div class="chips" style="margin-bottom:16px">

      <button class="steprow final ${done ? "done" : ready ? "cur" : "locked"}" ${ready ? `onclick="startFinal(${u.id})"` : "disabled"}>
        <span class="sdot">${done ? "✓" : ready ? "★" : "&#128274;"}</span>
        <span class="stxt"><b>Big quiz</b><span>${ready ? (best || "Mixes everything from this unit · pass with at most 1 mistake to unlock the next unit") : "Opens when every step is done"}</span></span>
        ${ready && !done ? `<span class="sgo">Go →</span>` : ""}
      </button>
    </div>
    ${done && next ? `<div class="note" style="margin-top:18px"><b>Unit complete.</b> Next up: ${esc(next.title)}.</div>
      <div style="margin-top:12px"><button class="btn" onclick="go('unit',${next.id})">Next: ${esc(next.title)} →</button></div>` : ""}
    <div style="margin-top:22px"><button class="btn ghost sm" onclick="go('unitall',${u.id})">${dual("See the whole unit on one page","Cijela cjelina")}</button></div>`);
}

/* Tap-the-words questions: {t:"build", q, w:[words], x:[extra wrong words], a:[accepted answers], e} */
let BUILD = null;
function buildHTML(q, where){
  BUILD = { q, where, bank: (q.bank || shuffle(q.w.concat(q.x || []))).slice(), used: [] };
  return `<div class="bline" id="bline"><span class="bph">Tap the words in order</span></div>
    <div class="bbank" id="bbank"></div>
    <div style="margin-top:12px"><button class="btn" id="bcheck" onclick="${where === "sq" ? "pickSQ(-2)" : "pick(-2)"}">${dual("Check","Provjeri")}</button></div>`;
}
function paintBuild(){
  if(!BUILD) return;
  const line = $("#bline"), bank = $("#bbank"); if(!line || !bank) return;
  line.innerHTML = BUILD.used.length
    ? BUILD.used.map((bi, j) => `<button class="bw" onclick="unBuild(${j})">${esc(BUILD.bank[bi])}</button>`).join("")
    : `<span class="bph">Tap the words in order</span>`;
  bank.innerHTML = BUILD.bank.map((w, i) => `<button class="bw ${BUILD.used.includes(i) ? "gone" : ""}" ${BUILD.used.includes(i) ? "disabled" : ""} onclick="addBuild(${i})">${esc(w)}</button>`).join("");
}
function addBuild(i){ if(BUILD && !BUILD.done && !BUILD.used.includes(i)){ BUILD.used.push(i); paintBuild(); } }
function unBuild(j){ if(BUILD && !BUILD.done){ BUILD.used.splice(j, 1); paintBuild(); } }
function buildAnswer(){ return BUILD.used.map(i => BUILD.bank[i]).join(" "); }
function checkBuild(q){
  const said = norm(buildAnswer());
  if(!said) return null;
  BUILD.done = true;
  $$("#bline .bw, #bbank .bw").forEach(b => b.disabled = true);
  const ok = q.a.some(a => norm(a) === said);
  $("#bline").style.borderColor = ok ? "var(--olive)" : "var(--madder)";
  $("#bline").style.borderStyle = "solid";
  const btn = $("#bcheck"); if(btn) btn.style.display = "none";
  return ok;
}

/* ---------- review after every quiz: what you got right and wrong ---------- */
function logAnswer(log, q, ok, yours, right){
  log.push({ q: q.q, qEn: q.qEn || "", ok: !!ok, yours: String(yours || ""), right: String(right || ""), e: q.e || "" });
}
const rvPlain = t => String(t).toLowerCase().replace(/[^\p{L}\s]/gu, "").replace(/\s+/g, " ").trim();
function reviewHTML(log){
  if(!log || !log.length) return "";
  const wrong = log.filter(x => !x.ok).length;
  return `<div class="card review" style="margin-top:14px" data-only="all">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:4px">
      <div class="kicker" style="margin:0">review · pregled</div>
      <div class="chips" style="margin:0">
        <button class="chip" aria-pressed="true" onclick="reviewFilter(this,'all')">All · ${log.length}</button>
        <button class="chip" aria-pressed="false" onclick="reviewFilter(this,'no')"${wrong ? "" : " disabled"}>Wrong · ${wrong}</button>
      </div>
    </div>
    ${log.map((x, n) => `<div class="rv ${x.ok ? "rv-ok" : "rv-no"}">
        <div class="rv-q"><span class="rv-mark">${x.ok ? "✓" : "✗"}</span><span>${n + 1}. ${esc(x.q)}</span></div>
        ${x.qEn ? `<div class="rv-sub">${esc(x.qEn)}</div>` : ""}
        <div class="rv-a">${x.ok
          ? `You: <b>${esc(x.yours)}</b>${!x.right || rvPlain(x.right) === rvPlain(x.yours) ? "" : norm(x.right) === norm(x.yours) ? ` <span style="color:var(--stone-dim)">· with the accents: ${esc(x.right)}</span>` : ` <span style="color:var(--stone-dim)">· also right: ${esc(x.right)}</span>`}`
          : `You: <s>${esc(x.yours || "—")}</s> → <b>${esc(x.right)}</b>`}</div>
        ${x.e ? `<div class="rv-sub">${esc(x.e)}</div>` : ""}
      </div>`).join("")}
  </div>`;
}
function reviewFilter(btn, k){
  const card = btn.closest(".review"); if(!card) return;
  card.dataset.only = k;
  card.querySelectorAll(".chips .chip").forEach(c => c.setAttribute("aria-pressed", String(c === btn)));
}

let SQ = null;   // the step being done right now
function vStep(arg){
  const [uid, k] = String(arg).split(":").map(Number);
  const u = UNITS.find(x => x.id === uid);
  if(!u || unitState(u) === "locked") return go("gramatika");
  if(!stepOpen(u, k)) return go("unit", uid);
  CARD_SRC = "Grammar: " + u.title;
  const n = stepCount(u);
  const dots = Array.from({length:n}, (_, j) =>
    `<i class="${stepDone(u, j) ? "d" : j === k ? "c" : ""}"></i>`).join("");
  const top = `<div class="chips" style="margin-bottom:14px">
      <button class="btn ghost sm" onclick="go('unit',${uid})">← ${dual("Unit steps","Koraci")}</button></div>
    <div class="stepdots">${dots}</div>`;

  if(k === u.grammar.length){                          // the words page
    shell(`unit ${unitNo(uid)} · step ${k + 1} of ${n}`, "Words and phrases", esc(u.title),
      `${top}<p style="font-size:14.5px;color:var(--stone-dim);margin:0 0 10px">Have a quick look. Tap 🔊 to hear one, ☆ to put it in your cards.</p>
      <div class="kicker">words · riječi</div><div class="wordlist">${u.vocab.map(v => wordRow(v[0], v[1])).join("")}</div>
      <div class="kicker" style="margin-top:22px">phrases · fraze</div><div class="wordlist">${u.phrases.concat(allPhrases(uid)).filter((x, i, arr) => arr.findIndex(y => y[0] === x[0]) === i).map(v => wordRow(v[0], v[1])).join("")}</div>
      <div style="margin-top:20px"><button class="btn" onclick="finishStep(${uid},${k})">${dual("Done — on to the big quiz","Gotovo")} →</button></div>`);
    return;
  }

  const g = u.grammar[k];
  const keep = SQ && SQ.u === uid && SQ.k === k;           // came back to the step you left
  if(keep){ if(SQ.ans === SQ.i) SQ.i++; }
  else SQ = { u:uid, k, q: shuffle((STEP_Q[uid] || [])[k] || []).map(shuffleOpts), i:0, again:new Set(), log:[] };
  shell(`unit ${unitNo(uid)} · step ${k + 1} of ${n}`, g.h, esc(u.title),
    `${top}<div class="card"><div style="font-size:15px">${fillUnitRefs(g.b)}</div></div>${phrasesHTML(uid, k)}
    <div class="card stepcheck" style="margin-top:14px">
      <div class="kicker">quick check · provjera</div>
      <div id="sq"></div>
    </div>`);
  paintSQ();
}

function paintSQ(){
  const box = $("#sq"); if(!box || !SQ) return;
  if(SQ.i >= SQ.q.length) return finishStep(SQ.u, SQ.k);
  const q = SQ.q[SQ.i];
  box.innerHTML = `<div style="font-family:var(--mono);font-size:11.5px;color:var(--stone-dim);margin-bottom:6px">${SQ.i + 1} / ${SQ.q.length}</div>
    <div class="q">${esc(q.q)}</div>
    ${q.t === "mc"
      ? `<div class="opts">${q.o.map((o, i) => `<button class="opt" onclick="pickSQ(${i})">${esc(o)}</button>`).join("")}</div>`
      : q.t === "build" ? buildHTML(q, "sq")
      : `<input class="answer" id="sqa" placeholder="Type it in Croatian…" autocomplete="off" autocapitalize="off" spellcheck="false">
         <div style="margin-top:12px"><button class="btn" onclick="pickSQ(-1)">${dual("Check","Provjeri")}</button></div>`}
    <div id="sqv"></div>`;
  if(q.t === "build") paintBuild();
  const a = $("#sqa");
  if(a) a.addEventListener("keydown", e => { if(e.key === "Enter") pickSQ(-1); });
}
function pickSQ(i){
  const q = SQ.q[SQ.i];
  let ok, typo = "";
  if(q.t === "mc"){
    ok = i === q.a;
    $$("#sq .opt").forEach((b, j) => { b.disabled = true; if(j === q.a) b.classList.add("right"); else if(j === i) b.classList.add("wrong"); });
  } else if(q.t === "build"){
    ok = checkBuild(q);
    if(ok === null) return;
  } else {
    const inp = $("#sqa"), typed = inp.value;
    if(!norm(typed)) return;
    const r = checkTyped(typed, q.a);
    ok = r.ok; typo = r.typo ? (r.meant || q.a[0]) : "";
    inp.disabled = true; inp.style.borderWidth = "2px";
    inp.style.borderColor = ok ? "var(--olive)" : "var(--madder)";
  }
  logAnswer(SQ.log, q, ok, q.t === "mc" ? q.o[i] : q.t === "build" ? buildAnswer() : $("#sqa").value, q.t === "mc" ? q.o[q.a] : (typo || q.a[0]));
  SQ.ans = SQ.i;
  const key = q.q;
  const retry = !ok && !SQ.again.has(key);
  if(retry){ SQ.again.add(key); SQ.q.push(shuffleOpts(q)); }   // a missed one comes back once at the end
  if(ok) addXP(2);
  const ans = (q.t === "type" || q.t === "build") && (!ok || typo)
    ? `<div style="margin-top:5px"><span style="color:var(--stone-dim)">${ok ? "With the accents:" : "Answer:"}</span>
       <span style="font-family:var(--display);font-size:17px;color:var(--brass)">${esc(typo || q.a[0])}</span></div>` : "";
  $("#sqv").innerHTML = `<div class="verdict ${ok ? "ok" : "no"}">
      <b style="color:${ok ? "var(--olive)" : "var(--madder)"}">${ok ? "Correct ✓" : "Not quite ✗"}</b>
      ${esc(q.e || "")}${ans}
      ${retry ? `<div style="margin-top:6px;font-size:13px;color:var(--stone-dim)">You'll get this one again at the end.</div>` : ""}
    </div>
    <div style="margin-top:12px"><button class="btn" id="sqn">${SQ.i + 1 >= SQ.q.length ? "Finish step" : "Next →"}</button></div>`;
  const nb = $("#sqn"); nb.focus();
  nb.onclick = () => { SQ.i++; paintSQ(); };
}

function finishStep(uid, k){
  const u = UNITS.find(x => x.id === uid), rec = unitRec(uid);
  rec.st = rec.st || {};
  const first = !rec.st[k];
  rec.st[k] = 1;
  if(first) addXP(10); else save();
  const log = SQ && SQ.u === uid && SQ.k === k ? SQ.log : null;
  if(log && log.length) countQuiz();
  SQ = null;
  const n = stepCount(u), nextK = k + 1;
  const last = nextK >= n;
  const nextTitle = last ? "Big quiz" : nextK === u.grammar.length ? "Words and phrases" : u.grammar[nextK].h;
  window.scrollTo({top:0, behavior:"instant"});
  shell(`unit ${unitNo(uid)} · step ${k + 1} of ${n}`, "Step done ✓", esc(u.title),
    `<div class="card" style="text-align:center;padding:34px 20px">
      <div class="stepdots" style="justify-content:center">${Array.from({length:n}, (_, j) => `<i class="${stepDone(u, j) ? "d" : ""}"></i>`).join("")}</div>
      <p style="font-family:var(--display);font-size:22px;margin:14px 0 4px">${stepsDoneN(u)} of ${n} steps done</p>
      <p style="color:var(--stone-dim);font-size:14px;margin:0 0 18px">Next: ${esc(nextTitle)}</p>
      <div class="chips" style="justify-content:center">
        <button class="btn ghost sm" onclick="go('unit',${uid})">${dual("Stop here for now","Dosta za danas")}</button>
        ${last ? `<button class="btn sm" onclick="startFinal(${uid})">${dual("Take the big quiz","Veliki kviz")} →</button>`
               : `<button class="btn sm" onclick="go('step','${uid}:${nextK}')">${dual("Next step","Sljedeći korak")} →</button>`}
      </div></div>${reviewHTML(log)}`);
}

/* Big quiz: the unit's own drills plus one question from each step. */
function startFinal(id){
  const u = UNITS.find(x => x.id === id);
  D = { unit:id, final:true, title: u.title + " — big quiz",
        q: shuffle(u.drills.concat(FINAL_Q[id] || []).map(shuffleOpts)), i:0, score:0 };
  paintDrill();
}

async function genPractice(id){
  const u = UNITS.find(x=>x.id===id);
  const box = $("#extra");
  box.innerHTML = `<div class="card" style="margin-top:18px"><span class="spin"></span> Writing new sentences…</div>`;
  try{

      [{role:"user", content:`Unit topic: "${u.title}" — ${u.goal}
Vocabulary in play: ${u.vocab.map(v=>v[0]).join(", ")}.
Write 8 fresh example sentences in standard Croatian at CEFR ${S.level} using this unit's grammar and words. Vary the persons and include a couple of questions.
Return ONLY a JSON array, no prose, no markdown: [{"hr":"...","en":"..."}]`}]);
    const arr = parseJSON(txt);
    box.innerHTML = `<div class="kicker" style="margin-top:24px">new sentences · nove rečenice</div>
      <div class="wordlist">${arr.map(x=>wordRow(x.hr,x.en)).join("")}</div>
      <button class="btn ghost sm" style="margin-top:10px" onclick="genPractice(${id})">${dual("Eight more","Još osam")}</button>`;

/* ============================================================
   VJEŽBA / DRILL ENGINE
   ============================================================ */
let D = null;
function startDrill(id, custom){
  const u = UNITS.find(x=>x.id===id);
  D = { unit:id, title: custom ? "Provjera" : u.title, q: shuffle((custom||u.drills).slice()), i:0, score:0 };
  paintDrill();
}
let TYPED = "", TYPO = "";
function paintDrill(){
  TYPED = ""; TYPO = "";
  { const t = tabOf(CUR), prev = LAST[t] || {}; LAST[t] = { drill: D, route: CUR, arg: prev.arg }; }
  if(D.i >= D.q.length){ return endDrill(); }
  const q = D.q[D.i];
  const bar = `<div class="progressline"><i style="width:${(D.i/D.q.length)*100}%"></i></div>
    <div style="display:flex;justify-content:space-between;font-family:var(--mono);font-size:11.5px;color:var(--stone-dim);margin:-12px 0 16px">
      <span>${D.i+1} / ${D.q.length}</span><span>${D.score} correct</span></div>`;
  const body = q.t === "mc"
    ? `<div class="opts">${q.o.map((o,i)=>`<button class="opt" onclick="pick(${i})">${esc(o)}</button>`).join("")}</div>`
    : q.t === "build" ? buildHTML(q, "drill")
    : `<input class="answer" id="ans" placeholder="Type it in Croatian…" autocomplete="off" autocapitalize="off" spellcheck="false">
       <div style="margin-top:12px"><button class="btn" onclick="pick(-1)">${dual("Check","Provjeri")}</button></div>`;
  const isRead = D.reading && q.t === "mc";
  if(isRead) GLOSS_CTX = q.q + " " + q.o.join(" ");
  const qHTML = isRead
    ? `<div class="q qread">${markup(q.q)}</div>
       <div class="tr-en ${D.showEn ? "" : "hidden"}" id="q-en">${esc(q.qEn || "")}</div>
       <button class="linkbtn" style="margin:-4px 0 10px" onclick="toggleQuizEn(this)">🌐 ${D.showEn ? "Hide English" : "Show English"}</button>`
    : `<div class="q">${esc(q.q)}</div>`;
  const body2 = isRead
    ? `<div class="opts">${q.o.map((o,i)=>`<button class="opt" onclick="pick(${i})">${esc(o)}<span class="tr-en opt-en ${D.showEn ? "" : "hidden"}">${esc((q.oEn || [])[i] || "")}</span></button>`).join("")}</div>`
    : body;
  shell(`question ${D.i+1} of ${D.q.length}`, esc(D.title), "",
    `${bar}<div class="card">${qHTML}${body2}<div id="verdict"></div></div>`);
  if(isRead && D.showEn && !q.qEn) fillQuizEn();
  if(q.t === "build") paintBuild();
  const a = $("#ans");
  if(a){ a.focus(); a.addEventListener("keydown", e=>{ if(e.key==="Enter") pick(-1); }); }
}
let GLOSS_CTX = "";
/* Show / hide English without redrawing — so an answered question stays answered. */
function toggleQuizEn(btn){
  D.showEn = !D.showEn;
  $$(".tr-en").forEach(el => el.classList.toggle("hidden", !D.showEn));
  if(btn) btn.textContent = "🌐 " + (D.showEn ? "Hide English" : "Show English");
  if(D.showEn && !D.q[D.i].qEn) fillQuizEn();
}
async function fillQuizEn(){
  const q = D.q[D.i]; if(!q || q.qEn) return;
  const el = $("#q-en"); if(el) el.innerHTML = `<span class="spin"></span>`;
  try{
    const tr = await translateLines([q.q].concat(q.o));
    q.qEn = tr[0]; q.oEn = tr.slice(1);
    const src = RD && RD.questions && RD.questions[q.n];
    if(src){ src.qEn = q.qEn; src.oEn = q.oEn; keepReading(); }
    if(D.q[D.i] !== q) return;
    const e1 = $("#q-en"); if(e1) e1.textContent = q.qEn;
    $$(".opt-en").forEach((e, i) => e.textContent = q.oEn[i] || "");
  }catch(e){ const e2 = $("#q-en"); if(e2) e2.innerHTML = `Couldn't translate right now. <button class="linkbtn" onclick="fillQuizEn()">Retry</button>`; }
}
function pick(i){
  const q = D.q[D.i];
  let ok;
  if(q.t === "mc"){
    ok = i === q.a;
    $$(".opt").forEach((b,j)=>{ b.disabled = true; if(j===q.a) b.classList.add("right"); else if(j===i) b.classList.add("wrong"); });
  } else if(q.t === "build"){
    ok = checkBuild(q);
    if(ok === null) return;
  } else {
    const typed = $("#ans").value;
    if(!norm(typed)) return;
    const r = checkTyped(typed, q.a);
    ok = r.ok; TYPED = typed; TYPO = r.typo ? (r.meant || q.a[0]) : "";
    $("#ans").disabled = true;
    $("#ans").style.borderColor = ok ? "var(--olive)" : "var(--madder)";
    $("#ans").style.borderWidth = "2px";
  }
  if(ok){ D.score++; addXP(5); }
  logAnswer(D.log = D.log || [], q, ok, q.t === "mc" ? q.o[i] : q.t === "build" ? buildAnswer() : TYPED, q.t === "mc" ? q.o[q.a] : (TYPO || q.a[0]));
  D.ans = D.i;                                   // this question is answered — never score it twice

  const yours = (q.t === "type" && TYPED)
    ? `<div style="margin-top:9px;font-size:14px">
         <span style="color:var(--stone-dim)">You wrote:</span>
         <span class="hr" style="font-family:var(--display);font-size:17px;color:${ok?"var(--olive)":"var(--madder)"}">${esc(TYPED)}</span>
       </div>` : "";
  const answer = (q.t === "build" && !ok)
    ? `<div style="margin-top:5px;font-size:14px"><span style="color:var(--stone-dim)">Answer:</span>
         <span style="font-family:var(--display);font-size:17px;color:var(--brass)">${esc(q.a[0])}</span></div>`
    : (q.t === "type" && (!ok || TYPO))
    ? `<div style="margin-top:5px;font-size:14px">
         <span style="color:var(--stone-dim)">${ok ? "With the accents:" : "Answer:"}</span>
         <span style="font-family:var(--display);font-size:17px;color:var(--brass)">${esc(TYPO || q.a[0])}</span>
       </div>` : "";

  $("#verdict").innerHTML = `<div class="verdict ${ok?"ok":"no"}">
    <b style="color:${ok?"var(--olive)":"var(--madder)"}">${ok ? "Correct \u2713" : "Not quite \u2717"}</b>
    ${esc(q.e||"")}${yours}${answer}
    </div>
    <div style="margin-top:12px;display:flex;align-items:center;gap:12px;flex-wrap:wrap">
      <button class="btn" id="nx">${D.i+1>=D.q.length?"See score":"Next \u2192"}</button>
      <span style="font-family:var(--mono);font-size:13px;color:var(--stone-dim)">${D.score} / ${D.i+1} correct</span>
    </div>`;
  $("#nx").focus();
  $("#nx").onclick = ()=>{ D.i++; paintDrill(); };
}
function endDrill(){
  if(D === QZ) QZ = null;
  { const t = tabOf(CUR), l = LAST[t]; if(l && l.drill === D) LAST[t] = { route: l.route, arg: l.arg }; }
  countQuiz();
  const pct = Math.round(D.score/D.q.length*100);
  const wrong = D.q.length - D.score;
  const passed = quizPassed(D.score, D.q.length);
  const gate = D.final || D.skill;                     // quizzes that unlock the next one
  const msg = gate
    ? (wrong === 0 ? "Perfect — passed!" : passed ? "Passed — only one mistake!" : `${wrong} mistakes — you need at most 1 to pass. Have another look and try again.`)
    : (pct===100 ? "Perfect. Every one right." : pct>=75 ? "Very good." : pct>=50 ? "Decent start — have another look." : "Go back over it and try again.");
  let unlocked = null;
  if(D.unit){
    const rec = S.done[D.unit] = S.done[D.unit] || {};
    const before = unitPassed(rec);
    rec.read = true;
    rec.drill = Math.max(rec.drill || 0, pct);
    if(D.final){ rec.pass = before || passed; rec.v = 2; }
    if(D.final && passed && !before) unlocked = unitAfter(D.unit);
    if(unlocked) pushEvent(`🔓 Unit ${unitNo(unlocked)} unlocked`, `You passed “${D.title.replace(/ — big quiz$/, "")}”. Next up: ${unlocked.title}.`);
    save();
  }
  if(D.skill && passed){
    S.skills = S.skills || {};
    if(!S.skills[D.skill]){ const si = SKILLS.findIndex(x => x.id === D.skill); unlocked = SKILLS[si + 1] || null;
      if(unlocked) pushEvent("🗣️ New speaking lesson", `${unlocked.title} is open.`); }
    S.skills[D.skill] = Math.max(S.skills[D.skill] || 0, pct); save();
  }
  const nextUnit = D.unit ? unitAfter(D.unit) : null;
  const nextOpen = D.unit && nextUnit && unitState(nextUnit) !== "locked";
  const si = D.skill ? SKILLS.findIndex(x => x.id === D.skill) : -1;
  const nextSkill = si > -1 ? SKILLS[si + 1] : null;
  const again = D.reading ? "readQuiz()" : D.skill ? `startSkillDrill('${D.skill}')` : D.final ? `startFinal(${D.unit})` : D.unit ? `startDrill(${D.unit})` : "go('provjera')";
  const back = D.reading ? `<button class="btn ghost sm" onclick="go('citanje')">${dual("Back to the reading","Natrag na tekst")}</button>`
    : D.skill ? `<button class="btn ghost sm" onclick="go('skill','${D.skill}')">${dual("Back to the lesson","Natrag na lekciju")}</button>`
    : D.unit ? `<button class="btn ghost sm" onclick="go('unit',${D.unit})">${dual("Back to the unit","Natrag na cjelinu")}</button>`
    : `<button class="btn ghost sm" onclick="go('provjera')">${dual("Back to quizzes","Natrag na provjere")}</button>`;
  const fwd = D.reading ? `<button class="btn sm" onclick="go('citanje')">${dual("New reading","Novi tekst")} →</button>`
    : D.skill ? (passed && nextSkill ? `<button class="btn sm" onclick="go('skill','${nextSkill.id}')">${dual("Next lesson","Sljedeća lekcija")} →</button>` : "")
    : D.unit ? (nextOpen ? `<button class="btn sm" onclick="go('unit',${nextUnit.id})">${dual("Next unit","Sljedeća cjelina")} →</button>` : "")
    : "";
  shell("done · gotovo", "Your score", "",
    `<div class="card" style="text-align:center;padding:40px">
      <div style="font-family:var(--mono);font-size:56px;color:var(--brass);line-height:1">${D.score}<span style="font-size:26px;color:var(--stone-dim)">/${D.q.length}</span></div>
      <p style="font-family:var(--display);font-size:22px;margin-top:8px">${msg}</p>
      ${unlocked ? `<p style="color:var(--olive);font-size:14px;margin:0">Unlocked: ${esc(unlocked.title)}</p>` : ""}
      <div class="chips" style="justify-content:center;margin-top:16px">
        <button class="btn ghost sm" onclick="${again}">${dual("Again","Opet")}</button>
        ${back}${fwd}
      </div></div>${reviewHTML(D.log)}`);
}

/* ============================================================
   RAZGOVOR — live tutor
   ============================================================ */
let CH = { busy:false };
// CH.hist stays a live pointer into the current saved conversation,
// so every existing call site keeps working unchanged.
Object.defineProperty(CH, "hist", {
  get(){ return curChat().hist; },
  set(v){ curChat().hist = v; save(); }
});

function newChat(scenario, level){
  const id = "c" + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
  S.chats = S.chats || {};
  S.chats[id] = { id, title:"", scenario: scenario || S.scenario, level: level || S.level,
                  created: Date.now(), updated: Date.now(), hist: [] };
  S.chatId = id;
  return S.chats[id];
}
function curChat(){
  S.chats = S.chats || {};
  if(!S.chatId || !S.chats[S.chatId]) newChat();
  return S.chats[S.chatId];
}
function touchChat(){
  const c = curChat();
  c.updated = Date.now();
  if(!c.title){
    const first = c.hist.find(m => m.who === "me");
    const sc = SCENARIOS.find(x => x.k === c.scenario);
    c.title = first ? first.hr.slice(0,42) : (sc ? sc.l : "Razgovor");
  }
  save();
}
function openChat(id){
  if(!S.chats[id]) return;
  S.chatId = id;
  S.scenario = S.chats[id].scenario;
  S.level = S.chats[id].level || S.level;
  save(); vTalk();
}
function startChat(){
  const c = curChat();
  if(c.hist.length) newChat(S.scenario, S.level);
  save(); vTalk();
}
let DELARM = null;
function delChat(id, ev){
  ev.stopPropagation();
  if(DELARM !== id){ DELARM = id; vTalk(); setTimeout(()=>{ if(DELARM===id){ DELARM=null; if(CUR==="razgovor") vTalk(); } }, 3500); return; }
  DELARM = null;
  delete S.chats[id]; S.removedChats = S.removedChats || {}; S.removedChats[id] = Date.now();
  if(S.chatId === id){ S.chatId = Object.keys(S.chats)[0] || null; if(!S.chatId) newChat(); }
  save(); vTalk();
}
function renameChat(id, ev){
  ev.stopPropagation();
  const c = S.chats[id]; if(!c) return;
  const v = prompt("New name for this conversation:", c.title || "");
  if(v !== null){ c.title = v.trim().slice(0,60) || c.title; save(); vTalk(); }
}
function ago(t){
  const d = Math.floor((Date.now()-t)/1000);
  if(d < 60) return "sada";
  if(d < 3600) return Math.floor(d/60) + " min";
  if(d < 86400) return Math.floor(d/3600) + " h";
  const days = Math.floor(d/86400);
  return days === 1 ? "jučer" : days + " dana";
}
const LEVELS = [
  {k:"A1", l:"Početnik", en:"Beginner", d:"very short sentences, present tense, common words, lots of scaffolding"},
  {k:"A2", l:"Osnovni",  en:"Elementary", d:"short everyday sentences, past and future allowed, basic cases"},
  {k:"B1", l:"Srednji",  en:"Intermediate", d:"normal conversational Croatian, full case system, some idiom"}
];

function vTalk(){

      <div class="kicker">situation · situacija</div>
      <div class="chips" style="margin-bottom:14px">${SCENARIOS.map(s=>

      <div class="kicker">level · razina</div>
      <div class="chips">${LEVELS.map(l=>
        `<button class="chip" aria-pressed="${l.k===S.level}" onclick="setLevel('${l.k}')">${dual(l.k + " · " + l.en, l.l)}</button>`).join("")}

        return `<div class="chatrow${on?" on":""}" onclick="openChat('${c.id}')">

            <div class="ct">${esc(c.title || (sc?sc.l:"Razgovor"))}</div>
            <div class="cs2">${esc(sc?sc.l:"")} · ${esc(c.level||"A1")} · ${c.hist.length} poruka · ${ago(c.updated||c.created)}</div>

          </div>
          <button class="crn" title="Rename" onclick="renameChat('${c.id}',event)">✎</button>
          <button class="cdel${DELARM===c.id?" armed":""}" onclick="delChat('${c.id}',event)">${DELARM===c.id?"Delete?":"×"}</button>

  const i = $("#say"); if(i){ i.focus(); i.addEventListener("keydown", e=>{ if(e.key==="Enter") sendMsg(); }); }

function setScenario(k){
  const c = curChat();
  S.scenario = k;
  if(c.hist.length) newChat(k, S.level); else { c.scenario = k; }
  save(); vTalk();
}
function setLevel(k){ S.level = k; curChat().level = k; save(); vTalk(); }

function paintChat(){
  const c = $("#chat"); if(!c) return;
  c.innerHTML = CH.hist.map(m=>{
    if(m.who==="me") return `<div class="msg me"><div class="cro">${esc(m.hr)}</div></div>`;
    return `<div class="msg bot"><div class="cro">${esc(m.hr)} ${spk(m.hr)}</div>
      ${S.showEn && m.tr ? `<div class="tr">${esc(m.tr)}</div>` : ""}
      ${m.fix ? `<div class="fix"><b>Almost:</b> ${esc(m.fix.fixed)}<br><span style="color:var(--stone-dim)">${esc(m.fix.note)}</span></div>` : ""}</div>`;
  }).join("");
  c.scrollTop = c.scrollHeight;
  const s = $("#sugg");
  const last = CH.hist[CH.hist.length-1];
  if(s) s.innerHTML = (last && last.sugg ? last.sugg : []).map(x=>{
    const hr = typeof x === "string" ? x : (x.hr || "");
    const en = typeof x === "string" ? ""  : (x.en || "");
    if(!hr) return "";
    return `<button onclick="useSugg(${JSON.stringify(hr).replace(/"/g,'&quot;')})">
      ${esc(hr)}${en ? `<span class="c2">${esc(en)}</span>` : ""}</button>`;
  }).join("");
}
function useSugg(t){ const i=$("#say"); i.value=t; i.focus(); }

function tutorSystem(){
  const sc = SCENARIOS.find(x=>x.k===S.scenario) || SCENARIOS[0];
  const lv = LEVELS.find(x=>x.k===S.level) || LEVELS[0];
  return STYLE_RULES + `
ROLE: ${sc.s}
The learner is a teenage English speaker at CEFR ${lv.k} (${lv.en}). Match that: ${lv.d}.

HOW TO BEHAVE:
- Speak ONLY Croatian in the "reply" field. Keep it to 1-2 sentences and always end with a question so the conversation continues.
- Stay in character. Be warm, curious and a bit funny. React to what they actually said.
- If the learner writes "?" or asks in English, rephrase your previous question more simply in Croatian and put the explanation in "note".
- Correct only meaningful errors (wrong case, wrong verb form, wrong word choice, non-Croatian words). Ignore missing diacritics and capitalisation — a learner typing on a US keyboard cannot easily type č ž š ć đ.
- If they wrote a Serbian/Bosnian form (kafa, hleb, voz, šta, ko, hiljada, ekavian), always correct it and say briefly what the Croatian word is.
- If their Croatian was fine, set "correction" to null and do not invent a nitpick.
- ${courseContext().replace(/\n/g, " ")}
- "suggestions" = three short, natural things THEY could say next. Each is an object with "hr" (the Croatian) and "en" (its English translation).

OUTPUT FORMAT — use these tags exactly, in this order, and nothing else.
No JSON, no markdown, no text outside the tags. Put the Croatian reply FIRST
so the learner sees it immediately.

<r>your Croatian reply, 1-2 sentences, ending in a question</r>
<t>English translation of that reply</t>
<c>their corrected sentence :: one short English sentence saying why</c>
<s>Croatian thing they could say | English translation</s>
<s>Croatian thing they could say | English translation</s>
<s>Croatian thing they could say | English translation</s>

Omit the <c> block entirely when their Croatian was fine. Always give exactly
three <s> lines, each with the Croatian, then a pipe, then the English.`;
}

async function openLine(){
  if(CH.busy) return; CH.busy = true;
  try{
    const opener = [{role:"user", content:"Start the conversation. Greet me in character and ask me one easy opening question."}];
    let j;
    try{
      j = await askProxyStream(tutorSystem(), opener, ()=>{});
    }catch(e){
      if(String(e.message) === "NOSTREAM") j = parseTagged(await ask(tutorSystem(), opener));
      else throw e;
    }
    CH.hist.push({who:"bot", hr:j.reply, tr:j.translation, sugg:j.suggestions||[]});
    touchChat(); paintChat();
    if($("#cherr")) $("#cherr").innerHTML = "";
  }catch(e){ if($("#cherr")) $("#cherr").innerHTML = apiError(e); }
  CH.busy = false;
}

async function sendMsg(){
  const i = $("#say"); if(!i) return;
  const t = i.value.trim(); if(!t || CH.busy) return;
  i.value = ""; CH.busy = true; $("#send").disabled = true;
  CH.hist.push({who:"me", hr:t}); touchChat(); paintChat();
  const c = $("#chat");
  c.insertAdjacentHTML("beforeend", `<div class="msg bot" id="typing"><span class="spin"></span> <span id="typingtxt" style="font-size:13px;color:var(--stone-dim)"></span></div>`);
  c.scrollTop = c.scrollHeight;
  const slow1 = setTimeout(()=>{ const t=$("#typingtxt"); if(t) t.textContent = "still thinking\u2026"; }, 8000);
  const slow2 = setTimeout(()=>{ const t=$("#typingtxt"); if(t) t.textContent = "Gemini is slow right now \u2014 hang on\u2026"; }, 20000);
  try{
    const msgs = historyForApi(CH.hist);

    // Render the Croatian as it arrives rather than after the whole reply.
    const live = document.createElement("div");
    live.className = "msg bot";
    live.innerHTML = `<div class="cro"></div>`;
    let first = true;
    const onText = t => {
      if(first){
        clearTimeout(slow1); clearTimeout(slow2);
        const ty0 = $("#typing"); if(ty0) ty0.remove();
        c.appendChild(live); first = false;
      }
      live.querySelector(".cro").textContent = t;
      c.scrollTop = c.scrollHeight;
    };

    let j;
    try{
      j = await askProxyStream(tutorSystem(), msgs, onText);
    }catch(e){
      if(String(e.message) === "NOSTREAM"){        // host can't stream — fall back
        j = parseTagged(await ask(tutorSystem(), msgs));
      } else { if(live.parentNode) live.remove(); throw e; }
    }
    if(live.parentNode) live.remove();

    CH.hist.push({who:"bot", hr:j.reply, tr:j.translation, fix:j.correction||null, sugg:j.suggestions||[]});
    touchChat(); addXP(3);
    if($("#cherr")) $("#cherr").innerHTML = "";
  }catch(e){
    CH.hist.push({who:"bot", hr:"Something went wrong.", tr:"The connection failed — details below.", sugg:[]});
    if($("#cherr")) $("#cherr").innerHTML = apiError(e);
    console.error("Nauči hrvatski AI call failed:", e);
  }
  clearTimeout(slow1); clearTimeout(slow2);
  const ty = $("#typing"); if(ty) ty.remove();
  $$(".msg.bot").forEach(el => { if(el.querySelector(".spin") && !el.textContent.trim()) el.remove(); });
  CH.busy = false; if($("#send")) $("#send").disabled = false;
  paintChat(); if($("#say")) $("#say").focus();
}

  const old = card.nextElementSibling; if(old && old.classList.contains("review")) old.remove();
  card.insertAdjacentHTML("afterend", reviewHTML(FD.log));
}

/* ---------- 2. write a sentence (AI-checked) ---------- */
let FWR = null;
function vWrite(){
  const open = Object.keys(FCASE).filter(caseOpen);
  FWR = FWR || { pick: "mix", task: null, own: "" };
  if(FWR.pick !== "mix" && !open.includes(FWR.pick)) FWR.pick = "mix";
  if(FWR.task && !open.includes(FWR.task.k)) FWR.task = null;
  shell("practise · vježbaj", "Write a <i>sentence</i>",
    "You get a word and a job for it. Write any sentence you like — the AI checks it and explains in plain words. Or pick your own word.",
    `<div class="card">
      <div class="kicker">case · padež</div>
      <div class="chips">
        <button class="chip" aria-pressed="${FWR.pick === "mix"}" onclick="FWR.pick='mix';newWriteTask()">${dual("Surprise me","Iznenadi me")}</button>
        ${Object.keys(FCASE).map(k => open.includes(k)
          ? `<button class="chip" aria-pressed="${FWR.pick === k}" onclick="FWR.pick='${k}';newWriteTask()">${dual(FCASE[k].name, FCASE[k].hr)}</button>`
          : `<button class="chip" disabled title="Pass the big quiz of Unit ${unitNo(FCASE[k].unit)} to open">${dual("&#128274; " + FCASE[k].name, "pass Unit " + unitNo(FCASE[k].unit))}</button>`).join("")}
      </div>
      <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">
        <input class="field" id="fw-own" placeholder="…or type your own word (e.g. prijatelj)" value="${esc(FWR.own)}" autocomplete="off" spellcheck="false" style="flex:1;min-width:180px">
        <button class="btn ghost sm" onclick="FWR.own=$('#fw-own').value.trim();newWriteTask()">${dual("Use my word","Moja riječ")}</button>
      </div>
      ${open.length ? "" : `<p class="note" style="margin-top:12px">Pass the big quiz of the accusative unit (Unit ${unitNo(8)}) in Grammar and this opens up.</p>`}
    </div>
    <div class="card" style="margin-top:14px" id="fw-card"></div>`);
  if(open.length){ if(!FWR.task) newWriteTask(); else paintWriteTask(); }
}
function newWriteTask(){
  const open = Object.keys(FCASE).filter(caseOpen);
  if(!open.length) return;
  const k = FWR.pick === "mix" ? open[Math.floor(Math.random() * open.length)] : FWR.pick;
  let word, en = "";
  if(FWR.own){ word = FWR.own; }
  else {
    const fits = FW.filter(w => FF.some(fr => fr.c === k && fr.ok(w)));
    const w = fits[Math.floor(Math.random() * fits.length)]; word = w.b; en = w.en;
  }
  const fw = FW.find(x => norm(x.b) === norm(word));                  // a course word: the app knows its forms
  FWR.task = { k, word, en, form: fw ? (formForm(fw, k) || "") : "", done: null };
  if(CUR === "fwrite" && $("#fw-card")) paintWriteTask(); else vWrite();
}
function paintWriteTask(){
  const t = FWR.task, card = $("#fw-card"); if(!t || !card) return;
  const c = FCASE[t.k];
  card.innerHTML = `<div class="kicker">${esc(c.name)} · ${esc(c.hr)}</div>
    <p style="font-size:16px;margin:4px 0 12px">Write a sentence with <b class="hr" style="font-family:var(--display);font-size:20px">${esc(t.word)}</b>${t.en ? ` <span style="color:var(--stone-dim)">(${esc(t.en)})</span>` : ""} as <b>${esc(c.role)}</b>.</p>
    <input class="answer" id="fw-a" placeholder="Napiši rečenicu…" autocomplete="off" spellcheck="false">
    <div style="margin-top:12px;display:flex;gap:9px;flex-wrap:wrap">
      <button class="btn" id="fw-check" onclick="checkWrite()">${dual("Check my sentence","Provjeri")}</button>
      <button class="btn ghost sm" onclick="FWR.own='';newWriteTask()">${dual("New word","Nova riječ")}</button>
    </div>
    <div id="fw-v"></div>`;
  const a = $("#fw-a");
  if(t.typed) a.value = t.typed;
  a.addEventListener("input", () => { t.typed = a.value; });
  if(t.vHTML){ $("#fw-v").innerHTML = t.vHTML; return; }
  if(t.sent){ paintWriteResult(t, t.form ? tokens(t.sent).includes(norm(t.form)) : null, t.failed ? { failed: true } : { busy: "Getting feedback on the rest…" }); return; }
  a.focus(); a.addEventListener("keydown", e => { if(e.key === "Enter") checkWrite(); });
}
/* Works like the daily-sentence check: the part the app can judge by itself shows at
   once, you can move on straight away, and the AI's feedback drops in when it's ready
   (with one quiet retry if the AI is busy). */
async function checkWrite(retry){
  const t = FWR.task, out = $("#fw-v"); if(!t || !out) return;
  if(!retry){
    const inp = $("#fw-a"); if(!inp) return;
    const s0 = inp.value.trim();
    if(tokens(s0).length < 2){ out.innerHTML = `<div class="verdict no">Write a full sentence — at least two words.</div>`; return; }
    t.sent = s0; t.ai = null; t.vHTML = ""; t.typed = s0; t.failed = false;
  }
  const s = t.sent, c = FCASE[t.k];
  const formUsed = t.form ? tokens(s).includes(norm(t.form)) : null;
  paintWriteResult(t, formUsed, { busy: retry === 2 ? "The AI is busy — trying again…" : "Getting feedback on the rest…" });
  try{
    const txt = await ask(STYLE_RULES + "You are a friendly Croatian teacher checking one learner sentence. Be encouraging and brief. Write all explanations in English.",
      [{role:"user", content:`Task: write a sentence using "${t.word}" in the ${c.name} case (${c.role}).
The learner wrote: "${s}"
What's being practised is the ending on "${t.word}". Is it the right ${c.name} form? Then glance at the rest.
${CHECK_RULES}
${courseContext()}
Return ONLY JSON, no markdown: {"ok":true or false,"caseOk":true or false,"fixed":"<the sentence with any real fix, written WITH proper diacritics; identical apart from accents if nothing else is wrong>","en":"<English translation>","form":"<the ${c.name} form of ${t.word}>","note":"<one short sentence in plain English>"}`}], 1000);
    const j = parseJSON(txt);
    if(FWR.task !== t) return;                               // you've moved on
    t.ai = j;
    paintWriteResult(t, formUsed, {});
  }catch(e){
    if(FWR.task !== t) return;
    if(!retry){ paintWriteResult(t, formUsed, { busy: "The AI is busy — trying again…" }); return setTimeout(() => { if(FWR.task === t) checkWrite(2); }, 3000); }
    t.failed = true;
    paintWriteResult(t, formUsed, { failed: true });
  }
}
// Plain-English check on the AI's note: if it slipped into Croatian, leave it out.
const looksEnglish = s => /\b(the|is|a|an|you|your|it|to|and|of|here|with|for|this|that|use)\b/i.test(String(s || ""));
function paintWriteResult(t, formUsed, st){
  const out = $("#fw-v"); if(!out || FWR.task !== t) return;
  const c = FCASE[t.k], s = t.sent, j = t.ai;
  let head, body = "";
  if(j){
    const fixed = String(j.fixed || s);
    const onlyAccents = norm(fixed) === norm(s);
    const caseOk = formUsed === true || (formUsed !== false && j.caseOk !== false) || (formUsed === false && j.caseOk === true && !!j.ok);
    const clean = caseOk && (!!j.ok || onlyAccents);
    const level = clean ? "ok" : caseOk ? "fix" : "no";
    if(caseOk && !t.xp){ t.xp = true; addXP(4); }
    head = level === "ok" ? `<b style="color:var(--olive)">Nice — that's right ✓</b>`
         : level === "fix" ? `<b style="color:var(--olive)">Right ending ✓</b> <span style="color:var(--brass)">— one small fix elsewhere</span>`
         : `<b style="color:var(--madder)">Almost ✗</b>`;
    const showFix = rvPlain(fixed) !== rvPlain(s);
    body = `${showFix ? `<div style="margin-top:6px"><span style="color:var(--stone-dim)">${level === "no" ? "Better:" : onlyAccents ? "With the accents:" : "Fixed:"}</span>
          <span style="font-family:var(--display);font-size:18px">${esc(fixed)}</span> ${spk(fixed)}</div>` : ""}
        ${j.en && looksEnglish(j.en) ? `<div style="font-size:13px;color:var(--stone-dim);font-style:italic;margin-top:3px">${esc(j.en)}</div>` : ""}
        ${(t.form || j.form) ? `<div style="font-size:14px;margin-top:5px">${esc(c.name)} of <b>${esc(t.word)}</b>: <b class="hr" style="font-family:var(--display);font-size:16px">${esc(t.form || j.form)}</b></div>` : ""}
        ${j.note && looksEnglish(j.note) && !(level === "ok" && onlyAccents) ? `<div style="font-size:14px;margin-top:4px">${esc(j.note)}</div>` : ""}`;
    out.innerHTML = `<div class="verdict ${level === "no" ? "no" : "ok"}">${head}${body}</div>${writeButtons()}`;
    t.vHTML = out.innerHTML;
    return;
  }
  // No AI answer yet: show what the app knows by itself, and let you move on.
  head = formUsed === true ? `<b style="color:var(--olive)">Right ending ✓</b> <span class="hr" style="font-family:var(--display);font-size:17px">${esc(t.form)}</span>`
       : formUsed === false ? `<b style="color:var(--madder)">Check the ending</b> — the ${esc(c.name.toLowerCase())} of <b>${esc(t.word)}</b> is <b class="hr" style="font-family:var(--display);font-size:17px">${esc(t.form)}</b>`
       : "";
  const tail = st.failed
    ? `<div style="font-size:13px;color:var(--stone-dim);margin-top:6px">Couldn't get AI feedback right now${formUsed === true ? " — the ending is right, so it counts" : ""}.
         <button class="btn ghost sm" style="margin-left:6px" onclick="checkWrite(1)">↻ ${dual("Retry","Opet")}</button></div>`
    : `<div style="font-size:13px;color:var(--stone-dim);margin-top:6px"><span class="spin"></span> ${esc(st.busy || "Checking…")}</div>`;
  if(formUsed === true && !t.xp){ t.xp = true; addXP(4); }
  out.innerHTML = `<div class="verdict ${formUsed === false ? "no" : formUsed ? "ok" : ""}" ${formUsed == null ? `style="border:1px dashed var(--line)"` : ""}>${head}${tail}</div>${writeButtons()}`;
}
function writeButtons(){
  return `<div style="margin-top:12px;display:flex;gap:9px;flex-wrap:wrap">
      <button class="btn" onclick="FWR.own='';newWriteTask()">${dual("Next word","Sljedeća")} →</button>
      <button class="btn ghost sm" onclick="FWR.task.vHTML='';FWR.task.ai=null;FWR.task.sent='';paintWriteTask()">${dual("Try again","Opet")}</button>
    </div>`;
}

function vRead(){

function keepReading(){

async function genRead(topic, retried){
  const out = $("#rout");

  try{
    const txt = await ask(STYLE_RULES + "You write graded reading texts for a Croatian course. Use everyday spoken vocabulary (avion, aerodrom, dućan), never bureaucratic forms.",
      [{role:"user", content:`Topic: ${topic}. Level: CEFR ${S.level}.
Write a short original text in standard Croatian: ${S.level==="A1"?"60-90":S.level==="A2"?"110-150":"170-220"} words. Natural, warm, specific, with real Croatian detail. Present tense dominant at A1.
Then: a glossary of the 10-14 hardest words (give the DICTIONARY form plus the English), and 4 comprehension questions in Croatian with 4 options each.
Return ONLY this JSON, no markdown:
{"title":"<Croatian title>","titleEn":"<English title>","text":"<the text>","translation":"<full English translation>","glossary":[["<dictionary form>","<English>"]],"questions":[{"q":"<question in Croatian>","qEn":"<the question in English>","o":["","","",""],"oEn":["<option 1 in English>","","",""],"a":<index>,"e":"<short English explanation>"}]}`}], 6000);
    let parsed;
    try{ parsed = parseJSON(txt); }catch(pe){ throw new Error("BADJSON"); }
    if(!parsed || !parsed.text) throw new Error("BADJSON");
    RD = parsed; RD.topic = topic;
    (RD.glossary||[]).forEach(g=>{ GLOSSCACHE[norm(g[0])] = g[1]; });
    RD.at = Date.now();

  }catch(e){
    const m = String((e && e.message) || "");

      out.innerHTML = `<div class="card" style="margin-top:14px"><span class="spin"></span> Gemini hiccupped — trying once more…</div>`;
      return setTimeout(() => genRead(topic, true), 2500);

}

function markup(t){
  const re = /[A-Za-zČčĆćŠšŽžĐđ]{2,}/g;
  let out = "", last = 0, m;
  while((m = re.exec(t))){
    out += esc(t.slice(last, m.index));
    out += '<w onclick="gloss(event,&quot;'+esc(m[0])+'&quot;)">'+esc(m[0])+'</w>';
    last = m.index + m[0].length;
  }
  return out + esc(t.slice(last));
}
