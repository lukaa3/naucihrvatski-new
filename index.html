{
  id:22, sec:5, title:"Word order and little words", sub:"Red riječi i enklitike",
  goal:"The single thing that most separates a learner's Croatian from a native's.",
  grammar:[
    {h:"The second-position rule",
     b:"Unstressed words — <b>sam si je smo ste su · ću ćeš će · bih bi · me te ga je joj mu ih im · se · li</b> — cluster in <b>second position</b> in the clause.<br><br>✓ Radio <b>sam</b>. ✓ Jučer <b>sam</b> radio. ✓ U Zagrebu <b>sam</b> radio.<br>✗ <b>Sam</b> radio. ✗ Jučer radio <b>sam</b>.<br><br>Whatever you put first, the cluster follows immediately after it."},
    {h:"They come in a fixed order",
     b:"When several stack up, this is the sequence:<br><br><b>li → ću/bih → mi/ti/mu/joj/nam → me/te/ga/je → se → je (biti)</b><br><br>Dao <b>mi ga je</b>. — He gave it to me.<br>Kako <b>ti se</b> sviđa? — How do you like it?<br>Jučer <b>sam ga</b> vidio. — I saw him yesterday.<br>Ne bih <b>ti to</b> rekao. — I wouldn't tell you that.<br><br>Read the cluster as one glued-together chunk that slots in after the first word. You can be perfect on cases and still sound foreign if these sit wrong."},
    {h:"Otherwise word order is free",
     b:"Because the endings carry the grammar, you can reorder for emphasis:<br><b>Ana voli Marka.</b> — neutral<br><b>Marka voli Ana.</b> — it's Marko she loves<br><b>Voli Ana Marka.</b> — she does love him<br><br>All grammatical, all meaning the same basic thing. The last position tends to carry the new information."},
    {h:"The je exception",
     b:"<b>je</b> (from biti) goes <em>last</em> in the cluster, except it swaps with <b>se</b>:<br>Vidio <b>ga je</b>. — He saw him.<br>Vratio <b>se je</b> → in practice: <b>vratio se</b>. (je usually drops after se)"}
  ],
  vocab:[["dakle","so / therefore"],["ipak","still / after all"],["zapravo","actually"],
    ["uglavnom","mostly"],["barem","at least"],["čak","even"],["tek","only just"],
    ["upravo","just now / exactly"],["odmah","immediately"],["opet","again"],
    ["također","also"],["osim","except"],["prema","towards"],["iako","although"]],
  phrases:[["Dao mi ga je.","He gave it to me."],["Kako ti se sviđa?","How do you like it?"],
    ["Jučer sam ga vidio.","I saw him yesterday. (m)"],["Ne bih ti to rekao.","I wouldn't tell you that. (m)"],
    ["Vidio sam je.","I saw her. (m)"]],
  drills:[
    {t:"mc",q:"Which is correct?",o:["Sam ga vidio.","Ga sam vidio.","Vidio sam ga.","Vidio ga sam."],a:2,e:"Clitics go second, in order: sam then ga... actually here 'vidio' is first, so 'sam ga' follows."},
    {t:"mc",q:"Correct order in 'He gave it to me':",o:["Dao je mi ga.","Dao mi ga je.","Dao ga mi je.","Dao je ga mi."],a:1,e:"Dative before accusative, je last."},
    {t:"mc",q:"Where do clitics sit?",o:["First","Second","Last","Anywhere"],a:1,e:"Second position in the clause."},
    {t:"type",q:"Say: How do you like it? (informal)",a:["kako ti se sviđa","kako ti se svida"],e:"Kako ti se sviđa?"},
    {t:"mc",q:"Why is 'Ana voli Marka' still clear if reordered?",o:["Word order is fixed","Endings carry the grammar","Croatian has articles","It isn't clear"],a:1,e:"The -a on Marka marks the object."},
    {t:"mc",q:"Which comes first in a cluster?",o:["se","je","mi","li"],a:3,e:"li → ću/bih → dative → accusative → se → je."}
  ]
},
{
  id:23, sec:5, title:"Joining sentences", sub:"Veznici",
  goal:"Stop speaking in short bursts. Connectors are what turn phrases into conversation.",
  grammar:[
    {h:"The basic joiners",
     b:"<b>i</b> and · <b>a</b> and/but (contrast) · <b>ali</b> but · <b>ili</b> or<br><b>pa</b> so, and then · <b>te</b> and (formal) · <b>nego</b> but rather<br><br><em>Ja radim, <b>a</b> ona uči.</em> — I work, and she studies. (contrasting)<br><em>Volim kavu, <b>ali</b> ne pijem je navečer.</em><br><br>The <b>i / a</b> difference: <em>i</em> just adds, <em>a</em> sets two things against each other."},
    {h:"da — the workhorse",
     b:"<b>da</b> means <em>that</em>, and it's everywhere:<br><em>Mislim <b>da</b> je dobro.</em> — I think that it's good.<br><em>Znam <b>da</b> dolaziš.</em> — I know you're coming.<br><em>Nadam se <b>da</b> ćeš doći.</em> — I hope you'll come.<br><br>Unlike English, <b>you can't drop it</b>. <em>Mislim je dobro</em> is wrong.<br><br><b>da</b> also replaces the infinitive: <em>Želim <b>da</b> dođeš.</em> — I want you to come."},
    {h:"Cause, time and condition",
     b:"<b>jer</b> / <b>zato što</b> — because<br><b>ako</b> — if (real condition)<br><b>kad(a)</b> — when<br><b>dok</b> — while / until<br><b>iako</b> — although<br><b>zato</b> — that's why<br><b>prije nego</b> — before · <b>nakon što</b> — after<br><br><em>Ne idem <b>jer</b> sam umoran.</em><br><em><b>Ako</b> imaš vremena, dođi.</em><br><em><b>Kad</b> sam bio mali, živio sam u Splitu.</em><br><em><b>Iako</b> je hladno, idem van.</em>"},
    {h:"koji — which, who, that",
     b:"<b>koji / koja / koje</b> links a description to a noun, and it takes the case its own clause needs:<br><em>Čovjek <b>koji</b> govori…</em> — The man who is speaking… (subject)<br><em>Knjiga <b>koju</b> čitam…</em> — The book that I'm reading… (object)<br><em>Grad u <b>kojem</b> živim…</em> — The city I live in… (locative)<br><br>Gender comes from the noun it refers back to; case comes from its job in the new clause."}
  ],
  vocab:[["i","and"],["a","and / but"],["ali","but"],["ili","or"],["pa","so / then"],
    ["da","that"],["jer","because"],["zato što","because"],["ako","if"],["kad","when"],
    ["dok","while"],["iako","although"],["zato","that's why"],["koji","which / who"],
    ["osim toga","besides"],["na primjer","for example"],["s druge strane","on the other hand"]],
  phrases:[["Mislim da je to dobra ideja.","I think that's a good idea."],
    ["Ne idem jer sam umoran.","I'm not going because I'm tired. (m)"],
    ["Ako imaš vremena, dođi.","If you have time, come."],
    ["Kad sam bio mali, živio sam u Splitu.","When I was little, I lived in Split. (m)"],
    ["Knjiga koju čitam je odlična.","The book I'm reading is excellent."],
    ["Iako je hladno, idem van.","Although it's cold, I'm going out."]],
  drills:[
    {t:"type",q:"Say: I think that's a good idea.",a:["mislim da je to dobra ideja"],e:"Mislim da je to dobra ideja."},
    {t:"mc",q:"Can you drop 'da' like English drops 'that'?",o:["Yes, always","No, never","Only in questions","Only in the past"],a:1,e:"da is obligatory in Croatian."},
    {t:"mc",q:"'The book that I'm reading' =",o:["Knjiga koji čitam","Knjiga koja čitam","Knjiga koju čitam","Knjiga kojoj čitam"],a:2,e:"It's the object of čitam → accusative koju."},
    {t:"mc",q:"Difference between 'i' and 'a'?",o:["No difference","i adds, a contrasts","a is formal","i is past tense"],a:1,e:"a sets two things against each other."},
    {t:"type",q:"Say: I'm not going because I'm tired. (m)",a:["ne idem jer sam umoran"],e:"Ne idem jer sam umoran."},
    {t:"mc",q:"'Although it's cold' =",o:["Ako je hladno","Iako je hladno","Jer je hladno","Kad je hladno"],a:1,e:"iako = although."}
  ]
},
{
  id:24, sec:5, title:"Sound changes", sub:"Glasovne promjene",
  goal:"Understand why endings sometimes reshape the word — so irregular forms stop looking random.",
  grammar:[
    {h:"Palatalizacija — k, g, h → č, ž, š",
     b:"Before certain endings, these three consonants soften:<br>ruka → ru<b>č</b>ica · knjiga → knji<b>ž</b>ica · duh → du<b>š</b>a<br>vojnik → vojni<b>č</b>e (vocative) · Bog → Bo<b>ž</b>e<br><br>You'll see it constantly in vocatives and diminutives."},
    {h:"Sibilarizacija — k, g, h → c, z, s",
     b:"Before <b>-i</b>, usually in masculine plurals and the dative/locative of feminines:<br>vojnik → vojni<b>c</b>i · knjiga → knji<b>z</b>i (D/L) · siromah → siroma<b>s</b>i<br>ruka → ru<b>c</b>i · noga → no<b>z</b>i<br><br>This is why <em>u knjizi</em> looks nothing like <em>knjiga</em>."},
    {h:"Jotacija — consonant + j merge",
     b:"t + j → <b>ć</b> · d + j → <b>đ</b> · s + j → <b>š</b> · z + j → <b>ž</b> · l + j → <b>lj</b> · n + j → <b>nj</b><br><br>brat + ja → bra<b>ć</b>a · mlad + ji → mla<b>đ</b>i · visok + ji → vi<b>š</b>i<br><br>This is where comparatives get their shape."},
    {h:"Nepostojano a — the vanishing a",
     b:"Some words have an <b>a</b> that appears in the nominative and disappears everywhere else:<br>p<b>a</b>s → psa, psu, psom<br>ot<b>a</b>c → oca, ocu<br>dobar → dobr<b>og</b>, dobr<b>a</b><br>Amerikan<b>a</b>c → Amerikanca<br><br>Once you spot the pattern, dozens of 'irregular' words become regular."},
    {h:"L → O at the end of words",
     b:"Word-final <b>l</b> became <b>o</b>. That's why past participles look the way they do:<br>čita<b>l</b> → čita<b>o</b> · radi<b>l</b> → radi<b>o</b> · bi<b>l</b> → bi<b>o</b><br>But the feminine keeps the l: čita<b>la</b>, radi<b>la</b>, bi<b>la</b>.<br><br>Also: sto<b>l</b> but stolovi, pose<b>o</b> → posla (work)."}
  ],
  vocab:[["ruka","hand / arm"],["noga","leg / foot"],["knjiga","book"],["oko","eye"],["uho","ear"],
    ["glava","head"],["kosa","hair"],["lice","face"],["srce","heart"],["tijelo","body"],
    ["prst","finger"],["leđa","back (pl)"],["trbuh","stomach"],["zub","tooth"],["usta","mouth (pl)"]],
  phrases:[["Boli me glava.","I have a headache."],["Boli me trbuh.","My stomach hurts."],
    ["U knjizi piše…","In the book it says…"],["Na ruci imam sat.","I have a watch on my hand."]],
  drills:[
    {t:"mc",q:"Why does 'knjiga' become 'knjizi'?",o:["Palatalizacija","Sibilarizacija","Jotacija","Nepostojano a"],a:1,e:"k, g, h → c, z, s before -i."},
    {t:"mc",q:"Why is it 'psa' and not 'pasa'?",o:["Palatalizacija","Jotacija","Nepostojano a","L→O"],a:2,e:"The a in pas vanishes in other cases."},
    {t:"mc",q:"'čitao' comes from:",o:["čitau","čital","čitav","čitat"],a:1,e:"Word-final l became o."},
    {t:"mc",q:"Why does the feminine keep 'čitala'?",o:["It's irregular","The l isn't word-final there","Feminines never change","It's a different verb"],a:1,e:"The l is followed by -a, so it stays."},
    {t:"type",q:"Say: I have a headache.",a:["boli me glava"],e:"Boli me glava — literally 'the head hurts me'."},
    {t:"mc",q:"t + j gives:",o:["č","ć","đ","š"],a:1,e:"Jotacija: t+j → ć, as in braća."}

},
{
  id:25, sec:5, title:"Verb prefixes", sub:"Prefiksi",
  goal:"Turn one verb into fifteen. This is how Croatian builds most of its vocabulary.",
  grammar:[
    {h:"One root, many meanings",
     b:"Take <b>ići</b> (to go) and watch:<br><b>doći</b> — come · <b>otići</b> — leave · <b>ući</b> — enter · <b>izaći</b> — exit<br><b>proći</b> — pass by · <b>naći</b> — find · <b>poći</b> — set off · <b>obići</b> — go around<br><b>prijeći</b> — cross · <b>sići</b> — get down · <b>ući</b> — go in<br><br>Same with <b>pisati</b>: napisati (write down), potpisati (sign), prepisati (copy), opisati (describe), zapisati (note down), ispisati (print out)."},
    {h:"What each prefix tends to mean",
     b:"<b>do-</b> arrival, up to · <b>od-</b> away from · <b>u-</b> into · <b>iz-</b> out of<br><b>pre-</b> across, over, re- · <b>pro-</b> through, past · <b>za-</b> begin, behind<br><b>na-</b> onto, a quantity of · <b>po-</b> a bit, completion · <b>s-/z-</b> together, down<br><b>raz-</b> apart · <b>ob-/o-</b> around · <b>pri-</b> near, adding<br><br>These are tendencies, not rules. But once you know them, you can often guess a new verb."},
    {h:"Prefixes usually make a verb perfective",
     b:"Adding a prefix to an imperfective verb generally makes it perfective:<br>pisati (impf) → napisati (pf)<br>čitati (impf) → pročitati (pf)<br>jesti (impf) → pojesti (pf)<br><br>To get an imperfective back, Croatian adds a suffix:<br>napisati → napisivati · doći → dolaziti · otići → odlaziti"},
    {h:"Learn them as families",
     b:"When you meet a new verb, look for the root you already know. <em>Prevesti</em> looks new until you see <b>pre-</b> (across) + <b>voditi</b> (lead) = translate, lead across.<br><br><em>Razumjeti</em> = <b>raz-</b> (apart) + <b>umjeti</b> (to know how) = to take apart and know = understand.<br><br>This is why Croatian vocabulary accelerates: after a few hundred words you start guessing correctly."}
  ],

{
  id:26, sec:5, title:"Everyday speech", sub:"Svakodnevni govor",
  goal:"The words and habits that make you sound like a person rather than a textbook.",
  grammar:[
    {h:"The words in every real conversation",
     b:"<b>Može?</b> — OK? Works for you? · <b>Može!</b> — Sure<br><b>Ajde</b> — come on, let's go, alright<br><b>Dobro</b> — OK (agreeing to anything)<br><b>Kako ide?</b> — How's it going? (friendlier than Kako si?)<br><b>Nema veze</b> — never mind<br><b>Nema frke</b> — no worries<br><b>Fakat?</b> — really?<br><b>Baš</b> — really, just: <em>Baš je lijepo!</em><br><b>Evo</b> / <b>Eto</b> — here you go / there you have it<br><b>Pa</b> — well, so (starting a reply)<br><b>Ma</b> — oh come on: <em>Ma ne!</em><br><br>Three of these — <b>može</b>, <b>ajde</b>, <b>nema veze</b> — will carry you a long way."},
    {h:"Formal word vs. spoken word",
     b:"Textbooks teach the left; people say the right:<br><em>zrakoplov</em> → <b>avion</b><br><em>zračna luka</em> → <b>aerodrom</b><br><em>trgovina</em> → <b>dućan</b><br><em>računalo</em> → <b>kompjuter</b><br><em>hladnjak</em> → <b>frižider</b><br><em>dizalo</em> → <b>lift</b><br><em>pješice</em> → <b>pješke</b><br><br>All still Croatian — this is formal versus everyday, not Croatian versus Serbian."},
    {h:"Buying time when you're stuck",
     b:"Fluency is mostly about recovering smoothly, not never making mistakes.<br><b>Kako da kažem…</b> — how do I put it…<br><b>Samo malo.</b> — just a moment<br><b>Ne znam kako se kaže.</b> — I don't know how to say it<br><b>Možete li ponoviti?</b> — can you repeat?<br><b>Što znači to?</b> — what does that mean?<br><br>Memorise these word for word. They keep a conversation alive instead of killing it."},
    {h:"Opinions",
     b:"<b>Mislim da…</b> — I think that…<br><b>Slažem se</b> / <b>Ne slažem se</b> — I agree / disagree<br><b>Imaš pravo.</b> — You're right.<br><b>Ovisi.</b> — It depends.<br><b>Nije loše.</b> — Not bad.<br><b>Super!</b> / <b>Odlično!</b> — Great!"}

const Store = (()=>{
  const mem = {};
  let LS = null;
  try{ const t="__pl"; window.localStorage.setItem(t,"1"); window.localStorage.removeItem(t); LS = window.localStorage; }catch(e){ LS = null; }
  const CS = (typeof window!=="undefined" && window.storage && typeof window.storage.get==="function") ? window.storage : null;
  const mode = LS ? "local" : CS ? "claude" : "none";
  return {
    mode, persistent: mode!=="none",
    async get(k){
      if(LS){ try{ const v = LS.getItem(k); if(v!=null) return JSON.parse(v); }catch(e){} }
      if(CS){ try{ const r = await CS.get(k); if(r) return JSON.parse(r.value); }catch(e){} }
      return mem[k] ?? null;
    },
    async set(k,v){
      mem[k] = v;
      if(LS){ try{ LS.setItem(k, JSON.stringify(v)); return; }catch(e){} }
      if(CS){ try{ await CS.set(k, JSON.stringify(v)); }catch(e){} }
    },
    async del(k){
      delete mem[k];
      if(LS){ try{ LS.removeItem(k); }catch(e){} }
      if(CS){ try{ await CS.delete(k); }catch(e){} }
    }
  };
})();

async function loadState(){

  if(saved) S = Object.assign(S, saved);
  const today = new Date().toISOString().slice(0,10);
  if(S.lastDay !== today){
    const y = new Date(Date.now()-864e5).toISOString().slice(0,10);
    S.streak = (S.lastDay === y) ? (S.streak||0)+1 : 1;
    S.lastDay = today;

async function save(){
  S.updatedAt = Date.now();
  await Store.set("nh:state", S);
  paintStats();
  if(CLOUD.user){                       // debounced background push
    clearTimeout(PUSH_T);
    PUSH_T = setTimeout(()=>CLOUD.push(true), 4000);
  }
}
function addXP(n){ S.xp = (S.xp||0) + n; save(); }

function paintStats(){
  const total = UNITS.length*2;
  let d = 0;
  UNITS.forEach(u=>{ const x=S.done[u.id]; if(x){ if(x.read) d++; if(x.drill!=null) d++; } });
  $("#s-xp").textContent = S.xp||0;
  $("#s-streak").textContent = S.streak||0;
  $("#s-words").textContent = Object.keys(S.cards||{}).length;
  const pct = Math.min(1, d/total);

  // Šahovnica: the checkerboard fills square by square as you finish the course.
  const board = $("#board");
  if(board && board.dataset.filled !== String(Math.round(pct*48))){
    board.dataset.filled = String(Math.round(pct*48));
    const cols = 24, rows = 2, w = 240/cols, hgt = 20/rows;
    const filled = Math.round(pct * cols * rows);
    let out = "", n = 0;
    for(let r = 0; r < rows; r++){
      for(let c = 0; c < cols; c++){
        const light = (r + c) % 2 === 0;
        const on = n < filled;
        const fill = on ? (light ? "#E0362F" : "#EAF0FA") : (light ? "rgba(234,240,250,.07)" : "rgba(234,240,250,.03)");
        out += `<rect x="${c*w}" y="${r*hgt}" width="${w}" height="${hgt}" fill="${fill}"/>`;
        n++;
      }
    }
    board.innerHTML = out;
  }
  const lab = $("#pl-label");
  if(lab) lab.textContent = d === 0 ? "Your checkerboard fills as you learn."
        : d >= total ? "Course complete. Bravo!"
        : Math.round(pct*100) + "% of the course done";
}

async function askClaude(system, messages){
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({ model:"claude-sonnet-4-6", max_tokens: 1000, system, messages })
  });
  if(!res.ok) throw new Error("HTTP " + res.status);
  const data = await res.json();
  return (data.content||[]).map(b => b.type === "text" ? b.text : "").join("\n").trim();
}

async function askGemini(system, messages, maxTokens, key, model){
  const body = {
    system_instruction: { parts:[{ text: system }] },
    contents: messages.map(m => ({
      role: m.role === "assistant" ? "model" : "user",
      parts: [{ text: m.content }]
    })),
    generationConfig: {
      maxOutputTokens: Math.max(2048, maxTokens || 2048),
      temperature: 0.85,
      thinkingConfig: { thinkingBudget: 0 }
    }
  };
  const url = "https://generativelanguage.googleapis.com/v1beta/models/" +
              encodeURIComponent(model || GMODEL) + ":generateContent";
  const send = async payload => fetch(url, {
    method:"POST",
    headers:{ "Content-Type":"application/json", "x-goog-api-key": key || GKEY },
    body: JSON.stringify(payload)
  });

  let res = await send(body);
  if(res.status === 400){                       // some models reject thinkingConfig
    const b2 = JSON.parse(JSON.stringify(body));
    delete b2.generationConfig.thinkingConfig;
    res = await send(b2);
  }
  if(!res.ok){
    let msg = "";
    try{ const j = await res.json(); msg = (j.error && j.error.message) || ""; }catch(e){}
    if(res.status === 400 && /API key not valid/i.test(msg)) throw new Error("BADKEY");
    if(res.status === 403) throw new Error("BADKEY");
    if(res.status === 404) throw new Error("NOMODEL");
    if(res.status === 429) throw new Error("RATE");
    throw new Error("Gemini " + res.status + (msg ? ": " + msg : ""));
  }
  const d = await res.json();
  const c = (d.candidates || [])[0];
  const txt = (((c || {}).content || {}).parts || []).map(p => p.text || "").join("");
  if(!txt.trim()){
    const fr = c && c.finishReason;
    throw new Error(fr === "MAX_TOKENS" ? "The reply got cut off. Try again."
                  : fr === "SAFETY"     ? "Gemini blocked the reply."
                  : "Empty reply from Gemini.");
  }
  return txt.trim();
}

const PROXY = "/api/chat";
let PROXY_OK = null;   // null = untested, true = live, false = not usable
let DIAG = null;       // what the health check actually found

async function probe(live){
  // Informational only. The health check tells us what's wrong when it can,
  // but an older function build has no ping endpoint — that's not a failure,
  // so we never rule the proxy out on anything except 404 or no response.
  try{
    const r = await fetch(PROXY + "?ping=1" + (live ? "&live=1" : ""));
    if(r.status === 404){
      DIAG = { deployed:false, key:false, origin:false, http:404 };
      PROXY_OK = false; paintGear(); return;
    }
    let j = null;
    try{ j = await r.json(); }catch(e){}
    if(j && j.ok === true && typeof j.keyConfigured === "boolean"){
      DIAG = { deployed:true, known:true, key:!!j.keyConfigured, origin:!!j.originAllowed,
               origins:j.originsConfigured || [], http:r.status,
               works: typeof j.keyWorks === "boolean" ? j.keyWorks : null,
               problem: j.keyProblem || "" };
    }else{
      // function is alive but predates ?ping — status unknown, so let the real call decide
      DIAG = { deployed:true, known:false, key:null, origin:null, http:r.status };
    }
  }catch(e){
    DIAG = { deployed:false, key:false, origin:false, http:0 };
    PROXY_OK = false;
  }
  paintGear();
}

async function askProxy(system, messages, maxTokens){
  let res;
  try{
    res = await fetch(PROXY, {
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ system, messages, maxTokens: maxTokens || 2048 })
    });
  }catch(e){ throw new Error("NOPROXY"); }          // offline, or opened as a local file

  if(res.status === 404){ throw new Error("NOPROXY:404"); }

  let data = null, raw = "";
  try{ raw = await res.text(); data = JSON.parse(raw); }
  catch(e){ throw new Error("BADRESP:" + res.status + ":" + raw.slice(0,120).replace(/\s+/g," ")); }

  if(!res.ok){
    if(res.status === 429) throw new Error(data.error || "RATE");
    if(res.status === 500) throw new Error("NOKEY");
    if(res.status === 403) throw new Error("ORIGIN");
    if(res.status === 405) throw new Error("OLDFN");
    throw new Error("HTTP " + res.status + " — " + (data.error || "no detail"));
  }
  if(!data || !data.text) throw new Error("Empty reply.");
  PROXY_OK = true;
  return data.text.trim();
}

async function ask(system, messages, maxTokens){
  if(GKEY) return askGemini(system, messages, maxTokens);   // personal key wins, for local dev
  if(PROXY_OK !== false){
    try{ return await askProxy(system, messages, maxTokens); }
    catch(e){
      // Only fall through to Claude if nothing answered at all. If the function
      // replied with an error, surface that error — masking it hides the cause.
      if(String(e.message).indexOf("NOPROXY") === 0){ PROXY_OK = false; }
      else throw e;
    }
  }
  return askClaude(system, messages);
}
function parseJSON(txt){
  let t = String(txt).replace(/```json/gi,"").replace(/```/g,"").trim();
  const a = t.indexOf("{"), b = t.lastIndexOf("}");
  const c = t.indexOf("["), d = t.lastIndexOf("]");
  if(c > -1 && (c < a || a === -1)) t = t.slice(c, d+1); else if(a > -1) t = t.slice(a, b+1);
  return JSON.parse(t);
}
function apiError(e){
  const m = String((e && e.message) || "");
  if(/^KEY_INVALID/.test(m))  return `<div class="err"><b>API key is not valid.</b> Google rejected the key itself. In Cloudflare, re-paste <code>GEMINI_API_KEY</code> — watch for a trailing space or a key you've since deleted in AI Studio — then <b>Trigger deploy</b>.</div>`;
  if(/^KEY_EXPIRED/.test(m))  return `<div class="err"><b>API key has expired.</b> Make a fresh one in Google AI Studio, update the Netlify variable, and redeploy.</div>`;
  if(/^API_DISABLED/.test(m)) return `<div class="err"><b>API is not enabled.</b> The Generative Language API isn't enabled for this key's project. Enable it in Google Cloud, wait a minute, then try again.</div>`;
  if(/^PERMISSION/.test(m))   return `<div class="err"><b>Key lacks permission.</b> The key exists but is restricted from calling this API. Check its API restrictions in Google Cloud.</div>`;

  if(!GKEY) return `<div class="err"><b>AI is not connected.</b> Lessons, grammar, drills and flashcards all work without it.<div style="font-family:var(--mono);font-size:11px;margin-top:8px;color:var(--stone-dim);word-break:break-all">${esc(m) || "no error message"}</div><div style="margin-top:9px"><button class="btn sm" onclick="openSettings()">Otvori postavke</button></div></div>`;

function vLessons(){
  const cur = firstOpen();
  let out = "";
  SECTIONS.forEach(sec => {
    const list = UNITS.filter(u => u.sec === sec.id);
    const done = list.filter(u => unitState(u) === "done").length;
    out += `<div class="secthead">
      <div class="bar" style="background:${sec.color}"></div>
      <div><h3>${esc(sec.name)}</h3><div class="sub">${esc(sec.hr)}</div></div>
      <div class="cnt">${done}/${list.length}</div>
    </div><div class="path">`;
    list.forEach((u, i) => {
      const st = unitState(u);
      const side = i % 2 === 0 ? "l" : "r";
      const isCur = u.id === cur;
      const style = st === "done" ? `background:${sec.color};border-color:${sec.color};color:#05132B`
                  : st === "open" ? `color:${sec.color}` : "";
      out += `<div class="node ${side} ${st} ${isCur ? "cur" : ""}">
        <button onclick="${st === "locked" ? "lockedMsg()" : `go('unit',${u.id})`}">
          <span class="dotbig" style="${style}">${st === "done" ? "✓" : st === "locked" ? "&#128274;" : u.id}</span>
          <span class="lbl"><b>${esc(u.title)}</b><span>${esc(u.sub)}</span></span>
        </button></div>`;
    });
    out += `</div>`;
  });
  const total = UNITS.filter(u => unitState(u) === "done").length;
  shell("the course · tečaj", "Your <i>path</i>",
    `${total} of ${UNITS.length} units complete. Work down in order — finishing a unit unlocks the next. Everything from the alphabet to verb aspect, in the order that actually makes sense to learn it.`,
    out);
}

    <button class="btn sm" onclick="this.parentNode.remove()">OK</button>`;

}

let D = null;
function startDrill(id, custom){
  const u = UNITS.find(x=>x.id===id);
  D = { unit:id, title: custom ? "Provjera" : u.title, q: shuffle((custom||u.drills).slice()), i:0, score:0 };
  paintDrill();
}
function paintDrill(){
  if(D.i >= D.q.length){ return endDrill(); }
  const q = D.q[D.i];
  const bar = `<div class="progressline"><i style="width:${(D.i/D.q.length)*100}%"></i></div>`;
  const body = q.t === "mc"
    ? `<div class="opts">${q.o.map((o,i)=>`<button class="opt" onclick="pick(${i})">${esc(o)}</button>`).join("")}</div>`
    : `<input class="answer" id="ans" placeholder="Type it in Croatian…" autocomplete="off" autocapitalize="off" spellcheck="false">
       <div style="margin-top:12px"><button class="btn" onclick="pick(-1)">${dual("Check","Provjeri")}</button></div>`;
  shell(`question ${D.i+1} of ${D.q.length}`, esc(D.title), "",
    `${bar}<div class="card"><div class="q">${esc(q.q)}</div>${body}<div id="verdict"></div></div>`);
  const a = $("#ans");
  if(a){ a.focus(); a.addEventListener("keydown", e=>{ if(e.key==="Enter") pick(-1); }); }
}
function pick(i){
  const q = D.q[D.i];
  let ok;
  if(q.t === "mc"){
    ok = i === q.a;
    $$(".opt").forEach((b,j)=>{ b.disabled = true; if(j===q.a) b.classList.add("right"); else if(j===i) b.classList.add("wrong"); });
  } else {
    const v = norm($("#ans").value);
    if(!v) return;
    ok = q.a.some(x => norm(x) === v);
    $("#ans").disabled = true;
    $("#ans").style.borderColor = ok ? "var(--olive)" : "var(--madder)";
  }
  if(ok){ D.score++; addXP(5); }
  $("#verdict").innerHTML = `<div class="verdict ${ok?"ok":"no"}">
    <b style="color:${ok?"var(--olive)":"var(--madder)"}">${ok?"Correct!":"Not quite."}</b> ${esc(q.e||"")}
    </div><div style="margin-top:12px"><button class="btn" id="nx">${D.i+1>=D.q.length?"See score":"Next →"}</button></div>`;
  $("#nx").focus();
  $("#nx").onclick = ()=>{ D.i++; paintDrill(); };
}
function endDrill(){
  const pct = Math.round(D.score/D.q.length*100);
  const msg = pct===100 ? "Perfect. Every one right." : pct>=75 ? "Very good." : pct>=50 ? "Decent start — reread the lesson." : "Go back to the lesson and try again.";
  if(D.unit){ S.done[D.unit] = S.done[D.unit]||{}; S.done[D.unit].drill = Math.max(S.done[D.unit].drill||0, pct); save(); }
  const next = D.unit ? UNITS.find(x=>x.id===D.unit+1) : null;
  shell("done · gotovo", "Your score", "",
    `<div class="card" style="text-align:center;padding:40px">
      <div style="font-family:var(--mono);font-size:56px;color:var(--brass);line-height:1">${D.score}<span style="font-size:26px;color:var(--stone-dim)">/${D.q.length}</span></div>
      <p style="font-family:var(--display);font-size:22px;margin-top:8px">${msg}</p>
      <div class="chips" style="justify-content:center;margin-top:16px">
        ${D.unit?`<button class="btn ghost sm" onclick="startDrill(${D.unit})">${dual("Again","Opet")}</button>
        <button class="btn ghost sm" onclick="go('unit',${D.unit})">${dual("Back to lesson","Natrag na lekciju")}</button>`:""}
        ${next?`<button class="btn sm" onclick="go('unit',${next.id})">${dual("Next unit","Sljedeća cjelina")} →</button>`:`<button class="btn sm" onclick="go('razgovor')">${dual("Go talk","Idi na razgovor")} →</button>`}
      </div></div>`);
}

/* ============================================================
   RAZGOVOR — live tutor
   ============================================================ */
let CH = { busy:false };
// CH.hist stays a live pointer into the current saved conversation,
// so every existing call site keeps working unchanged.
Object.defineProperty(CH, "hist", {
  get(){ return curChat().hist; },
  set(v){ curChat().hist = v; save(); }
});

function newChat(scenario, level){
  const id = "c" + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
  S.chats = S.chats || {};
  S.chats[id] = { id, title:"", scenario: scenario || S.scenario, level: level || S.level,
                  created: Date.now(), updated: Date.now(), hist: [] };
  S.chatId = id;
  return S.chats[id];
}
function curChat(){
  S.chats = S.chats || {};
  if(!S.chatId || !S.chats[S.chatId]) newChat();
  return S.chats[S.chatId];
}
function touchChat(){
  const c = curChat();
  c.updated = Date.now();
  if(!c.title){
    const first = c.hist.find(m => m.who === "me");
    const sc = SCENARIOS.find(x => x.k === c.scenario);
    c.title = first ? first.hr.slice(0,42) : (sc ? sc.l : "Razgovor");
  }
  save();
}
function openChat(id){
  if(!S.chats[id]) return;
  S.chatId = id;
  S.scenario = S.chats[id].scenario;
  S.level = S.chats[id].level || S.level;
  save(); vTalk();
}
function startChat(){
  const c = curChat();
  if(c.hist.length) newChat(S.scenario, S.level);
  save(); vTalk();
}
let DELARM = null;
function delChat(id, ev){
  ev.stopPropagation();
  if(DELARM !== id){ DELARM = id; vTalk(); setTimeout(()=>{ if(DELARM===id){ DELARM=null; if(CUR==="razgovor") vTalk(); } }, 3500); return; }
  DELARM = null;
  delete S.chats[id];
  if(S.chatId === id){ S.chatId = Object.keys(S.chats)[0] || null; if(!S.chatId) newChat(); }
  save(); vTalk();
}
function renameChat(id, ev){
  ev.stopPropagation();
  const c = S.chats[id]; if(!c) return;
  const v = prompt("New name for this conversation:", c.title || "");
  if(v !== null){ c.title = v.trim().slice(0,60) || c.title; save(); vTalk(); }
}
function ago(t){
  const d = Math.floor((Date.now()-t)/1000);
  if(d < 60) return "sada";
  if(d < 3600) return Math.floor(d/60) + " min";
  if(d < 86400) return Math.floor(d/3600) + " h";
  const days = Math.floor(d/86400);
  return days === 1 ? "jučer" : days + " dana";
}
const LEVELS = [
  {k:"A1", l:"Početnik", en:"Beginner", d:"very short sentences, present tense, common words, lots of scaffolding"},
  {k:"A2", l:"Osnovni",  en:"Elementary", d:"short everyday sentences, past and future allowed, basic cases"},
  {k:"B1", l:"Srednji",  en:"Intermediate", d:"normal conversational Croatian, full case system, some idiom"}
];

function vTalk(){
  const cur = curChat();
  const list = Object.values(S.chats||{}).sort((a,b)=>(b.updated||b.created)-(a.updated||a.created));
  const sc = SCENARIOS.find(x=>x.k===S.scenario) || SCENARIOS[0];
  shell("razgovor · conversation", "Pričaj sa <i>mnom</i>",
    "Pick a situation and type back in Croatian. Every reply comes with a translation you can ignore once you don't need it, a gentle correction when you slip, and three things you could say next.",
    `<div class="card">
      <div class="kicker">situation · situacija</div>
      <div class="chips" style="margin-bottom:14px">${SCENARIOS.map(s=>
        `<button class="chip" aria-pressed="${s.k===S.scenario}" onclick="setScenario('${s.k}')">${dual(s.en, s.l)}</button>`).join("")}</div>
      <div class="kicker">level · razina</div>
      <div class="chips">${LEVELS.map(l=>
        `<button class="chip" aria-pressed="${l.k===S.level}" onclick="setLevel('${l.k}')">${dual(l.k + " · " + l.en, l.l)}</button>`).join("")}
        <button class="chip" aria-pressed="${S.showEn}" onclick="S.showEn=!S.showEn;save();vTalk()">${dual("Translation","Prijevod")}</button></div>
    </div>

    <div class="card" style="margin-top:14px">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px">
        <div class="kicker" style="margin:0">razgovori · ${list.length} saved</div>
        <button class="btn sm" onclick="startChat()">+ New conversation</button>
      </div>
      ${list.length ? `<div class="chatlist">${list.map(c=>{
        const sc = SCENARIOS.find(x=>x.k===c.scenario);
        const last = c.hist[c.hist.length-1];
        const on = c.id === S.chatId;
        return `<div class="chatrow${on?" on":""}" onclick="openChat('${c.id}')">
          <div class="cmeta">
            <div class="ct">${esc(c.title || (sc?sc.l:"Razgovor"))}</div>
            <div class="cs2">${esc(sc?sc.l:"")} · ${esc(c.level||"A1")} · ${c.hist.length} poruka · ${ago(c.updated||c.created)}</div>

    </div>

        <input id="say" placeholder="Write something in Croatian…" autocomplete="off" autocapitalize="sentences">

}
function setScenario(k){
  const c = curChat();
  S.scenario = k;
  if(c.hist.length) newChat(k, S.level); else { c.scenario = k; }
  save(); vTalk();
}
function setLevel(k){ S.level = k; curChat().level = k; save(); vTalk(); }

function paintChat(){
  const c = $("#chat"); if(!c) return;
  c.innerHTML = CH.hist.map(m=>{
    if(m.who==="me") return `<div class="msg me"><div class="cro">${esc(m.hr)}</div></div>`;
    return `<div class="msg bot"><div class="cro">${esc(m.hr)} ${spk(m.hr)}</div>
      ${S.showEn && m.tr ? `<div class="tr">${esc(m.tr)}</div>` : ""}
      ${m.fix ? `<div class="fix"><b>Almost:</b> ${esc(m.fix.fixed)}<br><span style="color:var(--stone-dim)">${esc(m.fix.note)}</span></div>` : ""}</div>`;
  }).join("");
  c.scrollTop = c.scrollHeight;
  const s = $("#sugg");
  const last = CH.hist[CH.hist.length-1];
  if(s) s.innerHTML = (last && last.sugg ? last.sugg : []).map(x=>
    `<button onclick="useSugg(${JSON.stringify(x).replace(/"/g,'&quot;')})">${esc(x)}</button>`).join("");
}
function useSugg(t){ const i=$("#say"); i.value=t; i.focus(); }

function tutorSystem(){
  const sc = SCENARIOS.find(x=>x.k===S.scenario) || SCENARIOS[0];
  const lv = LEVELS.find(x=>x.k===S.level) || LEVELS[0];
  return STYLE_RULES + `
ROLE: ${sc.s}
The learner is a teenage English speaker at CEFR ${lv.k} (${lv.en}). Match that: ${lv.d}.

HOW TO BEHAVE:
- Speak ONLY Croatian in the "reply" field. Keep it to 1-2 sentences and always end with a question so the conversation continues.
- Stay in character. Be warm, curious and a bit funny. React to what they actually said.
- If the learner writes "?" or asks in English, rephrase your previous question more simply in Croatian and put the explanation in "note".
- Correct only meaningful errors (wrong case, wrong verb form, wrong word choice, non-Croatian words). Ignore missing diacritics and capitalisation — a learner typing on a US keyboard cannot easily type č ž š ć đ.
- If they wrote a Serbian/Bosnian form (kafa, hleb, voz, šta, ko, hiljada, ekavian), always correct it and say briefly what the Croatian word is.
- If their Croatian was fine, set "correction" to null and do not invent a nitpick.
- "suggestions" = three short, natural things THEY could say next, in Croatian at their level.

OUTPUT: return ONLY valid JSON, no markdown fences, no text outside it:
{"reply":"<Croatian>","translation":"<English of reply>","correction":null or {"fixed":"<their sentence corrected>","note":"<one short English sentence explaining why>"},"suggestions":["...","...","..."]}`;
}

async function openLine(){
  if(CH.busy) return; CH.busy = true;
  try{
    const txt = await ask(tutorSystem(), [{role:"user", content:"Start the conversation. Greet me in character and ask me one easy opening question."}]);
    const j = parseJSON(txt);
    CH.hist.push({who:"bot", hr:j.reply, tr:j.translation, sugg:j.suggestions||[]});
    touchChat(); paintChat();
    if($("#cherr")) $("#cherr").innerHTML = "";
  }catch(e){ if($("#cherr")) $("#cherr").innerHTML = apiError(e); }
  CH.busy = false;
}

async function sendMsg(){
  const i = $("#say"); if(!i) return;
  const t = i.value.trim(); if(!t || CH.busy) return;
  i.value = ""; CH.busy = true; $("#send").disabled = true;
  CH.hist.push({who:"me", hr:t}); touchChat(); paintChat();
  const c = $("#chat");
  c.insertAdjacentHTML("beforeend", `<div class="msg bot" id="typing"><span class="spin"></span></div>`);
  c.scrollTop = c.scrollHeight;
  try{
    const msgs = [];
    CH.hist.forEach(m=>{
      if(m.who==="me") msgs.push({role:"user", content:m.hr});
      else msgs.push({role:"assistant", content:JSON.stringify({reply:m.hr, translation:m.tr, correction:m.fix||null, suggestions:m.sugg||[]})});
    });
    const txt = await ask(tutorSystem(), msgs);
    const j = parseJSON(txt);
    CH.hist.push({who:"bot", hr:j.reply, tr:j.translation, fix:j.correction||null, sugg:j.suggestions||[]});
    touchChat(); addXP(3);
    if($("#cherr")) $("#cherr").innerHTML = "";
  }catch(e){
    CH.hist.push({who:"bot", hr:"Something went wrong.", tr:"The connection failed — details below.", sugg:[]});
    if($("#cherr")) $("#cherr").innerHTML = apiError(e);
    console.error("Nauči hrvatski AI call failed:", e);
  }
  const ty = $("#typing"); if(ty) ty.remove();
  CH.busy = false; if($("#send")) $("#send").disabled = false;
  paintChat(); if($("#say")) $("#say").focus();
}

async function genRead(topic){
  const out = $("#rout");
  out.innerHTML = `<div class="card" style="margin-top:14px"><span class="spin"></span> Writing a text about “${esc(topic)}”…</div>`;
  try{
    const txt = await ask(STYLE_RULES + "You write graded reading texts for a Croatian course. Use everyday spoken vocabulary (avion, aerodrom, dućan), never bureaucratic forms.",
      [{role:"user", content:`Topic: ${topic}. Level: CEFR ${S.level}.
Write a short original text in standard Croatian: ${S.level==="A1"?"60-90":S.level==="A2"?"110-150":"170-220"} words. Natural, warm, specific, with real Croatian detail. Present tense dominant at A1.
Then: a glossary of the 10-14 hardest words (give the DICTIONARY form plus the English), and 4 comprehension questions in Croatian with 4 options each.
Return ONLY this JSON, no markdown:
{"title":"<Croatian title>","text":"<the text>","translation":"<full English translation>","glossary":[["<dictionary form>","<English>"]],"questions":[{"q":"<question in Croatian>","o":["","","",""],"a":<index>,"e":"<short English explanation>"}]}`}], 2000);
    RD = parseJSON(txt); RD.topic = topic; GLOSSCACHE = {};

function markup(t){
  const re = /[A-Za-zČčĆćŠšŽžĐđ]{2,}/g;
  let out = "", last = 0, m;
  while((m = re.exec(t))){
    out += esc(t.slice(last, m.index));
    out += '<w onclick="gloss(event,&quot;'+esc(m[0])+'&quot;)">'+esc(m[0])+'</w>';
    last = m.index + m[0].length;
  }
  return out + esc(t.slice(last));
}
function paintRead(){
  const out = $("#rout"); if(!out || !RD) return;
  const body = String(RD.text||"").split(/\n+/).map(p=>"<p>"+markup(p)+"</p>").join("");
  out.innerHTML = `<div class="card" style="margin-top:14px">
      <div class="kicker">${esc(RD.topic||"")} · ${S.level}</div>

      <div class="wordlist">${RD.glossary.map(g=>wordRow(g[0],g[1])).join("")}</div>`:""}`;
}
function readQuiz(){
  if(!RD || !RD.questions) return;
  D = {unit:null, title:RD.title||"Pitanja", q:RD.questions.map(q=>({t:"mc",q:q.q,o:q.o,a:q.a,e:q.e})), i:0, score:0};
  paintDrill();
}

async function gloss(ev, word){
  const g = $("#gloss");
  const key = norm(word);
  const put = txt=>{
    g.innerHTML = `<b>${esc(word)}</b>${txt}`;
    g.classList.remove("hidden");
    const r = ev.target.getBoundingClientRect();
    g.style.left = Math.min(window.innerWidth-260, Math.max(8, r.left)) + "px";
    g.style.top  = (r.bottom + 8) + "px";
    clearTimeout(g._t); g._t = setTimeout(()=>g.classList.add("hidden"), 4500);
  };
  let hit = GLOSSCACHE[key];
  if(!hit){ const k = Object.keys(GLOSSCACHE).find(x => key.startsWith(x.slice(0, Math.max(3, x.length-2)))); if(k) hit = GLOSSCACHE[k]; }
  if(hit) return put(esc(hit));
  put(`<span class="spin"></span>`);
  try{
    const txt = await ask(STYLE_RULES + "You are a Croatian dictionary. Be terse.",
      [{role:"user", content:`The word "${word}" appears in this Croatian text: "${String(RD&&RD.text||"").slice(0,400)}".
Reply with ONLY this, one line, no JSON, no extra words:
<dictionary form> — <English meaning> (<grammatical note, e.g. genitiv jednine, 1. lice prezenta>)`}], 200);
    GLOSSCACHE[key] = txt;
    put(esc(txt));
  }catch(e){ put(" — nije dostupno"); }
}
document.addEventListener("scroll", ()=>{ const g=$("#gloss"); if(g) g.classList.add("hidden"); }, true);

let PACKOPEN = null;
let CARDSET = null, CARDSET_N = -1;
function cardSet(){
  const n = Object.keys(S.cards || {}).length;
  if(CARDSET_N !== n){ CARDSET = new Set(Object.keys(S.cards || {})); CARDSET_N = n; }
  return CARDSET;
}
function packDone(p){
  const set = cardSet();
  return p.w.filter(w => set.has(cardKey(w[0], w[1]))).length;
}
function vPacks(){
  if(PACKOPEN){
    const p = PACKS.find(x => x.k === PACKOPEN);
    if(p) return shell("vocabulary · rječnik", esc(p.en),
      `${p.w.length} words. Star the ones you want to drill — they go straight into your flashcards.`,
      `<div class="chips" style="margin-bottom:16px">
        <button class="btn ghost sm" onclick="PACKOPEN=null;vPacks()">← ${dual("All topics","Sve teme")}</button>
        <button class="btn sm" onclick="addPack('${p.k}')">${dual("Add all to flashcards","Dodaj sve")}</button>
        <button class="btn brass sm" onclick="packQuiz('${p.k}')">${dual("Quiz me on these","Provjeri me")}</button>
      </div>
      <div class="wordlist">${p.w.map(w => wordRow(w[0], w[1])).join("")}</div>`);
  }
  const total = PACKS.reduce((n, p) => n + p.w.length, 0);
  shell("vocabulary · rječnik", "Words by <i>topic</i>",
    `${total} words across ${PACKS.length} topics — everything from ordering food to describing how you feel. Tap a topic, star what you want, and it lands in your flashcards.`,
    `<div class="grid g3">${PACKS.map(p => {
      const d = packDone(p);
      return `<div class="pack" onclick="PACKOPEN='${p.k}';vPacks()">
        <b>${esc(p.en)}</b><span>${esc(p.hr)}</span>
        <span class="n">${p.w.length} words${d ? " · " + d + " starred" : ""}</span></div>`;
    }).join("")}</div>`);
}
function addPack(k){
  const p = PACKS.find(x => x.k === k); if(!p) return;
  S.cards = S.cards || {};
  p.w.forEach(w => { S.cards[cardKey(w[0], w[1])] = S.cards[cardKey(w[0], w[1])] || {box:1, seen:0}; });
  save(); vPacks();
}
function packQuiz(k){
  const p = PACKS.find(x => x.k === k); if(!p) return;
  const pool = shuffle(p.w.slice()).slice(0, 10);
  const qs = pool.map(w => {
    const wrong = shuffle(p.w.filter(x => x[1] !== w[1])).slice(0, 3).map(x => x[1]);
    const opts = shuffle([w[1], ...wrong]);
    return { t:"mc", q:`What does "${w[0]}" mean?`, o:opts, a:opts.indexOf(w[1]), e:`${w[0]} — ${w[1]}` };
  });
  D = { unit:null, title:p.en, q:qs, i:0, score:0 };
  paintDrill();
}

function seedCards(){

function startCards(dir){
  const keys = shuffle(Object.keys(S.cards)).sort((a,b)=>(S.cards[a].box||1)-(S.cards[b].box||1)).slice(0,20);
  FC = {q:keys, i:0, dir, right:0, flipped:false};

function paintCard(){
  if(FC.i >= FC.q.length){
    return shell("done · gotovo", "Round finished", "",
      `<div class="card" style="text-align:center;padding:40px">
        <div style="font-family:var(--mono);font-size:52px;color:var(--brass)">${FC.right}<span style="font-size:24px;color:var(--stone-dim)">/${FC.q.length}</span></div>

  }
  const k = FC.q[FC.i], p = k.split("|");
  const front = FC.dir==="hr" ? p[0] : p[1];
  const back  = FC.dir==="hr" ? p[1] : p[0];
  shell(`card ${FC.i+1} of ${FC.q.length} · box ${S.cards[k].box||1}`, "Flashcards", "",
    `<div class="progressline"><i style="width:${FC.i/FC.q.length*100}%"></i></div>
    <div class="flash">
      <div class="front">${esc(front)}</div>
      ${FC.dir==="hr"?spk(p[0]):""}
      <div class="back" id="bk">${FC.flipped?esc(back):'<span style="opacity:.4">· · ·</span>'}</div>
    </div>
    <div style="margin-top:16px;display:flex;gap:9px;justify-content:center;flex-wrap:wrap">
      ${FC.flipped

function gradeCard(ok){

      <div class="note">Croatian uses <b>Latin script only</b>. Dž, Lj and Nj are single letters, not pairs. There are no silent letters and no exceptions: spell it as you hear it, read it as it's written.</div>

        ${CROATIAN_ONLY.map(r=>`<tr><td class="hr" style="color:var(--olive)">${esc(r[0])}</td><td style="color:var(--madder);opacity:.8">${esc(r[1])}</td><td style="color:var(--stone-dim);font-size:13.5px">${esc(r[2])}</td></tr>`).join("")}

/* ============================================================
   ACCOUNTS — Supabase handles signup, password hashing,
   sessions and password resets. This app never sees a password.
   ============================================================ */
let SB = null;

const CLOUD = {
  ready:false, user:null, email:"", busy:false,
  lastSync:0, lastErr:"", pendingKind:"",

  async init(){
    if(!SB_READY()){ this.ready = true; this.lastErr = "NOCONFIG"; paintCloud(); return; }
    if(!window.__sbCreate){
      await new Promise(r => window.addEventListener("sb-ready", r, {once:true}));
    }
    try{
      SB = window.__sbCreate(SUPABASE_URL, SUPABASE_ANON_KEY);
    }catch(e){ this.ready = true; this.lastErr = "NOCONFIG"; paintCloud(); return; }

    // A password-reset link lands back here with tokens in the URL hash.
    if((window.location.hash || "").indexOf("type=recovery") > -1) this.pendingKind = "recovery";

    SB.auth.onAuthStateChange((event, session) => {
      this.user = session ? session.user : null;
      this.email = this.user ? this.user.email : "";
      paintCloud();
      if(event === "PASSWORD_RECOVERY"){ openAuth("reset"); return; }
      if(this.user && event === "SIGNED_IN") this.sync();
      if(CUR === "napredak") vSave();
    });

    const { data } = await SB.auth.getSession();
    if(data && data.session){ this.user = data.session.user; this.email = this.user.email; }
    this.ready = true;
    paintCloud();
    if(this.user) this.sync();
  },

  async signIn(email, password){
    const { error } = await SB.auth.signInWithPassword({ email, password });
    if(error) throw new Error(error.message);
  },

  async signUp(email, password){
    const { data, error } = await SB.auth.signUp({ email, password });
    if(error) throw new Error(error.message);
    return (data && data.session) ? "in" : "confirm";
  },

  async recover(email){
    const { error } = await SB.auth.resetPasswordForEmail(email, { redirectTo: window.location.origin });
    if(error) throw new Error(error.message);
  },

  async resetPassword(password){
    const { error } = await SB.auth.updateUser({ password });
    if(error) throw new Error(error.message);
    try{ history.replaceState(null, "", location.pathname); }catch(e){}
  },

  async acceptInvite(password){ return this.resetPassword(password); },

  async signOut(){
    try{ await SB.auth.signOut(); }catch(e){}
    this.user = null; this.email = ""; paintCloud();
    if(CUR === "napredak") vSave();
  },

  /* ---- progress sync ---- */
  async sync(){
    if(this.busy || !this.user) return;
    this.busy = true; this.lastErr = "";
    try{
      const { data, error } = await SB.from("progress")
        .select("state, updated_at").eq("user_id", this.user.id).maybeSingle();
      if(error) throw new Error(error.message);
      if(!data){ await this.push(true); }
      else if((data.updated_at || 0) > (S.updatedAt || 0)){
        applyState(data.state); await Store.set("nh:state", S);
        this.lastSync = data.updated_at; paintStats();
      }else{ await this.push(true); }
    }catch(e){ this.lastErr = String(e.message || e); }
    this.busy = false; paintCloud();
    if(CUR === "napredak") vSave();
  },

  async push(quiet){
    if(!this.user) return;
    try{
      const now = Date.now();
      const { error } = await SB.from("progress").upsert({
        user_id: this.user.id, state: S, updated_at: now
      });
      if(error) throw new Error(error.message);
      this.lastSync = now; this.lastErr = "";
    }catch(e){ this.lastErr = String(e.message || e); }
    paintCloud();
    if(!quiet && CUR === "napredak") vSave();
  },

  async pull(){
    try{
      const { data, error } = await SB.from("progress")
        .select("state, updated_at").eq("user_id", this.user.id).maybeSingle();
      if(error) throw new Error(error.message);
      if(!data) this.lastErr = "EMPTY";
      else { applyState(data.state); await Store.set("nh:state", S);
             this.lastSync = data.updated_at; this.lastErr = ""; paintStats(); }
    }catch(e){ this.lastErr = String(e.message || e); }
    if(CUR === "napredak") vSave();
  }
};

function cloudErrText(m){
  m = String(m || "");
  if(m === "NOCONFIG") return "Accounts aren't set up yet. Add your Supabase URL and anon key near the top of index.html.";
  if(/Invalid login credentials/i.test(m)) return "Wrong email or password.";
  if(/User already registered/i.test(m))   return "That email already has an account — sign in instead.";
  if(/Password should be at least/i.test(m)) return "Password must be at least 6 characters.";
  if(/Email not confirmed/i.test(m))       return "Check your email and click the confirmation link first.";
  if(/rate limit|too many/i.test(m))       return "Too many attempts. Wait a minute.";
  if(m === "EMPTY")                        return "Nothing saved to your account yet.";
  if(/relation .* does not exist|progress/i.test(m) && /does not exist/i.test(m))
    return "The progress table hasn't been created yet — run the SQL from the setup guide.";
  return m;
}

async function doAuth(){
  const msg = $("#a-msg"), go = $("#a-go");
  const val = id => { const el = $(id); return el ? el.value.trim() : ""; };
  const email = val("#a-e"), p1 = val("#a-p1"), p2 = val("#a-p2");
  const fail = t => { msg.innerHTML = `<div class="err">${esc(t)}</div>`; go.disabled = false; };

  if((AUTHTAB === "invite" || AUTHTAB === "reset")){
    if(p1.length < 6) return fail("Password must be at least 6 characters.");
    if(p1 !== p2) return fail("The two passwords don't match.");
  }else if(AUTHTAB === "forgot"){
    if(!email) return fail("Enter your email.");
  }else{
    if(!email || !p1) return fail("Enter your email and password.");
  }

  go.disabled = true;
  msg.innerHTML = `<div style="font-size:14px"><span class="spin"></span> Working…</div>`;
  try{
    if(AUTHTAB === "in"){ await CLOUD.signIn(email, p1); closeAuth(); }
    else if(AUTHTAB === "up"){
      const r = await CLOUD.signUp(email, p1);
      if(r === "confirm"){
        msg.innerHTML = `<div class="verdict ok"><b>Check your email.</b> Click the confirmation link, then come back and sign in.</div>`;
        go.disabled = false; return;
      }
      closeAuth();
    }
    else if(AUTHTAB === "invite"){ await CLOUD.acceptInvite(p1); closeAuth(); }
    else if(AUTHTAB === "reset"){ await CLOUD.resetPassword(p1); closeAuth(); }
    else if(AUTHTAB === "forgot"){
      await CLOUD.recover(email);
      msg.innerHTML = `<div class="verdict ok"><b>Sent.</b> Check your email for the reset link.</div>`;
      go.disabled = false; return;
    }
    if(CUR === "napredak") vSave();
  }catch(e){ fail(cloudErrText(e.message || e)); }
}

function b64enc(str){
  const bytes = new TextEncoder().encode(str);
  let bin = ""; bytes.forEach(b => bin += String.fromCharCode(b));
  return btoa(bin);
}
function b64dec(b64){
  const bin = atob(b64.trim());
  const bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}

      <div class="grid g3">
        <div><div style="font-family:var(--mono);font-size:26px;color:var(--brass)">${S.xp||0}</div><div style="font-size:12px;color:var(--stone-dim)">bodova</div></div>
        <div><div style="font-family:var(--mono);font-size:26px;color:var(--brass)">${units}/${UNITS.length}</div><div style="font-size:12px;color:var(--stone-dim)">lekcija pročitano</div></div>
        <div><div style="font-family:var(--mono);font-size:26px;color:var(--brass)">${drilled}/${UNITS.length}</div><div style="font-size:12px;color:var(--stone-dim)">vježbi riješeno</div></div>
        <div><div style="font-family:var(--mono);font-size:26px;color:var(--brass)">${Object.keys(S.cards||{}).length}</div><div style="font-size:12px;color:var(--stone-dim)">kartica</div></div>
        <div><div style="font-family:var(--mono);font-size:26px;color:var(--brass)">${S.streak||0}</div><div style="font-size:12px;color:var(--stone-dim)">dana zaredom</div></div>
        <div><div style="font-family:var(--mono);font-size:26px;color:var(--brass)">${Object.keys(S.chats||{}).length}</div><div style="font-size:12px;color:var(--stone-dim)">razgovora</div></div>
      </div>
      <div style="margin-top:14px"><span class="pill">Nauči hrvatski v${VERSION}</span></div>
    </div>

    <div class="card" style="margin-top:14px">
      <div class="kicker">your name</div>
      <div style="display:flex;gap:9px;flex-wrap:wrap">
        <input class="answer" id="nm" style="flex:1;min-width:180px;font-size:17px" value="${esc(S.name||"")}" placeholder="npr. Yur" maxlength="24">
        <button class="btn ghost" onclick="S.name=$('#nm').value.trim();save();vSave()">Save name</button>
      </div>
    </div>

    <div class="card" style="margin-top:14px">
      <div class="kicker">backup file</div>
      <p style="font-size:14.5px;color:var(--stone-dim)">Your account already syncs everything. This is just an extra copy you can keep on your own computer.</p>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn ghost" onclick="downloadSave()">${dual("Download backup","Preuzmi")}</button>
        <label class="btn ghost" style="cursor:pointer">${dual("Load backup file","Učitaj")}<input type="file" accept=".json,application/json" style="display:none" onchange="uploadSave(this)"></label>
      </div>
      <div id="rmsg"></div>
    </div>

    <div class="card" style="margin-top:14px">
      <div class="kicker">start over</div>
      <p style="font-size:14.5px;color:var(--stone-dim)">Wipes XP, streak, finished units and every flashcard. Grab your save code first if you might want it back.</p>
      <button class="btn ghost" id="wipe" onclick="wipe()">Erase all progress</button>
    </div>`);
}



let WIPEARM = false;
async function wipe(){
  const b = $("#wipe");
  if(!WIPEARM){ WIPEARM = true; b.textContent = "Are you sure? Click again."; b.style.borderColor = "var(--madder)"; b.style.color = "var(--madder)";
    setTimeout(()=>{ WIPEARM = false; if($("#wipe")){ $("#wipe").textContent = "Obriši sav napredak"; $("#wipe").style.borderColor=""; $("#wipe").style.color=""; } }, 4000);
    return; }
  WIPEARM = false;
  S = {name:"", xp:0, streak:0, lastDay:new Date().toISOString().slice(0,10), done:{}, cards:{}, level:"A1", scenario:"kafic", showEn:true};
  await save(); go("napredak");
}

/* ============================================================
   POSTAVKE — API key modal
   ============================================================ */
function connState(){
  if(GKEY) return { k:"key",     c:"var(--brass)", t:"Personal key" };
  if(DIAG === null) return { k:"probing", c:"var(--stone-dim)", t:"Checking…" };
  if(!DIAG.deployed) return Store.mode === "claude"
      ? { k:"claude", c:"var(--brass)", t:"Running via Claude" }
      : { k:"nofunc", c:"var(--madder)", t:"AI not connected" };
  if(DIAG.known === false) return { k:"unknown", c:"var(--brass)", t:"Function is live" };
  if(!DIAG.key)    return { k:"nokey",  c:"var(--madder)", t:"API key not set" };
  if(!DIAG.origin) return { k:"origin", c:"var(--madder)", t:"Origin blocked" };
  return { k:"server", c:"var(--olive)", t:"AI connected" };
}
function paintGear(){
  const d = $("#dot"), l = $("#gearlbl");
  if(!d) return;
  const s = connState();
  d.style.background = s.c;
  l.textContent = s.t;
}

function openSettings(){
  const box = $("#settings");
  box.className = "scrim";
  box.onclick = e => { if(e.target === box) closeSettings(); };
  const st = connState();
  const row = (ok, label, detail) =>
    `<div style="display:flex;gap:9px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--line)">
       <span style="color:${ok?"var(--olive)":"var(--madder)"};font-size:15px;line-height:1.4">${ok?"✓":"✗"}</span>
       <div style="flex:1"><div style="font-size:14.5px">${label}</div>
       ${detail?`<div style="font-size:12.5px;color:var(--stone-dim)">${detail}</div>`:""}</div></div>`;
  const diag = GKEY ? "" : `
    <div class="kicker" style="margin-top:18px">diagnostics</div>
    ${DIAG === null
      ? `<div style="font-size:14px"><span class="spin"></span> Checking the server…</div>`
      : row(DIAG.deployed, "Function is deployed",
             DIAG.deployed ? "/api/chat responds ("+DIAG.http+")" : "404 — functions/api/chat.js didn't deploy") +
        (DIAG.known === false
          ? `<div style="font-size:13px;color:var(--stone-dim);padding:8px 0">This function build has no health check, so the key and origin can't be read from here. It's an older <code>chat.js</code> — everything may still work. Press <b>Test connection</b> to find out for real.</div>`
          : row(DIAG.key, "GEMINI_API_KEY is set",
                 DIAG.key ? "" : "Set it in Cloudflare, then redeploy — variables only apply to new deployments") +
            row(DIAG.origin, "Origin is allowed",
                 DIAG.origin ? "" : "This URL isn't in the allow list" + (DIAG.origins && DIAG.origins.length ? " — configured: " + DIAG.origins.map(esc).join(", ") : "")) +
            (DIAG.works === null ? "" : row(DIAG.works, "The key actually works",
                 DIAG.works ? "Google accepted a test call" : esc(DIAG.problem || "Google rejected the key"))))}
    <div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn ghost sm" onclick="DIAG=null;openSettings();probe().then(openSettings)">Check again</button>
      <button class="btn brass sm" onclick="DIAG=null;openSettings();probe(true).then(openSettings)">Test the key live</button>
    </div>`;
  box.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-label="Postavke">
    <div class="eyebrow">settings</div>
    <h2>AI <i style="color:var(--brass)">connection</i></h2>

    <div style="display:flex;align-items:center;gap:9px;margin:14px 0 6px">
      <span class="dot" style="width:9px;height:9px;background:${st.c}"></span>
      <span style="font-family:var(--display);font-size:20px;font-weight:700">${esc(st.t)}</span>
    </div>
    <p style="color:var(--stone-dim);font-size:14px;margin:0">${
      st.k === "server" ? "Requests go to this site's own function, which holds the key server-side. Nothing to paste."
      : st.k === "key"  ? "A personal key is set in this browser, so it's used instead of the server. Clear it below to test the server path."
      : st.k === "claude" ? "Running inside Claude, so the tutor works through Claude and no key is needed."
      : st.k === "probing" ? "Checking the server…"
      : "The server path isn't usable yet. The checks below say why."}</p>
    ${diag}

    <div style="margin-top:16px"><button class="btn" onclick="testConn()">Test connection</button></div>
    <div id="kmsg" style="margin-top:12px"></div>

    <hr class="rule">
    <details ${GKEY?"open":""}>
      <summary style="cursor:pointer;font-size:13.5px;color:var(--stone-dim)">Advanced — use your own Gemini key</summary>
      <p style="font-size:13px;color:var(--stone-dim);margin-top:10px">Only needed if you're running the file locally with no server behind it. On the live site, leave this empty.</p>
      <input class="field" id="k" type="password" autocomplete="off" spellcheck="false"
             placeholder="${GKEY ? maskKey(GKEY) : "AIza…"}" value="">
      <label style="display:flex;align-items:center;gap:7px;font-size:13px;color:var(--stone-dim);margin-top:8px">
        <input type="checkbox" onchange="$('#k').type = this.checked ? 'text' : 'password'"> Show key
      </label>
      <div class="kicker" style="margin-top:14px">model</div>
      <select class="field" id="m">${MODELS.map(m=>`<option value="${m}" ${m===GMODEL?"selected":""}>${m}</option>`).join("")}</select>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:14px">
        <button class="btn ghost" onclick="saveKey()">Save key</button>
        ${GKEY ? `<button class="btn ghost" onclick="clearKey()">Remove key</button>` : ""}
      </div>
      <p style="font-size:12.5px;color:var(--stone-dim);margin-top:12px;margin-bottom:0">A personal key is stored in this browser only and is deliberately excluded from your save codes and backups. If a key of yours has ever been pasted somewhere public, delete it in AI Studio and make a new one.</p>
    </details>

    <div style="margin-top:18px"><button class="btn ghost" onclick="closeSettings()">Close</button></div>
  </div>`;
  document.addEventListener("keydown", escClose);
}

async function testConn(){
  const msg = $("#kmsg");
  msg.innerHTML = `<div style="font-size:14px"><span class="spin"></span> Checking…</div>`;
  try{
    const out = await ask("Odgovaraj isključivo na standardnom hrvatskom jeziku.",
      [{role:"user", content:"Pozdravi me u jednoj kratkoj rečenici."}], 256);
    const via = GKEY ? "your own key" : PROXY_OK ? "the server" : "Claude";
    msg.innerHTML = `<div class="verdict ok"><b style="color:var(--olive)">Working</b> — via: ${via}.<br>„${esc(out.slice(0,140))}"</div>`;
    paintGear();
  }catch(e){ msg.innerHTML = apiError(e); }
}

function escClose(e){ if(e.key === "Escape") closeSettings(); }
function closeSettings(){
  const box = $("#settings");
  box.className = "hidden"; box.innerHTML = "";
  document.removeEventListener("keydown", escClose);
}

async function saveKey(){
  const v = ($("#k").value || "").trim();
  const m = $("#m").value;
  GMODEL = m; await Store.set(MODEL_K, m);
  if(v){ GKEY = v; await Store.set(KEY_K, v); }
  paintGear();
  $("#kmsg").innerHTML = `<div class="verdict ok"><b style="color:var(--olive)">Saved.</b> ${GKEY ? "Ključ "+esc(maskKey(GKEY))+" · model "+esc(GMODEL) : "Model "+esc(GMODEL)+". Ključ nije unesen."}</div>`;
}

async function clearKey(){
  GKEY = ""; PROXY_OK = null; await Store.del(KEY_K); paintGear();
  $("#kmsg").innerHTML = `<div class="verdict no">Key removed from this device.</div>`;
  setTimeout(openSettings, 900);
}

async function testKey(){
  const msg = $("#kmsg");
  const k = ($("#k").value || "").trim() || GKEY;
  const m = $("#m").value;
  if(!k){ msg.innerHTML = `<div class="err">Paste a key first.</div>`; return; }
  msg.innerHTML = `<div style="font-size:14px"><span class="spin"></span> Calling Gemini…</div>`;
  try{
    const out = await askGemini("Odgovaraj isključivo na standardnom hrvatskom jeziku.",
      [{role:"user", content:"Pozdravi me u jednoj kratkoj rečenici."}], 256, k, m);
    msg.innerHTML = `<div class="verdict ok"><b style="color:var(--olive)">Radi.</b> ${esc(m)} kaže: „${esc(out.slice(0,120))}"</div>`;
  }catch(e){
    msg.innerHTML = apiError(e);
  }
}

/* ============================================================
   INIT
   ============================================================ */
(async function(){
  await loadKey();
  if(!GKEY) probe();          // non-blocking; paints the indicator when it lands
  await loadState();
  paintNav();
  paintStats();
  paintGear();
  go("home");
  CLOUD.init();
})();
</script>

</body>
</html>
