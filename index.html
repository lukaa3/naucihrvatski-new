{
  id:27, sec:1, title:"Putting a sentence together", sub:"Kako složiti rečenicu",
  goal:"Know which word goes where — who, what, when, where, ne and the little words — so you can build any simple sentence without guessing.",
  grammar:[
    {h:"The basic order: who → does → what",
     b:"Start every sentence the way English does: <b>who → does → what</b>.<br><br><b>Ana pije čaj.</b> — Ana drinks tea.<br><b>Marko gleda film.</b> — Marko is watching a film.<br><b>Mi učimo hrvatski.</b> — We're learning Croatian.<br><br>When <em>who</em> is just I, you or we, leave it out — the verb ending already says it (Unit {u3}):<br><b>Pijem čaj.</b> — I drink tea. · <b>Gledamo film.</b> — We're watching a film.<br><br>This order is never wrong. Croatians move words around for emphasis, but you can always fall back on it."},
    {h:"Describing words go before the thing",
     b:"Just like English, the describing word comes first:<br><b>dobar čaj</b> — good tea · <b>hladno pivo</b> — cold beer · <b>nov auto</b> — a new car<br><br>It copies the gender of the thing, the same way koji / koja / koje did in Unit {u6}:<br><b>dobar</b> čaj (m) · <b>dobra</b> pizza (f) · <b>dobro</b> pivo (n)<br><br>After <b>je, sam, si…</b> it comes after, also like English:<br><b>Čaj je dobar.</b> — The tea is good. · <b>Pivo je hladno.</b><br><br><b>jako</b> (very) and <b>malo</b> (a bit) go right in front of the describing word: <b>jako dobar</b> čaj · <b>malo hladno</b>."},
    {h:"Where 'when' and 'where' go",
     b:"<b>When</b> words — <b>danas</b> (today), <b>sutra</b> (tomorrow), <b>sada</b> (now), <b>navečer</b> (in the evening), <b>uvijek</b> (always) — usually go <b>first</b>, or straight after the verb:<br><b>Danas radim.</b> · <b>Radim danas.</b> — I'm working today.<br><br><b>Where</b> words usually go <b>at the end</b>:<br><b>Pijem čaj ovdje.</b> · <b>Radim kod kuće.</b> — I work at home. (<em>kod kuće</em> = at home — learn it as one chunk.)<br><br>A safe recipe: <b>when → verb → what → where</b><br><b>Sutra gledam film kod kuće.</b> — Tomorrow I'm watching a film at home.<br><b>Navečer radim kod kuće.</b> — In the evening I work at home."},
    {h:"ne sits right in front of the verb",
     b:"<b>ne</b> always goes <b>directly before the verb</b>, touching it:<br><b>Ne pijem pivo.</b> — I don't drink beer.<br><b>Danas ne radim.</b> — I'm not working today.<br><b>Marko ne gleda film.</b><br><br>✗ <em>Ne danas radim.</em> · ✗ <em>Pijem ne pivo.</em><br><br>With <b>biti</b> you use the one-word forms from Unit {u3} instead: <b>nisam, nisi, nije…</b><br><b>Nisam umoran.</b> · <b>Ana nije ovdje.</b>"},
    {h:"The little words go second",
     b:"A few short words can never start a sentence: <b>sam, si, je, smo, ste, su</b>, <b>li</b> and <b>se</b>. They sit in <b>second place</b> — right after the first word or chunk:<br><b>Umoran sam.</b> — I'm tired.<br><b>Danas sam umoran.</b> — Today I'm tired.<br><b>Ana je ovdje.</b> · <b>Kako se zoveš?</b> · <b>Ideš li?</b><br><br>A chunk can be a few words that belong together:<br><b>Ana i Marko su ovdje.</b><br><br>✗ <em>Sam umoran.</em> · ✗ <em>Danas umoran sam.</em><br><br>So: say one chunk, then the little word. Unit {u22} goes deeper once you know more of these words."},
    {h:"Questions: question word first",
     b:"With a question word, it goes <b>first</b>, then the verb:<br><b>Gdje radiš?</b> — Where do you work?<br><b>Što piješ?</b> — What are you drinking?<br><b>Kada dolaziš?</b> — When are you coming?<br><b>Zašto ne piješ pivo?</b> — Why aren't you drinking beer?<br><br>Yes/no questions: verb first, then <b>li</b> (Unit {u6}): <b>Piješ li čaj?</b><br>Or keep the normal order and raise your voice: <b>Piješ čaj?</b><br><br>A little word still goes second: <b>Gdje si?</b> · <b>Kako se zoveš?</b>"}
  ],
  vocab:[["danas","today"],["sutra","tomorrow"],["sada","now"],["navečer","in the evening"],["ujutro","in the morning"],
    ["uvijek","always"],["ovdje","here"],["tamo","there"],["kod kuće","at home"],["čaj","tea"],["sok","juice"],
    ["film","film / movie"],["jako","very"],["malo","a bit"]],
  phrases:[["Danas ne radim.","I'm not working today."],["Sutra sam kod kuće.","Tomorrow I'm at home."],
    ["Gdje radiš?","Where do you work?"],["Što piješ?","What are you drinking?"],["Navečer gledam film.","In the evening I watch a film."]],
  drills:[
    {t:"build",q:"Make: I'm tired today. (male)",w:["danas","sam","umoran"],a:["Danas sam umoran.","Umoran sam danas."],e:"sam goes second."},
    {t:"mc",q:"Which is correct?",o:["Ne danas radim.","Danas ne radim.","Danas radim ne."],a:1,e:"ne touches the verb."},
    {t:"mc",q:"Which is correct?",o:["Sam umoran.","Umoran sam."],a:1,e:"sam can't come first."},
    {t:"type",q:"Say: I don't drink beer.",a:["ne pijem pivo","ja ne pijem pivo"],e:"Ne pijem pivo."},
    {t:"build",q:"Make: Where are you working tomorrow?",w:["gdje","radiš","sutra"],a:["Gdje radiš sutra?","Gdje sutra radiš?"],e:"Question word first."},
    {t:"build",q:"Make: Tomorrow I'm watching a film at home.",w:["sutra","gledam","film","kod","kuće"],a:["Sutra gledam film kod kuće.","Sutra kod kuće gledam film.","Gledam film sutra kod kuće.","Gledam film kod kuće sutra."],e:"when → verb → what → where."}
  ]
},
{
  id:7, sec:1, title:"Numbers, time and dates", sub:"Brojevi, sati i datumi",
  goal:"Count, tell the time, and handle the Croatian month names, which are nothing like English.",
  grammar:[
    {h:"Counting",
     b:"nula, jedan, dva, tri, četiri, pet, šest, sedam, osam, devet, deset,<br>jedanaest, dvanaest, trinaest, četrnaest, petnaest, šesnaest, sedamnaest, osamnaest, devetnaest, dvadeset.<br><br>From 11 up it's just <em>digit + naest</em>. Tens: dvadeset, trideset, četrdeset, pedeset, šezdeset, sedamdeset, osamdeset, devedeset, <b>sto</b>, <b>tisuća</b>.<br><br>21 = dvadeset jedan. 135 = sto trideset pet."},
    {h:"Counting things: 1, a few, many",
     b:"After a number, the word changes its ending. Croatian sorts numbers into three groups — <b>1</b>, <b>a few</b> (2, 3, 4) and <b>many</b> (5 and up):<table><tr><th></th><th>stol (m)</th><th>kava (f)</th><th>pivo (n)</th></tr><tr><td class='cs'>1</td><td class='hr'>jedan stol</td><td class='hr'>jedna kava</td><td class='hr'>jedno pivo</td></tr><tr><td class='cs'>2, 3, 4</td><td class='hr'>dva stola</td><td class='hr'>dvije kave</td><td class='hr'>dva piva</td></tr><tr><td class='cs'>5 and up</td><td class='hr'>pet stolova</td><td class='hr'>pet kava</td><td class='hr'>pet piva</td></tr></table><b>1</b> — the word stays normal. <b>jedan / jedna / jedno</b> matches its gender (Unit {u4}).<br><br><b>2, 3, 4</b> — masculine <b>adds -a</b> (stola) · feminine <b>-a → -e</b> (kave) · neuter <b>-o → -a</b> (piva). Use <b>dva</b> for masculine and neuter words, <b>dvije</b> for feminine.<br><br><b>5 and up</b> — short masculine words add <b>-ova</b>, like their plural (stolova, sokova) · feminine keeps <b>-a</b> (pet kava — it only <em>looks</em> like one) · neuter <b>-a</b> (piva).<br><br><b>Two extra rules:</b><br>• <b>11–19 count as 'many'</b>: dvanaest kava, petnaest stolova.<br>• For bigger numbers, <b>only the last word counts</b>: dvadeset <b>jedna</b> kava · dvadeset <b>dvije</b> kave · dvadeset <b>pet</b> kava.<br><br>Why does this happen? It's a case called the genitive, which you'll meet properly in Unit {u9}. You don't need the name to use the pattern — just ask: <em>1, a few, or many?</em>"},
    {h:"Telling the time",
     b:"<b>Koliko je sati?</b> — What time is it?<br><br><b>On the hour</b>, say the number then the word for hour:<br>Jedan sat · Dva sata · Pet sati · Deset sati<br><br><b>Half past — the one that catches everyone.</b> Croatian counts <em>towards</em> the next hour:<table><tr><th>time</th><th>Croatian</th><th>literally</th></tr><tr><td class='cs'>2:30</td><td class='hr'>pola tri</td><td>half to three</td></tr><tr><td class='cs'>3:30</td><td class='hr'>pola četiri</td><td>half to four</td></tr><tr><td class='cs'>7:30</td><td class='hr'>pola osam</td><td>half to eight</td></tr></table>So <b>pola tri is 2:30, not 3:30.</b> Take the hour you're heading towards and put <em>pola</em> in front.<br><br><b>Careful — <em>tri i pol</em> is not a time.</b> It means <em>three and a half</em> as an amount: <em>tri i pol sata</em> = three and a half <b>hours</b>.<br><br><b>Other ways to say the same time</b> — all used:<table><tr><th>time</th><th>everyday</th><th>digital / official</th></tr><tr><td class='cs'>2:30</td><td class='hr'>pola tri</td><td class='hr'>dva i trideset</td></tr><tr><td class='cs'>2:15</td><td class='hr'>dva i petnaest</td><td class='hr'>dva i petnaest</td></tr><tr><td class='cs'>2:45</td><td class='hr'>petnaest do tri</td><td class='hr'>dva i četrdeset pet</td></tr></table>Digital forms are what you hear at stations and on the radio; <em>pola</em> and <em>do</em> are what people say to each other. Recognise both, use whichever is easier.<br><br><b>Arranging a time:</b><br><b>U koliko sati?</b> / <b>Kad?</b> — At what time? / When?<br><b>U osam.</b> — At eight. · <b>Oko osam.</b> — Around eight.<br><em>U osam ujutro</em> — 8am · <em>U osam navečer</em> — 8pm"},
    {h:"Days and months",
     b:"<b>Dani:</b> ponedjeljak, utorak, srijeda, četvrtak, petak, subota, nedjelja. The week starts Monday. <em>Nedjelja</em> = Sunday; <b>tjedan</b> = week.<br><br><b>Mjeseci</b> — old Slavic names describing nature, not Roman emperors:<br>siječanj, veljača, ožujak, travanj, svibanj, lipanj, srpanj, kolovoz, rujan, listopad, studeni, prosinac.<br><em>Listopad</em> = leaf-fall (October). <em>Travanj</em> = grass month (April). No shortcut — memorise them."}
  ],
  vocab:[["sat","hour / clock"],["minuta","minute"],["dan","day"],["tjedan","week"],["mjesec","month"],
    ["godina","year"],["danas","today"],["jučer","yesterday"],["sutra","tomorrow"],
    ["ujutro","in the morning"],["popodne","in the afternoon"],["navečer","in the evening"],
    ["uvijek","always"],["nikad","never"],["ponekad","sometimes"],["često","often"],
    ["rijetko","rarely"],["rano","early"],["kasno","late"],["odmah","right away"]],
  phrases:[["Koliko je sati?","What time is it?"],["Sada je pola tri.","It's half past two."],
    ["U koliko sati počinje?","What time does it start?"],["Danas je srijeda.","Today is Wednesday."],
    ["Imam sedamnaest godina.","I'm seventeen."],["Rođen sam u lipnju.","I was born in June. (m)"],
    ["Vidimo se u osam.","See you at eight."]],
  drills:[
    {t:"type",q:"What is 'pola tri' in digits?",a:["2:30","230","14:30"],e:"2:30 — Croatian counts towards the next hour."},
    {t:"mc",q:"Which is October?",o:["kolovoz","listopad","studeni","rujan"],a:1,e:"listopad. kolovoz=August, rujan=September, studeni=November."},
    {t:"type",q:"Say: See you at eight.",a:["vidimo se u osam","vidimo se u osam sati"],e:"Vidimo se u osam."},
    {t:"mc",q:"How do you say 3:30?",o:["tri i pol","pola tri","pola četiri","tri sata pol"],a:2,e:"pola četiri — half TO four. tri i pol means three and a half hours."},
    {t:"type",q:"Say: I'm seventeen years old.",a:["imam sedamnaest godina"],e:"Imam sedamnaest godina — literally 'I have 17 years'."},
    {t:"mc",q:"'tjedan' means:",o:["Sunday","week","month","Tuesday"],a:1,e:"tjedan = week; nedjelja = Sunday."}
  ]
},
/* ============ SECTION 2 — THE CASES ============ */
{
  id:8, sec:2, title:"Accusative — the object", sub:"Akuzativ",
  goal:"Say what you have, want, see, eat and buy. This is the case you'll use most.",
  grammar:[
    {h:"What cases actually do",
     b:"English shows who-does-what by <b>word order</b>. Croatian marks it on the <b>word ending</b> instead, so the order is free.<br><em>Ana voli Marka</em> and <em>Marka voli Ana</em> both mean Ana loves Marko — the <b>-a</b> on Marko is what marks him as the one being loved.<br><br>Croatian has seven of these endings. Here's the whole map, <b>in the order you'll learn them</b>:<table><tr><th>case</th><th>job</th><th>example</th><th>unit</th></tr><tr><td class='cs'>N nominativ</td><td>the subject — who does it</td><td class='hr'>Ana pije kavu.</td><td>you know it</td></tr><tr><td class='cs'>A akuzativ</td><td>the object — what it's done to</td><td class='hr'>Pijem kavu.</td><td>this unit</td></tr><tr><td class='cs'>G genitiv</td><td>of, from, without</td><td class='hr'>čaša vode</td><td>Unit {u9}</td></tr><tr><td class='cs'>L lokativ</td><td>where, about</td><td class='hr'>u Zagrebu</td><td>Unit {u10}</td></tr><tr><td class='cs'>D dativ</td><td>to / for whom</td><td class='hr'>Pišem Ani.</td><td>Unit {u11}</td></tr><tr><td class='cs'>I instrumental</td><td>with, by means of</td><td class='hr'>s Anom</td><td>Unit {u12}</td></tr><tr><td class='cs'>V vokativ</td><td>calling someone</td><td class='hr'>Ano!</td><td>Unit {u13}</td></tr></table>The reference tables on the Grammar page use this same order. (Croatian school books list them differently — Unit {u13} shows you that once you know all seven.)<br><br>This unit is the <b>akuzativ</b> — the direct object: the thing had, wanted, seen, eaten, bought."},
    {h:"The endings",
     b:"What happens to each kind of word when it's the object (the thing seen, had, wanted, bought). <b>Alive</b> = people and animals.<table><tr><th>word</th><th>what to do</th></tr><tr><td class='cs'>m<br>thing</td><td>nothing — no change<br><em class='exl'>stol → stol · auto → auto</em></td></tr><tr><td class='cs'>m<br>alive</td><td><b>add -a</b> · names in -o / -e: change it to -a<br><em class='exl'>brat → brata · Ivan → Ivana · Marko → Marka</em></td></tr><tr><td class='cs'>f<br>-a</td><td><b>-a → -u</b> (alive or not)<br><em class='exl'>kava → kavu · mama → mamu · Ana → Anu</em></td></tr><tr><td class='cs'>f<br>other</td><td>nothing — no change<br><em class='exl'>noć → noć · Kim → Kim</em></td></tr><tr><td class='cs'>n</td><td>nothing — no change (even dijete)<br><em class='exl'>pivo → pivo · more → more</em></td></tr></table><b>Feminine -a → -u</b> is the single most useful ending in the language. Masculine changes <b>only if it's alive</b>. Neuter never changes.<br><br><b>Two things to watch:</b><br>• <b>Men whose word ends in -a</b> (tata, Luka, kolega) take <b>-u</b>, like feminine words: <em>Vidim tatu.</em> — I see Dad. · <em>Zovem Luku.</em> — I'm calling Luka. They're still men, so describing words stay masculine: <em>Tata je <b>umoran</b>.</em><br>• A few masculine words <b>drop an a</b> from inside before adding -a: pas → <b>psa</b> (not pasa) · otac → <b>oca</b> · mačak → <b>mačka</b>. Unit {u24} explains why — for now just learn these three."},
    {h:"Alive or not",
     b:"Vidim <b>stol</b>. — I see the table (a thing, no change)<br>Vidim <b>psa</b>. — I see the dog (alive, takes -a)<br>Vidim <b>Marka</b>. — I see Marko (a person, takes -a)<br>Vidim <b>prijatelja</b> / <b>prijateljicu</b>. — I see my friend (a boy / a girl)<br><br><b>Describing words change too</b>, and they follow the same idea:<br>• masculine <b>alive</b> → <b>-og</b>: Imam <b>velikog</b> psa. · Imam <b>dobrog</b> prijatelja.<br>• feminine → <b>-u</b>: Imam <b>veliku</b> kuću. · Imam <b>dobru</b> prijateljicu.<br>• everything else → no change: Imam <b>velik</b> stol. · Imam <b>veliko</b> more.<br><br><b>More than one</b> (plural): masculine and feminine end in <b>-e</b>, neuter in <b>-a</b>: Vidim <b>gradove</b> · <b>žene</b> · <b>sela</b>.<br><br><b>him / her / them</b> as the object are the little words <b>ga / je / ih</b>: <em>Vidim ga. Volim je.</em> — Unit {u21} covers them properly."},
    {h:"Several ways to order the same coffee",
     b:"All of these get you a coffee. They differ in politeness, not meaning:<table><tr><th>Croatian</th><th>feel</th></tr><tr><td class='hr'>Kavu, molim.</td><td>short and fine</td></tr><tr><td class='hr'>Molim vas jednu kavu.</td><td>polite, very standard</td></tr><tr><td class='hr'>Htio bih kavu.</td><td>polite (male speaker)</td></tr><tr><td class='hr'>Htjela bih kavu.</td><td>polite (female speaker)</td></tr><tr><td class='hr'>Može jedna kava?</td><td>casual, friendly</td></tr><tr><td class='hr'>Dajte mi kavu.</td><td>blunt — avoid with strangers</td></tr><tr><td class='hr'>Hoću kavu.</td><td>demanding — avoid</td></tr></table>Pick <b>Molim vas jednu kavu</b> and you will never be wrong. <em>Može jedna kava?</em> is what you'll hear friends say.<br><br>Why <b>jednu</b> but <b>jedna</b>? <em>jedan / jedna / jedno</em> (one) changes like a describing word, so as the object <em>jedna kava → jednu kavu</em>. In <em>Može jedna kava?</em> the coffee isn't the object (literally 'Is one coffee possible?'), so it stays <em>jedna</em>.<br><br>Notice <b>kava → kavu</b> in every one of them. That change is this unit's whole subject."},
    {h:"Ordering politely",
     b:"<b>Molim vas jednu kavu.</b> — A coffee please<br><b>Htio bih</b> / <b>Htjela bih</b> jedno pivo. — I'd like a beer (m/f)<br><br><em>Htio bih</em> is much softer than <em>hoću</em>. Use it in shops and cafés — <em>hoću kavu</em> sounds demanding."}
  ],
  vocab:[["kava","coffee"],["čaj","tea"],["voda","water"],["mlijeko","milk"],["sok","juice"],
    ["pivo","beer"],["vino","wine"],["kruh","bread"],["sir","cheese"],["meso","meat"],
    ["riba","fish"],["juha","soup"],["salata","salad"],["voće","fruit"],["povrće","vegetables"],
    ["jabuka","apple"],["rajčica","tomato"],["krumpir","potato"],["kolač","cake"],
    ["sladoled","ice cream"],["račun","the bill"],["jelovnik","menu"]],
  phrases:[["Molim vas jednu kavu.","One coffee, please."],["Htio bih jedno pivo.","I'd like a beer. (m)"],
    ["Imam veliku kuću.","I have a big house."],["Vidim Marka.","I see Marko."],
    ["Jedem kruh i sir.","I'm eating bread and cheese."],["Račun, molim vas.","The bill, please."],
    ["Što preporučujete?","What do you recommend?"]],
  drills:[
    {t:"type",q:"Order politely: one coffee please.",a:["molim vas jednu kavu","htio bih jednu kavu","htjela bih jednu kavu"],e:"Molim vas jednu kavu — kava becomes kavu."},
    {t:"mc",q:"Vidim ___ . (pas)",o:["pas","psu","psa","pasa"],a:2,e:"pas is animate → psa."},
    {t:"mc",q:"Vidim ___ . (stol)",o:["stol","stola","stolu","stolom"],a:0,e:"Inanimate masculine doesn't change."},
    {t:"type",q:"Say: I have a big house.",a:["imam veliku kuću","imam veliku kucu"],e:"Imam veliku kuću."},
    {t:"type",q:"Say: The bill, please.",a:["račun molim vas","racun molim vas","račun molim","molim vas račun"],e:"Račun, molim vas."},
    {t:"mc",q:"Why does 'pivo' stay 'pivo'?",o:["It's feminine","Neuter never changes","It's plural","It's animate"],a:1,e:"Neuter is identical in N and A."}
  ]
},
{
  id:9, sec:2, title:"Genitive — of, from, without", sub:"Genitiv",
  goal:"Show possession, use the commonest prepositions, and say something isn't there.",
  grammar:[
    {h:"The endings",
     b:"<table><tr><th></th><th>N</th><th>G — one</th><th>G — more than one</th></tr><tr><td class='cs'>m</td><td class='hr'>grad</td><td class='hr'>grada</td><td class='hr'>gradova</td></tr><tr><td class='cs'>f</td><td class='hr'>kuća</td><td class='hr'>kuće</td><td class='hr'>kuća</td></tr><tr><td class='cs'>n</td><td class='hr'>more</td><td class='hr'>mora</td><td class='hr'>mora</td></tr></table><b>One thing:</b><br>• masculine → <b>add -a</b> (exactly like the alive accusative): grad → grada · brat → brata · Ivan → Ivana · Marko → Marka<br>• feminine <b>-a → -e</b>: kuća → kuće · Ana → Ane · Hrvatska → Hrvatske. Consonant feminines → <b>-i</b>: noć → noći<br>• neuter <b>-o / -e → -a</b>: more → mora · pivo → piva<br>• men ending in -a take <b>-e</b>: tata → tate<br><br><b>More than one</b> (after 5+, puno, malo, nema…):<br>• masculine: one-syllable words <b>-ova</b> (grad → gradova), longer words <b>-a</b> (prijatelj → prijatelja)<br>• feminine: <b>-a</b> — it looks just like the basic singular: kuća → kuća, žena → žena<br>• neuter: <b>-a</b>: more → mora, selo → sela<br>• Common odd ones: <b>ljudi</b> (people), <b>sati</b> (hours), <b>djece</b> (children)<br><br>The vanishing a from the accusative happens here too: pas → <b>psa</b> · otac → <b>oca</b>."},
    {h:"Four jobs",
     b:"<b>1 · Possession</b> — English <em>of</em> or <em>'s</em>:<br>knjiga <b>profesora</b> (the professor's book) · centar <b>grada</b> (the city centre) · kraj <b>filma</b> (the end of the film)<br><br><b>2 · After these prepositions:</b> <b>iz</b> from/out of, <b>od</b> from, <b>do</b> to/until, <b>bez</b> without, <b>kod</b> at someone's, <b>blizu</b> near, <b>poslije/nakon</b> after, <b>prije</b> before, <b>oko</b> around, <b>preko</b> across, <b>zbog</b> because of, <b>umjesto</b> instead of<br><br><b>3 · After quantities</b> — 5+, and <em>puno, malo, čaša, boca, kilogram</em>:<br>puno <b>ljudi</b> (a lot of people) · čaša <b>vode</b> (a glass of water) · kilogram <b>jabuka</b> (a kilo of apples)<br><br><b>4 · After nema</b>:<br><b>Nema</b> kruha. — There's no bread. · <b>Nema</b> problema."},
    {h:"Numbers use the genitive — the rule from Unit {u7}",
     b:"Back in Unit {u7} you learned the <em>1 / a few / many</em> pattern — jedna kava · dvije kave · pet kava. Here's what's behind it: the genitive.<table><tr><th>after…</th><th>what the noun takes</th><th>example</th></tr><tr><td class='cs'>1</td><td>nothing special, it just agrees</td><td class='hr'>jedan stol · jedna kava</td></tr><tr><td class='cs'>2, 3, 4</td><td>genitive <b>singular</b></td><td class='hr'>dva stola · tri kave</td></tr><tr><td class='cs'>5 and up</td><td>genitive <b>plural</b></td><td class='hr'>pet stolova · šest kava</td></tr></table>That's it — the same genitive endings you just learned, triggered by a number instead of a preposition.<br><br>Two extra details:<br>• <b>dva</b> for masculine and neuter, <b>dvije</b> for feminine — <em>dva piva</em>, <em>dvije kave</em><br>• Anything <em>ending</em> in 2, 3 or 4 follows the middle row: <em>dvadeset dva stola</em> (22 tables). Anything ending 5–0 follows the bottom row: <em>dvadeset pet stolova</em>.<br>• <b>11–19 always take the bottom row</b>, even 12, 13, 14: <em>dvanaest stolova</em> · <em>četrnaest kava</em>.<br>• <b>The number decides, not the verb.</b> Želim (I want) <b>kavu</b> (one, normal accusative) · Želim dvije <b>kave</b> · Želim pet <b>kava</b> · Pet <b>kava</b> je na stolu (five coffees are on the table). No 'want' in the last one, and it's still <em>kava</em>.<br><br>Now say the Unit {u7} phrases again and you'll hear the pattern: <b>jedna kava · dvije kave · pet kava</b>."},
    {h:"ima and nema",
     b:"<b>Ima</b> + noun = there is / there are.<br><b>Nema</b> + <b>genitive</b> = there isn't.<br>Ima li kruha? — Is there bread?<br>Nema mlijeka. — There's no milk.<br>Ima li ovdje zahod? — Is there a toilet here?"}
  ],
  vocab:[["bez","without (+G)"],["iz","from / out of (+G)"],["od","from (+G)"],["do","to / until (+G)"],
    ["kod","at someone's (+G)"],["blizu","near (+G)"],["poslije","after (+G)"],["prije","before (+G)"],
    ["oko","around (+G)"],["zbog","because of (+G)"],["umjesto","instead of (+G)"],
    ["puno","a lot of (+G)"],["šećer","sugar"],["sol","salt (f)"],["novac","money"],
    ["ljudi","people"],["čaša","glass"],["boca","bottle"],["šalica","cup"],["nema","there isn't (+G)"]],
  phrases:[["Ja sam iz Amerike.","I'm from America."],["Kava bez šećera, molim.","Coffee without sugar, please."],
    ["Nema problema.","No problem."],["Ima li ovdje zahod?","Is there a toilet here?"],
    ["Idem do dućana.","I'm going to the shop."],["Puno ljudi je ovdje.","There are a lot of people here."],
    ["Vidimo se poslije škole.","See you after school."]],
  drills:[
    {t:"type",q:"Say: Coffee without sugar.",a:["kava bez šećera","kava bez secera"],e:"Kava bez šećera."},
    {t:"mc",q:"Ja sam iz ___ . (Hrvatska)",o:["Hrvatska","Hrvatsku","Hrvatske","Hrvatskoj"],a:2,e:"iz + genitive, f → -e."},
    {t:"type",q:"Say: There's no bread.",a:["nema kruha"],e:"Nema kruha."},
    {t:"mc",q:"Which does NOT take genitive?",o:["bez","kod","do","u"],a:3,e:"u takes accusative or locative."},
    {t:"mc",q:"'a glass of water' =",o:["čaša voda","čaša vodu","čaša vode","čaša vodom"],a:2,e:"Quantity → genitive."},
    {t:"mc",q:"'five coffees' =",o:["pet kava","pet kave","pet kavu","pet kavi"],a:0,e:"Five and up takes the genitive plural: pet kava."}
  ]
},
{
  id:10, sec:2, title:"Locative — where you are", sub:"Lokativ",
  goal:"Master the u/na split. Getting this right is what makes you sound like you know the language.",
  grammar:[
    {h:"Motion versus position",
     b:"The <em>same</em> preposition takes a <b>different case</b> depending on movement.<br><br><b>Going → accusative:</b> Idem <b>u Zagreb</b>.<br><b>Being → locative:</b> Ja sam <b>u Zagrebu</b>.<br><br>Idem <b>u školu</b> / Ja sam <b>u školi</b><br>Idem <b>na plažu</b> / Ja sam <b>na plaži</b><br><br>Ask: am I arriving, or already there?"},
    {h:"The endings",
     b:"The locative always comes after a little word: <b>u</b> (in), <b>na</b> (on / at) or <b>o</b> (about), plus two rarer ones at the end of this step.<br><b>masculine and neuter → -u</b> · <b>feminine → -i</b><br>grad → u grad<b>u</b> · Zagreb → u Zagreb<b>u</b> · more → na mor<b>u</b> · kino → u kin<b>u</b> · škola → u škol<b>i</b> · Ana → o An<b>i</b><br>Consonant feminines → -i too: noć → u noći.<br><br><b>Watch out — k, g, h before -i:</b> they turn into <b>c, z, s</b>. That's why you see:<br>banka → u ban<b>ci</b> · Amerika → u Ameri<b>ci</b> · knjiga → u knji<b>zi</b> · ruka → u ru<b>ci</b><br>Family words and names keep their letter: o baki, o Luki.<br><br><b>Countries ending in -ska / -čka / -ška</b> are really describing words, so they take <b>-oj</b>:<br>Hrvatska → u Hrvatsk<b>oj</b> · Njemačka → u Njemačk<b>oj</b> · Engleska → u Englesk<b>oj</b><br>Other places are normal: u Americi · u Italiji · u Splitu · u New Yorku<br><br><b>More than one:</b> masculine / neuter <b>-ima</b>, feminine <b>-ama</b>: u gradovima · na plažama<br><b>Describing words:</b> masculine / neuter <b>-om</b>, feminine <b>-oj</b>: u velik<b>om</b> gradu · u velik<b>oj</b> kući<br><br>The locative <b>only ever appears after a preposition</b> — never alone. Used with <b>u</b> in, <b>na</b> on/at, <b>o</b> about, <b>po</b> around, <b>pri</b> at / by / during (only in set phrases: <em>pri kraju</em> near the end, <em>pri ruci</em> at hand).<br><br><b>Careful:</b> the everyday word for <em>near</em> is <b>blizu</b>, and that one takes the <b>genitive</b>, not the locative: <em>Živim blizu škole.</em> So <em>pri</em> and <em>blizu</em> can both come out as \"near\" in English, but they're different words with different cases."},
    {h:"u or na — you memorise these",
     b:"<b>u</b> — u školi, u kući, u gradu, u kinu, u dućanu, u banci, u sobi, u Hrvatskoj<br><b>na</b> — na poslu (at work), na plaži (beach), na moru (seaside), na fakultetu (university), na ulici (street), na otoku (island), na kolodvoru (station), na tržnici (market), na koncertu (concert)<br><br>Rough logic: <em>na</em> for open surfaces, islands, events. But learn each place together with its preposition — that's faster than reasoning it out."},
    {h:"Three question words, three cases",
     b:"<b>Gdje?</b> where (are you) → locative<br><b>Kamo?</b> where to → accusative<br><b>Odakle?</b> where from → genitive<br><br>Gdje si? — Na poslu sam.<br>Kamo ideš? — Idem u kino.<br>Odakle si? — Iz Splita."}
  ],
  vocab:[["škola","school"],["posao","work / job"],["fakultet","university"],["dućan","shop"],
    ["tržnica","market"],["kino","cinema"],["kazalište","theatre"],["restoran","restaurant"],
    ["kafić","café"],["plaža","beach"],["ulica","street"],["trg","square"],["kolodvor","station"],
    ["aerodrom","airport"],["bolnica","hospital"],["banka","bank"],["park","park"],
    ["knjižnica","library"],["muzej","museum"],["crkva","church"],["zahod","toilet"]],
  phrases:[["Gdje si?","Where are you?"],["U školi sam.","I'm at school."],["Na poslu sam.","I'm at work."],
    ["Idem u kino.","I'm going to the cinema."],["Živim u Zagrebu.","I live in Zagreb."],
    ["Ljeti smo na moru.","In summer we're at the seaside."],["Razgovaramo o filmu.","We're talking about the film."]],
  drills:[
    {t:"mc",q:"Idem ___ . (Zagreb, going there)",o:["u Zagreb","u Zagrebu","iz Zagreba","na Zagreb"],a:0,e:"Motion → accusative."},
    {t:"mc",q:"Ja sam ___ . (Zagreb, there now)",o:["u Zagreb","u Zagrebu","do Zagreba","na Zagrebu"],a:1,e:"Position → locative."},
    {t:"type",q:"Say: I'm at work.",a:["na poslu sam","ja sam na poslu"],e:"Na poslu sam — work takes na."},
    {t:"type",q:"Say: I live in Croatia.",a:["živim u hrvatskoj","zivim u hrvatskoj"],e:"Živim u Hrvatskoj."},
    {t:"mc",q:"Which is right?",o:["Idem na plaži","Idem u plažu","Idem na plažu","Sam na plažu"],a:2,e:"Motion + na = accusative."},
    {t:"mc",q:"'Kamo?' asks for which case?",o:["genitive","accusative","locative","dative"],a:1,e:"Kamo = where to = motion = accusative."}
  ]
},
{
  id:11, sec:2, title:"Dative — to whom", sub:"Dativ",
  goal:"Give, send, show — and use the verb that Croatian flips around: liking.",
  grammar:[
    {h:"The endings are the locative's",
     b:"<b>masculine and neuter → -u</b> · <b>feminine → -i</b> — exactly the locative endings, including k/g/h → c/z/s (knjiga → knjizi). Family words and names keep their letter: baka → baki, Luka → Luki. The difference: the dative works <b>without a preposition</b>.<br><br>Dajem knjigu <b>prijatelju</b>. — I'm giving the book to my friend.<br>Pišem <b>Ani</b> / <b>Marku</b>. — I'm writing to Ana / Marko.<br>Pomažem <b>sestri</b>. — I'm helping my sister.<br>Kupujem poklon <b>tati</b>. — I'm buying Dad a present. (men ending in -a take -i too)<br><br><b>Describing words:</b> masculine / neuter <b>-om</b>, feminine <b>-oj</b>: <em>dobrom prijatelju</em> · <em>dobroj prijateljici</em><br><b>More than one:</b> <b>-ima / -ama</b>, same as the locative: <em>Pišem prijateljima.</em><br><br>Also after <b>prema</b> towards and <b>zahvaljujući</b> thanks to."},
    {h:"Short pronouns — you'll use these constantly",
     b:"<b>mi</b> to me · <b>ti</b> to you · <b>mu</b> to him/it · <b>joj</b> to her · <b>nam</b> to us · <b>vam</b> to you · <b>im</b> to them<br><br>Daj <b>mi</b> to. — Give me that.<br>Reci <b>mu</b>. — Tell him.<br>Pomozi <b>joj</b>. — Help her.<br>Kako <b>ti</b> se sviđa? — How do you like it?<br><br><em>Daj, Reci, Pomozi</em> are the 'do it!' forms of dati, reći, pomoći. Unit {u16} shows how they're made; for now learn these as phrases."},
    {h:"Liking works backwards",
     b:"The thing you like is the <b>subject</b>, and you're in the dative — literally <em>it is pleasing to me</em>:<br><br><b>Sviđa mi se</b> Zagreb. — I like Zagreb.<br><b>Sviđaju mi se</b> ove knjige. — I like these books (plural thing → plural verb).<br>Kako <b>ti se sviđa</b> Hrvatska? — How do you like Croatia?<br><br>Compare <b>voljeti</b>, which is normal: <em>Volim Zagreb.</em> Use <em>voljeti</em> for love and strong preference, <em>sviđati se</em> for ordinary liking."},
    {h:"Other verbs that take the dative",
     b:"<b>trebati</b> — Treba <b>mi</b> pomoć. (I need help)<br><b>nedostajati</b> — Nedostaješ <b>mi</b>. (I miss you)<br><b>hvala</b> — Hvala <b>ti</b> / Hvala <b>vam</b><br><b>čini se</b> — Čini <b>mi</b> se… (It seems to me…)<br><b>drago je</b> — Drago <b>mi</b> je. (Nice to meet you — literally 'it is dear to me')"}
  ],
  vocab:[["dati","to give"],["poslati","to send"],["pokazati","to show"],["pomoći","to help"],
    ["sviđati se","to be pleasing / to like"],["nedostajati","to be missed"],["reći","to say"],
    ["objasniti","to explain"],["obitelj","family (f)"],["majka","mother"],["otac","father"],
    ["brat","brother"],["sestra","sister"],["djed","grandfather"],["baka","grandmother"],
    ["sin","son"],["kći","daughter"],["muž","husband"],["žena","wife / woman"],["dijete","child"]],
  phrases:[["Sviđa mi se Zagreb.","I like Zagreb."],["Kako ti se sviđa Hrvatska?","How do you like Croatia?"],
    ["Daj mi to, molim te.","Give me that, please."],["Treba mi pomoć.","I need help."],
    ["Nedostaješ mi.","I miss you."],["Dajem knjigu sestri.","I'm giving the book to my sister."],
    ["Hvala ti puno!","Thanks a lot!"]],
  drills:[
    {t:"type",q:"Say: I like Zagreb.",a:["sviđa mi se zagreb","svida mi se zagreb"],e:"Sviđa mi se Zagreb."},
    {t:"mc",q:"'I miss you' =",o:["Nedostajem ti","Nedostaješ mi","Nedostajem te","Nedostaješ me"],a:1,e:"You are missed to me: Nedostaješ mi."},
    {t:"mc",q:"Which case answers 'kome?' (to whom?)",o:["genitive","dative","locative","instrumental"],a:1,e:"Dative — to whom."},
    {t:"type",q:"Say: I need help.",a:["treba mi pomoć","treba mi pomoc"],e:"Treba mi pomoć."},
    {t:"mc",q:"'I like these books' =",o:["Sviđa mi se ove knjige","Sviđaju mi se ove knjige","Sviđam ove knjige","Sviđa me ove knjige"],a:1,e:"Plural subject → plural verb: sviđaju."},
    {t:"type",q:"Say: Tell him.",a:["reci mu"],e:"Reci mu."}
  ]
},
{
  id:12, sec:2, title:"Instrumental — with and by", sub:"Instrumental",
  goal:"Say who you're with and how you're travelling — and learn the one distinction that matters.",
  grammar:[
    {h:"The endings",
     b:"<b>masculine and neuter → -om</b> · <b>feminine → -om</b> too<br>grad → grad<b>om</b> · Marko → Mark<b>om</b> · žena → žen<b>om</b> · Ana → An<b>om</b> · tata → tat<b>om</b> · selo → sel<b>om</b><br><br><b>When it's -em instead:</b><br>• after soft consonants (č ć š ž đ j lj nj) and c: prijatelj → prijatelj<b>em</b> · muž → muž<b>em</b> · otac → oc<b>em</b><br>• neuter words ending in -e: more → mor<b>em</b> · polje → polj<b>em</b><br><br><b>Consonant feminines</b> (obitelj, noć, ljubav) take <b>-i</b>: <em>s obitelji</em>. You'll also see -ju (<em>s ljubavlju</em>) — both are right.<br>The vanishing a again: pas → s <b>psom</b>.<br><br><b>Describing words:</b> masculine / neuter <b>-im</b>, feminine <b>-om</b>: s velik<b>im</b> psom · s velik<b>om</b> torbom<br><b>More than one:</b> <b>-ima / -ama</b>: s prijateljima · sa ženama"},
    {h:"The whole trick: person needs s, tool doesn't",
     b:"<b>A companion → s / sa + instrumental:</b><br>Idem <b>s prijateljem</b>. — I'm going with a friend.<br>Kava <b>s mlijekom</b>. — Coffee with milk.<br>Živim <b>s obitelji</b>. — I live with my family.<br><br><b>A means → bare instrumental, no preposition:</b><br>Idem <b>autobusom</b>. — I go by bus.<br>Pišem <b>olovkom</b>. — I write with a pen.<br>Putujem <b>vlakom</b>. — I travel by train.<br><br>Say <em>idem s autobusom</em> and you've said you're travelling <em>in the company of</em> a bus."},
    {h:"s or sa?",
     b:"Use <b>sa</b> before words starting with s, š, z, ž, or awkward clusters — purely for pronunciation.<br><em>sa Šimunom</em> (with Šimun) · <em>sa zetom</em> (with my son-in-law) · <em>sa mnom</em> (with me)<br>Otherwise <b>s</b>: <em>s Anom, s prijateljem, s tobom</em>."},
    {h:"Other uses",
     b:"After <b>pod</b> under, <b>nad</b> above, <b>pred</b> in front of, <b>za</b> behind, <b>među</b> among — when there's no movement:<br><em>pod stolom</em> (under the table) · <em>pred kućom</em> (in front of the house)<br><br>And for time periods: <em>ponedjeljkom</em> (on Mondays), <em>ljetom</em> (in summer)."}
  ],
  vocab:[["s / sa","with (+I)"],["autobus","bus"],["vlak","train"],["auto","car"],["bicikl","bicycle"],
    ["avion","plane"],["brod","boat"],["tramvaj","tram"],["taksi","taxi"],["pješke","on foot"],
    ["pod","under (+I)"],["nad","above (+I)"],["pred","in front of (+I)"],["među","among (+I)"],
    ["olovka","pen"],["nož","knife"],["žlica","spoon"],["vilica","fork"],["ruka","hand / arm"]],
  phrases:[["Idem s prijateljem.","I'm going with a friend."],["Putujem vlakom.","I'm travelling by train."],
    ["Kava s mlijekom, molim.","Coffee with milk, please."],["Živim s obitelji.","I live with my family."],
    ["Idem pješke.","I'm walking."],["Hoćeš ići sa mnom?","Do you want to come with me?"]],
  drills:[
    {t:"mc",q:"'I'm going by bus' =",o:["Idem s autobusom","Idem autobusom","Idem u autobusu","Idem autobus"],a:1,e:"A means of transport takes bare instrumental."},
    {t:"mc",q:"'I'm going with a friend' =",o:["Idem prijateljem","Idem s prijateljem","Idem prijatelju","Idem za prijatelja"],a:1,e:"A companion needs s."},
    {t:"type",q:"Say: Coffee with milk, please.",a:["kava s mlijekom molim","kava s mlijekom molim vas"],e:"Kava s mlijekom, molim."},
    {t:"type",q:"Say: I live with my family.",a:["živim s obitelji","zivim s obitelji"],e:"Živim s obitelji."},
    {t:"mc",q:"Instrumental of 'prijatelj':",o:["prijateljom","prijateljem","prijatelju","prijatelja"],a:1,e:"Soft consonant → -em."},
    {t:"type",q:"Ask: Do you want to come with me?",a:["hoćeš ići sa mnom","hoces ici sa mnom","hoćeš li ići sa mnom"],e:"Hoćeš ići sa mnom?"}
  ]
},
{
  id:13, sec:2, title:"Vocative and the full picture", sub:"Vokativ i pregled",
  goal:"Call someone by name, then see all seven cases together.",
  grammar:[
    {h:"Vocative — for calling someone",
     b:"Used only when you're <b>talking to</b> someone directly.<br><b>masculine</b> → <b>-e</b>: Ivan → <b>Ivane</b> · brat → <b>brate</b> · prijatelj → <b>prijatelju</b> (soft consonants take -u)<br>&nbsp;&nbsp;names in -o and men ending in -a don't change: <b>Marko! Luka!</b><br><b>feminine</b> → <b>-o</b>: Ana → <b>Ano</b> · Maja → <b>Majo</b> · mama → <b>mama</b> (usually unchanged in speech)<br>&nbsp;&nbsp;names not ending in -a don't change: <b>Kim!</b><br><b>neuter</b> → no change: <b>dijete!</b><br><br>Bok, <b>Ivane</b>! — Hi, Ivan! · Hvala, <b>prijatelju</b>! — Thanks, friend! · Ajde, <b>brate</b>! — Come on, bro! · <b>Gospodine</b>! — Sir!<br><br>In everyday speech people often just use the normal form, especially with names. Don't stress about it."},
    {h:"The order Croatian books use",
     b:"This course taught you the cases easiest-first: <b>N → A → G → L → D → I → V</b>.<br><br>Croatian schools, dictionaries and grammar books always <b>number</b> them in a different order. You'll see it in any table you find outside this app:<br><b>1 Nominativ</b> — tko? što? — the subject<br><b>2 Genitiv</b> — koga? čega? — of, from, without<br><b>3 Dativ</b> — kome? čemu? — to, for<br><b>4 Akuzativ</b> — koga? što? — the object<br><b>5 Vokativ</b> — calling someone<br><b>6 Lokativ</b> — o kome? o čemu? — position, about<br><b>7 Instrumental</b> — s kim? čime? — with, by<br><br>Same seven cases, same endings — just numbered differently. Inside this app everything stays in the order you learned."},
    {h:"Question words across all seven",
     b:"Now that you know the cases, the shapes of <em>tko</em> and <em>što</em> make sense — they follow the same seven jobs as any noun:<table><tr><th>case</th><th>tko (who)</th><th>što (what)</th><th>used for</th></tr><tr><td class='cs'>N</td><td class='hr'>tko</td><td class='hr'>što</td><td>Tko je to? — Who's that?</td></tr><tr><td class='cs'>A</td><td class='hr'>koga</td><td class='hr'>što</td><td>Koga vidiš? — Who do you see?</td></tr><tr><td class='cs'>G</td><td class='hr'>koga</td><td class='hr'>čega</td><td>Od koga je to? — Who's it from?</td></tr><tr><td class='cs'>L</td><td class='hr'>o kome</td><td class='hr'>o čemu</td><td>O čemu govoriš? — What are you talking about?</td></tr><tr><td class='cs'>D</td><td class='hr'>kome</td><td class='hr'>čemu</td><td>Kome pišeš? — Who are you writing to?</td></tr><tr><td class='cs'>I</td><td class='hr'>s kim</td><td class='hr'>čime</td><td>S kim ideš? — Who are you going with?</td></tr></table>Those fixed phrases you memorised back in Unit {u6} — <b>s kim</b>, <b>o čemu</b>, <b>od koga</b> — were these all along. The preposition decides the case: <em>s</em> takes instrumental, <em>o</em> takes locative, <em>od</em> takes genitive."},
    {h:"The shortcut nobody tells you",
     b:"Seven cases only cost you <b>five</b> sets of endings:<br>• <b>Dative and locative are always identical.</b><br>• In the plural, <b>dative, locative and instrumental are all identical</b> (-ama / -ima).<br>• Neuter accusative always equals nominative.<br>• Masculine inanimate accusative equals nominative.<br><br>So the workload is much smaller than the table suggests."},
    {h:"Plural endings",
     b:"<table><tr><th></th><th>gradovi (m)</th><th>žene (f)</th><th>mora (n)</th></tr><tr><td class='cs'>N</td><td class='hr'>gradovi</td><td class='hr'>žene</td><td class='hr'>mora</td></tr><tr><td class='cs'>A</td><td class='hr'>gradove</td><td class='hr'>žene</td><td class='hr'>mora</td></tr><tr><td class='cs'>G</td><td class='hr'>gradova</td><td class='hr'>žena</td><td class='hr'>mora</td></tr><tr><td class='cs'>L / D / I</td><td class='hr'>gradovima</td><td class='hr'>ženama</td><td class='hr'>morima</td></tr><tr><td class='cs'>V</td><td class='hr'>gradovi</td><td class='hr'>žene</td><td class='hr'>mora</td></tr></table>The <b>-ama / -ima</b> ending covering three cases at once is the single biggest shortcut in Croatian grammar."}
  ],
  vocab:[["gospodine","sir (vocative)"],["gospođo","madam (vocative)"],["prijatelju","friend (vocative)"],
    ["ljudi","people"],["svi","everyone"],["netko","someone"],["nitko","nobody"],
    ["nešto","something"],["ništa","nothing"],["svatko","everybody"],["negdje","somewhere"],
    ["nigdje","nowhere"],["uvijek","always"],["nikad","never"]],
  phrases:[["Bok, Ivane!","Hi, Ivan!"],["Hvala, prijatelju!","Thanks, friend!"],
    ["Oprostite, gospodine!","Excuse me, sir!"],["Nitko nije došao.","Nobody came."],
    ["Idemo s prijateljima.","We're going with friends."],["Govorimo o gradovima.","We're talking about cities."]],
  drills:[
    {t:"mc",q:"Vocative of 'Ivan':",o:["Ivan","Ivane","Ivanu","Ivana"],a:1,e:"Masculine vocative takes -e."},
    {t:"mc",q:"Which two cases are always identical?",o:["N and A","G and D","D and L","A and I"],a:2,e:"Dative and locative always match."},
    {t:"mc",q:"In the plural, which three merge?",o:["N, G, A","D, L, I","N, A, V","G, D, A"],a:1,e:"D, L and I all take -ama/-ima."},
    {t:"type",q:"Say: We're going with friends.",a:["idemo s prijateljima"],e:"Idemo s prijateljima."},
    {t:"mc",q:"Genitive plural of 'žena':",o:["žene","žena","ženama","ženu"],a:1,e:"žena — the bare stem, a distinctively long ending."},
    {t:"mc",q:"We are talking about the cities —",o:["o gradovi","o gradove","o gradovima","o gradova"],a:2,e:"o takes the locative; the plural ending is -ima."}
  ]
},
/* ============ SECTION 3 — TENSES ============ */
{
  id:38, sec:2, title:"Nouns that bend differently", sub:"Posebne imenice",
  goal:"Handle the nouns that don't follow the main patterns: noć, vrijeme, tata, Marko, auto and the always-plural ones.",
  grammar:[
    {h:"Feminine words ending in a consonant",
     b:"A group of feminine nouns ends in a consonant: <b>noć, stvar, ljubav, obitelj, riječ, sol, večer, jesen, pamet, kost</b>.<br>They have their own endings — mostly <b>-i</b>:<table><tr><th>case</th><th>singular</th><th>plural</th></tr><tr><td class='cs'>N</td><td class='hr'>noć</td><td class='hr'>noći</td></tr><tr><td class='cs'>G</td><td class='hr'>noći</td><td class='hr'>noći</td></tr><tr><td class='cs'>D / L</td><td class='hr'>noći</td><td class='hr'>noćima</td></tr><tr><td class='cs'>A</td><td class='hr'>noć</td><td class='hr'>noći</td></tr><tr><td class='cs'>I</td><td class='hr'>noći / noću</td><td class='hr'>noćima</td></tr></table><b>Laku noć.</b> (A = N) · <b>Nemam soli.</b> — I have no salt. · <b>o ljubavi</b> — about love · <b>s obitelji</b> — with family<br><br>The instrumental can also end in -ju (<em>s ljubavlju</em>) — both are right; -i is more common in speech."},
    {h:"Words that grow: vrijeme → vremena",
     b:"A few neuter nouns add a syllable in every case except N / A:<br><b>vrijeme</b> (time / weather) → vremena, vremenu, vremenom<br><b>ime</b> (name) → imena · <b>rame</b> (shoulder) → ramena<br><b>dijete</b> (child) → djeteta, djetetu — plural <b>djeca</b><br><br><b>Nemam vremena.</b> — I don't have time.<br><b>Kako ti je ime?</b> — What's your name?<br><b>Kakvo je vrijeme?</b> → <b>Po lijepom vremenu…</b> — In nice weather…"},
    {h:"Masculine words ending in -a",
     b:"<b>tata, kolega, Luka, Nikola</b> end in -a but are men. They take the <b>feminine endings</b>, but describing words stay <b>masculine</b>:<br><b>Vidim tatu.</b> · <b>Idem s tatom.</b> · <b>Pišem Luki.</b><br><b>dobar</b> tata (a good dad) · <b>dobar</b> kolega (a good colleague) · <b>Luka je umoran.</b> (Luka is tired)"},
    {h:"Masculine words ending in -o or -e",
     b:"Some masculine nouns and lots of names end in -o or -e: <b>auto, radio, Marko, Ivo, Hrvoje</b>. They take the normal masculine endings:<br>Marko → <b>Marka</b>, <b>Marku</b>, <b>s Markom</b> · auto → <b>auta</b>, <b>u autu</b>, <b>autom</b><br>radio adds a j: <b>radija</b>, <b>na radiju</b><br><br>Careful: <b>kino, pivo, selo</b> end in -o but are neuter."},
    {h:"Always plural",
     b:"Some things are always plural in Croatian, even when there's only one:<br><b>vrata</b> (door) · <b>novine</b> (newspaper) · <b>hlače</b> (trousers) · <b>traperice</b> (jeans) · <b>naočale</b> (glasses) · <b>škare</b> (scissors) · <b>leđa</b> (back)<br><br>So the verb is plural too:<br><b>Vrata su velika.</b> · <b>Gdje su mi naočale?</b> — Where are my glasses? (Croatians often use <em>mi</em>, 'to me', for 'my': Gdje su mi ključevi? — Where are my keys?) · <b>Hlače su nove.</b> — The trousers are new."}
  ],
  vocab:[["noć","night (f)"],["stvar","thing (f)"],["ljubav","love (f)"],["obitelj","family (f)"],["sol","salt (f)"],
    ["vrijeme","time / weather"],["ime","name"],["rame","shoulder"],["tata","dad"],["kolega","colleague (m)"],
    ["vrata","door (plural)"],["novine","newspaper (plural)"],["hlače","trousers (plural)"],["naočale","glasses (plural)"],["traperice","jeans (plural)"]],
  phrases:[["Nemam vremena.","I don't have time."],["Kako ti je ime?","What's your name?"],["Laku noć.","Good night."],
    ["Gdje su mi naočale?","Where are my glasses?"],["Kakvo je vrijeme?","What's the weather like?"]],
  drills:[
    {t:"mc",q:"Genitive of 'noć':",o:["noći","noća"],a:0,e:"-i."},
    {t:"type",q:"Say: I don't have time.",a:["nemam vremena"],e:"vrijeme → vremena."},
    {t:"mc",q:"'a good dad' =",o:["dobra tata","dobar tata"],a:1,e:"Describing words stay masculine."},
    {t:"type",q:"Say: with Marko",a:["s markom"],e:"Normal masculine ending."},
    {t:"mc",q:"'Vrata su…' — why su?",o:["vrata is always plural","it's a mistake"],a:0,e:"Always plural."},
    {t:"mc",q:"Genitive of 'ime':",o:["ima","imena"],a:1,e:"It grows: imena."}
  ]
},
{
  id:29, sec:2, title:"Which case after which word", sub:"Prijedlozi i padeži",
  goal:"See every common preposition with the case it takes, all on one page — and handle time phrases like 'two days ago' and 'in a week'.",
  grammar:[
    {h:"Every preposition picks a case",
     b:"You've met most of these one at a time. Here they are together. Learn each one <b>with its case</b>, as a pair.<table><tr><th>case</th><th>prepositions</th></tr><tr><td class='cs'>genitive</td><td class='hr'>iz (from) · od (from) · do (to) · bez (without) · kod (at someone's) · blizu (near) · oko (around) · prije (before) · poslije / nakon (after) · zbog (because of) · umjesto (instead of) · preko (across) · između (between)</td></tr><tr><td class='cs'>dative</td><td class='hr'>prema (towards) · k / ka (to someone)</td></tr><tr><td class='cs'>accusative</td><td class='hr'>kroz (through) · za (for) · niz / uz (down / up along)</td></tr><tr><td class='cs'>locative</td><td class='hr'>o (about) · po (around, by) · pri (at, during — set phrases like pri kraju)</td></tr><tr><td class='cs'>instrumental</td><td class='hr'>s / sa (with)</td></tr></table>The genitive row is by far the longest — when in doubt, it's usually genitive.<br><br><b>Blizu mora.</b> — Near the sea. · <b>Zbog kiše.</b> — Because of the rain. · <b>Kroz grad.</b> — Through the city."},
    {h:"The two-way ones: moving or staying",
     b:"A few prepositions take <b>two</b> cases, depending on whether something is moving there or already there (like Unit {u10}):<br><br><b>u, na</b> — moving → accusative · staying → locative<br><b>pod</b> (under), <b>pred</b> (in front of), <b>nad</b> (above), <b>za</b> (behind), <b>među</b> (among) — moving → accusative · staying → instrumental<br><br><b>Stavi torbu pod stol.</b> — Put the bag under the table. (moving)<br><b>Torba je pod stolom.</b> — The bag is under the table. (staying)<br><b>Idem u grad.</b> → <b>Ja sam u gradu.</b>"},
    {h:"Time phrases",
     b:"<b>prije</b> + genitive = ago / before: <b>prije dva dana</b> — two days ago · <b>prije posla</b> — before work<br><b>za</b> + accusative = in (from now): <b>za tjedan dana</b> — in a week · <b>za sat vremena</b> — in an hour<br><b>od … do</b> + genitive = from … to: <b>od ponedjeljka do petka</b><br><b>nakon / poslije</b> + genitive = after: <b>nakon posla</b><br><b>u</b> + accusative for days: <b>u ponedjeljak</b> — on Monday · <b>u subotu</b> — on Saturday<br><b>u</b> + locative for months: <b>u svibnju</b> — in May"},
    {h:"za — the busy one",
     b:"<b>za + accusative</b>:<br>for — <b>Ovo je za Anu.</b> — This is for Ana.<br>in (time) — <b>za pet minuta</b> — in five minutes<br><br><b>za + instrumental</b>:<br>behind / at — <b>za stolom</b> — at the table · <b>za kućom</b> — behind the house<br><br>Also handy: <b>Hvala na pomoći.</b> — Thanks for the help. (Croatian uses <b>na</b> + locative here.)"}
  ],
  vocab:[["blizu","near (+G)"],["zbog","because of (+G)"],["umjesto","instead of (+G)"],["između","between (+G)"],
    ["kroz","through (+A)"],["prema","towards (+D)"],["preko","across (+G)"],["prije","before / ago (+G)"],
    ["nakon","after (+G)"],["tjedan dana","a week"],["sat vremena","an hour"]],
  phrases:[["Prije dva dana.","Two days ago."],["Za tjedan dana.","In a week."],["Od ponedjeljka do petka.","From Monday to Friday."],
    ["Ovo je za mamu.","This is for Mom."],["Hvala na pomoći.","Thanks for the help."]],
  drills:[
    {t:"mc",q:"bez takes which case?",o:["genitive","dative","locative"],a:0,e:"bez + genitive."},
    {t:"type",q:"Say: from Monday to Friday",a:["od ponedjeljka do petka"],e:"od … do + genitive."},
    {t:"mc",q:"'two days ago' =",o:["prije dva dana","za dva dana"],a:0,e:"prije = ago."},
    {t:"mc",q:"'in a week' (from now) =",o:["prije tjedan dana","za tjedan dana"],a:1,e:"za = in."},
    {t:"mc",q:"The cat is under the table:",o:["Mačka je pod stol.","Mačka je pod stolom."],a:1,e:"Staying → instrumental."},
    {t:"type",q:"Say: This is for Ana.",a:["ovo je za anu","to je za anu"],e:"za + accusative."}
  ]
},
{
  id:30, sec:2, title:"Somebody, nothing, everywhere", sub:"Netko, ništa, svugdje",
  goal:"Say someone, something, nobody, nothing, everyone, everywhere — and use them in every case.",
  grammar:[
    {h:"some- words: ne + question word",
     b:"Put <b>ne-</b> in front of a question word and you get a 'some-' word:<table><tr><th>question</th><th>some-</th></tr><tr><td class='cs'>tko — who</td><td class='hr'>netko — someone</td></tr><tr><td class='cs'>što — what</td><td class='hr'>nešto — something</td></tr><tr><td class='cs'>gdje — where</td><td class='hr'>negdje — somewhere</td></tr><tr><td class='cs'>kada — when</td><td class='hr'>nekad — sometimes / once</td></tr><tr><td class='cs'>kako — how</td><td class='hr'>nekako — somehow</td></tr><tr><td class='cs'>koji — which</td><td class='hr'>neki — some</td></tr></table><b>Netko je na vratima.</b> — Someone's at the door.<br><b>Imaš li nešto?</b> — Do you have anything?<br><b>Negdje u gradu.</b> — Somewhere in town."},
    {h:"no- words: ni + question word, plus ne",
     b:"Put <b>ni-</b> in front for the 'no-' words: <b>nitko</b> (nobody), <b>ništa</b> (nothing), <b>nigdje</b> (nowhere), <b>nikad</b> (never), <b>nikako</b> (no way), <b>nijedan</b> (not one).<br><br>Remember the double negative from Unit {u5} — the verb still gets <b>ne</b>:<br><b>Nitko ne zna.</b> — Nobody knows.<br><b>Ništa ne vidim.</b> — I don't see anything.<br><b>Nikad ne pijem kavu.</b> — I never drink coffee.<br><b>Ne idem nigdje.</b> — I'm not going anywhere."},
    {h:"every- words",
     b:"<b>svatko</b> — everyone (each person) · <b>svi</b> — everyone, all (plural verb)<br><b>sve</b> — everything · <b>svugdje</b> — everywhere · <b>uvijek</b> — always · <b>svaki</b> — every<br><br><b>Svi su ovdje.</b> — Everyone is here.<br><b>Sve je u redu.</b> — Everything's fine.<br><b>Svaki dan</b> — every day."},
    {h:"They change like tko and što",
     b:"These words take the same endings as tko and što (Unit {u13}):<br>netko → <b>nekoga</b>, nekome, s nekim · nitko → <b>nikoga</b>, nikome<br>nešto → <b>nečega</b>, o nečemu · ništa → <b>ničega</b><br><br><b>Vidim nekoga.</b> — I see someone.<br><b>Ne vidim nikoga.</b> — I don't see anyone.<br><br>With a preposition, the <b>ni</b> splits off and goes first:<br><b>ni s kim</b> — with nobody · <b>ni o čemu</b> — about nothing<br><b>Ne razgovaram ni s kim.</b> — I'm not talking to anyone."}
  ],

{
  id:14, sec:3, title:"Past tense", sub:"Perfekt",
  goal:"Talk about yesterday, last year, your whole life — one simple pattern covers all of it.",
  grammar:[
    {h:"Two pieces",
     b:"<b>The verb's past form + the short form of biti (sam, si, je…).</b><br>To make the past form, drop <b>-ti</b> from the -ti form and add:<br><b>-o</b> (male speaker) · <b>-la</b> (female) · <b>-lo</b> (neuter) · <b>-li</b> (plural m/mixed) · <b>-le</b> (plural all-f)<br><br>raditi → radi<b>o</b> sam / radi<b>la</b> sam<br>gledati → gleda<b>li</b> smo<br>učiti → uči<b>la</b> je"},
    {h:"The ending shows who did it, not what was done",
     b:"This is the part English speakers forget. The past form agrees with the <b>doer</b>:<br><br><b>Bio sam</b> u Splitu. (a man)<br><b>Bila sam</b> u Splitu. (a woman)<br><b>Bili smo</b> u Splitu. (a group)<br><br>So every time you talk about your own past you need your own ending. Pick yours now and drill it until it's automatic."},
    {h:"Negative and questions",
     b:"Swap the short form for nisam/nisi/nije/nismo/niste/nisu:<br><b>Nisam radio</b> jučer. — I didn't work yesterday.<br><b>Nije bila</b> ovdje. — She wasn't here.<br><br>Question: <b>Jesi li bio</b> u Hrvatskoj? — Have you been to Croatia?"},
    {h:"Word order — the second-position rule",
     b:"<em>sam, si, je, smo, ste, su</em> must sit <b>second</b> in the clause.<br>✓ Radio sam. ✓ Jučer sam radio. ✓ U Zagrebu sam radio.<br>✗ Sam radio. ✗ Jučer radio sam.<br><br>Whatever comes first, the little word follows immediately."},
    {h:"Irregular past forms",
     b:"A few drop or change the stem:<br>ići → <b>išao / išla</b> (went)<br>reći → <b>rekao / rekla</b> (said)<br>doći → <b>došao / došla</b> (came)<br>jesti → <b>jeo / jela</b> (ate)<br>moći → <b>mogao / mogla</b> (could)<br>htjeti → <b>htio / htjela</b> (wanted)"}
  ],
  vocab:[["prošli tjedan","last week"],["prošle godine","last year"],["sinoć","last night"],

    ["putovati","to travel"],["doći","to come"],["otići","to leave"],["vidjeti","to see"],
    ["reći","to say"],["pitati","to ask"],["odgovoriti","to answer"],["ustati","to get up"],

{
  id:15, sec:3, title:"Future tense", sub:"Futur I",
  goal:"Make plans — and get the spelling right, because this is where Croatian and Serbian visibly differ.",
  grammar:[
    {h:"Short form of htjeti + infinitive",
     b:"<b>ću, ćeš, će, ćemo, ćete, će</b><br><br><b>Radit ću</b> sutra. — I'll work tomorrow.<br><b>Ići ćemo</b> na more. — We'll go to the seaside.<br>Što <b>ćeš raditi</b>? — What will you do?<br>Ona <b>će doći</b>. — She'll come."},
    {h:"The spelling rule",
     b:"When the verb comes first, the infinitive <b>drops its final -i</b> and stays a <b>separate word</b>:<br>✓ <b>radit ću</b> · ✓ <b>pisat ćeš</b> · ✓ <b>gledat će</b><br>✗ raditi ću · ✗ <b>radiću</b><br><br>Writing it as one word is the Serbian convention. Croatian keeps them separate. Verbs in <b>-ći</b> don't change: <em>ići ću</em>, <em>doći ću</em>."},
    {h:"Negative and question",
     b:"<b>Neću raditi.</b> — I won't work. (full form, normal order)<br><b>Nećemo ići.</b> — We won't go.<br><b>Hoćeš li doći?</b> — Will you come?<br><br><em>Neću</em> is written as one word in modern standard Croatian."},
    {h:"Present tense often does the job",
     b:"For near or scheduled events, Croatians frequently just use the present:<br><em>Sutra <b>idem</b> u Zagreb.</em> — I'm going to Zagreb tomorrow.<br><em>Vlak <b>polazi</b> u pet.</em> — The train leaves at five.<br><br>Perfectly natural, and often more natural than the full future."}
  ],
  vocab:[["sutra","tomorrow"],["prekosutra","day after tomorrow"],["sljedeći tjedan","next week"],
    ["uskoro","soon"],["kasnije","later"],["planirati","to plan"],["putovanje","a trip"],
    ["odmor","holiday"],["ljeto","summer"],["zima","winter"],["proljeće","spring"],["jesen","autumn (f)"],
    ["nadam se","I hope"],["sigurno","definitely"],["obećati","to promise"],["čekati","to wait"],
    ["stići","to arrive"],["krenuti","to set off"]],
  phrases:[["Što ćeš raditi sutra?","What will you do tomorrow?"],["Ići ćemo na more.","We'll go to the seaside."],
    ["Neću ići.","I won't go."],["Vidimo se sljedeći tjedan.","See you next week."],
    ["Nadam se da ćeš doći.","I hope you'll come."],["Sutra idem u Zagreb.","I'm going to Zagreb tomorrow."]],

    {t:"type",q:"Say: We'll go to the seaside.",a:["ići ćemo na more","ici cemo na more","mi ćemo ići na more"],e:"Ići ćemo na more."},
    {t:"mc",q:"'I won't come' =",o:["Ne ću doći","Neću doći","Nisam doći","Ne hoću dolaziti"],a:1,e:"Neću — one word."},
    {t:"type",q:"Ask: Will you come? (informal)",a:["hoćeš li doći","hoces li doci"],e:"Hoćeš li doći?"},

    {t:"type",q:"Say: I'm going to Zagreb tomorrow. (using present)",a:["sutra idem u zagreb","idem sutra u zagreb"],e:"Sutra idem u Zagreb — present is natural for plans."}

{
  id:16, sec:3, title:"Would — the conditional", sub:"Kondicional",
  goal:"Be polite. In shops, cafés and with strangers this is what separates you from sounding blunt.",
  grammar:[
    {h:"bih + the past form",
     b:"<b>bih, bi, bi, bismo, biste, bi</b> + the same <b>-o / -la / -li</b> form as the past tense (radio, radila, radili).<br><br><b>Htio bih</b> / <b>Htjela bih</b> kavu. — I'd like a coffee.<br><b>Volio bih</b> ići u Dubrovnik. — I'd love to go to Dubrovnik.<br><b>Mogli biste</b> mi pomoći? — Could you help me?<br><b>Trebao bih</b> ići. — I should go.<br><br>In speech people often just use <b>bi</b> for every person. It's technically sloppy but extremely common."},
    {h:"Why this matters more than it looks",
     b:"<em>Hoću kavu</em> is grammatical but lands like <em>Give me a coffee</em>.<br><em>Htio bih kavu</em> lands like <em>I'd like a coffee</em>.<br><br>Same information, completely different impression. Use the conditional with anyone you don't know."},
    {h:"If-sentences",
     b:"<b>Kad bih imao novca, kupio bih auto.</b> — If I had money, I'd buy a car.<br><b>Da sam znao, došao bih.</b> — Had I known, I'd have come. (<em>da</em> + the past = 'had I…' — learn it as a pattern.)<br><br>Simple real conditions use <b>ako</b> + present:<br><em>Ako imaš vremena, dođi.</em> — If you have time, come."},
    {h:"Imperative — telling people what to do",
     b:"Built from the present stem:<br><b>Čekaj! / Čekajte!</b> — Wait!<br><b>Dođi! / Dođite!</b> — Come!<br><b>Reci! / Recite!</b> — Say it!<br><b>Idemo!</b> — Let's go!<br><b>Daj!</b> — Give / come on!<br><br>The <b>-te</b> ending is the vi form. Negative: <b>nemoj / nemojte</b> + infinitive — <em>Nemoj ići!</em> Don't go!<br><br>Softening an imperative: add <em>molim te / molim vas</em>."}
  ],
  vocab:[["htio bih","I'd like (m)"],["htjela bih","I'd like (f)"],["volio bih","I'd love to (m)"],
    ["trebao bih","I should (m)"],["mogao bih","I could (m)"],["ako","if"],["kad","when / if"],
    ["da","that / if"],["rezervirati","to book"],["naručiti","to order"],["preporučiti","to recommend"],
    ["probati","to try"],["platiti","to pay"],["pomoći","to help"],["čekati","to wait"],
    ["nemoj","don't (ti)"],["nemojte","don't (vi)"]],
  phrases:[["Htio bih rezervirati stol.","I'd like to book a table. (m)"],

    ["Volio bih probati.","I'd love to try. (m)"],["Trebao bih ići.","I should go. (m)"],
    ["Nemoj se brinuti.","Don't worry."],["Dođite, molim vas.","Come in, please."]],
  drills:[

    {t:"mc",q:"Polite 'Wait!' to a stranger:",o:["Čekaj!","Čekajte!","Čekamo!","Čekati!"],a:1,e:"-te is the vi form."},
    {t:"mc",q:"Which sounds polite in a café?",o:["Hoću kavu.","Daj kavu.","Htio bih kavu.","Kava!"],a:2,e:"The conditional softens it."},
    {t:"type",q:"Say: Don't worry. (informal)",a:["nemoj se brinuti"],e:"Nemoj se brinuti."},
    {t:"mc",q:"'I should go' (male) =",o:["Trebam ići","Trebao bih ići","Trebat ću ići","Trebao sam ići"],a:1,e:"Conditional gives 'should'."}

{
  id:17, sec:3, title:"Perfective and imperfective", sub:"Glagolski vid",
  goal:"The hardest thing in Croatian, and the thing that most marks a fluent speaker. Worth the effort.",
  grammar:[
    {h:"Every verb comes in a pair",
     b:"Croatian verbs are either <b>imperfective</b> (ongoing, repeated, unfinished) or <b>perfective</b> (completed, one-off, with a result).<br><br><table><tr><th>imperfective</th><th>perfective</th><th></th></tr><tr><td class='hr'>čitati</td><td class='hr'>pročitati</td><td>read</td></tr><tr><td class='hr'>pisati</td><td class='hr'>napisati</td><td>write</td></tr><tr><td class='hr'>jesti</td><td class='hr'>pojesti</td><td>eat</td></tr><tr><td class='hr'>kupovati</td><td class='hr'>kupiti</td><td>buy</td></tr><tr><td class='hr'>dolaziti</td><td class='hr'>doći</td><td>come</td></tr><tr><td class='hr'>govoriti</td><td class='hr'>reći</td><td>speak / say</td></tr></table>"},
    {h:"What changes",
     b:"<b>Čitao sam knjigu.</b> — I was reading a book / I used to read. (maybe never finished)<br><b>Pročitao sam knjigu.</b> — I read the book. (finished it)<br><br><b>Jeo sam.</b> — I was eating.<br><b>Pojeo sam.</b> — I ate it all up.<br><br>English needs extra words for this. Croatian builds it into the verb."},
    {h:"The rule that catches everyone",
     b:"<b>Perfective verbs have no present tense meaning.</b> A perfective in present form refers to the <em>future</em>.<br><br><em>Pročitam knjigu</em> does not mean <em>I read a book</em> — it means something like <em>once I've read it</em>, and it only appears after words like <b>kad</b> (when), <b>ako</b> (if) and <b>čim</b> (as soon as): <em>Kad pročitam knjigu…</em> — When I've read the book… (Unit {u33} shows it in action).<br><br>So for <em>I'm reading</em> right now, you must use the imperfective: <b>Čitam.</b>"},
    {h:"How to learn them",
     b:"Don't memorise rules — memorise <b>pairs</b>, the way you'd memorise a plural.<br><br>Common perfective prefixes: <b>po-</b> (pojesti), <b>na-</b> (napisati), <b>pro-</b> (pročitati), <b>s-/z-</b> (skuhati), <b>u-</b> (uraditi), <b>do-</b> (doći), <b>iz-</b> (izaći).<br><br>Rough guide: if you're describing a habit or something in progress, use imperfective. If you're reporting something finished, use perfective."}
  ],
  vocab:[["čitati / pročitati","to read"],["pisati / napisati","to write"],["jesti / pojesti","to eat"],
    ["piti / popiti","to drink"],["kupovati / kupiti","to buy"],["dolaziti / doći","to come"],
    ["odlaziti / otići","to leave"],["gledati / pogledati","to watch"],["učiti / naučiti","to learn"],
    ["raditi / uraditi","to do"],["kuhati / skuhati","to cook"],["govoriti / reći","to speak / say"],
    ["davati / dati","to give"],["otvarati / otvoriti","to open"],["zatvarati / zatvoriti","to close"]],
  phrases:[["Čitao sam cijeli dan.","I was reading all day. (m)"],
    ["Pročitao sam knjigu.","I read the book (finished it). (m)"],
    ["Naučio sam nove riječi.","I learned new words. (m)"],
    ["Svaki dan učim hrvatski.","Every day I study Croatian."],
    ["Popio sam kavu.","I drank the coffee. (m)"]],
  drills:[
    {t:"mc",q:"'I read the whole book' (finished) =",o:["Čitao sam knjigu","Pročitao sam knjigu","Čitam knjigu","Čitat ću knjigu"],a:1,e:"Completed action → perfective pročitati."},
    {t:"mc",q:"'I'm reading right now' =",o:["Pročitam","Čitam","Pročitao sam","Čitat ću"],a:1,e:"Perfectives have no present meaning — use čitam."},
    {t:"mc",q:"Perfective partner of 'pisati':",o:["pisavati","napisati","pišem","pisao"],a:1,e:"napisati"},
    {t:"mc",q:"'Every day I study Croatian' uses which?",o:["perfective","imperfective"],a:1,e:"A repeated habit is imperfective."},
    {t:"type",q:"Say (male): I drank the coffee.",a:["popio sam kavu"],e:"Popio sam kavu — perfective, it's gone."},
    {t:"mc",q:"Why does 'pročitam' not mean 'I read'?",o:["It's misspelled","Perfectives have no present meaning","It's plural","It's a noun"],a:1,e:"A perfective in present form points to the future."}
  ]
},

{
  id:25, sec:3, title:"Verb prefixes", sub:"Prefiksi",
  goal:"Turn one verb into fifteen. This is how Croatian builds most of its vocabulary.",
  grammar:[
    {h:"One root, many meanings",
     b:"Take <b>ići</b> (to go) and watch:<br><b>doći</b> — come · <b>otići</b> — leave · <b>ući</b> — enter · <b>izaći</b> — exit<br><b>proći</b> — pass by · <b>naći</b> — find · <b>poći</b> — set off · <b>obići</b> — go around<br><b>prijeći</b> — cross · <b>sići</b> — get down · <b>ući</b> — go in<br><br>Same with <b>pisati</b>: napisati (write down), potpisati (sign), prepisati (copy), opisati (describe), zapisati (note down), ispisati (print out)."},
    {h:"You need these — the everyday ones",
     b:"These aren't fancy — they're some of the most common words in the language. Learn them as pairs, ongoing / done (Unit {u17}):<table><tr><th>meaning</th><th>ongoing</th><th>done / once</th></tr><tr><td class='cs'>come</td><td class='hr'>dolaziti</td><td class='hr'>doći</td></tr><tr><td class='cs'>leave</td><td class='hr'>odlaziti</td><td class='hr'>otići</td></tr><tr><td class='cs'>go in</td><td class='hr'>ulaziti</td><td class='hr'>ući</td></tr><tr><td class='cs'>go out</td><td class='hr'>izlaziti</td><td class='hr'>izaći</td></tr><tr><td class='cs'>go past</td><td class='hr'>prolaziti</td><td class='hr'>proći</td></tr><tr><td class='cs'>find</td><td class='hr'>nalaziti</td><td class='hr'>naći</td></tr><tr><td class='cs'>bring</td><td class='hr'>donositi</td><td class='hr'>donijeti</td></tr><tr><td class='cs'>take away</td><td class='hr'>odnositi</td><td class='hr'>odnijeti</td></tr><tr><td class='cs'>call (phone)</td><td class='hr'>zvati</td><td class='hr'>nazvati</td></tr><tr><td class='cs'>drink (up)</td><td class='hr'>piti</td><td class='hr'>popiti</td></tr><tr><td class='cs'>eat (up)</td><td class='hr'>jesti</td><td class='hr'>pojesti</td></tr><tr><td class='cs'>make / do</td><td class='hr'>raditi</td><td class='hr'>napraviti</td></tr><tr><td class='cs'>cook</td><td class='hr'>kuhati</td><td class='hr'>skuhati</td></tr><tr><td class='cs'>wash</td><td class='hr'>prati</td><td class='hr'>oprati</td></tr></table><b>Dođi ovamo!</b> — Come here! · <b>Uđite!</b> — Come in!<br><b>Izlazimo večeras?</b> — Are we going out tonight?<br><b>Donesi vodu.</b> — Bring some water. · <b>Nazovi Anu.</b> — Call Ana.<br><b>Popio sam kavu.</b> — I drank my coffee."},
    {h:"What each prefix tends to mean",
     b:"<b>do-</b> arrival, up to · <b>od-</b> away from · <b>u-</b> into · <b>iz-</b> out of<br><b>pre-</b> across, over, re- · <b>pro-</b> through, past · <b>za-</b> begin, behind<br><b>na-</b> onto, a quantity of · <b>po-</b> a bit, completion · <b>s-/z-</b> together, down<br><b>raz-</b> apart · <b>ob-/o-</b> around · <b>pri-</b> near, adding<br><br>These are tendencies, not rules. But once you know them, you can often guess a new verb."},
    {h:"Prefixes usually make a verb perfective",
     b:"Adding a prefix to an imperfective verb generally makes it perfective:<br>pisati (impf) → napisati (pf)<br>čitati (impf) → pročitati (pf)<br>jesti (impf) → pojesti (pf)<br><br>To get an imperfective back, Croatian adds a suffix:<br>napisati → napisivati · doći → dolaziti · otići → odlaziti"},
    {h:"Learn them as families",
     b:"When you meet a new verb, look for the root you already know. <em>Prevesti</em> looks new until you see <b>pre-</b> (across) + <b>voditi</b> (lead) = translate, lead across.<br><br><em>Razumjeti</em> = <b>raz-</b> (apart) + <b>umjeti</b> (to know how) = to take apart and know = understand.<br><br>This is why Croatian vocabulary accelerates: after a few hundred words you start guessing correctly."}
  ],
  vocab:[["doći","to come"],["otići","to leave"],["ući","to enter"],["izaći","to go out"],
    ["proći","to pass"],["naći","to find"],["prijeći","to cross"],["napisati","to write down"],
    ["potpisati","to sign"],["opisati","to describe"],["prevesti","to translate"],

  phrases:[["Dođi ovamo!","Come here!"],["Sutra odlazim.","I'm leaving tomorrow."],
    ["Možeš li to prevesti?","Can you translate that?"],["Nastavimo sutra.","Let's continue tomorrow."],
    ["Ne mogu naći ključeve.","I can't find the keys."]],
