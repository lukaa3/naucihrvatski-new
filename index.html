<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nauči hrvatski</title>
<script type="module">
  import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
  window.__sbCreate = createClient;
  window.dispatchEvent(new Event("sb-ready"));
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;0,700;0,800;1,400;1,700&family=Karla:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap&subset=latin,latin-ext" rel="stylesheet">
<style>
:root{
  --deep:#08152F;
  --deep-2:#102344;
  --deep-3:#193561;
  --stone:#EAF0FA;
  --stone-dim:#93A6C4;
  --dim:#93A6C4;
  --olive:#3FB98A;
  --madder:#E0362F;
  --brass:#6BA6FF;
  --line:rgba(234,240,250,.13);
  --line-2:rgba(234,240,250,.24);
  --display:'Alegreya', Georgia, 'Times New Roman', serif;
  --body:'Karla', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --mono:'Space Mono', ui-monospace, Menlo, monospace;
  --r:14px;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--deep);
  color:var(--stone);
  font-family:var(--body);
  font-size:16px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(900px 500px at 82% -8%, rgba(107,166,255,.13), transparent 60%),
    radial-gradient(700px 600px at 6% 104%, rgba(224,54,47,.08), transparent 62%);
}
h1,h2,h3,h4{font-family:var(--display);font-weight:800;line-height:1.15;margin:0;letter-spacing:-.01em}
p{margin:0 0 .8em}
a{color:var(--brass)}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
input,textarea,select{font-family:inherit;font-size:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px;border-radius:6px}

/* ---------- shell ---------- */
.shell{position:relative;z-index:1;display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh;max-width:1240px;margin:0 auto}

.rail{
  border-right:1px solid var(--line);
  padding:26px 18px 40px;
  position:sticky;top:0;height:100vh;overflow-y:auto;
  display:flex;flex-direction:column;gap:22px;
}
.brand{display:block;text-decoration:none;color:inherit}
.brand .mark{font-family:var(--display);font-size:30px;font-weight:800;letter-spacing:-.02em}
.brand .mark em{font-style:italic;color:var(--brass)}
.brand .tag{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--stone-dim);margin-top:2px}

.nav{display:flex;flex-direction:column;gap:2px}
.nav button{
  display:flex;align-items:baseline;gap:9px;width:100%;text-align:left;
  background:none;border:0;border-radius:10px;padding:9px 11px;
  color:var(--stone-dim);transition:background .15s,color .15s;
}
.nav button .hr{font-family:var(--display);font-size:17px;font-weight:700;color:inherit}
.nav button .en{font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.6}
.nav button:hover{background:rgba(107,166,255,.10);color:var(--stone)}
.nav button[aria-current="true"]{background:var(--deep-2);color:var(--stone)}
.nav button[aria-current="true"] .hr{color:var(--brass)}

.rail-foot{margin-top:auto;font-size:12px;color:var(--stone-dim);line-height:1.5}
.stat-row{display:flex;gap:14px;margin-bottom:12px}
.stat{flex:1}
.stat b{display:block;font-family:var(--mono);font-size:19px;color:var(--brass);font-weight:700}
.stat span{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--stone-dim)}

.main{padding:30px 34px 90px;min-width:0}

/* ---------- pleter (signature) ---------- */
.board{width:100%;height:20px;display:block;border-radius:3px;overflow:hidden}
.board rect{transition:fill .35s}

/* ---------- page head ---------- */
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--brass);margin-bottom:8px}
.page-h{font-size:clamp(30px,4.4vw,44px);margin-bottom:6px}
.page-h i{color:var(--brass);font-style:italic}
.lede{color:var(--stone-dim);max-width:60ch;margin-bottom:24px}

/* ---------- cards ---------- */
.card{background:var(--deep-2);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.card + .card{margin-top:14px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}

.kicker{font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--stone-dim);margin-bottom:10px}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;gap:8px;justify-content:center;
  background:var(--madder);border:1px solid var(--madder);color:#fff;
  padding:10px 18px;border-radius:999px;font-weight:600;font-size:15px;
  transition:transform .12s, filter .15s;
}
.btn:hover{filter:brightness(1.1)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;border-color:var(--line-2);color:var(--stone)}
.btn.ghost:hover{background:rgba(107,166,255,.12)}
.btn.brass{background:var(--brass);border-color:var(--brass);color:#05132B}
.btn.sm{padding:6px 13px;font-size:13.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}

.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{
  background:transparent;border:1px solid var(--line-2);color:var(--stone-dim);
  padding:5px 12px;border-radius:999px;font-size:13.5px;transition:.15s;
  line-height:1.25;text-align:center;
}
.c2{display:block;font-size:10px;opacity:.62;font-style:italic;letter-spacing:.01em;margin-top:1px}
.btn .c2{opacity:.75;font-size:10px}
.chip:hover{color:var(--stone);border-color:var(--stone-dim)}
.chip[aria-pressed="true"]{background:var(--brass);border-color:var(--brass);color:#05132B;font-weight:600}

/* ---------- word rows ---------- */
.wordlist{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.word{display:flex;align-items:center;gap:12px;background:var(--deep-2);padding:9px 13px}
.word .hr{font-family:var(--display);font-size:19px;font-weight:700;min-width:150px}
.word .en{color:var(--stone-dim);flex:1;font-size:14.5px}
.word .note{font-size:12px;color:var(--brass);opacity:.85;font-style:italic}
.spk{background:none;border:0;color:var(--stone-dim);padding:3px 5px;border-radius:6px;line-height:1}
.spk:hover{color:var(--brass);background:rgba(107,166,255,.14)}
.save{background:none;border:0;color:var(--stone-dim);padding:3px 5px;font-size:13px}
.save:hover{color:var(--brass)}
.save[aria-pressed="true"]{color:var(--brass)}

/* ---------- tables ---------- */
table{width:100%;border-collapse:collapse;font-size:14.5px}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line)}
th{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--stone-dim);font-weight:600}
td.hr{font-family:var(--display);font-size:17px;font-weight:600}
td.cs{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--brass);white-space:nowrap}
.tblwrap{overflow-x:auto}

/* ---------- unit list ---------- */
.unit{
  display:flex;align-items:center;gap:16px;width:100%;text-align:left;
  background:var(--deep-2);border:1px solid var(--line);border-radius:var(--r);
  padding:15px 18px;margin-bottom:9px;transition:.15s;
}
.unit:hover{border-color:var(--line-2);transform:translateX(3px)}
.unit .ord{
  font-family:var(--display);font-style:italic;font-size:14px;color:var(--brass);
  min-width:62px;border-right:1px solid var(--line);padding-right:12px;line-height:1.2;
}
.unit .ord b{display:block;font-style:normal;font-family:var(--mono);font-size:20px;font-weight:700}
.unit .body{flex:1;min-width:0}
.unit .t{font-family:var(--display);font-size:21px;font-weight:700}
.unit .s{font-size:13px;color:var(--stone-dim)}
.unit .tick{color:var(--olive);font-size:19px}

/* ---------- chat ---------- */
.chat{display:flex;flex-direction:column;gap:12px;min-height:280px;max-height:56vh;overflow-y:auto;padding-right:4px}
.msg{max-width:88%;padding:12px 15px;border-radius:14px;font-size:15.5px}
.msg.bot{background:var(--deep-3);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px}
.msg.me{background:rgba(224,54,47,.18);border:1px solid rgba(224,54,47,.45);align-self:flex-end;border-bottom-right-radius:4px}
.msg .cro{font-family:var(--display);font-size:18px;line-height:1.45}
.msg .tr{font-size:13.5px;color:var(--stone-dim);margin-top:5px;font-style:italic}
.fix{margin-top:9px;padding:9px 11px;border-left:3px solid var(--olive);background:rgba(63,185,138,.12);border-radius:0 8px 8px 0;font-size:13.5px}
.fix b{color:var(--olive)}
.composer{display:flex;gap:9px;margin-top:14px}
.composer input{
  flex:1;background:var(--deep);border:1px solid var(--line-2);color:var(--stone);
  padding:12px 15px;border-radius:999px;font-size:16px;
}
.composer input::placeholder{color:var(--stone-dim);opacity:.65}
.hintbar{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.hintbar button{background:rgba(107,166,255,.13);border:1px solid rgba(107,166,255,.35);color:var(--brass);padding:4px 11px;border-radius:999px;font-size:13px}
.hintbar button:hover{background:rgba(107,166,255,.24)}

/* ---------- quiz ---------- */
.q{font-family:var(--display);font-size:23px;font-weight:700;margin-bottom:14px;line-height:1.35}
.opts{display:grid;gap:8px}
.opt{
  text-align:left;background:var(--deep);border:1px solid var(--line-2);color:var(--stone);
  padding:12px 16px;border-radius:11px;font-size:16px;transition:.13s;
}
.opt:hover:not(:disabled){border-color:var(--brass)}
.opt.right{border-color:var(--olive);background:rgba(63,185,138,.18)}
.opt.wrong{border-color:var(--madder);background:rgba(224,54,47,.16)}
.answer{
  width:100%;background:var(--deep);border:1px solid var(--line-2);color:var(--stone);
  padding:12px 16px;border-radius:11px;font-size:18px;font-family:var(--display);
}
.verdict{margin-top:13px;padding:12px 14px;border-radius:10px;font-size:14.5px}
.verdict.ok{background:rgba(63,185,138,.14);border:1px solid rgba(63,185,138,.42)}
.verdict.no{background:rgba(224,54,47,.13);border:1px solid rgba(224,54,47,.42)}
.progressline{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin-bottom:20px}
.progressline i{display:block;height:100%;background:var(--brass);transition:width .3s}

/* ---------- reading ---------- */
.read{font-family:var(--display);font-size:20px;line-height:1.75;max-width:62ch}
.read w{cursor:pointer;border-bottom:1px dotted rgba(107,166,255,.45)}
.read w:hover{color:var(--brass);background:rgba(107,166,255,.12)}
.gloss{
  position:fixed;background:var(--deep-3);border:1px solid var(--brass);border-radius:9px;
  padding:8px 12px;font-family:var(--body);font-size:14px;z-index:60;pointer-events:none;
  box-shadow:0 8px 26px rgba(0,0,0,.5);max-width:250px;
}
.gloss b{font-family:var(--display);font-size:16px;color:var(--brass);display:block}

/* ---------- flashcard ---------- */
.flash{
  background:var(--deep-2);border:1px solid var(--line-2);border-radius:18px;
  padding:46px 26px;text-align:center;min-height:190px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
}
.flash .front{font-family:var(--display);font-size:40px;font-weight:800;line-height:1.1}
.flash .back{font-size:19px;color:var(--stone-dim)}

/* ---------- misc ---------- */
.note{font-size:13.5px;color:var(--stone-dim);background:rgba(107,166,255,.07);border-left:2px solid var(--brass);padding:10px 13px;border-radius:0 8px 8px 0;margin:10px 0}
.note b{color:var(--brass)}
.pill{display:inline-block;font-family:var(--mono);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;padding:3px 9px;border:1px solid var(--line-2);border-radius:999px;color:var(--stone-dim)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(237,231,218,.25);border-top-color:var(--brass);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.err{background:rgba(224,54,47,.13);border:1px solid rgba(224,54,47,.48);border-radius:10px;padding:12px 15px;font-size:14px;margin-top:12px}
.hidden{display:none !important}
hr.rule{border:0;border-top:1px solid var(--line);margin:22px 0}


/* ---------- invite banner ---------- */
.invite{position:fixed;left:0;right:0;bottom:0;z-index:10000;background:var(--deep-3);border-top:1px solid var(--brass);padding:14px 18px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;box-shadow:0 -8px 30px rgba(0,0,0,.5)}
.invite p{margin:0;flex:1;min-width:200px;font-size:14px}

/* ---------- chat list ---------- */
.chatlist{display:grid;gap:6px;max-height:260px;overflow-y:auto}
.chatrow{display:flex;align-items:center;gap:8px;background:var(--deep);border:1px solid var(--line);border-radius:11px;padding:9px 12px;cursor:pointer;transition:.13s}
.chatrow:hover{border-color:var(--line-2)}
.chatrow.on{border-color:var(--brass);background:rgba(107,166,255,.10)}
.cmeta{flex:1;min-width:0}
.ct{font-family:var(--display);font-size:16.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cs2{font-size:11px;letter-spacing:.04em;color:var(--stone-dim);text-transform:uppercase}
.cprev{font-size:12.5px;color:var(--stone-dim);opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.crn,.cdel{background:none;border:0;color:var(--stone-dim);padding:3px 6px;border-radius:6px;font-size:15px;line-height:1;flex:none}
.crn:hover{color:var(--brass)}
.cdel:hover{color:var(--madder)}
.cdel.armed{color:var(--madder);border:1px solid var(--madder);font-size:11.5px;padding:3px 8px}

/* ---------- settings modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(4,10,24,.76);backdrop-filter:blur(3px);z-index:80;display:flex;align-items:center;justify-content:center;padding:18px}
.modal{background:var(--deep-2);border:1px solid var(--line-2);border-radius:18px;max-width:520px;width:100%;max-height:88vh;overflow-y:auto;padding:26px;box-shadow:0 24px 70px rgba(0,0,0,.6)}
.modal h2{font-size:26px;margin-bottom:4px}
.field{width:100%;background:var(--deep);border:1px solid var(--line-2);color:var(--stone);padding:11px 14px;border-radius:11px;font-family:var(--mono);font-size:13px}
.field:focus{border-color:var(--brass)}
select.field{font-family:var(--body);font-size:15px}
.gear{background:none;border:1px solid var(--line);color:var(--stone-dim);border-radius:9px;padding:5px 11px;font-size:12.5px;margin-top:10px}
.gear:hover{color:var(--brass);border-color:var(--brass)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:1px}
.view{animation:fade .28s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}

/* ---------- mobile ---------- */
@media (max-width:820px){
  .shell{grid-template-columns:1fr}
  .rail{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:18px 16px}
  .nav{flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:4px}
  .nav button{flex-direction:column;gap:0;align-items:center;white-space:nowrap;padding:7px 12px}
  .nav button .en{display:none}
  .rail-foot{margin-top:0}
  .main{padding:22px 16px 70px}
  .word .hr{min-width:110px;font-size:17px}
  .msg{max-width:95%}
}
</style>
</head>
<body>
<div class="shell">
  <aside class="rail">
    <a class="brand" href="#" onclick="go('home');return false">
      <div class="mark">Nauči <em>hrvatski</em></div>
      <div class="tag">learn croatian &nbsp;·&nbsp; every day</div>
    </a>

    <button class="gear" onclick="openSettings()"><span class="dot" id="dot"></span><span id="gearlbl">Settings</span></button>
    <div id="cloudbadge" style="font-size:11.5px;color:var(--olive);letter-spacing:.04em"></div>

    <nav class="nav" id="nav"></nav>

    <div class="rail-foot">
      <div class="stat-row">
        <div class="stat"><b id="s-xp">0</b><span>points</span></div>
        <div class="stat"><b id="s-streak">0</b><span>day streak</span></div>
        <div class="stat"><b id="s-words">0</b><span>words</span></div>
      </div>
      <svg class="board" viewBox="0 0 240 20" preserveAspectRatio="none" aria-hidden="true" id="board"></svg>
      <div style="margin-top:8px" id="pl-label">Your checkerboard fills as you learn.</div>
    </div>
  </aside>

  <main class="main" id="main"></main>
</div>
<div id="gloss" class="gloss hidden"></div>
<div id="settings" class="hidden"></div>
<div id="authbox" class="hidden"></div>
<script>
/* ============================================================
   NAUČI HRVATSKI — hrvatski
   Standard Croatian only: ijekavian, Croatian lexicon.
   ============================================================ */

const VERSION = "6.0";

/* ============================================================
   CONFIG — fill these in after creating your Supabase project.
   Both values are safe to publish: the anon key only ever grants
   what your row-level-security rules allow.

const SUPABASE_URL = "PASTE_YOUR_PROJECT_URL_HERE";
const SUPABASE_ANON_KEY = "PASTE_YOUR_ANON_KEY_HERE";
const SB_READY = () => SUPABASE_URL.indexOf("http") === 0 && SUPABASE_ANON_KEY.length > 20;
const SECTIONS = [
  {id:1, name:"First steps",      hr:"Prvi koraci",    color:"#6BA6FF"},
  {id:2, name:"The cases",        hr:"Padeži",         color:"#E0362F"},
  {id:3, name:"Tenses",           hr:"Vremena",        color:"#3FB98A"},
  {id:4, name:"Words that change",hr:"Promjene riječi",color:"#C58AF0"},
  {id:5, name:"Sounding native",  hr:"Kao domaći",     color:"#F0A93B"}
];

const UNITS = [
/* ============ SECTION 1 — FIRST STEPS ============ */
{
  id:1, sec:1, title:"Sounds and spelling", sub:"Abeceda i izgovor",
  goal:"Read any Croatian word aloud correctly — the alphabet is fully phonetic, so this is a one-time cost.",
  grammar:[
    {h:"Thirty letters, zero exceptions",
     b:"Every letter has exactly one sound, always. No silent letters, no <em>ough</em> problems. Learn the letters once and you can pronounce any word you ever see.<br><br><b>The five that don't look like English:</b><br><b>c</b> = ts (ca<em>ts</em>) — <em>cesta</em> is TSES-ta<br><b>j</b> = y (<em>y</em>es) — <em>ja</em> is YAH<br><b>š</b> = sh · <b>ž</b> = the s in mea<em>s</em>ure · <b>h</b> = raspy, like Ba<em>ch</em><br><br><b>č vs ć:</b> č is hard (chur<em>ch</em>), ć is soft and lighter. Croatians hear the difference; foreigners mostly don't at first, and mixing them up won't stop you being understood.<br><br><b>Dž, Lj, Nj are single letters</b> — dž like <em>j</em>udge, lj like mi<em>lli</em>on, nj like ca<em>ny</em>on."},
    {h:"R can be a whole syllable",
     b:"Croatian lets <b>r</b> act as a vowel. That's how you get words that look impossible:<br><b>prst</b> (finger) · <b>vrt</b> (garden) · <b>krv</b> (blood) · <b>trg</b> (square) · <b>Hrvatska</b> (Croatia)<br><br>Roll the r and treat it as the vowel. <em>Hrvatska</em> is HUR-vat-ska."},
    {h:"Stress never lands on the last syllable",
     b:"In a word of two or more syllables, the stress is never final. <em>HVA-la</em>, <em>DO-bar dan</em>, <em>Za-GREB</em> → actually <em>ZA-greb</em>.<br><br>Croatian also has pitch accents — rising and falling tones. Native speakers use four. You do not need them to be understood, and chasing them early wastes time. Get the syllable right and move on."}
  ],
  vocab:[["abeceda","alphabet"],["slovo","letter"],["riječ","word"],["glas","sound / voice"],
    ["izgovor","pronunciation"],["kako","how"],["polako","slowly"],["ponovno","again"],
    ["hvala","thank you"],["molim","please / you're welcome"],["da","yes"],["ne","no"]],
  phrases:[["Kako se to izgovara?","How is that pronounced?"],
    ["Možete li ponoviti?","Could you repeat that?"],
    ["Govorite polako, molim vas.","Speak slowly, please."],
    ["Ne razumijem.","I don't understand."]],
  drills:[
    {t:"mc",q:"How is 'cesta' pronounced?",o:["KES-ta","TSES-ta","CHES-ta","SES-ta"],a:1,e:"Croatian c is always ts."},
    {t:"mc",q:"How is 'ja' pronounced?",o:["JAH","YAH","ZHAH","HAH"],a:1,e:"j is always y, as in yes."},
    {t:"mc",q:"Which is a single letter in Croatian?",o:["st","nj","kr","pl"],a:1,e:"Dž, Lj and Nj are each one letter."},
    {t:"mc",q:"'Hrvatska' has how many vowel sounds?",o:["Two — a, a","Three — the r acts as one","One","Four"],a:1,e:"r works as a syllable: HUR-vat-ska."},
    {t:"mc",q:"Where does stress never fall?",o:["First syllable","Middle syllable","Last syllable","It's random"],a:2,e:"Never on the final syllable of a multi-syllable word."},

{
  id:2, sec:1, title:"Hello and who you are", sub:"Pozdravi i predstavljanje",
  goal:"Greet anyone, give your name, and handle the formal/informal split that runs through the whole language.",
  grammar:[
    {h:"ti or vi — decide before you open your mouth",
     b:"<b>ti</b> = one person you know: friends, classmates, family, anyone your age.<br><b>vi</b> = a stranger, an older person, a teacher, a waiter, a shop assistant. Also any group.<br><br>Kako <b>si</b>? (ti) · Kako <b>ste</b>? (vi)<br>Kako se <b>zoveš</b>? (ti) · Kako se <b>zovete</b>? (vi)<br><br>With an adult you don't know: <b>vi</b>. Croatians will often say <em>možemo na ti</em> — we can switch to ti — when they want to drop it."},
    {h:"Greetings by time of day",
     b:"<b>Bok</b> — hi AND bye, informal, the one you'll use most<br><b>Dobro jutro</b> — until about 10am<br><b>Dobar dan</b> — the safe neutral one, all day<br><b>Dobra večer</b> — evening<br><b>Laku noć</b> — only when someone is going to bed<br><b>Doviđenja</b> — polite goodbye · <b>Vidimo se</b> — see you<br><br><em>Bok</em> to a stranger in a shop is slightly casual but fine. <em>Dobar dan</em> is never wrong."},
    {h:"Saying your name",
     b:"The verb is <b>zvati se</b>, and the <b>se</b> is part of it — you can't drop it.<br><b>Zovem se</b> Ana. — My name is Ana.<br><b>Kako se zoveš?</b> — What's your name?<br><br>Or simply: <b>Ja sam</b> Marko. And on meeting: <b>Drago mi je.</b> — Nice to meet you."}
  ],
  vocab:[["bok","hi / bye (informal)"],["dobro jutro","good morning"],["dobar dan","good day"],
    ["dobra večer","good evening"],["laku noć","good night"],["doviđenja","goodbye"],
    ["vidimo se","see you"],["oprostite","excuse me / sorry (vi)"],["oprosti","sorry (ti)"],
    ["gospodin","Mr / sir"],["gospođa","Mrs / ma'am"],["ime","name"],["prezime","surname"],
    ["nema na čemu","you're welcome"],["ništa","nothing"],["dobro","good / well"],["loše","bad"]],
  phrases:[["Kako se zoveš?","What's your name? (ti)"],
    ["Zovem se…","My name is…"],["Drago mi je.","Nice to meet you."],
    ["Kako si?","How are you? (ti)"],["Kako ste?","How are you? (vi)"],
    ["Dobro sam, hvala. A ti?","I'm well, thanks. And you?"],
    ["Odakle si?","Where are you from?"],["Ja sam iz Amerike.","I'm from America."],
    ["Govorim malo hrvatski.","I speak a little Croatian."]],
  drills:[
    {t:"mc",q:"You greet your teacher. Which is right?",o:["Kako si?","Kako ste?","Kako je?","Kako sam?"],a:1,e:"A teacher gets vi: Kako ste?"},
    {t:"type",q:"Say: My name is Marko.",a:["zovem se marko","ja se zovem marko"],e:"Zovem se Marko — the se can't be dropped."},
    {t:"mc",q:"It's 9am in a bakery. What do you say?",o:["Laku noć","Dobro jutro","Vidimo se","Dobra večer"],a:1,e:"Dobro jutro — morning, and polite enough for a stranger."},
    {t:"type",q:"Say: Nice to meet you.",a:["drago mi je"],e:"Drago mi je."},

    {t:"type",q:"Ask a friend where they're from.",a:["odakle si"],e:"Odakle si?"}

},
{
  id:3, sec:1, title:"Biti — am, are, is", sub:"Glagol biti",
  goal:"Build real sentences, ask yes-no questions, and say what things are not.",
  grammar:[
    {h:"The pronouns, and why you'll drop them",
     b:"<b>ja</b> I · <b>ti</b> you · <b>on</b> he · <b>ona</b> she · <b>ono</b> it<br><b>mi</b> we · <b>vi</b> you (pl/formal) · <b>oni</b> they (m/mixed) · <b>one</b> they (f)<br><br>The verb ending already says who, so the pronoun is optional and usually left out. <em>Umoran sam</em> is normal; <em>Ja sam umoran</em> adds emphasis — <em>I'm</em> tired, as opposed to you."},
    {h:"Two present tenses of biti",
     b:"<b>Short:</b> sam, si, je, smo, ste, su — the everyday form. It <b>can never start a sentence</b>.<br><b>Long:</b> jesam, jesi, jest, jesmo, jeste, jesu — starts questions, gives emphatic answers.<br><br>Ana <b>je</b> ovdje. · <b>Jesi</b> li umoran? — <b>Jesam</b>.<br><br><b>Negative:</b> nisam, nisi, nije, nismo, niste, nisu — one word, never <em>ne sam</em>."},
    {h:"Asking yes-no questions",
     b:"Two ways, both using the little word <b>li</b>, which always sits second:<br><b>Jesi li</b> ti student? — Are you a student?<br><b>Je li</b> ovo kava? — Is this coffee? (often heard as <em>jel'</em>)<br><br>Or just raise your intonation: <em>Ti si student?</em> Common in speech."},
    {h:"Adjectives change with the speaker",
     b:"Because the adjective describes <em>you</em>, it takes your gender:<br>Umoran sam (m) / Umorna sam (f) — I'm tired<br>Gladan sam / Gladna sam — I'm hungry<br>Sretan sam / Sretna sam — I'm happy<br><br>Learn your own form now; you'll say these constantly."}
  ],
  vocab:[["student / studentica","student m/f"],["učenik / učenica","pupil m/f"],
    ["prijatelj / prijateljica","friend m/f"],["umoran / umorna","tired"],["gladan / gladna","hungry"],
    ["žedan / žedna","thirsty"],["sretan / sretna","happy"],["tužan / tužna","sad"],
    ["bolestan / bolesna","ill"],["ovdje","here"],["tamo","there"],["ovo","this"],["to","that"],
    ["sada","now"],["danas","today"],["jako","very"],["malo","a little"]],
  phrases:[["Ja sam Amerikanac / Amerikanka.","I'm American m/f."],
    ["Nisam odavde.","I'm not from around here."],["Jesi li ti student?","Are you a student?"],
    ["Je li ovo tvoje?","Is this yours?"],["Ona nije kod kuće.","She isn't at home."],
    ["Mi smo prijatelji.","We are friends."],["Jako sam umoran.","I'm very tired. (m)"]],
  drills:[
    {t:"type",q:"Say (male speaker): I am tired.",a:["umoran sam","ja sam umoran"],e:"Umoran sam."},
    {t:"mc",q:"Which sentence is correct?",o:["Sam student.","Ja sam student.","Student sam ja jesam.","Je sam student."],a:1,e:"The short form sam can never open a sentence."},
    {t:"type",q:"Say: I'm not from Zagreb.",a:["nisam iz zagreba"],e:"Nisam iz Zagreba — negation is one word."},
    {t:"mc",q:"Complete: ___ li ti gladan?",o:["Je","Jesi","Si","Nisi"],a:1,e:"Second person: jesi, plus li."},
    {t:"mc",q:"A woman says she's hungry:",o:["Gladan sam","Gladna sam","Gladno sam","Gladni sam"],a:1,e:"Feminine adjectives take -a."},
    {t:"type",q:"Say: We are friends.",a:["mi smo prijatelji","smo prijatelji"],e:"Mi smo prijatelji."}
  ]
},
{
  id:4, sec:1, title:"Gender and plurals", sub:"Rod i množina",
  goal:"Tell m/f/n apart at a glance — everything in the case system depends on this.",
  grammar:[
    {h:"You can usually see the gender",
     b:"<b>Muški (m)</b> — ends in a consonant: <em>grad, stol, prijatelj</em><br><b>Ženski (f)</b> — ends in <b>-a</b>: <em>žena, knjiga, kava</em><br><b>Srednji (n)</b> — ends in <b>-o</b> or <b>-e</b>: <em>more, selo, pivo</em><br><br><b>The exceptions worth memorising:</b> <b>noć, stvar, ljubav, riječ, večer, sol, krv, misao</b> end in consonants but are <b>feminine</b>. Mostly abstract nouns."},
    {h:"Plurals",
     b:"<b>m → -i</b> · <b>f → -e</b> · <b>n → -a</b><br>stol → stolovi · žena → žene · selo → sela<br><br>One-syllable masculine nouns insert <b>-ov-</b> first: grad → grad<b>ov</b>i, stol → stol<b>ov</b>i. After soft consonants (č ć š ž đ j lj nj) it's <b>-ev-</b>: muž → muž<b>ev</b>i, kralj → kralj<b>ev</b>i."},
    {h:"Irregular plurals you'll meet immediately",
     b:"<b>čovjek → ljudi</b> (person → people)<br><b>dijete → djeca</b> (child → children; djeca behaves as feminine singular!)<br><b>brat → braća</b> · <b>vrata</b> is always plural (door)<br><b>oko → oči</b> (eye) · <b>uho → uši</b> (ear)"},
    {h:"There are no articles",
     b:"No <em>a</em>, no <em>the</em>. <em>Imam knjigu</em> means both <em>I have a book</em> and <em>I have the book</em>. Don't try to translate <em>the</em> — there's nothing to translate it into."}
  ],
  vocab:[["grad","city"],["selo","village"],["kuća","house"],["stan","flat"],["soba","room"],
    ["stol","table"],["stolica","chair"],["prozor","window"],["vrata","door (pl only)"],
    ["knjiga","book"],["more","sea"],["otok","island"],["planina","mountain"],["rijeka","river"],
    ["pas","dog"],["mačka","cat"],["dijete","child (pl djeca)"],["čovjek","person (pl ljudi)"],
    ["noć","night (f)"],["stvar","thing (f)"],["riječ","word (f)"]],
  phrases:[["Ovo je velika kuća.","This is a big house."],["Gradovi su lijepi.","The cities are beautiful."],
    ["Hrvatska ima tisuću otoka.","Croatia has a thousand islands."],["Imam dva psa.","I have two dogs."],
    ["Djeca su u školi.","The children are at school."]],
  drills:[
    {t:"mc",q:"What gender is 'noć'?",o:["masculine","feminine","neuter"],a:1,e:"Feminine, despite the consonant ending."},
    {t:"type",q:"Plural of 'knjiga':",a:["knjige"],e:"knjige"},
    {t:"type",q:"Plural of 'grad':",a:["gradovi"],e:"gradovi — one-syllable masculine inserts -ov-."},
    {t:"mc",q:"Plural of 'čovjek':",o:["čovjeci","čovjekovi","ljudi","čovjeke"],a:2,e:"Fully irregular: ljudi."},
    {t:"mc",q:"Which is correct?",o:["veliko more","velika more","veliki more","velik more"],a:0,e:"more is neuter → veliko."},
    {t:"type",q:"Plural of 'selo':",a:["sela"],e:"sela — neuter takes -a."}
  ]
},
{
  id:5, sec:1, title:"Present tense", sub:"Prezent",
  goal:"Conjugate any regular verb plus the handful of irregulars you'll use hourly.",
  grammar:[
    {h:"Three patterns, one system",
     b:"Look at the <em>ja</em> form. It ends <b>-am</b>, <b>-im</b>, or <b>-em</b>, and that decides everything else.<table><tr><th></th><th>-am imati</th><th>-im raditi</th><th>-em pisati</th></tr><tr><td class='cs'>ja</td><td class='hr'>imam</td><td class='hr'>radim</td><td class='hr'>pišem</td></tr><tr><td class='cs'>ti</td><td class='hr'>imaš</td><td class='hr'>radiš</td><td class='hr'>pišeš</td></tr><tr><td class='cs'>on/ona</td><td class='hr'>ima</td><td class='hr'>radi</td><td class='hr'>piše</td></tr><tr><td class='cs'>mi</td><td class='hr'>imamo</td><td class='hr'>radimo</td><td class='hr'>pišemo</td></tr><tr><td class='cs'>vi</td><td class='hr'>imate</td><td class='hr'>radite</td><td class='hr'>pišete</td></tr><tr><td class='cs'>oni</td><td class='hr'>imaju</td><td class='hr'>rade</td><td class='hr'>pišu</td></tr></table>After the first letter the endings are identical: -m, -š, —, -mo, -te, then -ju / -e / -u."},
    {h:"The irregulars",
     b:"<table><tr><th></th><th>ići go</th><th>moći can</th><th>htjeti want</th></tr><tr><td class='cs'>ja</td><td class='hr'>idem</td><td class='hr'>mogu</td><td class='hr'>hoću</td></tr><tr><td class='cs'>ti</td><td class='hr'>ideš</td><td class='hr'>možeš</td><td class='hr'>hoćeš</td></tr><tr><td class='cs'>on</td><td class='hr'>ide</td><td class='hr'>može</td><td class='hr'>hoće</td></tr><tr><td class='cs'>mi</td><td class='hr'>idemo</td><td class='hr'>možemo</td><td class='hr'>hoćemo</td></tr><tr><td class='cs'>vi</td><td class='hr'>idete</td><td class='hr'>možete</td><td class='hr'>hoćete</td></tr><tr><td class='cs'>oni</td><td class='hr'>idu</td><td class='hr'>mogu</td><td class='hr'>hoće</td></tr></table>Also: <b>jesti</b> → jedem · <b>piti</b> → pijem · <b>spavati</b> → spavam · <b>vidjeti</b> → vidim"},
    {h:"There's no 'I am doing'",
     b:"Croatian has one present tense. <b>Radim</b> covers <em>I work</em>, <em>I am working</em>, and <em>I do work</em>. Don't look for a continuous form — there isn't one."},
    {h:"Negation, and the double negative rule",
     b:"Put <b>ne</b> in front as a separate word: <em>Ne radim danas.</em><br>Only three fuse: <b>nisam</b>, <b>nemam</b>, <b>neću</b>.<br><br>Where English says <em>I don't know anything</em>, Croatian says <em>I don't know nothing</em> — and that's correct:<br><b>Ne znam ništa.</b> · <b>Nikad ne idem tamo.</b> · <b>Nitko nije ovdje.</b><br>Dropping the <em>ne</em> is the mistake."}
  ],
  vocab:[["imati","to have"],["raditi","to work / do"],["govoriti","to speak"],["učiti","to learn"],
    ["znati","to know"],["misliti","to think"],["živjeti","to live"],["gledati","to watch"],
    ["slušati","to listen"],["čitati","to read"],["pisati","to write"],["jesti","to eat"],
    ["piti","to drink"],["ići","to go"],["moći","can"],["htjeti","to want"],["trebati","to need"],
    ["voljeti","to love"],["razumjeti","to understand"],["spavati","to sleep"],["kupiti","to buy"]],
  phrases:[["Učim hrvatski.","I'm learning Croatian."],["Ne znam.","I don't know."],
    ["Što radiš?","What are you doing?"],["Idem u školu.","I'm going to school."],
    ["Možeš li mi pomoći?","Can you help me?"],["Ne razumijem ništa.","I don't understand anything."],
    ["Volim hrvatsku glazbu.","I love Croatian music."]],
  drills:[
    {t:"type",q:"Conjugate: mi + raditi",a:["radimo"],e:"radimo"},
    {t:"type",q:"Say: I'm learning Croatian.",a:["učim hrvatski","ja učim hrvatski"],e:"Učim hrvatski."},
    {t:"mc",q:"Which means 'I can't'?",o:["Ne mogu","Nemogu","Nisam moći","Ne možem"],a:0,e:"Ne mogu — two words."},
    {t:"type",q:"Say: I don't know anything.",a:["ne znam ništa"],e:"Ne znam ništa — double negative required."},
    {t:"mc",q:"oni + ići =",o:["ide","idu","idete","idemo"],a:1,e:"idu"},
    {t:"mc",q:"'Radim' can mean:",o:["Only 'I work'","Only 'I am working'","Both","Neither"],a:2,e:"One present tense covers both."}
  ]
},
{
  id:6, sec:1, title:"Asking questions", sub:"Pitanja",
  goal:"Ask anything. This is the single fastest way to keep a conversation alive when your vocabulary runs out.",
  grammar:[
    {h:"The question words",
     b:"<b>tko?</b> who · <b>što?</b> what · <b>gdje?</b> where · <b>kamo?</b> where to · <b>odakle?</b> where from<br><b>kada?</b> when · <b>kako?</b> how · <b>zašto?</b> why · <b>koliko?</b> how much/many<br><b>koji?</b> which · <b>čiji?</b> whose · <b>kakav?</b> what kind of<br><br>Croatian uses <b>tko</b> and <b>što</b> — not <em>ko</em> and <em>šta</em>."},
    {h:"Question words decline too",
     b:"<b>tko</b> changes by case just like a noun:<br>N <b>tko</b> · G <b>koga</b> · D <b>komu/kome</b> · A <b>koga</b> · L <b>o kome</b> · I <b>s kim</b><br><br><b>što</b>: N što · G <b>čega</b> · D <b>čemu</b> · A što · L <b>o čemu</b> · I <b>čime</b><br><br>S <b>kim</b> ideš? — Who are you going with?<br>O <b>čemu</b> govoriš? — What are you talking about?<br>Od <b>koga</b> je to? — Who is that from?"},
    {h:"koji, čiji and kakav agree like adjectives",
     b:"<b>koji / koja / koje</b> — which<br><b>čiji / čija / čije</b> — whose<br><b>kakav / kakva / kakvo</b> — what kind of<br><br><b>Koja</b> je tvoja? — Which one is yours? (f thing)<br><b>Čiji</b> je ovo auto? — Whose car is this?<br><b>Kakvo</b> je vrijeme? — What's the weather like?"},
    {h:"Yes-no questions, three ways",
     b:"1. <b>Je li</b> ovo tvoje? — most standard<br>2. <b>Da li</b> ideš? — very common in speech<br>3. Just intonation: <b>Ideš?</b><br><br>And the survival questions, worth memorising word for word:<br><b>Što znači…?</b> — What does … mean?<br><b>Kako se kaže … na hrvatskom?</b> — How do you say … in Croatian?<br><b>Možete li ponoviti?</b> — Can you repeat?<br><b>Gdje je…?</b> — Where is…?<br><b>Koliko košta?</b> — How much does it cost?"}
  ],
  vocab:[["tko","who"],["što","what"],["gdje","where"],["kamo","where to"],["odakle","where from"],
    ["kada","when"],["kako","how"],["zašto","why"],["zato što","because"],["koliko","how much"],
    ["koji","which"],["čiji","whose"],["kakav","what kind of"],["možda","maybe"],
    ["naravno","of course"],["stvarno","really"],["znači","means"],["pitanje","question"],["odgovor","answer"]],
  phrases:[["Što znači to?","What does that mean?"],
    ["Kako se kaže „apple\" na hrvatskom?","How do you say 'apple' in Croatian?"],
    ["Gdje je zahod?","Where is the toilet?"],["Koliko košta?","How much does it cost?"],
    ["S kim ideš?","Who are you going with?"],["O čemu govoriš?","What are you talking about?"],
    ["Zašto ne?","Why not?"],["Čiji je ovo auto?","Whose car is this?"]],
  drills:[
    {t:"type",q:"Ask: What does that mean?",a:["što znači to","sto znaci to","što to znači"],e:"Što znači to?"},
    {t:"mc",q:"'Who are you going with?' =",o:["Tko ideš?","S kim ideš?","Koga ideš?","Čime ideš?"],a:1,e:"With a person = s + instrumental, so s kim."},
    {t:"mc",q:"Which is standard Croatian?",o:["Ko je to?","Šta je to?","Tko je to?","Ča je to?"],a:2,e:"tko, not ko. što, not šta."},
    {t:"type",q:"Ask: How much does it cost?",a:["koliko košta","koliko kosta"],e:"Koliko košta?"},
    {t:"mc",q:"'O ___ govoriš?' — What are you talking about?",o:["što","čega","čemu","čime"],a:2,e:"o takes the locative: o čemu."},
    {t:"type",q:"Ask: Where is the station?",a:["gdje je kolodvor"],e:"Gdje je kolodvor?"}
  ]
},
{
  id:7, sec:1, title:"Numbers, time and dates", sub:"Brojevi, sati i datumi",
  goal:"Count, tell the time, and handle the Croatian month names, which are nothing like English.",
  grammar:[
    {h:"Counting",
     b:"nula, jedan, dva, tri, četiri, pet, šest, sedam, osam, devet, deset,<br>jedanaest, dvanaest, trinaest, četrnaest, petnaest, šesnaest, sedamnaest, osamnaest, devetnaest, dvadeset.<br><br>From 11 up it's just <em>digit + naest</em>. Tens: dvadeset, trideset, četrdeset, pedeset, šezdeset, sedamdeset, osamdeset, devedeset, <b>sto</b>, <b>tisuća</b>.<br><br>21 = dvadeset jedan. 135 = sto trideset pet."},
    {h:"What the noun does after a number",
     b:"<b>1</b> → normal singular, and it agrees: <em>jedan stol, jedna kava, jedno pivo</em><br><b>2, 3, 4</b> → genitive singular: <em>dva stol<b>a</b>, tri kav<b>e</b></em><br><b>5+</b> → genitive plural: <em>pet stol<b>ova</b>, šest kav<b>a</b></em><br><br>And <b>dva</b> for m/n but <b>dvije</b> for feminine: <em>dvije kave, dva piva</em>.<br><br>So: jedna kava · dvije kave · pet kava."},
    {h:"Telling the time",
     b:"<b>Koliko je sati?</b> — What time is it?<br>Jedan sat · Dva sata · Pet sati (the number rule again)<br><br><b>Pola tri = 2:30.</b> Literally <em>half three</em>, meaning half way <b>to</b> three. This trips up every English speaker. Pola tri is NOT 3:30.<br><br>Deset i petnaest — 10:15 · Petnaest do pet — 4:45<br><b>U koliko sati?</b> — At what time? → <b>U</b> osam."},
    {h:"Days and months",
     b:"<b>Dani:</b> ponedjeljak, utorak, srijeda, četvrtak, petak, subota, nedjelja. The week starts Monday. <em>Nedjelja</em> = Sunday; <b>tjedan</b> = week.<br><br><b>Mjeseci</b> — old Slavic names describing nature, not Roman emperors:<br>siječanj, veljača, ožujak, travanj, svibanj, lipanj, srpanj, kolovoz, rujan, listopad, studeni, prosinac.<br><em>Listopad</em> = leaf-fall (October). <em>Travanj</em> = grass month (April). No shortcut — memorise them."}
  ],
  vocab:[["sat","hour / clock"],["minuta","minute"],["dan","day"],["tjedan","week"],["mjesec","month"],
    ["godina","year"],["danas","today"],["jučer","yesterday"],["sutra","tomorrow"],
    ["ujutro","in the morning"],["popodne","in the afternoon"],["navečer","in the evening"],

{
  id:8, sec:2, title:"Accusative — the object", sub:"Akuzativ",
  goal:"Say what you have, want, see, eat and buy. This is the case you'll use most.",
  grammar:[
    {h:"What cases actually do",
     b:"English shows who-does-what by word order. Croatian marks it on the <b>ending</b>, so word order is free.<br><em>Ana voli Marka</em> and <em>Marka voli Ana</em> both mean Ana loves Marko — the <b>-a</b> on Marko is what marks him as the one being loved.<br><br>The <b>accusative</b> marks the direct object: the thing had, wanted, seen, eaten, bought."},
    {h:"The endings",
     b:"<table><tr><th></th><th>N</th><th>A</th></tr><tr><td class='cs'>f</td><td class='hr'>kava</td><td class='hr'>kavu</td></tr><tr><td class='cs'>n</td><td class='hr'>pivo</td><td class='hr'>pivo</td></tr><tr><td class='cs'>m thing</td><td class='hr'>stol</td><td class='hr'>stol</td></tr><tr><td class='cs'>m alive</td><td class='hr'>pas</td><td class='hr'>psa</td></tr></table><b>Feminine -a → -u.</b> The single most useful ending in the language.<br>Neuter never changes. Masculine changes <b>only if it's alive</b>."},
    {h:"Alive or not",
     b:"Vidim <b>stol</b>. — I see the table (thing, no change)<br>Vidim <b>psa</b>. — I see the dog (alive, takes -a)<br>Vidim <b>Marka</b>. — I see Marko (person, takes -a)<br><br>Adjectives follow: Imam <b>velikog</b> psa. Imam <b>veliku</b> kuću."},
    {h:"Ordering politely",
     b:"<b>Molim vas jednu kavu.</b> — A coffee please<br><b>Htio bih</b> / <b>Htjela bih</b> jedno pivo. — I'd like a beer (m/f)<br><br><em>Htio bih</em> is much softer than <em>hoću</em>. Use it in shops and cafés — <em>hoću kavu</em> sounds demanding."}
  ],
  vocab:[["kava","coffee"],["čaj","tea"],["voda","water"],["mlijeko","milk"],["sok","juice"],
    ["pivo","beer"],["vino","wine"],["kruh","bread"],["sir","cheese"],["meso","meat"],
    ["riba","fish"],["juha","soup"],["salata","salad"],["voće","fruit"],["povrće","vegetables"],
    ["jabuka","apple"],["rajčica","tomato"],["krumpir","potato"],["kolač","cake"],
    ["sladoled","ice cream"],["račun","the bill"],["jelovnik","menu"]],
  phrases:[["Molim vas jednu kavu.","One coffee, please."],["Htio bih jedno pivo.","I'd like a beer. (m)"],
    ["Imam veliku kuću.","I have a big house."],["Vidim Marka.","I see Marko."],
    ["Jedem kruh i sir.","I'm eating bread and cheese."],["Račun, molim vas.","The bill, please."],
    ["Što preporučujete?","What do you recommend?"]],
  drills:[
    {t:"type",q:"Order politely: one coffee please.",a:["molim vas jednu kavu","htio bih jednu kavu","htjela bih jednu kavu"],e:"Molim vas jednu kavu — kava becomes kavu."},
    {t:"mc",q:"Vidim ___ . (pas)",o:["pas","psu","psa","pasa"],a:2,e:"pas is animate → psa."},
    {t:"mc",q:"Vidim ___ . (stol)",o:["stol","stola","stolu","stolom"],a:0,e:"Inanimate masculine doesn't change."},
    {t:"type",q:"Say: I have a big house.",a:["imam veliku kuću","imam veliku kucu"],e:"Imam veliku kuću."},
    {t:"type",q:"Say: The bill, please.",a:["račun molim vas","racun molim vas","račun molim","molim vas račun"],e:"Račun, molim vas."},
    {t:"mc",q:"Why does 'pivo' stay 'pivo'?",o:["It's feminine","Neuter never changes","It's plural","It's animate"],a:1,e:"Neuter is identical in N and A."}
  ]
},
{
  id:9, sec:2, title:"Genitive — of, from, without", sub:"Genitiv",
  goal:"Show possession, use the commonest prepositions, and say something isn't there.",
  grammar:[
    {h:"The endings",
     b:"<table><tr><th></th><th>N</th><th>G sing</th><th>G plural</th></tr><tr><td class='cs'>m</td><td class='hr'>grad</td><td class='hr'>grada</td><td class='hr'>gradova</td></tr><tr><td class='cs'>f</td><td class='hr'>kuća</td><td class='hr'>kuće</td><td class='hr'>kuća</td></tr><tr><td class='cs'>n</td><td class='hr'>more</td><td class='hr'>mora</td><td class='hr'>mora</td></tr></table>m/n take <b>-a</b>, f takes <b>-e</b>."},
    {h:"Four jobs",
     b:"<b>1 · Possession</b> — English <em>of</em> or <em>'s</em>:<br>knjiga <b>profesora</b> · centar <b>grada</b> · kraj <b>filma</b><br><br><b>2 · After these prepositions:</b> <b>iz</b> from/out of, <b>od</b> from, <b>do</b> to/until, <b>bez</b> without, <b>kod</b> at someone's, <b>blizu</b> near, <b>poslije/nakon</b> after, <b>prije</b> before, <b>oko</b> around, <b>preko</b> across, <b>zbog</b> because of, <b>umjesto</b> instead of<br><br><b>3 · After quantities</b> — 5+, and <em>puno, malo, čaša, boca, kilogram</em>:<br>puno <b>ljudi</b> · čaša <b>vode</b> · kilogram <b>jabuka</b><br><br><b>4 · After nema</b>:<br><b>Nema</b> kruha. — There's no bread. · <b>Nema</b> problema."},
    {h:"ima and nema",
     b:"<b>Ima</b> + noun = there is / there are.<br><b>Nema</b> + <b>genitive</b> = there isn't.<br>Ima li kruha? — Is there bread?<br>Nema mlijeka. — There's no milk.<br>Ima li ovdje zahod? — Is there a toilet here?"}
  ],
  vocab:[["bez","without (+G)"],["iz","from / out of (+G)"],["od","from (+G)"],["do","to / until (+G)"],
    ["kod","at someone's (+G)"],["blizu","near (+G)"],["poslije","after (+G)"],["prije","before (+G)"],
    ["oko","around (+G)"],["zbog","because of (+G)"],["umjesto","instead of (+G)"],
    ["puno","a lot of (+G)"],["šećer","sugar"],["sol","salt (f)"],["novac","money"],
    ["ljudi","people"],["čaša","glass"],["boca","bottle"],["šalica","cup"],["nema","there isn't (+G)"]],
  phrases:[["Ja sam iz Amerike.","I'm from America."],["Kava bez šećera, molim.","Coffee without sugar, please."],
    ["Nema problema.","No problem."],["Ima li ovdje zahod?","Is there a toilet here?"],
    ["Idem do dućana.","I'm going to the shop."],["Puno ljudi je ovdje.","There are a lot of people here."],
    ["Vidimo se poslije škole.","See you after school."]],
  drills:[
    {t:"type",q:"Say: Coffee without sugar.",a:["kava bez šećera","kava bez secera"],e:"Kava bez šećera."},
    {t:"mc",q:"Ja sam iz ___ . (Hrvatska)",o:["Hrvatska","Hrvatsku","Hrvatske","Hrvatskoj"],a:2,e:"iz + genitive, f → -e."},
    {t:"type",q:"Say: There's no bread.",a:["nema kruha"],e:"Nema kruha."},
    {t:"mc",q:"Which does NOT take genitive?",o:["bez","kod","do","u"],a:3,e:"u takes accusative or locative."},
    {t:"mc",q:"'a glass of water' =",o:["čaša voda","čaša vodu","čaša vode","čaša vodom"],a:2,e:"Quantity → genitive."},
    {t:"type",q:"Say: No problem.",a:["nema problema"],e:"Nema problema."}
  ]
},
{
  id:10, sec:2, title:"Locative — where you are", sub:"Lokativ",
  goal:"Master the u/na split. Getting this right is what makes you sound like you know the language.",
  grammar:[
    {h:"Motion versus position",
     b:"The <em>same</em> preposition takes a <b>different case</b> depending on movement.<br><br><b>Going → accusative:</b> Idem <b>u Zagreb</b>.<br><b>Being → locative:</b> Ja sam <b>u Zagrebu</b>.<br><br>Idem <b>u školu</b> / Ja sam <b>u školi</b><br>Idem <b>na plažu</b> / Ja sam <b>na plaži</b><br><br>Ask: am I arriving, or already there?"},
    {h:"The endings",
     b:"m/n take <b>-u</b>, f takes <b>-i</b>.<br>grad → u grad<b>u</b> · more → na mor<b>u</b> · škola → u škol<b>i</b><br><br>The locative <b>only ever appears after a preposition</b> — never alone. Used with <b>u</b> in, <b>na</b> on/at, <b>o</b> about, <b>po</b> around, <b>pri</b> near."},
    {h:"u or na — you memorise these",
     b:"<b>u</b> — u školi, u kući, u gradu, u kinu, u dućanu, u banci, u sobi, u Hrvatskoj<br><b>na</b> — na poslu (at work), na plaži, na moru, na fakultetu, na ulici, na otoku, na kolodvoru, na tržnici, na koncertu<br><br>Rough logic: <em>na</em> for open surfaces, islands, events. But learn each place together with its preposition — that's faster than reasoning it out."},
    {h:"Three question words, three cases",
     b:"<b>Gdje?</b> where (are you) → locative<br><b>Kamo?</b> where to → accusative<br><b>Odakle?</b> where from → genitive<br><br>Gdje si? — Na poslu sam.<br>Kamo ideš? — Idem u kino.<br>Odakle si? — Iz Splita."}
  ],
  vocab:[["škola","school"],["posao","work / job"],["fakultet","university"],["dućan","shop"],
    ["tržnica","market"],["kino","cinema"],["kazalište","theatre"],["restoran","restaurant"],
    ["kafić","café"],["plaža","beach"],["ulica","street"],["trg","square"],["kolodvor","station"],
    ["aerodrom","airport"],["bolnica","hospital"],["banka","bank"],["park","park"],
    ["knjižnica","library"],["muzej","museum"],["crkva","church"],["zahod","toilet"]],
  phrases:[["Gdje si?","Where are you?"],["U školi sam.","I'm at school."],["Na poslu sam.","I'm at work."],
    ["Idem u kino.","I'm going to the cinema."],["Živim u Zagrebu.","I live in Zagreb."],
    ["Ljeti smo na moru.","In summer we're at the seaside."],["Razgovaramo o filmu.","We're talking about the film."]],
  drills:[
    {t:"mc",q:"Idem ___ . (Zagreb, going there)",o:["u Zagreb","u Zagrebu","iz Zagreba","na Zagreb"],a:0,e:"Motion → accusative."},
    {t:"mc",q:"Ja sam ___ . (Zagreb, there now)",o:["u Zagreb","u Zagrebu","do Zagreba","na Zagrebu"],a:1,e:"Position → locative."},
    {t:"type",q:"Say: I'm at work.",a:["na poslu sam","ja sam na poslu"],e:"Na poslu sam — work takes na."},
    {t:"type",q:"Say: I live in Croatia.",a:["živim u hrvatskoj","zivim u hrvatskoj"],e:"Živim u Hrvatskoj."},
    {t:"mc",q:"Which is right?",o:["Idem na plaži","Idem u plažu","Idem na plažu","Sam na plažu"],a:2,e:"Motion + na = accusative."},
    {t:"mc",q:"'Kamo?' asks for which case?",o:["genitive","accusative","locative","dative"],a:1,e:"Kamo = where to = motion = accusative."}

},
{
  id:11, sec:2, title:"Dative — to whom", sub:"Dativ",
  goal:"Give, send, show — and use the verb that Croatian flips around: liking.",
  grammar:[
    {h:"The endings are the locative's",
     b:"m/n <b>-u</b>, f <b>-i</b> — identical to the locative. The difference is that the dative works <b>without a preposition</b>.<br><br>Dajem knjigu <b>prijatelju</b>. — I'm giving the book to my friend.<br>Pišem <b>Ani</b>. — I'm writing to Ana.<br>Pomažem <b>sestri</b>. — I'm helping my sister.<br><br>Also after <b>prema</b> towards and <b>zahvaljujući</b> thanks to."},
    {h:"Short pronouns — you'll use these constantly",
     b:"<b>mi</b> to me · <b>ti</b> to you · <b>mu</b> to him/it · <b>joj</b> to her · <b>nam</b> to us · <b>vam</b> to you · <b>im</b> to them<br><br>Daj <b>mi</b> to. — Give me that.<br>Reci <b>mu</b>. — Tell him.<br>Pomozi <b>joj</b>. — Help her.<br>Kako <b>ti</b> se sviđa? — How do you like it?"},
    {h:"Liking works backwards",
     b:"The thing you like is the <b>subject</b>, and you're in the dative — literally <em>it is pleasing to me</em>:<br><br><b>Sviđa mi se</b> Zagreb. — I like Zagreb.<br><b>Sviđaju mi se</b> ove knjige. — I like these books (plural thing → plural verb).<br>Kako <b>ti se sviđa</b> Hrvatska? — How do you like Croatia?<br><br>Compare <b>voljeti</b>, which is normal: <em>Volim Zagreb.</em> Use <em>voljeti</em> for love and strong preference, <em>sviđati se</em> for ordinary liking."},
    {h:"Other verbs that take the dative",
     b:"<b>trebati</b> — Treba <b>mi</b> pomoć. (I need help)<br><b>nedostajati</b> — Nedostaješ <b>mi</b>. (I miss you)<br><b>hvala</b> — Hvala <b>ti</b> / Hvala <b>vam</b><br><b>čini se</b> — Čini <b>mi</b> se… (It seems to me…)<br><b>drago je</b> — Drago <b>mi</b> je. (Nice to meet you — literally 'it is dear to me')"}
  ],
  vocab:[["dati","to give"],["poslati","to send"],["pokazati","to show"],["pomoći","to help"],
    ["sviđati se","to be pleasing / to like"],["nedostajati","to be missed"],["reći","to say"],
    ["objasniti","to explain"],["obitelj","family (f)"],["majka","mother"],["otac","father"],
    ["brat","brother"],["sestra","sister"],["djed","grandfather"],["baka","grandmother"],
    ["sin","son"],["kći","daughter"],["muž","husband"],["žena","wife / woman"],["dijete","child"]],
  phrases:[["Sviđa mi se Zagreb.","I like Zagreb."],["Kako ti se sviđa Hrvatska?","How do you like Croatia?"],
    ["Daj mi to, molim te.","Give me that, please."],["Treba mi pomoć.","I need help."],
    ["Nedostaješ mi.","I miss you."],["Dajem knjigu sestri.","I'm giving the book to my sister."],
    ["Hvala ti puno!","Thanks a lot!"]],
  drills:[
    {t:"type",q:"Say: I like Zagreb.",a:["sviđa mi se zagreb","svida mi se zagreb"],e:"Sviđa mi se Zagreb."},
    {t:"mc",q:"'I miss you' =",o:["Nedostajem ti","Nedostaješ mi","Nedostajem te","Nedostaješ me"],a:1,e:"You are missed to me: Nedostaješ mi."},
    {t:"mc",q:"Which case answers 'komu?'",o:["genitive","dative","locative","instrumental"],a:1,e:"Dative — to whom."},
    {t:"type",q:"Say: I need help.",a:["treba mi pomoć","treba mi pomoc"],e:"Treba mi pomoć."},
    {t:"mc",q:"'I like these books' =",o:["Sviđa mi se ove knjige","Sviđaju mi se ove knjige","Sviđam ove knjige","Sviđa me ove knjige"],a:1,e:"Plural subject → plural verb: sviđaju."},
    {t:"type",q:"Say: Tell him.",a:["reci mu"],e:"Reci mu."}
  ]
},
{
  id:12, sec:2, title:"Instrumental — with and by", sub:"Instrumental",
  goal:"Say who you're with and how you're travelling — and learn the one distinction that matters.",
  grammar:[
    {h:"The endings",
     b:"m/n take <b>-om</b>, f takes <b>-om</b> too.<br>grad → grad<b>om</b> · žena → žen<b>om</b> · more → mor<b>em</b><br><br>After soft consonants (č ć š ž đ j lj nj) use <b>-em</b>: prijatelj → prijatelj<b>em</b>, nož → nož<b>em</b>."},
    {h:"The whole trick: person needs s, tool doesn't",
     b:"<b>A companion → s / sa + instrumental:</b><br>Idem <b>s prijateljem</b>. — I'm going with a friend.<br>Kava <b>s mlijekom</b>. — Coffee with milk.<br>Živim <b>s obitelji</b>. — I live with my family.<br><br><b>A means → bare instrumental, no preposition:</b><br>Idem <b>autobusom</b>. — I go by bus.<br>Pišem <b>olovkom</b>. — I write with a pen.<br>Putujem <b>vlakom</b>. — I travel by train.<br><br>Say <em>idem s autobusom</em> and you've said you're travelling <em>in the company of</em> a bus."},
    {h:"s or sa?",
     b:"Use <b>sa</b> before words starting with s, š, z, ž, or awkward clusters — purely for pronunciation.<br><em>sa Šimunom, sa zetom, sa mnom</em><br>Otherwise <b>s</b>: <em>s Anom, s prijateljem, s tobom</em>."},
    {h:"Other uses",
     b:"After <b>pod</b> under, <b>nad</b> above, <b>pred</b> in front of, <b>za</b> behind, <b>među</b> among — when there's no movement:<br><em>pod stolom</em> (under the table) · <em>pred kućom</em> (in front of the house)<br><br>And for time periods: <em>ponedjeljkom</em> (on Mondays), <em>ljetom</em> (in summer)."}
  ],
  vocab:[["s / sa","with (+I)"],["autobus","bus"],["vlak","train"],["auto","car"],["bicikl","bicycle"],
    ["avion","plane"],["brod","boat"],["tramvaj","tram"],["taksi","taxi"],["pješke","on foot"],
    ["pod","under (+I)"],["nad","above (+I)"],["pred","in front of (+I)"],["među","among (+I)"],
    ["olovka","pen"],["nož","knife"],["žlica","spoon"],["vilica","fork"],["ruka","hand / arm"]],
  phrases:[["Idem s prijateljem.","I'm going with a friend."],["Putujem vlakom.","I'm travelling by train."],
    ["Kava s mlijekom, molim.","Coffee with milk, please."],["Živim s obitelji.","I live with my family."],
    ["Idem pješke.","I'm walking."],["Hoćeš ići sa mnom?","Do you want to come with me?"]],
  drills:[
    {t:"mc",q:"'I'm going by bus' =",o:["Idem s autobusom","Idem autobusom","Idem u autobusu","Idem autobus"],a:1,e:"A means of transport takes bare instrumental."},
    {t:"mc",q:"'I'm going with a friend' =",o:["Idem prijateljem","Idem s prijateljem","Idem prijatelju","Idem za prijatelja"],a:1,e:"A companion needs s."},
    {t:"type",q:"Say: Coffee with milk, please.",a:["kava s mlijekom molim","kava s mlijekom molim vas"],e:"Kava s mlijekom, molim."},
    {t:"type",q:"Say: I live with my family.",a:["živim s obitelji","zivim s obitelji"],e:"Živim s obitelji."},
    {t:"mc",q:"Instrumental of 'prijatelj':",o:["prijateljom","prijateljem","prijatelju","prijatelja"],a:1,e:"Soft consonant → -em."},
    {t:"mc",q:"Why 'sa mnom' and not 's mnom'?",o:["It's feminine","Easier to pronounce","It's plural","It's a rule for pronouns only"],a:1,e:"sa appears before awkward clusters for pronunciation."}
  ]
},
{
  id:13, sec:2, title:"Vocative and the full picture", sub:"Vokativ i pregled",
  goal:"Call someone by name, then see all seven cases together.",
  grammar:[
    {h:"Vocative — for calling someone",
     b:"Used only when addressing a person directly.<br><b>m</b> → <b>-e</b>: Marko → <b>Marko</b> (names in -o don't change), Ivan → <b>Ivane</b>, prijatelj → <b>prijatelju</b><br><b>f</b> → <b>-o</b>: Ana → <b>Ano</b>, mama → <b>mama</b> (often unchanged in speech)<br><br>Bok, <b>Ivane</b>! · Hvala, <b>prijatelju</b>! · <b>Gospodine</b>! — Sir!<br><br>In everyday speech people often just use the nominative. Don't stress about it."},
    {h:"All seven, in the order Croatians learn them",
     b:"<b>1 Nominativ</b> — tko? što? — the subject<br><b>2 Genitiv</b> — koga? čega? — of, from, without<br><b>3 Dativ</b> — komu? čemu? — to, for<br><b>4 Akuzativ</b> — koga? što? — the object<br><b>5 Vokativ</b> — calling someone<br><b>6 Lokativ</b> — o komu? o čemu? — position, about<br><b>7 Instrumental</b> — s kim? čime? — with, by<br><br>Every textbook and dictionary uses this order. Learn the sequence and reference tables stop being confusing."},
    {h:"The shortcut nobody tells you",
     b:"Seven cases only cost you <b>five</b> sets of endings:<br>• <b>Dative and locative are always identical.</b><br>• In the plural, <b>dative, locative and instrumental are all identical</b> (-ama / -ima).<br>• Neuter accusative always equals nominative.<br>• Masculine inanimate accusative equals nominative.<br><br>So the workload is much smaller than the table suggests."},
    {h:"Plural endings",
     b:"<table><tr><th></th><th>žene (f)</th><th>gradovi (m)</th><th>mora (n)</th></tr><tr><td class='cs'>N</td><td class='hr'>žene</td><td class='hr'>gradovi</td><td class='hr'>mora</td></tr><tr><td class='cs'>G</td><td class='hr'>žena</td><td class='hr'>gradova</td><td class='hr'>mora</td></tr><tr><td class='cs'>D/L/I</td><td class='hr'>ženama</td><td class='hr'>gradovima</td><td class='hr'>morima</td></tr><tr><td class='cs'>A</td><td class='hr'>žene</td><td class='hr'>gradove</td><td class='hr'>mora</td></tr></table>The <b>-ama / -ima</b> ending covering three cases at once is the single biggest shortcut in Croatian grammar."}
  ],

{
  id:14, sec:3, title:"Past tense", sub:"Perfekt",
  goal:"Talk about yesterday, last year, your whole life — one simple pattern covers all of it.",
  grammar:[
    {h:"Two pieces",
     b:"<b>Past participle + short form of biti.</b><br>Drop <b>-ti</b> from the infinitive and add:<br><b>-o</b> (male speaker) · <b>-la</b> (female) · <b>-lo</b> (neuter) · <b>-li</b> (plural m/mixed) · <b>-le</b> (plural all-f)<br><br>raditi → radi<b>o</b> sam / radi<b>la</b> sam<br>gledati → gleda<b>li</b> smo<br>učiti → uči<b>la</b> je"},
    {h:"The ending shows who did it, not what was done",
     b:"This is the part English speakers forget. The participle agrees with the <b>doer</b>:<br><br><b>Bio sam</b> u Splitu. (a man)<br><b>Bila sam</b> u Splitu. (a woman)<br><b>Bili smo</b> u Splitu. (a group)<br><br>So every time you talk about your own past you need your own ending. Pick yours now and drill it until it's automatic."},
    {h:"Negative and questions",
     b:"Swap the short form for nisam/nisi/nije/nismo/niste/nisu:<br><b>Nisam radio</b> jučer. — I didn't work yesterday.<br><b>Nije bila</b> ovdje. — She wasn't here.<br><br>Question: <b>Jesi li bio</b> u Hrvatskoj? — Have you been to Croatia?"},
    {h:"Word order — the second-position rule",
     b:"<em>sam, si, je, smo, ste, su</em> must sit <b>second</b> in the clause.<br>✓ Radio sam. ✓ Jučer sam radio. ✓ U Zagrebu sam radio.<br>✗ Sam radio. ✗ Jučer radio sam.<br><br>Whatever comes first, the little word follows immediately."},
    {h:"Irregular participles",
     b:"A few drop or change the stem:<br>ići → <b>išao / išla</b> (went)<br>reći → <b>rekao / rekla</b> (said)<br>doći → <b>došao / došla</b> (came)<br>jesti → <b>jeo / jela</b> (ate)<br>moći → <b>mogao / mogla</b> (could)<br>htjeti → <b>htio / htjela</b> (wanted)"}
  ],

{
  id:15, sec:3, title:"Future tense", sub:"Futur I",
  goal:"Make plans — and get the spelling right, because this is where Croatian and Serbian visibly differ.",
  grammar:[
    {h:"Short form of htjeti + infinitive",
     b:"<b>ću, ćeš, će, ćemo, ćete, će</b><br><br><b>Radit ću</b> sutra. — I'll work tomorrow.<br><b>Ići ćemo</b> na more. — We'll go to the seaside.<br>Što <b>ćeš raditi</b>? — What will you do?<br>Ona <b>će doći</b>. — She'll come."},
    {h:"The spelling rule",
     b:"When the verb comes first, the infinitive <b>drops its final -i</b> and stays a <b>separate word</b>:<br>✓ <b>radit ću</b> · ✓ <b>pisat ćeš</b> · ✓ <b>gledat će</b><br>✗ raditi ću · ✗ <b>radiću</b><br><br>Writing it as one word is the Serbian convention. Croatian keeps them separate. Verbs in <b>-ći</b> don't change: <em>ići ću</em>, <em>doći ću</em>."},
    {h:"Negative and question",
     b:"<b>Neću raditi.</b> — I won't work. (full form, normal order)<br><b>Nećemo ići.</b> — We won't go.<br><b>Hoćeš li doći?</b> — Will you come?<br><br><em>Neću</em> is written as one word in modern standard Croatian."},
    {h:"Present tense often does the job",
     b:"For near or scheduled events, Croatians frequently just use the present:<br><em>Sutra <b>idem</b> u Zagreb.</em> — I'm going to Zagreb tomorrow.<br><em>Vlak <b>polazi</b> u pet.</em> — The train leaves at five.<br><br>Perfectly natural, and often more natural than the full future."}
  ],
  vocab:[["sutra","tomorrow"],["prekosutra","day after tomorrow"],["sljedeći tjedan","next week"],
    ["uskoro","soon"],["kasnije","later"],["planirati","to plan"],["putovanje","a trip"],

{
  id:16, sec:3, title:"Would — the conditional", sub:"Kondicional",
  goal:"Be polite. In shops, cafés and with strangers this is what separates you from sounding blunt.",
  grammar:[
    {h:"bih + past participle",
     b:"<b>bih, bi, bi, bismo, biste, bi</b> + the same <b>-o / -la / -li</b> participle as the past tense.<br><br><b>Htio bih</b> / <b>Htjela bih</b> kavu. — I'd like a coffee.<br><b>Volio bih</b> ići u Dubrovnik. — I'd love to go to Dubrovnik.<br><b>Mogli biste</b> mi pomoći? — Could you help me?<br><b>Trebao bih</b> ići. — I should go.<br><br>In speech people often just use <b>bi</b> for every person. It's technically sloppy but extremely common."},
    {h:"Why this matters more than it looks",
     b:"<em>Hoću kavu</em> is grammatical but lands like <em>Give me a coffee</em>.<br><em>Htio bih kavu</em> lands like <em>I'd like a coffee</em>.<br><br>Same information, completely different impression. Use the conditional with anyone you don't know."},
    {h:"If-sentences",
     b:"<b>Kad bih imao novca, kupio bih auto.</b> — If I had money, I'd buy a car.<br><b>Da sam znao, došao bih.</b> — Had I known, I'd have come.<br><br>Simple real conditions use <b>ako</b> + present:<br><em>Ako imaš vremena, dođi.</em> — If you have time, come."},
    {h:"Imperative — telling people what to do",
     b:"Built from the present stem:<br><b>Čekaj! / Čekajte!</b> — Wait!<br><b>Dođi! / Dođite!</b> — Come!<br><b>Reci! / Recite!</b> — Say it!<br><b>Idemo!</b> — Let's go!<br><b>Daj!</b> — Give / come on!<br><br>The <b>-te</b> ending is the vi form. Negative: <b>nemoj / nemojte</b> + infinitive — <em>Nemoj ići!</em> Don't go!<br><br>Softening an imperative: add <em>molim te / molim vas</em>."}
  ],

{
  id:17, sec:3, title:"Perfective and imperfective", sub:"Glagolski vid",
  goal:"The hardest thing in Croatian, and the thing that most marks a fluent speaker. Worth the effort.",
  grammar:[
    {h:"Every verb comes in a pair",
     b:"Croatian verbs are either <b>imperfective</b> (ongoing, repeated, unfinished) or <b>perfective</b> (completed, one-off, with a result).<br><br><table><tr><th>imperfective</th><th>perfective</th><th></th></tr><tr><td class='hr'>čitati</td><td class='hr'>pročitati</td><td>read</td></tr><tr><td class='hr'>pisati</td><td class='hr'>napisati</td><td>write</td></tr><tr><td class='hr'>jesti</td><td class='hr'>pojesti</td><td>eat</td></tr><tr><td class='hr'>kupovati</td><td class='hr'>kupiti</td><td>buy</td></tr><tr><td class='hr'>dolaziti</td><td class='hr'>doći</td><td>come</td></tr><tr><td class='hr'>govoriti</td><td class='hr'>reći</td><td>speak / say</td></tr></table>"},
    {h:"What changes",
     b:"<b>Čitao sam knjigu.</b> — I was reading a book / I used to read. (maybe never finished)<br><b>Pročitao sam knjigu.</b> — I read the book. (finished it)<br><br><b>Jeo sam.</b> — I was eating.<br><b>Pojeo sam.</b> — I ate it all up.<br><br>English needs extra words for this. Croatian builds it into the verb."},
    {h:"The rule that catches everyone",
     b:"<b>Perfective verbs have no present tense meaning.</b> A perfective in present form refers to the <em>future</em>.<br><br><em>Pročitam knjigu</em> does not mean <em>I read a book</em> — it means something like <em>once I've read it</em>, and only appears in subordinate clauses.<br><br>So for <em>I'm reading</em> right now, you must use the imperfective: <b>Čitam.</b>"},
    {h:"How to learn them",
     b:"Don't memorise rules — memorise <b>pairs</b>, the way you'd memorise a plural.<br><br>Common perfective prefixes: <b>po-</b> (pojesti), <b>na-</b> (napisati), <b>pro-</b> (pročitati), <b>s-/z-</b> (skuhati), <b>u-</b> (uraditi), <b>do-</b> (doći), <b>iz-</b> (izaći).<br><br>Rough guide: if you're describing a habit or something in progress, use imperfective. If you're reporting something finished, use perfective."}
  ],
  vocab:[["čitati / pročitati","to read"],["pisati / napisati","to write"],["jesti / pojesti","to eat"],
    ["piti / popiti","to drink"],["kupovati / kupiti","to buy"],["dolaziti / doći","to come"],
    ["odlaziti / otići","to leave"],["gledati / pogledati","to watch"],["učiti / naučiti","to learn"],
    ["raditi / uraditi","to do"],["kuhati / skuhati","to cook"],["govoriti / reći","to speak / say"],
    ["davati / dati","to give"],["otvarati / otvoriti","to open"],["zatvarati / zatvoriti","to close"]],
  phrases:[["Čitao sam cijeli dan.","I was reading all day. (m)"],
    ["Pročitao sam knjigu.","I read the book (finished it). (m)"],
    ["Naučio sam nove riječi.","I learned new words. (m)"],
    ["Svaki dan učim hrvatski.","Every day I study Croatian."],
    ["Popio sam kavu.","I drank the coffee. (m)"]],
  drills:[
    {t:"mc",q:"'I read the whole book' (finished) =",o:["Čitao sam knjigu","Pročitao sam knjigu","Čitam knjigu","Čitat ću knjigu"],a:1,e:"Completed action → perfective pročitati."},
    {t:"mc",q:"'I'm reading right now' =",o:["Pročitam","Čitam","Pročitao sam","Čitat ću"],a:1,e:"Perfectives have no present meaning — use čitam."},
    {t:"mc",q:"Perfective partner of 'pisati':",o:["pisavati","napisati","pišem","pisao"],a:1,e:"napisati"},
    {t:"mc",q:"'Every day I study Croatian' uses which?",o:["perfective","imperfective"],a:1,e:"A repeated habit is imperfective."},
    {t:"type",q:"Say (male): I drank the coffee.",a:["popio sam kavu"],e:"Popio sam kavu — perfective, it's gone."},
    {t:"mc",q:"Why does 'pročitam' not mean 'I read'?",o:["It's misspelled","Perfectives have no present meaning","It's plural","It's a noun"],a:1,e:"A perfective in present form points to the future."}

{
  id:18, sec:4, title:"My, your, his, her", sub:"Posvojne zamjenice",
  goal:"Say what belongs to whom — and learn svoj, which English has no equivalent for.",
  grammar:[
    {h:"They agree with the thing owned, not the owner",
     b:"<table><tr><th></th><th>m</th><th>f</th><th>n</th></tr><tr><td class='cs'>my</td><td class='hr'>moj</td><td class='hr'>moja</td><td class='hr'>moje</td></tr><tr><td class='cs'>your (ti)</td><td class='hr'>tvoj</td><td class='hr'>tvoja</td><td class='hr'>tvoje</td></tr><tr><td class='cs'>his</td><td class='hr'>njegov</td><td class='hr'>njegova</td><td class='hr'>njegovo</td></tr><tr><td class='cs'>her</td><td class='hr'>njezin</td><td class='hr'>njezina</td><td class='hr'>njezino</td></tr><tr><td class='cs'>our</td><td class='hr'>naš</td><td class='hr'>naša</td><td class='hr'>naše</td></tr><tr><td class='cs'>your (vi)</td><td class='hr'>vaš</td><td class='hr'>vaša</td><td class='hr'>vaše</td></tr><tr><td class='cs'>their</td><td class='hr'>njihov</td><td class='hr'>njihova</td><td class='hr'>njihovo</td></tr></table><b>moj</b> auto (m) · <b>moja</b> kuća (f) · <b>moje</b> pivo (n)<br><br>So a woman says <em>moj brat</em> and a man says <em>moja sestra</em> — the ending follows the noun, never the speaker."},
    {h:"They decline too",
     b:"Like adjectives, through all seven cases:<br>Vidim <b>tvoju</b> sestru. (A, f)<br>Idem s <b>mojim</b> prijateljem. (I, m)<br>U <b>našoj</b> kući. (L, f)<br>Knjiga <b>moga</b> brata. (G, m)"},
    {h:"svoj — the one English lacks",
     b:"When the owner is the <b>subject of the sentence</b>, Croatian uses <b>svoj</b> instead of moj/tvoj/njegov.<br><br><b>Volim svoju sestru.</b> — I love my sister.<br><b>On voli svoju sestru.</b> — He loves <em>his own</em> sister.<br><b>On voli njegovu sestru.</b> — He loves <em>someone else's</em> sister.<br><br>That last pair is a real difference in meaning, not a style choice. With <em>ja</em> and <em>ti</em>, using moj/tvoj instead of svoj is tolerated. With <em>on/ona/oni</em>, it changes who you mean."},
    {h:"Whose?",
     b:"<b>čiji / čija / čije</b> — whose<br><b>Čiji</b> je ovo auto? · <b>Čija</b> je ova torba? · <b>Čije</b> je ovo?"}
  ],
  vocab:[["moj","my"],["tvoj","your (ti)"],["njegov","his"],["njezin","her"],["naš","our"],
    ["vaš","your (vi)"],["njihov","their"],["svoj","one's own"],["čiji","whose"],
    ["torba","bag"],["ključ","key"],["novčanik","wallet"],["mobitel","mobile phone"],
    ["naočale","glasses (pl)"],["sat","watch"],["kaput","coat"],["cipele","shoes (pl)"]],
  phrases:[["Ovo je moja kuća.","This is my house."],["Gdje je tvoj mobitel?","Where's your phone?"],
    ["Volim svoju obitelj.","I love my family."],["Čiji je ovo ključ?","Whose key is this?"],
    ["Naša škola je velika.","Our school is big."],["Izgubio sam svoj novčanik.","I lost my wallet. (m)"]],
  drills:[

    {t:"mc",q:"'He loves his own sister' =",o:["On voli njegovu sestru","On voli svoju sestru","On voli moju sestru","On voli sestru njegovu"],a:1,e:"svoj = the subject's own."},
    {t:"type",q:"Ask: Whose key is this?",a:["čiji je ovo ključ","ciji je ovo kljuc"],e:"Čiji je ovo ključ?"},

{
  id:19, sec:4, title:"This, that, and adjectives", sub:"Pokazne zamjenice i pridjevi",
  goal:"Point at things, describe them, and get the agreement right every time.",
  grammar:[
    {h:"Three levels of 'that'",
     b:"<b>ovaj / ova / ovo</b> — this, near me<br><b>taj / ta / to</b> — that, near you<br><b>onaj / ona / ono</b> — that over there, far from both<br><br>English has two; Croatian has three. <em>Taj</em> is the one you'll use most in conversation.<br><br><b>Ovaj</b> auto je moj. · <b>Ta</b> knjiga je dobra. · <b>Ono</b> tamo je muzej."},
    {h:"Adjectives agree in gender, number and case",
     b:"<b>velik</b> grad · <b>velika</b> kuća · <b>veliko</b> more<br><b>veliki</b> gradovi · <b>velike</b> kuće · <b>velika</b> mora<br><br>And they change with the case: <em>Imam <b>veliku</b> kuću</em> (A) · <em>U <b>velikoj</b> kući</em> (L) · <em>S <b>velikim</b> psom</em> (I)."},
    {h:"Definite and indefinite forms",
     b:"Masculine adjectives have two forms:<br><b>Indefinite</b> (short): <em>velik grad</em> — a big city, describing<br><b>Definite</b> (long, -i): <em>veliki grad</em> — the big city, identifying<br><br>The definite form is also used after ovaj/taj/onaj and in fixed names: <em>Novi Zagreb</em>, <em>Stari grad</em>.<br><br>In everyday speech the definite form is winning — most people say <em>veliki</em> in both cases. Don't lose sleep over it."},
    {h:"Common adjective pairs",
     b:"velik / malen · dobar / loš · nov / star · mlad / star · lijep / ružan<br>dug / kratak · visok / nizak · jeftin / skup · brz / spor · lak / težak<br>topao / hladan · čist / prljav · pun / prazan · sretan / tužan"}

{
  id:20, sec:4, title:"Bigger, best, quickly", sub:"Komparativ i prilozi",
  goal:"Compare things and describe how actions happen.",
  grammar:[
    {h:"Comparative",
     b:"Add <b>-iji</b> (or <b>-ji</b>) to the adjective:<br>jeftin → jeftin<b>iji</b> · lijep → ljep<b>ši</b> · brz → br<b>ži</b><br><br>Then use <b>od</b> + genitive, or <b>nego</b> + nominative:<br>Zagreb je <b>veći od</b> Splita.<br>Ovo je <b>bolje nego</b> ono."},
    {h:"The irregulars you'll actually use",
     b:"dobar → <b>bolji</b> (better)<br>loš → <b>gori</b> (worse)<br>velik → <b>veći</b> (bigger)<br>malen → <b>manji</b> (smaller)<br>dug → <b>duži</b> (longer)<br>lijep → <b>ljepši</b> (more beautiful)<br><br><b>Superlative:</b> just add <b>naj-</b> to the comparative.<br><b>naj</b>bolji, <b>naj</b>veći, <b>naj</b>ljepši, <b>naj</b>manji"},
    {h:"Adverbs",
     b:"Most adverbs are just the <b>neuter</b> form of the adjective:<br>brz → <b>brzo</b> (quickly) · dobar → <b>dobro</b> (well) · loš → <b>loše</b> (badly) · lijep → <b>lijepo</b> (nicely)<br><br>Govori <b>brzo</b>. — He speaks quickly.<br>Govori <b>dobro</b> hrvatski. — He speaks Croatian well.<br><br>Adverbs never change form — no gender, no case. A rest for once."},
    {h:"Degree words",
     b:"<b>jako / vrlo</b> — very · <b>malo</b> — a bit · <b>previše</b> — too much · <b>dovoljno</b> — enough<br><b>skoro / gotovo</b> — almost · <b>uopće ne</b> — not at all · <b>baš</b> — really<br><br>Or the prefix <b>pre-</b> for 'too': <em>preskup</em> (too expensive), <em>prevelik</em> (too big)."}
  ],

{
  id:21, sec:4, title:"Short pronouns and se", sub:"Zamjenice i povratni glagoli",
  goal:"Stop repeating nouns, and handle the little word se that's attached to a hundred verbs.",
  grammar:[
    {h:"Long and short forms",
     b:"Most pronouns have a stressed long form and an unstressed short one. <b>The short one is normal</b>; the long one is for emphasis or after prepositions.<br><table><tr><th></th><th>A long</th><th>A short</th><th>D short</th></tr><tr><td class='cs'>me</td><td class='hr'>mene</td><td class='hr'>me</td><td class='hr'>mi</td></tr><tr><td class='cs'>you</td><td class='hr'>tebe</td><td class='hr'>te</td><td class='hr'>ti</td></tr><tr><td class='cs'>him/it</td><td class='hr'>njega</td><td class='hr'>ga</td><td class='hr'>mu</td></tr><tr><td class='cs'>her</td><td class='hr'>nju</td><td class='hr'>je / ju</td><td class='hr'>joj</td></tr><tr><td class='cs'>us</td><td class='hr'>nas</td><td class='hr'>nas</td><td class='hr'>nam</td></tr><tr><td class='cs'>them</td><td class='hr'>njih</td><td class='hr'>ih</td><td class='hr'>im</td></tr></table>Vidim <b>ga</b>. — I see him.<br>Daj <b>mi</b> <b>ga</b>. — Give it to me.<br>Za <b>mene</b>. — For me. (long form after a preposition)"},
    {h:"Reflexive verbs",
     b:"A huge number of Croatian verbs carry <b>se</b>. Sometimes it's genuinely reflexive, often it just belongs to the verb:<br><br><b>zvati se</b> — to be called · <b>osjećati se</b> — to feel<br><b>sviđati se</b> — to please · <b>bojati se</b> — to fear<br><b>smijati se</b> — to laugh · <b>šaliti se</b> — to joke<br><b>sjećati se</b> — to remember · <b>nadati se</b> — to hope<br><b>odmarati se</b> — to rest · <b>tuširati se</b> — to shower<br><b>vidjeti se</b> — to see each other · <b>družiti se</b> — to hang out<br><br>Learn the <em>se</em> as part of the word, like the <em>to</em> in English infinitives."},
    {h:"se also makes things impersonal",
     b:"<b>Kako se kaže…?</b> — How does one say…?<br><b>Ovdje se ne puši.</b> — No smoking here.<br><b>Govori se hrvatski.</b> — Croatian is spoken.<br><br>This is how Croatian handles what English does with <em>you</em>, <em>one</em>, or the passive."},
    {h:"sebe / sam sebi",
     b:"For genuine reflexive emphasis: <b>sebe, sebi, sobom</b><br><em>Kupio sam <b>sebi</b> knjigu.</em> — I bought myself a book.<br><em>Govori o <b>sebi</b>.</em> — He talks about himself."}
  ],
  vocab:[["zvati se","to be called"],["osjećati se","to feel"],["bojati se","to fear"],
    ["smijati se","to laugh"],["šaliti se","to joke"],["sjećati se","to remember"],
    ["nadati se","to hope"],["odmarati se","to rest"],["družiti se","to hang out"],
    ["dogoditi se","to happen"],["čuditi se","to be surprised"],["žuriti se","to hurry"],
    ["me","me (short)"],["te","you (short)"],["ga","him / it"],["je","her"],["ih","them"]],
  phrases:[["Vidim ga.","I see him."],["Daj mi ga.","Give it to me."],
    ["Kako se osjećaš?","How do you feel?"],["Ne sjećam se.","I don't remember."],
    ["Ovdje se ne puši.","No smoking here."],["Žurim se.","I'm in a hurry."],
    ["Vidimo se!","See you!"]],
  drills:[
    {t:"type",q:"Say: I see him.",a:["vidim ga"],e:"Vidim ga."},
    {t:"mc",q:"Which is right after a preposition?",o:["za me","za mene","za mi","za ja"],a:1,e:"Long form after prepositions: za mene."},
    {t:"type",q:"Say: I don't remember.",a:["ne sjećam se","ne sjecam se"],e:"Ne sjećam se."},
    {t:"mc",q:"'Kako se kaže?' means:",o:["How does he say?","How does one say?","How do you say to yourself?","How is he called?"],a:1,e:"se makes it impersonal."},
    {t:"type",q:"Ask: How do you feel? (informal)",a:["kako se osjećaš","kako se osjecas"],e:"Kako se osjećaš?"},
    {t:"mc",q:"Why does 'zvati se' have se?",o:["It's reflexive emphasis","It's simply part of the verb","It's plural","It's a typo"],a:1,e:"The se belongs to the verb; it can't be dropped."}
  ]
},
