const GLOSS_COOLDOWN = 400;                   // ms between API calls
const GLOSS_PAUSE = 15000;                    // ms to back off after a rate-limit error
let glossLastCall = 0, glossPausedUntil = 0;
const glossInFlight = {};                     // word -> pending promise, so a double-tap is one request

function glossLookupCached(key){
  if(translationCache[key]) return translationCache[key];
  // inflected forms: "kući" can reuse the glossary entry for "kuća"
  const k = Object.keys(translationCache).find(x => x.length >= 4 && key.startsWith(x.slice(0, Math.max(3, x.length - 2))));
  return k ? translationCache[k] : null;
}

/* ---- On the first tap, translate every word in the passage at once
   (about 60 words per request), so every later tap is instant and free. ---- */
let glossBatch = null;                        // { text, promise } for the passage on screen
const GLOSS_CHUNK = 60;

function passageWords(text){
  const seen = new Set(), out = [];
  (String(text || "").match(/[A-Za-zČčĆćŠšŽžĐđ]{2,}/g) || []).forEach(w => {
    const k = norm(w); if(!seen.has(k)){ seen.add(k); out.push(w); }
  });
  return out;
}

async function glossChunk(words, text){
  const txt = await ask(STYLE_RULES + "You are a Croatian dictionary. Be terse and accurate.",
    [{role:"user", content:`Croatian text:
"${text.slice(0, 2400)}"

For EACH of these words exactly as written, give how it is used in this text:
${JSON.stringify(words)}

Each value must be one line in exactly this format:
<dictionary form> — <English meaning> (<short grammatical note in English, e.g. genitive singular, 1st person present>)

Return ONLY a JSON object mapping each word to its line. No markdown, no other text.`}], 4000);
  const j = parseJSON(txt);
  if(!j || typeof j !== "object" || Array.isArray(j)) throw new Error("bad batch");
  let n = 0;
  Object.keys(j).forEach(w => {
    const v = String(j[w] || "").trim();
    if(v && v.indexOf("—") > -1){ translationCache[norm(w)] = v; n++; }
  });
  return n;
}

function prefetchPassage(){
  if(!RD || !RD.text) return Promise.resolve();
  if(glossBatch && glossBatch.text === RD.text) return glossBatch.promise;
  const text = RD.text;
  const todo = passageWords(text).filter(w => !batchDone(norm(w)));
  const job = { text, promise: null, byWord: {} };
  job.promise = (async () => {
    if(!todo.length) return;
    // every chunk at once, so a word near the end doesn't wait for the beginning
    const chunks = [];
    for(let i = 0; i < todo.length; i += GLOSS_CHUNK) chunks.push(todo.slice(i, i + GLOSS_CHUNK));
    const runs = chunks.map(c => { const p = glossChunk(c, text); c.forEach(w => job.byWord[norm(w)] = p.catch(() => {})); return p; });
    const res = await Promise.allSettled(runs);
    if(!RD || RD.text !== text) return;                         // reading changed — stop
    // the AI sometimes skips a word: one catch-up request for whatever's missing
    const missing = passageWords(text).filter(w => !batchDone(norm(w)));
    if(missing.length && missing.length <= 90){ try{ await glossChunk(missing, text); }catch(e){} }
    keepReading();                              // so taps stay free after a reload
    const bad = res.find(r => r.status === "rejected");
    if(bad && passageWords(text).filter(w => !batchDone(norm(w))).length > 10) throw bad.reason;
  })().catch(e => { if(glossBatch === job) glossBatch = null; throw e; });  // let a later tap retry
  glossBatch = job;
  return job.promise;
}
// A word counts as looked up only once it has a full popup line (not just a glossary meaning).
function batchDone(key){ const v = translationCache[key]; return !!(v && v.indexOf("—") > -1); }

async function gloss(ev, word){
  const g = $("#gloss");
  const key = norm(word);
  const target = ev.target;
  const put = txt => {
    g.innerHTML = `<b>${esc(word)}</b>${txt}${glossStar(key, word)}`;
    g.classList.remove("hidden");
    g.dataset.k = key;
    placeGloss(g, target);
    clearTimeout(g._t);
    fillGlossConj(key, target);
  };
  const wait = msg => put(`<span style="color:var(--stone-dim)">${msg}</span>`);

  // 1. Already know it — instant, no API call.
  if(batchDone(key)) return put(esc(translationCache[key]));

  // 2. Backing off after a rate-limit error.
  if(Date.now() < glossPausedUntil){
    return wait(`Please wait a moment before clicking another word.<br><span style="font-size:12px">(about ${Math.ceil((glossPausedUntil - Date.now()) / 1000)}s)</span>`);
  }

  // 3. Look up the whole passage at once (or wait for that lookup if it's already running).
  if(RD && RD.text && RD.text.indexOf(word) > -1){
    put(`<span class="spin"></span> <span style="color:var(--stone-dim);font-size:12px">translating the passage\u2026</span>`);
    try{
      const all = prefetchPassage();
      const own = glossBatch && glossBatch.byWord[key];
      if(own) await own;                                       // just this word's part of the passage
      if(batchDone(key)) return put(esc(translationCache[key]));
      await all;
      if(batchDone(key)) return put(esc(translationCache[key]));
    }catch(e){
      const m = String((e && e.message) || "");
      if(/QUOTA|RATE|429|BUSY|50[0-3]|Too fast|Daily limit|overload|TIMEOUT/i.test(m)){
        glossPausedUntil = Date.now() + GLOSS_PAUSE;
        const fb = glossLookupCached(key);
        return fb ? put(esc(fb)) : wait("Please wait a moment before clicking another word.");
      }
      // anything else: fall through to looking up just this word
    }
  }

  // 4. Fallback — this single word, if the passage lookup missed it.
  const fb = glossLookupCached(key);
  if(fb && glossBatch && glossBatch.text === (RD && RD.text)) return put(esc(fb));
  if(!glossInFlight[key]){
    // cooldown between single-word calls
    const since = Date.now() - glossLastCall;
    if(since < GLOSS_COOLDOWN) return wait("Please wait a moment before clicking another word.");
    glossLastCall = Date.now();
    glossInFlight[key] = ask(STYLE_RULES + "You are a Croatian dictionary. Be terse.",
      [{role:"user", content:`The word "${word}" appears in this Croatian text: "${String(RD && RD.text && RD.text.indexOf(word) > -1 ? RD.text : (GLOSS_CTX || (RD && RD.text) || "")).slice(0, 400)}".
Reply with ONLY this, one line, no JSON, no extra words:
<dictionary form> — <English meaning> (<short grammatical note in English, e.g. genitive singular, 1st person present>)`}], 200)
      .then(txt => { const t = String(txt || "").trim(); if(!t) throw new Error("empty"); translationCache[key] = t; return t; })
      .finally(() => { delete glossInFlight[key]; });
  }
  put(`<span class="spin"></span>`);

  try{
    const txt = await glossInFlight[key] || translationCache[key];
    put(esc(txt || translationCache[key]));
  }catch(e){
    const m = String((e && e.message) || "");
    if(/QUOTA|RATE|429|BUSY|50[0-3]|Too fast|Daily limit|overload|TIMEOUT/i.test(m)){
      glossPausedUntil = Date.now() + GLOSS_PAUSE;
      wait("Please wait a moment before clicking another word.");
    }else{
      wait("Couldn't look that word up right now. Try again in a moment.");
    }
  }
}
/* ---- The word popup: "dictionary form — meaning (note)". ---- */
function parseGloss(line){
  const s = String(line || ""), i = s.indexOf("—");
  if(i < 0) return null;
  const base = s.slice(0, i).trim();
  let en = s.slice(i + 1).trim(), note = "";
  const m = en.match(/\(([^)]*)\)\s*$/);
  if(m){ note = m[1]; en = en.slice(0, m.index).trim(); }
  if(en.indexOf("—") > -1) en = en.split("—")[0].trim();
  return base ? { base, en, note } : null;
}
const isInfinitive = w => /(ti|ći)(\s+se)?$/i.test(String(w || "").trim());
function placeGloss(g, target){
  const r = target.getBoundingClientRect();
  g.style.left = Math.min(window.innerWidth - 260, Math.max(8, r.left)) + "px";
  g.style.top  = (r.bottom + 8) + "px";
  const h = g.offsetHeight;
  if(r.bottom + 8 + h > window.innerHeight - 8 && r.top - 8 - h > 8) g.style.top = (r.top - 8 - h) + "px";   // no room below: open above the word
}
function glossSentence(word){
  const t = (RD && RD.text && RD.text.indexOf(word) > -1) ? RD.text : (GLOSS_CTX || "");
  const parts = t.split(/(?<=[.!?…])\s+/);
  return (parts.find(x => x.indexOf(word) > -1) || "").slice(0, 220);
}
// the card you made from this popup word (so ★ shows, and tapping again removes it)
const GSTAR = {};
function glossCardFor(key){
  if(GSTAR[key] && S.cards && S.cards[GSTAR[key]]) return GSTAR[key];
  const p = parseGloss(translationCache[key]);
  if(!p || !S.cards) return null;
  const b = p.base.toLowerCase();
  const hit = Object.keys(S.cards).find(k => splitCard(k)[0].split(" / ")[0].toLowerCase() === b);
  if(hit) GSTAR[key] = hit;
  return hit || null;
}
/* ☆ in the word popup: always saves the basic form (kave → kava, volim → voljeti) with its real meaning. */
function glossStar(key, word){
  const line = translationCache[key];
  if(!line || line.indexOf("—") < 0) return "";
  const p = parseGloss(line);
  const on = !!glossCardFor(key);
  const label = on ? `in your flashcards as “${esc(splitCard(GSTAR[key])[0])}”` : "add to your flashcards";
  return `<div class="gconj"></div><div style="margin-top:7px"><button class="save gstar" aria-pressed="${on}" data-gword="${esc(word)}" onclick="starGloss(this)">${on ? "★" : "☆"}</button>
    <span class="gstar-l" style="font-size:12px;color:var(--stone-dim)">${label}</span></div>`;
}
async function starGloss(btn){
  const word = btn.getAttribute("data-gword"), key = norm(word);
  const lab = btn.parentNode.querySelector(".gstar-l");
  S.cards = S.cards || {};
  const had = glossCardFor(key);
  if(had){
    dropCard(had); delete GSTAR[key]; save();
    btn.setAttribute("aria-pressed", "false"); btn.textContent = "☆";
    if(lab) lab.textContent = "add to your flashcards";
    return;
  }
  if(btn.disabled) return;
  btn.disabled = true;
  if(lab) lab.innerHTML = `<span class="spin"></span> saving the basic form…`;
  const p = parseGloss(translationCache[key]) || { base: word, en: "" };
  const hint = gramOnly(p.en) ? "" : p.en;
  let info = null;
  try{ info = (await wordInfoBatch([{ w: word, en: hint, ctx: glossSentence(word) }]))[0]; }catch(e){}
  let hr, en, meta = {};
  if(info && info.base && info.en){ hr = info.base; en = info.en; meta = infoMeta(info); }
  else{
    // no AI right now: the tapped word is certainly Croatian, so it goes on the Croatian side;
    // it gets switched to its basic form automatically once the check can run
    const okBase = p.base && p.base.split(/\s+/)[0].slice(0, 2).toLowerCase() === word.slice(0, 2).toLowerCase();
    hr = okBase ? withForms(p.base) : word; en = hint;
  }
  btn.disabled = false;
  if(!en){ if(lab) lab.textContent = "couldn't look it up right now — try again in a moment"; return; }
  const k = cardKey(hr, en);
  if(!S.cards[k]) putCard(k, meta);
  GSTAR[key] = k; save();
  btn.setAttribute("aria-pressed", "true"); btn.textContent = "★";
  const c = S.cards[k];
  if(lab) lab.innerHTML = `in your flashcards as “${esc(hr)}”${gTag(c)}`;
  const g = $("#gloss"); if(g && g.dataset.k === key) fillGlossConj(key);
}
// verbs: show the present tense right in the popup
async function fillGlossConj(key, target){
  const g = $("#gloss"), box = g && g.querySelector(".gconj");
  if(!box) return;
  const p = parseGloss(translationCache[key]);
  if(!p || !isInfinitive(p.base)) return;
  const show = pres => {
    const b2 = $("#gloss") && $("#gloss").dataset.k === key && $("#gloss .gconj");
    if(!b2 || !pres) return;
    b2.innerHTML = `<div style="font-size:11px;color:var(--stone-dim);margin-top:7px;letter-spacing:.05em">PRESENT · ${esc(p.base)}</div>` + conjHTML(pres);
    if(target) placeGloss($("#gloss"), target);
  };
  const have = WINFO["v:" + norm(p.base)];
  if(have) return show(have);
  box.innerHTML = `<div style="font-size:12px;color:var(--stone-dim);margin-top:6px"><span class="spin"></span> verb forms…</div>`;
  try{
    const info = (await wordInfoBatch([{ w: p.base, en: gramOnly(p.en) ? "" : p.en }]))[0];
    if(info && info.pres) show(info.pres);
    else if($("#gloss .gconj")) $("#gloss .gconj").innerHTML = "";
  }catch(e){ const b3 = $("#gloss .gconj"); if(b3 && $("#gloss").dataset.k === key) b3.innerHTML = ""; }
}

}

  { const _p = PACKOPEN && PACKS.find(x => x.k === PACKOPEN); CARD_SRC = _p ? "Vocab: " + _p.en : "Vocab"; }

function addPack(k){

function packQuiz(k){
  const p = PACKS.find(x => x.k === k); if(!p) return;
  const pool = shuffle(p.w.slice()).slice(0, 10);

    const opts = shuffle([w[1], ...wrong]);
    return { t:"mc", q:`What does "${w[0]}" mean?`, o:opts, a:opts.indexOf(w[1]), e:`${w[0]} — ${w[1]}` };
  });

}

      if(FC && FC.q) FC.q = FC.q.map(x => x === k ? nk : x);
    }
    save(); close(); after();
  };
  $("#ce-save").onclick = doSave;
  ["#ce-hr", "#ce-en"].forEach(id => $(id).addEventListener("keydown", e => { if(e.key === "Enter") doSave(); if(e.key === "Escape") close(); }));
}

// All derived from the cards themselves, so it never gets out of sync:
// mastered = reached the top box; learning = the 40 oldest-starred of the rest;
// up next = everything else, waiting its turn.
function cardGroups(){
  const all = Object.keys(S.cards || {});
  const order = k => S.cards[k].t || S.cards[k].added || 0;
  const focus = S.cardFocus || "";
  const first = k => (focus && cardTopic(k) === focus && !S.cards[k].sw) ? 0 : 1;   // your chosen topic fills the group first
  const mastered = all.filter(k => (S.cards[k].box || 1) >= 5);
  const rest = all.filter(k => (S.cards[k].box || 1) < 5).sort((a, b) => first(a) - first(b) || order(a) - order(b));
  return { mastered, learning: rest.slice(0, LEARN_SIZE), upnext: rest.slice(LEARN_SIZE) };
}
const cardTopic = k => (S.cards[k] && S.cards[k].src) || "Earlier";
function cardRowHTML(k){
  const p = k.split("|"), c = S.cards[k];
  const box = Math.min(5, c.box || 1);
  const dots = `<span class="boxdots" title="box ${box} of 5">${[1,2,3,4].map(i => `<i class="${i < box ? "on" : ""}"></i>`).join("")}</span>`;
  return wordRow(p[0], p[1], true)
    .replace('</span><span class="en">', gTag(c) + '</span><span class="en">')
    .replace('<span class="en">', `<span class="en">${box < 5 ? dots : ""}${c.custom ? '<span class="pill" style="margin-right:7px;font-size:9px;padding:1px 7px">mine</span>' : ""}`)
    .replace('<button class="save"', `${box < 5 ? `<button class="cact" title="Swap out — send to the back of the line" onclick='swapCard(${JSON.stringify(k).replace(/'/g,"&#39;")})'>⇄</button>` : ""}<button class="cact" title="Edit" onclick='editCard(${JSON.stringify(k).replace(/'/g,"&#39;")})'>✎</button><button class="save"`);
}

function seedCards(){
  S.cards = S.cards||{};
  UNITS.slice(0,4).forEach(u=>u.vocab.slice(0,10).forEach(v=>{ if(!S.cards[cardKey(v[0],v[1])]) putCard(cardKey(v[0],v[1]), { src:"Starter words" }); }));
  save(); vCards();
}
function startCards(mode){
  const g = cardGroups();
  const inTopic = k => true;
  const seen = k => S.cards[k].last || 0;
  let q;
  if(mode === "review"){
    q = g.mastered.filter(inTopic).sort((a, b) => seen(a) - seen(b)).slice(0, ROUND_SIZE);
  }else{
    // a topic you picked pulls from all its unmastered words; otherwise just the learning set
    const pool = g.learning;
    q = shuffle(pool.slice()).sort((a, b) => (S.cards[a].box || 1) - (S.cards[b].box || 1) || seen(a) - seen(b))
        .slice(0, ROUND_SIZE);
    // keep old words fresh: swap one slot for the mastered word you saw longest ago
    const old = g.mastered.filter(inTopic).sort((a, b) => seen(a) - seen(b))[0];
    if(old && q.length >= ROUND_SIZE) q[q.length - 1] = old;
    q = shuffle(q);
  }
  if(!q.length) return vCards();
  FC = { q, i:0, dir: CARD_DIR, right:0, flipped:false, mode: mode || "learn", graduated:[], before: cardGroups().learning.length };
  paintCard();
}
function paintCard(){
  if(FC.i >= FC.q.length){

      `<div class="card" style="text-align:center;padding:36px 20px">

        ${grad.length ? `<div class="verdict ok" style="margin:18px auto 0;max-width:420px;text-align:left"><b style="color:var(--olive)">Mastered ${grad.length}:</b> ${grad.map(esc).join(", ")}${g.upnext.length ? `<br><span style="font-size:13px;color:var(--stone-dim)">New words moved in from up next.</span>` : ""}</div>` : ""}

          <div class="progressline" style="margin:0"><i style="width:${Math.min(100, g.mastered.length / Math.max(1, Object.keys(S.cards).length) * 100)}%"></i></div>

          <button class="btn" onclick="startCards('${FC.mode === "review" ? "review" : ""}')">${dual("Another 10","Još 10")}</button>
          <button class="btn ghost" onclick="go('kartice')">${dual("Done for now","Gotovo")}</button></div></div>`);
  }
  const k = FC.q[FC.i], p = k.split("|"), c = S.cards[k];

  const back  = FC.dir === "hr" ? p[1] : p[0];

  shell(`card ${FC.i + 1} of ${FC.q.length}`, "Flashcards", "",
    `<div class="progressline"><i style="width:${FC.i / FC.q.length * 100}%"></i></div>
    <div class="flash">
      <div style="font-size:11px;color:var(--stone-dim);letter-spacing:.06em">${box >= 5 ? "MASTERED · REVIEW" : esc(cardTopic(k))}</div>
      <div class="front">${esc(front)}${FC.dir === "hr" ? gTag(c) : ""}</div>
      ${FC.dir === "hr" ? spk(p[0]) : ""}
      <div class="back" id="bk">${FC.flipped ? esc(back) + (FC.dir === "en" ? gTag(c) + " " + spk(p[0]) : "") : '<span style="opacity:.4">· · ·</span>'}</div>
      ${FC.flipped && c.pos === "verb" ? conjHTML(c.pres) : ""}
      ${box < 5 ? `<span class="boxdots" style="margin-top:6px">${[1,2,3,4].map(i => `<i class="${i < box ? "on" : ""}"></i>`).join("")}</span>` : ""}
    </div>
    <div style="margin-top:16px;display:flex;gap:9px;justify-content:center;flex-wrap:wrap">
      ${FC.flipped
        ? `<button class="btn ghost" onclick="gradeCard(false)">${dual("Didn’t know","Ne znam")}</button><button class="btn" onclick="gradeCard(true)">${dual("I knew it","Znam")}</button>`
        : `<button class="btn brass" onclick="FC.flipped=true;paintCard()">${dual("Flip","Okreni")}</button>`}
    </div>
    <div style="margin-top:12px;display:flex;gap:14px;justify-content:center">
      ${box < 5 && FC.mode !== "review" ? `<button class="linkbtn" onclick='swapCard(${JSON.stringify(k).replace(/'/g,"&#39;")})'>⇄ Swap out</button>` : ""}
      <button class="linkbtn" onclick='editCard(${JSON.stringify(k).replace(/'/g,"&#39;")})'>✎ Edit</button>
    </div>`);
}
function gradeCard(ok){
  const k = FC.q[FC.i], c = S.cards[k];
  const was = c.box || 1;
  c.seen = (c.seen || 0) + 1;
  c.last = Date.now();
  c.box = ok ? Math.min(5, was + 1) : Math.max(1, was - 2);
  delete c.sw;
  if(ok && was < 5 && c.box >= 5){
    FC.graduated.push(k);
    const m = Object.values(S.cards).filter(x => (x.box || 1) >= 5).length;
    if(MASTER_MILESTONES.includes(m)) pushEvent(`🏆 ${m} words mastered`, "Those words are yours now. Bravo!");
  }
  if(ok){ FC.right++; addXP(2); } else save();
  FC.i++; FC.flipped = false; paintCard();
}

function vGrammar(){
  const cur = firstOpen();
  let path = "";
  SECTIONS.forEach(sec => {
    const list = UNITS.filter(u => u.sec === sec.id);
    const done = list.filter(u => unitState(u) === "done").length;
    path += `<div class="secthead">
      <div class="bar" style="background:${sec.color}"></div>
      <div><h3>${esc(sec.name)}</h3><div class="sub">${esc(sec.hr)}</div></div>
      <div class="cnt">${done}/${list.length}</div>
    </div><div class="path">`;
    list.forEach((u, i) => {
      const st = unitState(u);
      const side = i % 2 === 0 ? "l" : "r";
      const style = st === "done" ? `background:${sec.color};border-color:${sec.color};color:#05132B`
                  : st === "open" ? `color:${sec.color}` : "";
      path += `<div class="node ${side} ${st} ${u.id === cur ? "cur" : ""}">
        <button onclick="${st === "locked" ? "lockedMsg()" : `go('unit',${u.id})`}">

        </button></div>`;
    });
    path += `</div>`;
  });
  return vGrammarBody(path);
}

/* ---- Adding/removing flashcards. A removal leaves a dated marker so the
   merge knows you unstarred it, instead of copying it back from another device. ---- */
let CARD_SEQ = 0;
function putCard(k, extra){
  S.cards = S.cards || {};
  // t = when it was starred (keeps the order when a whole pack is added at once)
  S.cards[k] = Object.assign({ box:1, seen:0, t: Date.now() + (CARD_SEQ++ % 1000) / 1000, src: CARD_SRC }, extra || {});
  if(S.removed) delete S.removed[k];
  if(!S.cards[k].nv) fixCardsSoon();
}

/* ============================================================
   BASIC FORMS — every flashcard is kept in its dictionary form
   (kave → kava, velikog → velik / velika / veliko, volim → voljeti),
   with its gender, and verbs carry their present tense.
   ============================================================ */
const NV = 1;                                    // bump to re-check every card
const WI_POS = new Set(["noun","adj","verb","pron","num","adv","prep","conj","phrase","other"]);
const GRAM_WORDS = /\b(singular|plural|nominative|genitive|dative|accusative|locative|instrumental|vocative|person|infinitive|present|past|future|tense|case|form|masculine|feminine|neuter|1st|2nd|3rd|first|second|third|of|the)\b/gi;
// true when the "English" is only a grammar note, like "instrumental singular"
const gramOnly = s => !!String(s || "").trim() && /\b(singular|plural|nominative|genitive|dative|accusative|locative|instrumental|vocative|person|infinitive)\b/i.test(s) &&
  !String(s).replace(GRAM_WORDS, "").replace(/[\s,;()\/.-]+/g, "");
const PERSONS = ["ja", "ti", "on / ona", "mi", "vi", "oni"];
let WINFO = (() => { try{ return JSON.parse(localStorage.getItem("nauci-winfo") || "{}"); }catch(e){ return {}; } })();
function keepWinfo(){ try{ localStorage.setItem("nauci-winfo", JSON.stringify(WINFO)); }catch(e){} }

const WI_RULES = `You are a precise dictionary of standard Croatian for an English-speaking learner.
For each item give its dictionary entry. "w" is Croatian, but it may be in any case or form, misspelled, or missing č ć š ž đ.
"en" is the learner's English meaning. It may be empty, or wrong (for example a grammar note such as "instrumental singular" instead of a meaning) — then give the real meaning.
"ctx", if present, is the sentence the word came from: use it to pick the right meaning.
If "w" is actually an English word and "en" is a grammar note, the two sides were swapped by mistake: give the Croatian word that matches.

Return ONLY a JSON array with one object per item, in the same order:
{"base":"…","en":"…","pos":"noun|adj|verb|pron|num|adv|prep|conj|phrase|other","g":"m|f|n","pl":true,"pres":["…","…","…","…","…","…"],"was":"…"}
- "g": nouns only (the noun's gender). "pl": only for nouns that exist only in the plural. "pres": verbs only — the six present-tense forms in the order ja, ti, on, mi, vi, oni (with se after the verb when it has one: zovem se).

base rules:
- noun → nominative singular: kave → kava, psa → pas, gradovima → grad, kući → kuća. Plural-only nouns stay plural with pl true (vrata, hlače, novine, naočale, škare, leđa). Keep ljudi (people) and djeca (children) as they are.
- describing word → its three nominative singular forms "m / f / n": velikog → "velik / velika / veliko", hrvatskoj → "hrvatski / hrvatska / hrvatsko", najboljeg → "najbolji / najbolja / najbolje".
- possessive and this/that words → the same three-form style: moju → "moj / moja / moje", ovu → "ovaj / ova / ovo".
- personal pronouns → nominative: mene → ja, njega → on, nam → mi.
- verb → infinitive, keeping se when the verb needs it: volim → voljeti, zovem se → zvati se, išao → ići, pila → piti.
- numbers → the plain number: dvije → dva.
- words that never change (ovdje, sutra, i, ali, u, na, vrlo, često…) → unchanged.
- a phrase or sentence of three or more words → unchanged, pos "phrase", en unchanged.
- correct the spelling, including missing č ć š ž đ.
"en": a short English meaning of base — singular for nouns, "to …" for verbs. Keep the learner's wording when it's right; only adjust it to fit base (coffees → coffee).
"was": ONLY when base differs from w — one short English sentence saying what w was, e.g. "kave is the plural (or genitive) of kava." Otherwise "".
All English text in English only.`;

function cleanInfo(x){
  if(!x || typeof x !== "object") return null;
  const str = v => String(v == null ? "" : v).replace(/\|/g, "/").replace(/\s+/g, " ").trim();
  const o = { base: str(x.base), en: str(x.en), pos: WI_POS.has(x.pos) ? x.pos : "other" };
  if(!o.base || o.base.length > 80 || o.en.length > 120) return null;
  if(gramOnly(o.en)) o.en = "";
  if(o.pos === "noun" && /^[mfn]$/.test(x.g)) o.g = x.g;
  if(o.pos === "noun" && x.pl === true) o.pl = true;
  if(o.pos === "verb" && Array.isArray(x.pres) && x.pres.length === 6 && x.pres.every(v => str(v) && str(v).length < 40)) o.pres = x.pres.map(str);
  const was = str(x.was);
  if(was && looksEnglish(was) && o.base.toLowerCase() !== "") o.was = was;
  return o;
}
async function wordInfoBatch(items){
  const list = items.map(it => { const o = { w: it.w }; o.en = it.en || ""; if(it.ctx) o.ctx = String(it.ctx).slice(0, 220); return o; });
  const txt = await ask(STYLE_RULES + WI_RULES, [{ role:"user", content: JSON.stringify(list) }], Math.min(6000, 400 + items.length * 140));
  const j = parseJSON(txt);
  if(!Array.isArray(j) || j.length !== items.length) throw new Error("bad word info");
  const out = j.map(cleanInfo);
  out.forEach(o => { if(o && o.pres){ WINFO["v:" + norm(o.base)] = o.pres; } });
  keepWinfo();
  return out;
}
const infoMeta = info => {
  const m = { nv: NV, pos: info.pos };
  if(info.g) m.g = info.g;
  if(info.pl) m.pl = true;
  if(info.pres) m.pres = info.pres;
  return m;
};
const splitCard = k => { const i = k.indexOf("|"); return [k.slice(0, i), k.slice(i + 1)]; };
// cards whose words the course itself wrote keep their exact wording; anything you typed or picked up yourself gets fixed
const cardIsFree = (c, hr, en) => !!(c.custom || /^Reading/.test(c.src || "") || ["Other", "Earlier", "My words"].includes(c.src || "Earlier") || gramOnly(en));

function applyInfo(k, info){
  const c = S.cards && S.cards[k]; if(!c) return k;
  if(!info){ c.nv = NV; return k; }
  const [hr, en] = splitCard(k);
  let nhr = hr, nen = en;
  if(cardIsFree(c, hr, en)){ nhr = info.base || hr; nen = info.en || en; }
  else if(info.pos === "adj" && info.base.toLowerCase().startsWith(hr.toLowerCase() + " /")) nhr = info.base;
  const meta = infoMeta(info);
  ["g", "pl", "pres"].forEach(f => delete c[f]);
  Object.assign(c, meta);
  const nk = cardKey(nhr, nen);
  if(nk === k || !nen) return k;
  if(S.cards[nk]){                                   // you already had the basic form: keep one card, with the better progress
    const o = S.cards[nk];
    o.box = Math.max(o.box || 1, c.box || 1); o.seen = Math.max(o.seen || 0, c.seen || 0);
    ["g", "pl", "pres"].forEach(f => delete o[f]);
    Object.assign(o, meta);
  }else{
    S.cards[nk] = Object.assign({}, c);
    if(S.removed) delete S.removed[nk];
  }
  dropCard(k);
  if(FC && FC.q) FC.q = FC.q.map(x => x === k ? nk : x);
  return nk;
}

let FIX_RUN = null, FIX_WAIT = 0, FIX_T = 0;
function fixCardsSoon(ms){ clearTimeout(FIX_T); FIX_T = setTimeout(fixCards, ms == null ? 1200 : ms); }
function fixCards(){
  if(FIX_RUN || Date.now() < FIX_WAIT || !S.cards || navigator.onLine === false) return FIX_RUN;
  const todo = Object.keys(S.cards).filter(k => (S.cards[k].nv || 0) < NV);
  if(!todo.length) return null;
  FIX_RUN = (async () => {
    let changed = false;
    const words = [];
    todo.forEach(k => {
      const hr = splitCard(k)[0];
      if(hr.split(" / ")[0].trim().split(/\s+/).length >= 3){ S.cards[k].nv = NV; S.cards[k].pos = "phrase"; changed = true; }
      else words.push(k);
    });
    for(let i = 0; i < words.length; i += 30){
      const chunk = words.slice(i, i + 30).filter(k => S.cards[k]);
      if(!chunk.length) continue;
      let res;
      try{ res = await wordInfoBatch(chunk.map(k => { const [w, en] = splitCard(k); return { w, en }; })); }
      catch(e){
        try{ res = await wordInfoBatch(chunk.map(k => { const [w, en] = splitCard(k); return { w, en }; })); }   // one quiet retry
        catch(e2){ FIX_WAIT = Date.now() + 5 * 60 * 1000; break; }
      }
      chunk.forEach((k, n) => { applyInfo(k, res[n]); changed = true; });
    }
    if(changed){ save(); refreshCardsView(); }
  })().finally(() => { FIX_RUN = null; });
  return FIX_RUN;
}
function refreshCardsView(){
  if(CUR !== "kartice" || $("#cedit")) return;
  const a = document.activeElement;
  if(a && /^(nc-|ce-)/.test(a.id || "") && (a.value || "").trim()) return;      // don't wipe what you're typing
  if($("#main .flash") && FC && FC.q && FC.i < FC.q.length) return paintCard();
  if($("#nc-hr")) vCards();
}
setTimeout(() => fixCardsSoon(0), 6000);

// small label next to the Croatian: m / f / n for nouns, "verb" for verbs
function gTag(c){
  if(!c || !c.nv) return "";
  if(c.pos === "noun" && c.g) return `<span class="gtag" title="${{m:"masculine",f:"feminine",n:"neuter"}[c.g]}${c.pl ? ", only plural" : ""}">${c.g}${c.pl ? " · pl" : ""}</span>`;
  if(c.pos === "verb") return `<span class="gtag">verb</span>`;
  return "";
}
function conjHTML(pres){
  if(!pres || pres.length !== 6) return "";
  const cell = i => `<span>${PERSONS[i]} <b>${esc(pres[i])}</b></span>`;
  return `<div class="conj">${cell(0)}${cell(3)}${cell(1)}${cell(4)}${cell(2)}${cell(5)}</div>`;
}
function dropCard(k){
  if(S.cards) delete S.cards[k];
  CARDSET_N = -1;                                   // a renamed card keeps the count the same, so refresh the ★ list
  S.removed = S.removed || {}; S.removed[k] = Date.now();
}

/* ---- Combining two copies of progress. Nothing is ever thrown away just for
   being older: every card, finished unit, streak day and chat from both is
   kept, and the better result wins wherever they overlap. ---- */
function mergeState(a, b){
  a = a || {}; b = b || {};
  const keys = f => [...new Set([...Object.keys(a[f] || {}), ...Object.keys(b[f] || {})])];
  const out = Object.assign({}, b, a);                       // settings: this device wins

  out.xp = Math.max(a.xp || 0, b.xp || 0);
  out.streak = Math.max(a.streak || 0, b.streak || 0);
  out.name = (a.name || "").trim() || (b.name || "").trim() || "";

  out.done = {};
  keys("done").forEach(k => {
    const x = (a.done || {})[k] || {}, y = (b.done || {})[k] || {};
    const d = [x.drill, y.drill].filter(v => v != null);
    out.done[k] = Object.assign({ read: !!(x.read || y.read) }, d.length ? { drill: Math.max(...d) } : {});
    const st = Object.assign({}, y.st || {}, x.st || {});
    if(Object.keys(st).length) out.done[k].st = st;
    if(x.pass || y.pass || (!x.v && !y.v && unitPassed(out.done[k]))) out.done[k].pass = true;
    if(x.v === 2 || y.v === 2) out.done[k].v = 2;
  });

  out.lastRead = ((a.lastRead || {}).at || 0) >= ((b.lastRead || {}).at || 0) ? a.lastRead : b.lastRead;
  if(!out.lastRead) delete out.lastRead;

  // lessons: a copy from before the lesson reset doesn't bring old ticks back
  const ra = a.skillsReset || 0, rb = b.skillsReset || 0, R = Math.max(ra, rb);
  out.skills = {};
  keys("skills").forEach(k => {
    const v = Math.max(ra === R ? (a.skills || {})[k] || 0 : 0, rb === R ? (b.skills || {})[k] || 0 : 0);
    if(v) out.skills[k] = v;
  });
  if(R) out.skillsReset = R;
  delete out._resave;

  out.removed = {};
  keys("removed").forEach(k => out.removed[k] = Math.max((a.removed || {})[k] || 0, (b.removed || {})[k] || 0));
  out.cards = {};
  keys("cards").forEach(k => {
    const x = (a.cards || {})[k], y = (b.cards || {})[k];
    const c = (x && y) ? Object.assign({}, y, x, { box: Math.max(x.box || 1, y.box || 1),
                                                   seen: Math.max(x.seen || 0, y.seen || 0),
                                                   t: Math.max(x.t || 0, y.t || 0) })
                       : Object.assign({}, x || y);
    if(out.removed[k] && (c.t || 0) <= out.removed[k]) return;   // unstarred after it was added
    out.cards[k] = c;
    delete out.removed[k];
  });

  out.daily = {};
  keys("daily").forEach(k => {
    const x = (a.daily || {})[k] || {}, y = (b.daily || {})[k] || {};
    const m = Object.assign({}, y, x);
    m.word = !!(x.word || y.word); m.verb = !!(x.verb || y.verb);
    // a finished day keeps the word that was actually done
    if(y.word && !x.word){ ["wordHr","wordEn","wordS","wordF"].forEach(f => { if(y[f] !== undefined) m[f] = y[f]; }); }
    if(y.verb && !x.verb){ ["verbI","verbEn","verbS","verbF"].forEach(f => { if(y[f] !== undefined) m[f] = y[f]; }); }
    ["wordNote","verbNote","wordF","verbF"].forEach(f => { if(!m[f] && (x[f] || y[f])) m[f] = x[f] || y[f]; });
    if(y.qqA && !x.qqA){ m.qqQ = y.qqQ; m.qqA = y.qqA; }        // an answered quick question stays answered
    out.daily[k] = m;
  });

  out.removedChats = {};
  keys("removedChats").forEach(k => out.removedChats[k] = Math.max((a.removedChats || {})[k] || 0, (b.removedChats || {})[k] || 0));
  out.chats = {};
  keys("chats").forEach(k => {
    if(out.removedChats[k]) return;
    const x = (a.chats || {})[k], y = (b.chats || {})[k];
    out.chats[k] = (x && y) ? (((x.updated || 0) >= (y.updated || 0)) ? x : y) : (x || y);
  });
  out.chatId = (a.chatId && out.chats[a.chatId]) ? a.chatId : ((b.chatId && out.chats[b.chatId]) ? b.chatId : null);

  out.act = {};
  keys("act").forEach(k => {
    const x = (a.act || {})[k] || {}, y = (b.act || {})[k] || {};
    const m = { xp: Math.max(x.xp || 0, y.xp || 0), q: Math.max(x.q || 0, y.q || 0) };
    const fc = {};
    new Set([...Object.keys(x.fc || {}), ...Object.keys(y.fc || {})]).forEach(c => {
      const p = (x.fc || {})[c] || [0, 0], r = (y.fc || {})[c] || [0, 0]; fc[c] = p[1] >= r[1] ? p : r; });
    if(Object.keys(fc).length) m.fc = fc;
    out.act[k] = m;
  });
  out.notifOn = !!(a.notifOn || b.notifOn);

  out.updatedAt = Date.now();
  return out;
}

/* ============================================================
   ACCOUNTS — Supabase handles signup, password hashing,
   sessions and password resets. This app never sees a password.
   ============================================================ */
let SB = null;

const CLOUD = {
  ready:false, user:null, email:"", busy:false,
  lastSync:0, lastErr:"", pendingKind:"",

  async init(){
    if(!SB_READY()){ this.ready = true; this.lastErr = "NOCONFIG"; paintCloud(); runLink(); return; }

    // The Supabase library loads as a separate module script. Waiting on an
    // event is unreliable — it may already have fired — so poll for it.
    for(let i = 0; i < 100 && !window.__sbCreate; i++){
      await new Promise(r => setTimeout(r, 100));
    }
    if(!window.__sbCreate){
      this.ready = true; this.lastErr = "NOLIB"; paintCloud();
      if(CUR === "napredak") vSave();
      runLink();
      return;
    }
    try{
      SB = window.__sbCreate(SUPABASE_URL, SUPABASE_ANON_KEY);
    }catch(e){ this.ready = true; this.lastErr = "NOCONFIG"; paintCloud(); runLink(); return; }

    // A password-reset link lands back here with tokens in the URL hash.
    if((window.location.hash || "").indexOf("type=recovery") > -1) this.pendingKind = "recovery";

    SB.auth.onAuthStateChange((event, session) => {
      this.user = session ? session.user : null;
      this.email = this.user ? this.user.email : "";
      paintCloud();
      if(event === "PASSWORD_RECOVERY"){ openAuth("reset"); return; }
      if(this.user && this.loadedFor !== this.user.id) this.load();   // just signed in
      if(!this.user && event === "SIGNED_OUT") this.reset();
      if(CUR === "napredak") vSave();
    });

    const { data } = await SB.auth.getSession();
    if(data && data.session){ this.user = data.session.user; this.email = this.user.email; }
    this.ready = true;
    paintCloud();
    if(this.user) this.load(); else { go(CUR); runLink(); }
  },

  async signIn(email, password){
    if(!SB) throw new Error(SB_READY() ? "NOLIB" : "NOCONFIG");
    const { error } = await SB.auth.signInWithPassword({ email, password });
    if(error) throw new Error(error.message);
  },

  async signUp(email, password){
    if(!SB) throw new Error(SB_READY() ? "NOLIB" : "NOCONFIG");
    const { data, error } = await SB.auth.signUp({ email, password });
    if(error) throw new Error(error.message);
    return (data && data.session) ? "in" : "confirm";
  },

  async recover(email){
    if(!SB) throw new Error(SB_READY() ? "NOLIB" : "NOCONFIG");
    const { error } = await SB.auth.resetPasswordForEmail(email, { redirectTo: window.location.origin });
    if(error) throw new Error(error.message);
  },

  async resetPassword(password){
    if(!SB) throw new Error(SB_READY() ? "NOLIB" : "NOCONFIG");
    const { error } = await SB.auth.updateUser({ password });
    if(error) throw new Error(error.message);
    try{ history.replaceState(null, "", location.pathname); }catch(e){}
  },

  async acceptInvite(password){ return this.resetPassword(password); },

  async signOut(){
    if(this.dirty){ clearTimeout(PUSH_T); await this.write(); }      // don't lose the last change
    try{ if(SB) await SB.auth.signOut(); }catch(e){}
    this.reset();
  },
  reset(){
    this.user = null; this.email = ""; this.loaded = false; this.loadedFor = null;
    this.version = null; this.dirty = false;
    S = blankState(); paintStats(); paintCloud(); go(CUR === "napredak" ? "napredak" : "home");
  },

  /* ---- your account is the one copy of your progress ---- */
  loaded:false, loadedFor:null, version:null, dirty:false, saving:false, again:false,
  failCount:0, loadErr:"", backupErr:"",

  async load(){
    if(!this.user || !SB) return;
    const uid = this.user.id;
    this.loaded = false; this.loadErr = ""; paintCloud();
    try{
      const { data, error } = await SB.from("progress").select("state, updated_at").eq("user_id", uid).maybeSingle();
      if(error) throw new Error(error.message);
      if(!this.user || this.user.id !== uid) return;               // signed out while loading
      if(data){
        S = fromCloud(data.state); this.version = data.updated_at;
      }else{
        S = blankState(); S.updatedAt = Date.now();                  // brand-new account
        const now = Date.now();
        const { error: e2 } = await SB.from("progress").insert({ user_id: uid, state: S, updated_at: now });
        if(e2) throw new Error(e2.message);
        this.version = now;
      }
      this.loaded = true; this.loadedFor = uid; this.dirty = false; this.failCount = 0;
      if(S._resave){ delete S._resave; setTimeout(() => save(), 50); }   // store the one-time lesson reset
      this.lastSync = Date.now();
      paintStats(); paintCloud(); go(CUR);
      runLink();
      this.snapshot("daily");
      pushSync();
    }catch(e){
      this.loadErr = String(e.message || e); paintCloud();
      if(CUR === "napredak") vSave();
      setTimeout(() => { if(this.user && !this.loaded) this.load(); }, 5000);   // retry
    }
  },

  async write(){
    if(!this.user || !SB || !this.loaded || !this.dirty) return;
    if(this.saving){ this.again = true; return; }
    this.saving = true; this.dirty = false; paintCloud();
    const uid = this.user.id, now = Date.now();
    try{
      // Only write if nobody else saved since we last loaded — otherwise you'd
      // overwrite what you did on your phone with an older copy from your laptop.
      const { data, error } = await SB.from("progress").update({ state: S, updated_at: now })
        .eq("user_id", uid).eq("updated_at", this.version).select("updated_at");
      if(error) throw new Error(error.message);
      if(!data || !data.length){
        // another of your devices saved first: fold both together, then save again
        const { data: row, error: e2 } = await SB.from("progress").select("state, updated_at").eq("user_id", uid).maybeSingle();
        if(e2) throw new Error(e2.message);
        if(row){ S = mergeState(S, row.state); this.version = row.updated_at; }
        this.dirty = true; this.again = true;
        if(["home","kartice","napredak","gramatika","lekcije","rjecnik"].includes(CUR)) go(CUR);
      }else{
        this.version = data[0].updated_at; this.lastSync = now; this.failCount = 0; this.loadErr = "";
        pushSync();
      }
    }catch(e){
      this.dirty = true; this.failCount++;
      this.loadErr = String(e.message || e);
      const wait = [2000, 5000, 15000, 30000][Math.min(this.failCount - 1, 3)];
      clearTimeout(PUSH_T); PUSH_T = setTimeout(() => this.write(), wait);
    }
    this.saving = false; paintCloud();
    if(this.again){ this.again = false; setTimeout(() => this.write(), 300); }
  },

  // Coming back to a tab after using another device: pick up what changed there.
  async refresh(){
    if(!this.user || !SB || !this.loaded || this.dirty || this.saving) return;
    const uid = this.user.id;
    const { data, error } = await SB.from("progress").select("state, updated_at").eq("user_id", uid).maybeSingle();
    if(error || !data || data.updated_at === this.version) return;
    if(this.dirty || this.saving) return;
    S = fromCloud(data.state); this.version = data.updated_at;
    paintStats(); paintCloud();
    if(["home","kartice","napredak","gramatika","lekcije","rjecnik","qq"].includes(CUR)) go(CUR);
    this.snapshot("daily");
  },

  /* ---- backups: one per day automatically, plus one before any restore or erase.
     The newest 14 are kept. ---- */
  async snapshot(reason){
    if(!this.user || !SB) return;
    const uid = this.user.id;
    const empty = !(S.xp || Object.keys(S.cards || {}).length || Object.keys(S.done || {}).length);
    if(empty && reason === "daily") return;                          // nothing worth backing up yet
    try{
      if(reason === "daily"){
        const { data, error } = await SB.from("progress_history").select("created_at")
          .eq("user_id", uid).order("created_at", { ascending:false }).limit(1);
        if(error) throw new Error(error.message);
        if(data && data.length && learningDayKey(Date.parse(data[0].created_at)) === todayKey()) return;
      }
      const { error: e1 } = await SB.from("progress_history").insert({ user_id: uid, state: S });
      if(e1) throw new Error(e1.message);
      const { data: all, error: e2 } = await SB.from("progress_history").select("id")
        .eq("user_id", uid).order("created_at", { ascending:false });
      if(e2) throw new Error(e2.message);
      const extra = (all || []).slice(14).map(r => r.id);
      if(extra.length) await SB.from("progress_history").delete().in("id", extra);
      this.backupErr = "";
    }catch(e){ this.backupErr = String(e.message || e); }
  },
  async listBackups(){
    const { data, error } = await SB.from("progress_history").select("id, created_at, state")
      .eq("user_id", this.user.id).order("created_at", { ascending:false }).limit(14);
    if(error) throw new Error(error.message);
    return data || [];
  },
  // Replace your account with a given state — used by restore, backup file, and erase.
  async replaceWith(state, reason){
    if(!this.user || !SB || !this.loaded) throw new Error("Sign in first.");
    await this.snapshot(reason);                                      // so this can be undone too
    S = fromCloud(state); S.updatedAt = Date.now();
    const now = Date.now();
    const { error } = await SB.from("progress").upsert({ user_id: this.user.id, state: S, updated_at: now });
    if(error) throw new Error(error.message);
    this.version = now; this.dirty = false; this.lastSync = now;
    paintStats(); paintCloud();
  }
};

function cloudErrText(m){
  m = String(m || "");
  if(m === "NOCONFIG") return "Accounts aren't set up yet — the Supabase URL and anon key are still placeholders near the top of index.html.";
  if(m === "NOLIB")    return "The Supabase library didn't load. Check your internet connection, turn off any ad blocker for this site, and refresh.";
  if(/Invalid login credentials/i.test(m)) return "Wrong email or password.";
  if(/User already registered/i.test(m))   return "That email already has an account — sign in instead.";
  if(/Password should be at least/i.test(m)) return "Password must be at least 6 characters.";
  if(/Email not confirmed/i.test(m))       return "Check your email and click the confirmation link first.";
  if(/rate limit|too many/i.test(m))       return "Too many attempts. Wait a minute.";
  if(m === "EMPTY")                        return "Nothing saved to your account yet.";
  if(/relation .* does not exist|progress/i.test(m) && /does not exist/i.test(m))
    return "The progress table hasn't been created yet — run the SQL from the setup guide.";
  return m;
}

async function doAuth(){
  const msg = $("#a-msg"), go = $("#a-go");
  const val = id => { const el = $(id); return el ? el.value.trim() : ""; };
  const email = val("#a-e"), p1 = val("#a-p1"), p2 = val("#a-p2");
  const fail = t => { msg.innerHTML = `<div class="err">${esc(t)}</div>`; go.disabled = false; };

  if((AUTHTAB === "invite" || AUTHTAB === "reset")){
    if(p1.length < 6) return fail("Password must be at least 6 characters.");
    if(p1 !== p2) return fail("The two passwords don't match.");
  }else if(AUTHTAB === "forgot"){
    if(!email) return fail("Enter your email.");
  }else{
    if(!email || !p1) return fail("Enter your email and password.");
  }

  go.disabled = true;
  msg.innerHTML = `<div style="font-size:14px"><span class="spin"></span> Working…</div>`;
  try{
    if(AUTHTAB === "in"){ await CLOUD.signIn(email, p1); closeAuth(); }

      const r = await CLOUD.signUp(email, p1);
      if(r === "confirm"){
        msg.innerHTML = `<div class="verdict ok"><b>Check your email.</b> Click the confirmation link, then come back and sign in.</div>`;
        go.disabled = false; return;
      }
      closeAuth();
    }
    else if(AUTHTAB === "invite"){ await CLOUD.acceptInvite(p1); closeAuth(); }
    else if(AUTHTAB === "reset"){ await CLOUD.resetPassword(p1); closeAuth(); }
    else if(AUTHTAB === "forgot"){
      await CLOUD.recover(email);
      msg.innerHTML = `<div class="verdict ok"><b>Sent.</b> Check your email for the reset link.</div>`;
      go.disabled = false; return;
    }
    if(CUR === "napredak") vSave();
  }catch(e){ fail(cloudErrText(e.message || e)); }
}

function b64enc(str){
  const bytes = new TextEncoder().encode(str);
  let bin = ""; bytes.forEach(b => bin += String.fromCharCode(b));
  return btoa(bin);
}
function b64dec(b64){
  const bin = atob(b64.trim());
  const bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}

  ["phrase",    "💬 Phrase of the day",  "9 am"],

  ["milestone", "🏆 Milestones",          "streaks, unlocked units and lessons, mastered words"],
  ["weekly",    "📊 Weekly recap",        "Sundays at 6 pm"]
];
function notifPrefs(){ const n = S.notif || {}, o = {}; NOTIF_TYPES.forEach(([k]) => o[k] = n[k] !== false); return o; }
const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const isStandalone = () => (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true;
const pushSupported = () => "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
function b64uBytes(s){
  s = String(s).replace(/-/g, "+").replace(/_/g, "/"); while(s.length % 4) s += "=";
  const bin = atob(s), out = new Uint8Array(bin.length); for(let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i); return out;
}
async function sbToken(){
  if(!SB) return null;
  const { data } = await SB.auth.getSession();
  return data && data.session ? data.session.access_token : null;
}
async function pushApi(path, body, keepalive){
  const tok = await sbToken(); if(!tok) throw new Error("SIGNIN");
  const r = await fetch("/api/push/" + path, { method:"POST", keepalive: !!keepalive,
    headers:{ "Content-Type":"application/json", "Authorization":"Bearer " + tok }, body: JSON.stringify(body || {}) });
  const j = await r.json().catch(() => ({}));
  if(!r.ok) throw new Error(j.error || ("HTTP " + r.status));
  return j;
}

/* ---- what the server needs to know to time the reminders ---- */
function actRec(){
  S.act = S.act || {};
  const k = todayKey();
  if(!S.act[k]){
    const cut = dayIndex(k) - 35;                                   // keep about a month
    Object.keys(S.act).forEach(d => { if(dayIndex(d) < cut) delete S.act[d]; });
    S.act[k] = {};
  }
  return S.act[k];
}
function countQuiz(){ const a = actRec(); a.q = (a.q || 0) + 1; }
function quickPool(){
  const out = [], seen = new Set();
  UNITS.forEach(u => {
    if(!unitPassed((S.done || {})[u.id])) return;
    [].concat(...(STEP_Q[u.id] || []), FINAL_Q[u.id] || [], u.drills || []).forEach(q => {
      if(!q || typeof q.q !== "string" || q.q.length > 140 || seen.has(q.q)) return;
      if(q.t === "mc" && Array.isArray(q.o) && q.o.length <= 4 && q.o.every(o => String(o).length <= 40) && typeof q.a === "number"){
        seen.add(q.q); out.push({ t:"mc", q:q.q, o:q.o.slice(), a:q.a, e:q.e || "" });
      } else if(q.t === "type" && Array.isArray(q.a) && q.a.length){
        seen.add(q.q); out.push({ t:"type", q:q.q, a:q.a.slice(0, 6), e:q.e || "" });
      }
    });
  });
  const h = s => { let x = 7; for(let i = 0; i < s.length; i++) x = (x * 31 + s.charCodeAt(i)) | 0; return x; };
  return out.sort((x, y) => h(x.q) - h(y.q)).slice(0, 40);
}
function pushData(){
  const day = todayKey(), di = dayIndex(day);
  const done = [], phr = {}, act = {};
  for(let i = 0; i < 8; i++){ const k = keyOfIndex(di - i); if(dayDone(k)) done.push(k); }
  for(let i = 0; i < 10; i++){
    const k = keyOfIndex(di + i), r = (S.daily || {})[k];
    const p = (r && r.phr) || ALLP2[(dayIndex(k) * 31337) % ALLP2.length];
    phr[k] = [p[0], p[1]];
  }
  const cards = Object.values(S.cards || {});
  for(let i = 0; i < 8; i++){
    const k = keyOfIndex(di - i), a = (S.act || {})[k] || {};
    const w = cards.filter(c => (c.added || c.t) && learningDayKey(c.added || c.t) === k).length;
    if(a.xp || a.q || a.fc || w) act[k] = Object.assign({}, a, { w });
  }
  const last = cards.reduce((m, c) => Math.max(m, c.last || 0), 0);
  return { done, streak: dailyStreak(), phr, qq: quickPool(),
           cards: { n: cardGroups().learning.length, lastDay: last ? learningDayKey(last) : "" }, act };
}

/* Keeps the server up to date. Important changes (today done, settings, cards) go
   straight away; small ones (points) wait up to 10 minutes, to keep writes low. */
const PS = { last:"", key:"", at:0, t:null };
function pushSync(force){
  if(!S.notifOn || !CLOUD.user || !CLOUD.loaded) return;
  clearTimeout(PS.t);
  PS.t = setTimeout(() => pushSyncNow(force), force ? 200 : 2500);
}
async function pushSyncNow(force, keepalive){
  if(!S.notifOn || !CLOUD.user || !CLOUD.loaded) return;
  try{
    const body = { prefs: notifPrefs(), data: pushData() };
    const full = JSON.stringify(body);
    if(full === PS.last) return;
    const key = JSON.stringify([body.prefs, body.data.done, body.data.streak, body.data.cards, body.data.qq.length, Object.keys(body.data.phr)[0]]);
    if(!force && key === PS.key && Date.now() - PS.at < 10 * 60 * 1000) return;
    await pushApi("sync", body, keepalive);
    PS.last = full; PS.key = key; PS.at = Date.now();
  }catch(e){ /* the next change tries again */ }
}

      NS.sub = reg ? await reg.pushManager.getSubscription() : null;
    }
  }catch(e){ NS.sub = null; }

function notifErrText(e){
  const m = String((e && e.message) || e);
  if(m === "DENIED") return isIOS()
    ? "Notifications are blocked for this app. Turn them on in Settings → Notifications → Nauči hrvatski, then try again."
    : "Notifications are blocked for this site. Click the icon to the left of the address bar → Notifications → Allow, then try again.";
  if(m === "NOKV" || m === "NOSERVER" || /HTTP 404|HTTP 405/.test(m)) return "The server isn't set up for notifications yet — that's the Cloudflare part (a KV namespace called PUSH and an hourly trigger).";
  if(m === "SIGNIN") return "Sign in first.";
  return "Couldn't do that: " + m;
}
async function notifOn(){
  NS.busy = true; NS.msg = ""; paintNotif();
  try{
    const perm = await Notification.requestPermission();
    if(perm !== "granted") throw new Error("DENIED");
    const kr = await fetch("/api/push/key");
    const kj = await kr.json().catch(() => ({}));
    if(!kr.ok || !kj.key) throw new Error(kj.error || "NOSERVER");
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    const want = b64uBytes(kj.key);
    if(sub){                                                       // made with an old key? start fresh
      const had = sub.options && sub.options.applicationServerKey ? new Uint8Array(sub.options.applicationServerKey) : null;
      if(!had || had.length !== want.length || had.some((b, i) => b !== want[i])){ await sub.unsubscribe(); sub = null; }
    }
    sub = sub || await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: want });
    S.notifOn = true; save();
    await pushApi("subscribe", { sub: sub.toJSON(), prefs: notifPrefs(), data: pushData() });
    NS.sub = sub; PS.last = ""; NS.err = false;
    NS.msg = "On ✓ — a test notification is on its way.";
  }catch(e){ NS.err = true; NS.msg = notifErrText(e); }
  NS.busy = false; paintNotif();
}
async function notifOff(){
  NS.busy = true; paintNotif();
  try{
    const sub = NS.sub;
    if(sub){ const ep = sub.endpoint; await sub.unsubscribe(); await pushApi("unsubscribe", { endpoint: ep }).catch(() => {}); }
    NS.sub = null; NS.err = false; NS.msg = "Off on this device.";
  }catch(e){ NS.err = true; NS.msg = notifErrText(e); }
  NS.busy = false; paintNotif();
}

  }catch(e){ NS.err = true; NS.msg = String(e.message) === "NOSUB" ? "No device has notifications turned on yet." : notifErrText(e); }
  NS.busy = false; paintNotif();
}

  else if(!NS.checked) status = `<span class="spin"></span>`;
  else status = `<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
      <span style="font-size:14.5px">This device: <b style="color:${NS.sub ? "var(--olive)" : "var(--stone-dim)"}">${NS.sub ? "on" : "off"}</b></span>
      ${NS.sub
        ? `<button class="btn ghost sm" ${NS.busy ? "disabled" : ""} onclick="notifTest()">${dual("Send a test","Probaj")}</button>
           <button class="btn ghost sm" ${NS.busy ? "disabled" : ""} onclick="notifOff()">${dual("Turn off here","Isključi")}</button>`
        : `<button class="btn sm" ${NS.busy ? "disabled" : ""} onclick="notifOn()">🔔 ${dual("Turn on notifications","Uključi obavijesti")}</button>`}
      ${NS.busy ? `<span class="spin"></span>` : ""}
    </div>`;
  box.innerHTML = `<div class="kicker">notifications · obavijesti</div>
    ${status}
    ${NS.msg ? `<div style="margin-top:10px;font-size:14px;color:${NS.err ? "var(--madder)" : "var(--olive)"}">${esc(NS.msg)}</div>` : ""}
    <div style="margin-top:14px">
      ${NOTIF_TYPES.map(([k, name, when]) => `<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line)">
          <div style="min-width:0"><div style="font-size:15px">${name}</div><div style="font-size:12.5px;color:var(--stone-dim)">${esc(when)}</div></div>
          <button class="chip" style="flex:none" aria-pressed="${p[k]}" onclick="toggleNotif('${k}')">${p[k] ? "On" : "Off"}</button>
        </div>`).join("")}
      <p style="font-size:12.5px;color:var(--stone-dim);margin:8px 0 0">Times are New York time. These switches count for every device you've turned notifications on.</p>
    </div>`;
}

document.addEventListener("visibilitychange", () => {
  if(document.visibilityState === "hidden"){ if(CLOUD.dirty){ clearTimeout(PUSH_T); CLOUD.write(); } pushSyncNow(true, true); }
  else CLOUD.refresh();
});
window.addEventListener("pagehide", () => { if(CLOUD.dirty) CLOUD.write(); });

(async function(){
  await loadKey();
  if(!GKEY) probe();          // non-blocking; paints the indicator when it lands
  await loadState();
  paintNav();
  paintStats();
  paintGear();
  LINK = readLink(location.href);
  if(LINK) history.replaceState(null, "", location.pathname);
  { const pend = await takePendingLink(); LINK = LINK || pend; }
  if(LINK && LINK.go && LINK_ROUTES.includes(LINK.go)) CUR = LINK.go;
  go(CUR);
  CLOUD.init();
})();
</script>
