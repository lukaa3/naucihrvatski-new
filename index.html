  f:[SQm("'with the tomcat' (mačak) =",["s mačakom","s mačkom"],1,"The a drops: mačkom.")]},
 {u:13, g:{h:"The odd ones",
   b:"When a word gets <b>-e</b>, the letter before it can change: <b>k → č · g → ž · c → č</b>.<table><tr><th>basic</th><th>calling</th></tr><tr><td class='hr'>otac</td><td class='hr'>Oče!</td></tr><tr><td class='hr'>Bog (God)</td><td class='hr'>Bože!</td></tr><tr><td class='hr'>čovjek (man)</td><td class='hr'>Čovječe!</td></tr><tr><td class='hr'>prijateljica</td><td class='hr'>Prijateljice!</td></tr><tr><td class='hr'>konobar</td><td class='hr'>Konobaru!</td></tr><tr><td class='hr'>gospodin (sir)</td><td class='hr'>Gospodine!</td></tr><tr><td class='hr'>gospođa (madam)</td><td class='hr'>Gospođo!</td></tr></table>• Words ending in <b>-ica</b> take <b>-e</b>, not -o: prijateljice · učiteljice<br>• Words ending in <b>-ar</b> take <b>-u</b>: konobaru<br><br><b>These don't change at all:</b> Marko · Luka · tata · mama (usually) · Kim · every neuter word (dijete!)<br><br><b>Bože moj!</b> (Oh my God!) and <b>Čovječe!</b> (Man!) are everyday phrases. You'll hear them constantly."},
  q:[SQm("'Oh my God!' =",["Bog moj!","Bože moj!"],1,"Bog → Bože."),
     SQm("Calling a waiter:",["Konobare!","Konobaru!"],1,"-ar → -u."),
     SQm("Calling a friend (girl):",["Prijateljico!","Prijateljice!"],1,"-ica → -e."),
     SQt("Say: Man! (čovjek)",["čovječe"],"k → č, then -e."),
     SQm("Calling Marko:",["Marko!","Marka!","Marke!"],0,"Names in -o don't change.")],
  p:[["Bože moj!","Oh my God!"],["Čovječe!","Man! / Dude!"],["Gospodine!","Sir!"]],
  f:[SQm("'Gospođo!' is calling…",["a gentleman","a lady"],1,"gospođa → gospođo.")]},
 {u:9, g:{h:"The odd ones",
   b:"There are only a few groups. Learn new words in pairs, basic form + genitive (<em>pas, psa</em>). Dictionaries list them that way.<br><br><b>1 · Feminine words ending in a consonant → -i</b><table><tr><th>basic</th><th>genitive</th></tr><tr><td class='hr'>obitelj (family)</td><td class='hr'>obitelji</td></tr><tr><td class='hr'>noć (night)</td><td class='hr'>noći</td></tr><tr><td class='hr'>stvar (thing)</td><td class='hr'>stvari</td></tr><tr><td class='hr'>riječ (word)</td><td class='hr'>riječi</td></tr><tr><td class='hr'>ljubav (love)</td><td class='hr'>ljubavi</td></tr><tr><td class='hr'>sol (salt)</td><td class='hr'>soli</td></tr></table>Shortcut: <b>every word ending in -ost is feminine</b> and works the same way: radost (joy) → <b>radosti</b> · mogućnost (possibility) → <b>mogućnosti</b>.<br><br><b>2 · The disappearing a</b>, gone in every form except the basic one: pas → <b>psa</b> · otac → <b>oca</b> · posao → <b>posla</b><br><br><b>3 · Neuter words that grow a syllable:</b> dijete → <b>djeteta</b> · ime (name) → <b>imena</b> · vrijeme (time, weather) → <b>vremena</b><br><br><b>4 · Men's words ending in -a</b> go like feminine words: tata → <b>tate</b> · Luka → <b>Luke</b><br><br><b>5 · Girls' names not ending in -a never change:</b> Nema <b>Kim</b>.<br><br><b>In the plural</b> (after 5+): feminine consonant words keep <b>-i</b>: pet <b>stvari</b> · pet <b>noći</b>. When a word ends in two consonants, <b>an a slips in</b>: student → pet <b>studenata</b> · sestra → pet <b>sestara</b> · pismo → pet <b>pisama</b>. And the disappearing a comes back: pet <b>pasa</b>."},
  q:[SQm("Genitive of 'obitelj':",["obitelje","obitelji","obitelja"],1,"Feminine ending in a consonant → -i."),
     SQt("Say: coffee without salt",["kava bez soli"],"sol is feminine → soli."),
     SQm("'radost' (joy) is…",["masculine","feminine"],1,"Every -ost word is feminine: radosti."),
     SQm("Genitive of 'posao':",["posaoa","posla","posala"],1,"The a drops: posla."),
     SQt("Genitive of 'ime' (name):",["imena"],"ime grows: imena."),
     SQm("'five students' =",["pet studenta","pet studenata","pet studentova"],1,"An a slips in: studenata.")],
  p:[["Nema vremena.","There's no time."],["Nema soli.","There's no salt."],["bez obitelji","without family"]],
  f:[SQm("Genitive of 'vrijeme':",["vrijema","vremena","vrijemea"],1,"vrijeme grows: vremena."),
     SQt("Say: without love",["bez ljubavi"],"ljubav → ljubavi."),
     SQm("'twelve coffees' =",["dvanaest kave","dvanaest kava"],1,"11–19 always take the 5+ form.")]}
);
EXTRA_STEPS.unshift(
 {u:27, g:{h:"Describing words — the whole set",
   b:"A describing word always matches its thing: the same gender, and one or more than one.<table><tr><th></th><th>m</th><th>f</th><th>n</th></tr><tr><td class='cs'>one</td><td class='hr'>velik grad</td><td class='hr'>velika kuća</td><td class='hr'>veliko selo</td></tr><tr><td class='cs'>more than one</td><td class='hr'>veliki gradovi</td><td class='hr'>velike kuće</td><td class='hr'>velika sela</td></tr></table>• <b>one:</b> masculine adds nothing · feminine <b>-a</b> · neuter <b>-o</b><br>• <b>more than one:</b> masculine <b>-i</b> · feminine <b>-e</b> · neuter <b>-a</b>. These are the same endings the nouns get (Unit {u4}).<br><br><b>Three things to watch:</b><br>• Many masculine describing words <b>drop an a</b> once an ending is added: dobar → <b>dobra</b>, <b>dobri</b> · umoran → <b>umorna</b> · hladan → <b>hladna</b><br>• Words ending in <b>-ski / -čki / -ški</b> always end in <b>-i</b> for masculine: <b>hrvatski</b> jezik (language) · <b>hrvatska</b> kava · <b>hrvatsko</b> more<br>• A <b>mixed group</b> of men and women → masculine: <em>Ana i Marko su umorni.</em><br><br>You'll also hear the masculine with <b>-i</b> for one thing: <em>veliki grad</em>. Both are right; Unit {u19} explains the difference."},
  q:[SQm("'cold beer' =",["hladan pivo","hladna pivo","hladno pivo"],2,"pivo is neuter → -o."),
     SQm("'good houses' =",["dobri kuće","dobre kuće","dobra kuće"],1,"Feminine, more than one → -e."),
     SQt("Say: good friends (boys)",["dobri prijatelji"],"Masculine, more than one → -i."),
     SQm("'Croatian coffee' =",["hrvatski kava","hrvatska kava"],1,"kava is feminine → hrvatska."),
     SQm("'Ana and Marko are tired' =",["Ana i Marko su umorne.","Ana i Marko su umorni."],1,"A mixed group → masculine -i.")],
  p:[["hladno pivo","cold beer"],["hrvatska kuhinja","Croatian food"],["Umorni smo.","We\'re tired."]],
  f:[SQm("'new cars' (auto) =",["novi auti","nove auti"],0,"auto is masculine → novi.")]},
 {u:8, g:{h:"Describing words in the accusative",
   b:"The describing word changes in the same places the noun does.<table><tr><th></th><th>one</th><th>more than one</th></tr><tr><td class='cs'>m thing</td><td class='hr'>velik grad</td><td class='hr'>velike gradove</td></tr><tr><td class='cs'>m alive</td><td class='hr'>velikog psa</td><td class='hr'>velike pse</td></tr><tr><td class='cs'>f</td><td class='hr'>veliku kuću</td><td class='hr'>velike kuće</td></tr><tr><td class='cs'>n</td><td class='hr'>veliko selo</td><td class='hr'>velika sela</td></tr></table>• <b>masculine alive → -og:</b> Imam <b>velikog</b> psa. · Vidim <b>dobrog</b> prijatelja.<br>• <b>feminine → -u:</b> Pijem <b>hladnu</b> vodu.<br>• <b>masculine thing and neuter → no change:</b> Imam <b>nov</b> auto. · Pijem <b>hladno</b> pivo.<br>• <b>more than one:</b> masculine and feminine <b>-e</b>, neuter <b>-a</b>: Volim <b>velike</b> gradove. · Imam <b>dobre</b> prijatelje. · Volim <b>stara</b> sela."},
  q:[SQm("'Imam ___ psa.' (velik)",["velik","velikog","veliku"],1,"Alive masculine → -og."),
     SQm("'Pijem ___ vodu.' (hladan)",["hladna","hladnu","hladno"],1,"Feminine → -u."),
     SQm("'Imam ___ auto.' (nov)",["nov","novog"],0,"A thing → no change."),
     SQt("Say: I love big cities.",["volim velike gradove"],"More than one → -e."),
     SQm("'Imam ___ prijatelje.' (dobar)",["dobri","dobre","dobra"],1,"Masculine, more than one, as the object → -e.")],
  p:[["Imam velikog psa.","I have a big dog."],["Pijem hladnu vodu.","I\'m drinking cold water."]],
  f:[SQm("'Volim ___ sela.' (star)",["stare","stara","stari"],1,"Neuter, more than one → -a.")]},
 {u:9, g:{h:"Describing words in the genitive",
   b:"<table><tr><th></th><th>one</th><th>more than one</th></tr><tr><td class='cs'>m</td><td class='hr'>velikog grada</td><td class='hr'>velikih gradova</td></tr><tr><td class='cs'>f</td><td class='hr'>velike kuće</td><td class='hr'>velikih kuća</td></tr><tr><td class='cs'>n</td><td class='hr'>velikog sela</td><td class='hr'>velikih sela</td></tr></table>• <b>masculine and neuter → -og</b> · <b>feminine → -e</b> (the same as the noun)<br>• <b>more than one, every gender → -ih</b><br><br>čaša <b>hladne</b> vode · Nema <b>hladnog</b> piva. · Ja sam iz <b>velikog</b> grada. · pet <b>velikih</b> gradova<br><br>• After soft letters (č ć š ž đ j lj nj) it's <b>-eg</b>: vruć → <b>vrućeg</b> čaja<br>• In writing you'll also see <b>-oga</b> (velikoga). It's the same thing, just a bit more formal.<br>• With 2, 3 and 4 the describing word takes yet another form; Unit {u39} covers that."},
  q:[SQm("'a glass of cold water' =",["čaša hladna vode","čaša hladne vode","čaša hladnu vode"],1,"Feminine → -e, like the noun."),
     SQm("'There's no cold beer.' =",["Nema hladno piva.","Nema hladnog piva."],1,"Neuter → -og."),
     SQt("Say: from a big city",["iz velikog grada"],"Masculine → -og."),
     SQm("'five big cities' =",["pet velikih gradova","pet veliki gradova","pet velike gradova"],0,"5+ → -ih."),
     SQm("'without hot tea' (vruć) =",["bez vrućog čaja","bez vrućeg čaja"],1,"After ć it's -eg.")],
  p:[["čaša hladne vode","a glass of cold water"],["Nema hladnog piva.","There\'s no cold beer."]],
  f:[SQm("'a lot of good people' =",["puno dobri ljudi","puno dobrih ljudi"],1,"More than one → -ih.")]},
 {u:10, g:{h:"Describing words in the locative",
   b:"<table><tr><th></th><th>one</th><th>more than one</th></tr><tr><td class='cs'>m</td><td class='hr'>u velikom gradu</td><td class='hr'>u velikim gradovima</td></tr><tr><td class='cs'>f</td><td class='hr'>u velikoj kući</td><td class='hr'>u velikim kućama</td></tr><tr><td class='cs'>n</td><td class='hr'>u velikom selu</td><td class='hr'>u velikim selima</td></tr></table>• <b>masculine and neuter → -om</b> · <b>feminine → -oj</b><br>• <b>more than one, every gender → -im</b><br><br>Pričamo o <b>novom</b> autu. — We're talking about the new car. · Živim u <b>maloj</b> kući. — I live in a small house. · na <b>lijepoj</b> plaži — on a beautiful beach<br><br>• After soft letters it's <b>-em</b>: vruć → u <b>vrućem</b> moru<br>• This is also why Hrvatska takes <b>-oj</b> (u Hrvatskoj): it's really a describing word."},
  q:[SQm("'in a big city' =",["u velikoj gradu","u velikom gradu"],1,"Masculine → -om."),
     SQm("'in a small house' (mali) =",["u malom kući","u maloj kući"],1,"Feminine → -oj."),
     SQt("Say: We're talking about the new car.",["pričamo o novom autu"],"Masculine → -om."),
     SQm("'in big cities' =",["u velikim gradovima","u velikih gradovima"],0,"More than one → -im.")],
  p:[["u velikom gradu","in a big city"],["na lijepoj plaži","on a beautiful beach"]],
  f:[SQm("'at the old school' (star) =",["u staroj školi","u starom školi"],0,"Feminine → -oj.")]},
 {u:11, g:{h:"Describing words in the dative",
   b:"Exactly the same as the locative, just without a preposition:<table><tr><th></th><th>one</th><th>more than one</th></tr><tr><td class='cs'>m</td><td class='hr'>dobrom prijatelju</td><td class='hr'>dobrim prijateljima</td></tr><tr><td class='cs'>f</td><td class='hr'>dobroj prijateljici</td><td class='hr'>dobrim prijateljicama</td></tr><tr><td class='cs'>n</td><td class='hr'>malom djetetu</td><td class='hr'>—</td></tr></table>• <b>masculine and neuter → -om</b> · <b>feminine → -oj</b> · <b>more than one → -im</b><br><br>Pišem <b>dobrom</b> prijatelju. · Pomažem <b>staroj</b> gospođi. · Kupujem poklon <b>malom</b> djetetu."},
  q:[SQm("'I'm writing to a good friend (m).' =",["Pišem dobrom prijatelju.","Pišem dobroj prijatelju."],0,"Masculine → -om."),
     SQm("'I'm helping an old lady.' =",["Pomažem staroj gospođi.","Pomažem starom gospođi."],0,"Feminine → -oj."),
     SQt("Say: I'm writing to good friends.",["pišem dobrim prijateljima"],"More than one → -im.")],
  p:[["Pišem dobrom prijatelju.","I\'m writing to a good friend."]],
  f:[SQm("'to the little child' =",["malom djetetu","maloj djetetu"],0,"Neuter → -om.")]},
 {u:12, g:{h:"Describing words in the instrumental",
   b:"<table><tr><th></th><th>one</th><th>more than one</th></tr><tr><td class='cs'>m</td><td class='hr'>s velikim psom</td><td class='hr'>s velikim psima</td></tr><tr><td class='cs'>f</td><td class='hr'>s dobrom prijateljicom</td><td class='hr'>s dobrim prijateljicama</td></tr><tr><td class='cs'>n</td><td class='hr'>s hladnim mlijekom</td><td class='hr'>—</td></tr></table>• <b>masculine and neuter → -im</b> · <b>feminine → -om</b> (the same as the noun)<br>• <b>more than one → -im</b><br><br>Idem s <b>dobrim</b> ljudima. · kava s <b>hladnim</b> mlijekom · Putujem <b>brzim</b> vlakom."},
  q:[SQm("'with a big dog' =",["s velikom psom","s velikim psom"],1,"Masculine → -im."),
     SQm("'with a good friend (f)' =",["s dobrim prijateljicom","s dobrom prijateljicom"],1,"Feminine → -om."),
     SQt("Say: coffee with cold milk",["kava s hladnim mlijekom"],"Neuter → -im."),
     SQm("'with good people' =",["s dobrim ljudima","s dobre ljudima"],0,"More than one → -im.")],
  p:[["s dobrim ljudima","with good people"],["Putujem brzim vlakom.","I\'m travelling by fast train."]],
  f:[SQm("'by fast train' (brz) =",["brzim vlakom","brzom vlakom"],0,"Masculine → -im.")]},
 {u:13, g:{h:"Describing words when you call someone",
   b:"When you call someone, the describing word uses its basic form, and for men that's the <b>-i</b> one:<table><tr><th></th><th>calling</th></tr><tr><td class='cs'>m</td><td class='hr'>Dragi Ivane!</td></tr><tr><td class='cs'>f</td><td class='hr'>Draga Ana!</td></tr><tr><td class='cs'>more than one</td><td class='hr'>Dragi prijatelji!</td></tr></table><b>Dragi / Draga</b> (dear) is how almost every message and letter starts: <em>Dragi Marko,</em> … <em>Draga mama,</em> …"},
  q:[SQm("Start a message to Ana:",["Dragu Ana,","Draga Ana,","Dragoj Ana,"],1,"Calling someone → the basic form."),
     SQm("'Dear friends!' =",["Dragi prijatelji!","Drage prijatelje!"],0,"The basic form, more than one."),
     SQt("Say: Dear Ivan! (start of a message)",["dragi ivane"],"Dragi + Ivane.")],
  p:[["Dragi Ivane,","Dear Ivan, (start of a message)"],["Draga Ana,","Dear Ana,"]],
  f:[SQm("'Dragi Marko!' — dragi is…",["the basic -i form","the genitive"],0,"Calling someone uses the basic form.")]},
);
EXTRA_STEPS.push(
 {u:1, g:{h:"Capital letters and dots",
   b:"Croatian uses fewer capital letters than English.<table><tr><th>English</th><th>Croatian</th></tr><tr><td class='cs'>Monday</td><td class='hr'>ponedjeljak</td></tr><tr><td class='cs'>January</td><td class='hr'>siječanj</td></tr><tr><td class='cs'>Croatian (the language)</td><td class='hr'>hrvatski</td></tr><tr><td class='cs'>a Croat</td><td class='hr'>Hrvat</td></tr><tr><td class='cs'>the 5th of May</td><td class='hr'>5. svibnja</td></tr></table>• <b>small letters</b> for days, months, languages and describing words from places: ponedjeljak · siječanj · hrvatski · engleski · zagrebački<br>• <b>capitals</b> for names and for people from a place: Ana · Zagreb · Hrvat · Amerikanac<br>• <b>a dot after a number</b> turns it into first, second…: 5. svibnja (the 5th of May) · 2. kat (the 2nd floor) · 21. stoljeće (the 21st century)<br>• In messages to someone you call vi, <b>Vi</b> and <b>Vaš</b> are often written with a capital to be polite: Hvala Vam!"},
  q:[SQm("Which is spelled right?",["Ponedjeljak","ponedjeljak"],1,"Days are written small."),
     SQm("'Croatian' (the language) is written…",["Hrvatski","hrvatski"],1,"Languages are written small."),
     SQm("'a Croat' is written…",["hrvat","Hrvat"],1,"People from a place get a capital."),
     SQm("'2. kat' means…",["two floors","the 2nd floor"],1,"A dot after a number = first, second…")],
  p:[],
  f:[SQm("'5. svibnja' means…",["five Mays","the 5th of May"],1,"The dot makes it 'fifth'.")]},
 {u:6, g:{h:"…right? — zar ne, je li tako",
   b:"To check something, put <b>zar ne?</b> or <b>je li tako?</b> at the end, like English <em>right?</em> or <em>isn't it?</em><table><tr><th>tag</th><th>feel</th></tr><tr><td class='cs'>zar ne?</td><td class='hr'>right? — the usual one</td></tr><tr><td class='cs'>je li tako?</td><td class='hr'>is that so?</td></tr><tr><td class='cs'>jel' tako? · jel'?</td><td class='hr'>the same, casual</td></tr></table>Ti si Ana, zar ne? — You're Ana, right?<br>Ovo je kava, je li tako? — This is coffee, isn't it?<br><br><b>zar</b> on its own, at the start, shows surprise:<br>Zar ne znaš? — Don't you know?! · Zar si ovdje? — You're here?!"},
  q:[SQm("'You're tired, right?' =",["Umoran si, zar ne?","Umoran si, zar da?"],0,"zar ne = right?"),
     SQm("'Zar ne znaš?' sounds…",["surprised","extra polite"],0,"zar at the start = surprise."),
     SQt("Say: This is coffee, right?",["ovo je kava zar ne","ovo je kava je li tako","ovo je kava jel tako"],"Ovo je kava, zar ne?")],
  p:[["…zar ne?","…right?"],["Je li tako?","Is that so?"]],
  f:[SQm("'jel tako?' is…",["a casual 'je li tako?'","a spelling mistake"],0,"The spoken short form.")]},
 {u:9, g:{h:"Some, none, and when",
   b:"<b>1 · 'some' or 'any' of something</b>: when you don't mean a whole one, use the genitive:<br>Imaš li kruha? — Do you have any bread? · Ima li mlijeka? — Is there any milk? · Pijem malo vode. — I'm drinking a bit of water.<br>Compare: Imam kruh. — I have bread (a loaf of it).<br><br><b>2 · 'have no…' — nemam + genitive</b>:<br>Nemam vremena. — I don't have time. · Nemam novca. — I have no money.<br><br><b>3 · 'when', with no preposition</b>: a few time phrases are just the genitive. Learn them as chunks:<table><tr><th>Croatian</th><th>means</th></tr><tr><td class='cs'>prošle godine</td><td class='hr'>last year</td></tr><tr><td class='cs'>ove godine</td><td class='hr'>this year</td></tr><tr><td class='cs'>sljedeće godine</td><td class='hr'>next year</td></tr><tr><td class='cs'>prošlog tjedna</td><td class='hr'>last week</td></tr><tr><td class='cs'>jednog dana</td><td class='hr'>one day (someday)</td></tr></table><b>4 · more odd plurals after 5+</b>: mjesec → pet <b>mjeseci</b> (months) · gost → pet <b>gostiju</b> (guests) · prst → pet <b>prstiju</b> (fingers), on top of sati, ljudi and djece."},
  q:[SQm("'Do you have any bread?' =",["Imaš li kruh?","Imaš li kruha?"],1,"'any / some' → genitive."),
     SQt("Say: I have no money.",["nemam novca","nemam novaca"],"nemam + genitive."),
     SQm("'prošle godine' means…",["last year","next year"],0,"prošle = last."),
     SQm("'five months' =",["pet mjeseca","pet mjeseci"],1,"mjesec → mjeseci."),
     SQm("'next year' =",["sljedeće godine","sljedeća godina"],0,"Time with no preposition → genitive.")],
  p:[["Nemam vremena.","I don\'t have time."],["Imaš li kruha?","Do you have any bread?"],["prošle godine","last year"]],
  f:[SQm("'Ima li mlijeka?' means…",["Is there any milk?","Is the milk here?"],0,"Genitive = some / any.")]},
 {u:38, g:{h:"People from places, and braća",
   b:"<b>-anin → -ani</b>: words for people from a place often end in -anin and drop the -in when there's more than one:<table><tr><th>one</th><th>more than one</th></tr><tr><td class='cs'>građanin (citizen)</td><td class='hr'>građani</td></tr><tr><td class='cs'>Zagrepčanin</td><td class='hr'>Zagrepčani</td></tr><tr><td class='cs'>Splićanin</td><td class='hr'>Splićani</td></tr></table>A woman is <b>-anka</b>: Zagrepčanka · Splićanka.<br><br><b>braća</b> (brothers) changes like a feminine -a word but takes a plural verb: Braća su ovdje. · Idem s braćom. · Vidim braću.<br><b>gospodin → gospoda</b> (gentlemen): Dame i gospodo! — Ladies and gentlemen!"},
  q:[SQm("'citizens' =",["građanini","građani"],1,"-anin → -ani."),
     SQm("'Braća ___ ovdje.'",["je","su"],1,"braća takes a plural verb."),
     SQt("Say: I'm going with the brothers.",["idem s braćom"],"braća → s braćom.")],
  p:[["Dame i gospodo!","Ladies and gentlemen!"]],
  f:[SQm("'Zagrepčani' are…",["people from Zagreb","streets in Zagreb"],0,"-anin → -ani.")]},
 {u:29, g:{h:"A few more pairs",
   b:"<table><tr><th>word</th><th>case</th><th>example</th></tr><tr><td class='cs'>po (to fetch)</td><td class='hr'>+ A</td><td class='hr'>Idem po kruh. — I'm going to get bread.</td></tr><tr><td class='cs'>za vrijeme (during)</td><td class='hr'>+ G</td><td class='hr'>za vrijeme ručka — during lunch</td></tr><tr><td class='cs'>tijekom (during)</td><td class='hr'>+ G</td><td class='hr'>tijekom dana — during the day</td></tr><tr><td class='cs'>baviti se (do, be into)</td><td class='hr'>+ I</td><td class='hr'>Bavim se nogometom. — I play football.</td></tr><tr><td class='cs'>radovati se (look forward to)</td><td class='hr'>+ D</td><td class='hr'>Radujem se vikendu.</td></tr><tr><td class='cs'>brinuti se za (look after)</td><td class='hr'>+ A</td><td class='hr'>Brinem se za psa.</td></tr></table><b>po</b> has two jobs: + accusative = to fetch (Idem po Anu. — I'm going to pick Ana up) · + locative = around (po gradu)."},
  q:[SQm("'I'm going to get bread.' =",["Idem po kruhu.","Idem po kruh."],1,"po + accusative = to fetch."),
     SQt("Say: I play football. (baviti se)",["bavim se nogometom"],"baviti se + instrumental."),
     SQm("'during lunch' =",["za vrijeme ručka","za vrijeme ručak"],0,"za vrijeme + genitive."),
     SQm("'I'm looking forward to the weekend.' =",["Radujem se vikend.","Radujem se vikendu."],1,"radovati se + dative.")],
  p:[["Idem po kruh.","I\'m going to get bread."],["Bavim se nogometom.","I play football."],["Radujem se vikendu.","I\'m looking forward to the weekend."]],
  f:[SQm("'Idem po Anu' means…",["I'm going to pick Ana up","I'm walking around Ana"],0,"po + A = to fetch someone.")]},
 {u:30, g:{h:"All, alone, same, other",
   b:"<table><tr><th></th><th>m</th><th>f</th><th>n</th></tr><tr><td class='cs'>all, whole</td><td class='hr'>sav</td><td class='hr'>sva</td><td class='hr'>sve</td></tr><tr><td class='cs'>all (more than one)</td><td class='hr'>svi</td><td class='hr'>sve</td><td class='hr'>sva</td></tr><tr><td class='cs'>alone</td><td class='hr'>sam</td><td class='hr'>sama</td><td class='hr'>samo</td></tr><tr><td class='cs'>same</td><td class='hr'>isti</td><td class='hr'>ista</td><td class='hr'>isto</td></tr><tr><td class='cs'>other</td><td class='hr'>drugi</td><td class='hr'>druga</td><td class='hr'>drugo</td></tr></table>sav grad — the whole city · sva kava — all the coffee · svi ljudi — all the people · Sve je u redu.<br>In speech <b>cijeli</b> (whole) is very common too: cijeli dan — all day.<br><br><b>Careful: sam = alone</b> looks exactly like sam = am:<br><em>Sam sam.</em> — I'm alone (a man). · <em>Sama sam.</em> — I'm alone (a woman). · Živim sam. — I live alone.<br>And <b>samo</b> on its own = only: samo malo — just a bit.<br><br><b>isto</b> on its own = also, the same: Isto tako. — Likewise. · <b>drugi</b> = other, and also second: drugi put — another time."},
  q:[SQm("'Sama sam.' means…",["I'm alone (woman)","I am (woman)"],0,"sam / sama = alone."),
     SQm("'all the people' =",["sav ljudi","svi ljudi"],1,"More than one → svi."),
     SQt("Say: the whole day (cijeli)",["cijeli dan"],"cijeli dan."),
     SQm("'the same book' =",["isti knjiga","ista knjiga"],1,"knjiga is feminine → ista."),
     SQm("'Isto tako.' means…",["Likewise.","The same table."],0,"isto = also, the same.")],
  p:[["Sve je u redu.","Everything is fine."],["Isto tako.","Likewise."],["samo malo","just a bit"]],
  f:[SQm("'Živim sam.' means…",["I live alone.","I am alive."],0,"sam = alone.")]},
 {u:14, at:1, g:{h:"Building the -o / -la form",
   b:"<table><tr><th>-ti form</th><th>man</th><th>woman</th><th>group</th></tr><tr><td class='cs'>gledati</td><td class='hr'>gledao</td><td class='hr'>gledala</td><td class='hr'>gledali</td></tr><tr><td class='cs'>raditi</td><td class='hr'>radio</td><td class='hr'>radila</td><td class='hr'>radili</td></tr><tr><td class='cs'>vidjeti</td><td class='hr'>vidio</td><td class='hr'>vidjela</td><td class='hr'>vidjeli</td></tr><tr><td class='cs'>čuti</td><td class='hr'>čuo</td><td class='hr'>čula</td><td class='hr'>čuli</td></tr><tr><td class='cs'>krenuti</td><td class='hr'>krenuo</td><td class='hr'>krenula</td><td class='hr'>krenuli</td></tr><tr><td class='cs'>moći</td><td class='hr'>mogao</td><td class='hr'>mogla</td><td class='hr'>mogli</td></tr><tr><td class='cs'>jesti</td><td class='hr'>jeo</td><td class='hr'>jela</td><td class='hr'>jeli</td></tr></table>• Drop <b>-ti</b>: a woman adds <b>-la</b>, a group <b>-li</b>.<br>• The man's form ends in <b>-o</b> because it used to be -l (Unit {u24}): gledal → gledao, radil → radio. So it's <b>-ao</b> after a, <b>-io</b> after i, <b>-uo</b> after u.<br>• <b>-jeti</b> verbs: the man gets -io, everyone else -jela, -jeli: vidio / vidjela · volio / voljela · živio / živjela · htio / htjela<br>• <b>-ći</b> verbs: moći → mogao · reći → rekao · pomoći → pomogao · ići → išao and its family: došao · otišao · ušao · izašao · našao<br>• <b>-sti</b> verbs: jesti → jeo, jela · sjesti → sjeo, sjela"},
  q:[SQm("Past of 'čitati' (man):",["čitio","čitao","čital"],1,"-ati → -ao."),
     SQm("Past of 'vidjeti' (woman):",["vidila","vidjela"],1,"-jeti → -jela for women."),
     SQt("Say: I heard. (woman)",["čula sam"],"čuti → čula."),
     SQm("Past of 'moći' (man):",["mogao","moćio","mogo"],0,"moći → mogao."),
     SQm("Past of 'krenuti' (man):",["krenuo","krenio"],0,"-uti → -uo.")],
  p:[["Čula sam.","I heard. (woman)"],["Nisam vidio.","I didn\'t see. (man)"]],
  f:[SQm("Past of 'živjeti' (woman):",["živila","živjela"],1,"-jeti → -jela.")]},
 {u:15, g:{h:"biti in the future: bit ću",
   b:"biti uses the same pattern: <b>bit ću, bit ćeš, bit će…</b> (or ja ću biti):<table><tr><th></th><th>be</th></tr><tr><td class='cs'>ja</td><td class='hr'>bit ću</td></tr><tr><td class='cs'>ti</td><td class='hr'>bit ćeš</td></tr><tr><td class='cs'>on / ona</td><td class='hr'>bit će</td></tr><tr><td class='cs'>mi</td><td class='hr'>bit ćemo</td></tr><tr><td class='cs'>vi</td><td class='hr'>bit ćete</td></tr><tr><td class='cs'>oni / one</td><td class='hr'>bit će</td></tr></table>Bit ću kod kuće. — I'll be at home. · Sutra će biti hladno. — It'll be cold tomorrow. · Bit će dobro. — It'll be fine.<br><br>Don't mix it up with <b>budem</b> (Unit {u33}): that one is only for after kad / ako: Kad budem u Zagrebu… — When I'm in Zagreb…"},
  q:[SQm("'I'll be at home.' =",["Bit ću kod kuće.","Biti ću kod kuće."],0,"Verb first → bit ću (no -i)."),
     SQt("Say: It'll be fine.",["bit će dobro"],"Bit će dobro."),
     SQm("'Sutra će biti hladno.' means…",["It'll be cold tomorrow.","It was cold yesterday."],0,"će biti = will be.")],
  p:[["Bit će dobro.","It\'ll be fine."]],
  f:[SQm("'We'll be in Split.' =",["Bit ćemo u Splitu.","Bit će mo u Splitu."],0,"ćemo is one word.")]},
 {u:16, at:4, g:{h:"Building the imperative",
   b:"Start from the <b>oni</b> form of the present (Unit {u5}):<table><tr><th>oni</th><th>ti!</th><th>vi!</th><th>let's</th></tr><tr><td class='cs'>čitaju</td><td class='hr'>čitaj</td><td class='hr'>čitajte</td><td class='hr'>čitajmo</td></tr><tr><td class='cs'>piju</td><td class='hr'>pij</td><td class='hr'>pijte</td><td class='hr'>pijmo</td></tr><tr><td class='cs'>kupuju</td><td class='hr'>kupuj</td><td class='hr'>kupujte</td><td class='hr'>kupujmo</td></tr><tr><td class='cs'>rade</td><td class='hr'>radi</td><td class='hr'>radite</td><td class='hr'>radimo</td></tr><tr><td class='cs'>pišu</td><td class='hr'>piši</td><td class='hr'>pišite</td><td class='hr'>pišimo</td></tr><tr><td class='cs'>dođu</td><td class='hr'>dođi</td><td class='hr'>dođite</td><td class='hr'>dođimo</td></tr></table>• Ends in a vowel + <b>-ju</b> (čitaju, piju, kupuju)? Drop the -ju: čitaj · pij · kupuj · daj<br>• Otherwise swap the ending for <b>-i</b>: radi · piši · idi · dođi · jedi · vidi<br>• Add <b>-te</b> for vi and <b>-mo</b> for 'let's'.<br><br><b>Odd ones:</b> reći → reci · pomoći → pomozi · biti → budi (Budi dobar! — Be good!)<br><br><b>Which verb?</b> For a one-off request use the 'done' verb (Unit {u17}): Dođi! · Napiši! For 'keep doing it', the ongoing one: Piši mi! — Write to me (from time to time)!<br><b>Don't…:</b> nemoj + -ti form (Nemoj ići!) or ne + the ongoing verb: Ne čekaj! — Don't wait!"},
  q:[SQm("'Read!' (ti) =",["Čitaj!","Čitaji!","Čitai!"],0,"čitaju → drop -ju → čitaj."),
     SQm("'Write!' (vi) =",["Pišite!","Pisajte!"],0,"pišu → piši → pišite."),
     SQt("Say: Drink water! (ti)",["pij vodu"],"piju → pij."),
     SQm("'Help me!' (ti) =",["Pomoći mi!","Pomozi mi!"],1,"pomoći → pomozi."),
     SQm("'Let's wait!' =",["Čekajmo!","Čekajte!"],0,"-mo = let's.")],
  p:[["Budi dobar!","Be good!"],["Pomozi mi!","Help me!"],["Čekajmo.","Let\'s wait."]],
  f:[SQm("'Be careful!' (to a man) =",["Budi oprezan!","Biti oprezan!"],0,"biti → budi.")]},
 {u:18, g:{h:"my and our in every case",
   b:"<table><tr><th>case</th><th>m / n</th><th>f</th></tr><tr><td class='cs'>N</td><td class='hr'>moj · moje</td><td class='hr'>moja</td></tr><tr><td class='cs'>A</td><td class='hr'>moj / mog (alive) · moje</td><td class='hr'>moju</td></tr><tr><td class='cs'>G</td><td class='hr'>mog</td><td class='hr'>moje</td></tr><tr><td class='cs'>L · D</td><td class='hr'>mom</td><td class='hr'>mojoj</td></tr><tr><td class='cs'>I</td><td class='hr'>mojim</td><td class='hr'>mojom</td></tr><tr><td class='cs'>more than one</td><td class='hr'>moji · moje · moja</td><td class='hr'>G mojih · L D I mojim</td></tr></table><b>tvoj</b> and <b>svoj</b> work exactly the same: tvog · svom · tvojoj… In writing you'll also see the longer mojeg(a), mojem(u).<br><b>naš / vaš</b>: našeg · našem · našim · našu · našoj · našom<br><b>njegov, njezin, njihov</b> change like any describing word: njegovog brata · u njezinoj kući · s njihovim psom<br><br>Idem s mojim bratom. · Pričamo o mom gradu. · Pišem mojoj mami. · Nema mog psa."},
  q:[SQm("'with my brother' =",["s mojim bratom","s mojem bratom","s mog bratom"],0,"I → mojim."),
     SQm("'to my mom' =",["mojoj mami","moju mami"],0,"D, f → mojoj."),
     SQt("Say: about my city (mom)",["o mom gradu","o mojem gradu"],"L, m → mom."),
     SQm("'in our house' =",["u naše kuće","u našoj kući"],1,"L, f → našoj."),
     SQm("'Nema mog psa.' — mog is…",["the genitive of moj","a plural"],0,"nema + genitive.")],
  p:[["s mojim bratom","with my brother"],["u našoj kući","in our house"]],
  f:[SQm("'I'm writing to our friend (m).' =",["Pišem našem prijatelju.","Pišem naš prijatelju."],0,"D, m → našem.")]},
 {u:19, g:{h:"this and that in every case",
   b:"<table><tr><th>case</th><th>m / n</th><th>f</th></tr><tr><td class='cs'>N</td><td class='hr'>taj · to</td><td class='hr'>ta</td></tr><tr><td class='cs'>A</td><td class='hr'>taj / tog (alive) · to</td><td class='hr'>tu</td></tr><tr><td class='cs'>G</td><td class='hr'>tog</td><td class='hr'>te</td></tr><tr><td class='cs'>L · D</td><td class='hr'>tom</td><td class='hr'>toj</td></tr><tr><td class='cs'>I</td><td class='hr'>tim</td><td class='hr'>tom</td></tr><tr><td class='cs'>more than one</td><td class='hr'>ti · te · ta</td><td class='hr'>G tih · L D I tim</td></tr></table><b>ovaj</b> and <b>onaj</b> are the same with ov- / on-: ovog · ovom · ovim · ovoj · ovu · onog · onom · onoj…<br>u ovom gradu · s tom ženom · kod tog čovjeka · Čitam ovu knjigu.<br><br><b>Pointing and naming: always to / ovo / ono.</b> When you say 'this is…' or 'that's…', the pointing word stays neuter, whatever the thing is:<br>To je moja sestra. (not Ta je…) · Ovo je moj brat. · To su moji prijatelji. The verb still matches: je for one, su for more."},
  q:[SQm("'in this city' =",["u ovaj grad","u ovom gradu"],1,"Being somewhere → locative → ovom."),
     SQm("'That's my sister.' =",["Ta je moja sestra.","To je moja sestra."],1,"Pointing and naming → to."),
     SQt("Say: with that woman",["s tom ženom"],"I, f → tom."),
     SQm("'This is my brother.' =",["Ovaj je moj brat.","Ovo je moj brat."],1,"Pointing → ovo."),
     SQm("'Ne znam tog čovjeka.' — tog is…",["the accusative (alive) of taj","a typo"],0,"Alive masculine → tog.")],
  p:[["To je moja sestra.","That\'s my sister."],["u ovom gradu","in this city"]],
  f:[SQm("'Those are my friends.' =",["To su moji prijatelji.","Ti su moji prijatelji."],0,"Pointing → to, with su for more than one.")]},
 {u:20, at:1, g:{h:"How -iji, -ji and -ši work",
   b:"<table><tr><th>pattern</th><th>examples</th></tr><tr><td class='cs'>-iji — most words</td><td class='hr'>star → stariji · nov → noviji · jeftin → jeftiniji · pametan → pametniji</td></tr><tr><td class='cs'>-ji — many short words; the letter changes</td><td class='hr'>brz → brži · jak → jači · drag → draži · tih → tiši · mlad → mlađi · žut → žući · skup → skuplji · grub → grublji</td></tr><tr><td class='cs'>-ši — only a few</td><td class='hr'>lijep → ljepši · lak → lakši · mek → mekši</td></tr></table>With <b>-ji</b> the j merges with the letter before it (Unit {u24}): z → ž · k → č · g → ž · h → š · d → đ · t → ć · p → plj · b → blj<br><br><b>Irregular, just learn them:</b> dobar → bolji · loš → gori · velik → veći · malen → manji · dug → duži · visok → viši · nizak → niži · kratak → kraći · težak → teži · širok → širi<br><br>Comparatives are describing words, so they change too: bolji grad · bolja kava · bolje pivo · u boljem gradu · s boljim ljudima"},
  q:[SQm("Comparative of 'star' (old):",["starši","stariji","starji"],1,"Most words → -iji."),
     SQm("Comparative of 'jak' (strong):",["jakiji","jači"],1,"k + j → č."),
     SQt("Comparative of 'mlad' (young):",["mlađi"],"d + j → đ."),
     SQm("'a better coffee' =",["bolji kava","bolja kava"],1,"kava is feminine → bolja."),
     SQm("Comparative of 'tih' (quiet):",["tihiji","tiši"],1,"h + j → š.")],
  p:[["stariji brat","older brother"],["mlađa sestra","younger sister"]],
  f:[SQm("Comparative of 'skup' (expensive):",["skupiji","skuplji"],1,"p + j → plj.")]},
 {u:39, g:{h:"Hundreds, thousands and years",
   b:"<table><tr><th>number</th><th>Croatian</th></tr><tr><td class='cs'>100</td><td class='hr'>sto</td></tr><tr><td class='cs'>200</td><td class='hr'>dvjesto</td></tr><tr><td class='cs'>300</td><td class='hr'>tristo</td></tr><tr><td class='cs'>400</td><td class='hr'>četiristo</td></tr><tr><td class='cs'>500</td><td class='hr'>petsto</td></tr><tr><td class='cs'>1,000</td><td class='hr'>tisuću (jedna tisuća)</td></tr><tr><td class='cs'>2,000</td><td class='hr'>dvije tisuće</td></tr><tr><td class='cs'>5,000</td><td class='hr'>pet tisuća</td></tr><tr><td class='cs'>1,000,000</td><td class='hr'>milijun · dva milijuna · pet milijuna</td></tr></table><b>tisuća</b> is a feminine word and <b>milijun</b> a masculine one, so they follow the 1 / 2–4 / 5+ rule themselves: dvije tisuće · pet tisuća · dva milijuna.<br><br><b>Years</b> are said as 'the 2026th', and 'in 2026' uses the genitive (Unit {u31}):<br>2026. — dvije tisuće dvadeset šesta<br>in 2026 — 2026. godine — dvije tisuće dvadeset šeste godine<br>Rođen sam 2008. godine. — …dvije tisuće osme godine<br>devedesetih — in the nineties"},
  q:[SQm("'200' =",["dvasto","dvjesto"],1,"dvjesto."),
     SQm("'5,000 euros' =",["pet tisuće eura","pet tisuća eura"],1,"5+ → tisuća."),
     SQm("'in 2020' (written) =",["2020. godine","2020 godina"],0,"Genitive, with the dot."),
     SQt("Say: two thousand",["dvije tisuće"],"tisuća is feminine → dvije tisuće.")],
  p:[["dvije tisuće","two thousand"],["devedesetih","in the nineties"]],
  f:[SQm("'three million' =",["tri milijuna","tri milijun"],0,"2–4 → milijuna.")]},
 {u:23, g:{h:"koji in every case",
   b:"<table><tr><th>case</th><th>m / n</th><th>f</th></tr><tr><td class='cs'>N</td><td class='hr'>koji · koje</td><td class='hr'>koja</td></tr><tr><td class='cs'>A</td><td class='hr'>koji / kojeg (alive) · koje</td><td class='hr'>koju</td></tr><tr><td class='cs'>G</td><td class='hr'>kojeg</td><td class='hr'>koje</td></tr><tr><td class='cs'>L · D</td><td class='hr'>kojem</td><td class='hr'>kojoj</td></tr><tr><td class='cs'>I</td><td class='hr'>kojim</td><td class='hr'>kojom</td></tr><tr><td class='cs'>more than one</td><td class='hr'>koji · koje · koja</td><td class='hr'>G kojih · L D I kojim</td></tr></table>Gender comes from the noun; the case comes from its job in its own part of the sentence:<br>Čovjek kojeg vidim… — the man I see (alive, being seen)<br>Prijatelj s kojim radim… — the friend I work with<br>Djevojka kojoj pišem… — the girl I'm writing to<br>Knjiga o kojoj pričam… — the book I'm talking about<br><br>In speech <b>što</b> often stands in for the simple cases: čovjek što govori… — the man who's speaking."},
  q:[SQm("'the friend I work with' =",["prijatelj s koji radim","prijatelj s kojim radim"],1,"s + instrumental → kojim."),
     SQm("'the girl I'm writing to' =",["djevojka koju pišem","djevojka kojoj pišem"],1,"pisati + dative → kojoj."),
     SQm("'the man I see' =",["čovjek kojeg vidim","čovjek koji vidim"],0,"Alive and being seen → kojeg.")],
  p:[["prijatelj s kojim radim","the friend I work with"]],
  f:[SQm("'the book I'm talking about' =",["knjiga o kojoj pričam","knjiga o koju pričam"],0,"o + locative → kojoj.")]},
 {u:23, g:{h:"both… and, either… or, so that",
   b:"<table><tr><th>pair</th><th>means</th><th>example</th></tr><tr><td class='cs'>i … i</td><td class='hr'>both … and</td><td class='hr'>I Ana i Marko su ovdje.</td></tr><tr><td class='cs'>ili … ili</td><td class='hr'>either … or</td><td class='hr'>Ili sada ili nikad.</td></tr><tr><td class='cs'>ni … ni</td><td class='hr'>neither … nor</td><td class='hr'>Ne pijem ni kavu ni čaj.</td></tr><tr><td class='cs'>ne samo … nego i</td><td class='hr'>not only … but also</td><td class='hr'>Govori ne samo hrvatski nego i engleski.</td></tr></table>With <b>ni … ni</b> the verb still gets <b>ne</b> (the double negative, Unit {u5}).<br><br><b>so that / to:</b> da + present, or da / kako + bih, bi… (Unit {u16}):<br>Došao sam da te vidim. — I came to see you.<br>Učim hrvatski da bih mogao razgovarati s bakom. — I'm learning Croatian so I can talk with Grandma."},
  q:[SQm("'I drink neither coffee nor tea.' =",["Ne pijem ni kavu ni čaj.","Pijem ni kavu ni čaj."],0,"ni … ni still needs ne on the verb."),
     SQm("'either now or never' =",["ili sada ili nikad","i sada i nikad"],0,"ili … ili."),
     SQt("Say: I came to see you.",["došao sam da te vidim","došla sam da te vidim"],"da + present."),
     SQm("'both Ana and Marko' =",["i Ana i Marko","ni Ana ni Marko"],0,"i … i.")],
  p:[["Ili sada ili nikad.","Now or never."],["Došao sam da te vidim.","I came to see you."]],
  f:[SQm("'Učim da bih razumio' means…",["I study so that I understand","I studied and understood"],0,"da bih = so that I.")]},
);
EXTRA_STEPS.forEach(x => {
  const u = UNITS.find(v => v.id === x.u); if(!u) return;
  PHR[x.u] = PHR[x.u] || [];
  while(PHR[x.u].length < u.grammar.length) PHR[x.u].push([]);
  if(x.at != null){                                        // a step that belongs earlier in its unit
    u.grammar.splice(x.at, 0, x.g); STEP_Q[x.u].splice(x.at, 0, x.q); PHR[x.u].splice(x.at, 0, x.p || []);

    {h:"Inviting", lines:[
      ["Ideš na kavu?","Want to go for a coffee?"],
      ["Hoćeš izaći večeras?","Do you want to go out tonight?"],
      ["Imaš li vremena…?","Do you have time…?"],
      ["Što radiš u subotu?","What are you doing on Saturday?"],
      ["Jesi li slobodan / slobodna?","Are you free? (m / f)"],
      ["Dođi s nama!","Come with us!"]
    ]},
    {h:"Agreeing", lines:[
      ["Može!","Sure!"],
      ["Naravno!","Of course!"],
      ["Odgovara mi.","That works for me."],
      ["Dogovoreno.","Agreed / deal."],
      ["Rado.","Gladly."],
      ["Vidimo se!","See you!"]
    ]},
    {h:"Fixing the time and place", lines:[
      ["U koliko sati?","What time?"],
      ["Oko pet.","Around five."],
      ["Gdje se nalazimo?","Where shall we meet?"],
      ["Kod Trga.","By the square."],
      ["Ispred kina.","In front of the cinema."],
      ["Javim ti se.","I'll be in touch."]
    ]},
    {h:"Saying no nicely", lines:[
      ["Ne mogu, žao mi je.","I can't, sorry."],
      ["Možda drugi put.","Maybe another time."],
      ["Imam nešto drugo.","I've got something else on."],
      ["Baš sam zauzet / zauzeta.","I'm really busy. (m / f)"],
      ["Kasnim, oprosti.","I'm running late, sorry."],
      ["Moram otkazati.","I have to cancel."]
    ]}
  ],
  tips:"<b>Može</b> is the workhorse here. It means <em>OK</em>, <em>sure</em>, <em>that works</em>, and as a question <em>Može?</em> means <em>is that alright with you?</em> You'll hear it a hundred times a day.<br><br><b>Javim ti se</b> — literally <em>I'll let you know</em> — is how Croatians end loose plans. It's genuine, not a brush-off.<br><br><b>Turning someone down:</b> add a reason, however vague. <em>Ne mogu</em> alone is blunt; <em>Ne mogu, imam nešto drugo</em> is normal and completely fine.",
  drills:[
    {t:"type",q:"Ask a friend: Want to go for a coffee?",a:["ideš na kavu","ides na kavu","hoćeš na kavu"],e:"Ideš na kavu?"},
    {t:"mc",q:"Someone suggests 5pm. You agree:",o:["Nema veze","Odgovara mi","Ovisi","Žao mi je"],a:1,e:"Odgovara mi — that works for me."},
    {t:"type",q:"Ask: What time?",a:["u koliko sati","koliko sati"],e:"U koliko sati?"},
    {t:"type",q:"Decline politely: I can't, sorry.",a:["ne mogu žao mi je","ne mogu zao mi je","ne mogu, žao mi je"],e:"Ne mogu, žao mi je."},
    {t:"mc",q:"'Javim ti se' means:",o:["I'm leaving","I'll let you know","I agree","I forgot"],a:1,e:"It's how loose plans are left."},
    {t:"type",q:"Ask: Where shall we meet?",a:["gdje se nalazimo","gdje se vidimo"],e:"Gdje se nalazimo?"}
  ]
},
{
  id:"s6", title:"Small talk", sub:"Ćaskanje",
  goal:"Fill the gaps. Weather, weekends, how things are going — the glue of every conversation.",
  dialogue:[
    ["A","Kako ide?","How's it going?"],
    ["B","Dobro, a ti?","Good, and you?"],
    ["A","Ne mogu se žaliti. Kakvo vrijeme danas!","Can't complain. What weather today!"],
    ["B","Znam, prelijepo je. Konačno sunce.","I know, it's gorgeous. Finally some sun."],
    ["A","Što radiš ovaj vikend?","What are you doing this weekend?"],
    ["B","Ništa posebno. Možda idem na more.","Nothing special. Maybe I'll go to the coast."],
    ["A","Baš lijepo. Uživaj!","Very nice. Enjoy!"]
  ],
  blocks:[
    {h:"How are you, really", lines:[
      ["Kako ide?","How's it going?"],
      ["Kako si?","How are you?"],
      ["Što ima?","What's up?"],
      ["Dobro sam, a ti?","I'm good, and you?"],
      ["Ne mogu se žaliti.","Can't complain."],
      ["Moglo bi bolje.","Could be better."],
      ["Ide nekako.","Getting by."]
    ]},
    {h:"Weather", lines:[
      ["Kakvo je vrijeme?","What's the weather like?"],
      ["Lijepo je danas.","It's nice today."],
      ["Vruće je.","It's hot."],
      ["Hladno je.","It's cold."],
      ["Pada kiša.","It's raining."],
      ["Konačno sunce!","Finally some sun!"]
    ]},
    {h:"Weekend and plans", lines:[
      ["Što radiš ovaj vikend?","What are you doing this weekend?"],
      ["Ništa posebno.","Nothing special."],
      ["Odmaram se.","I'm resting."],
      ["Kako je bilo?","How was it?"],
      ["Bilo je super.","It was great."],
      ["Uživaj!","Enjoy!"]
    ]},
    {h:"Reacting", lines:[
      ["Stvarno?","Really?"],
      ["Fakat?","Seriously?"],
      ["Baš lijepo.","How nice."],
      ["Ma daj!","Come on! / No way!"],
      ["Šteta.","That's a shame."],
      ["Drago mi je zbog tebe.","I'm glad for you."]
    ]}
  ],
  tips:"<b>Reacting matters more than talking.</b> A well-placed <em>Stvarno?</em> or <em>Baš lijepo</em> keeps a conversation alive while you think. Learners often go silent while composing a sentence; a two-word reaction buys you five seconds and sounds natural.<br><br><b>Kako ide?</b> is friendlier than <em>Kako si?</em> among people your age.<br><br><b>Weather is the safest topic in the language.</b> If you're stuck with someone and have nothing to say, <em>Kakvo vrijeme!</em> always works.",
  drills:[
    {t:"type",q:"Ask a friend: How's it going?",a:["kako ide"],e:"Kako ide?"},
    {t:"mc",q:"Someone shares good news. Best reaction?",o:["Šteta.","Baš lijepo!","Ne znam.","Možda."],a:1,e:"Baš lijepo — how nice."},
    {t:"type",q:"Say: It's raining.",a:["pada kiša","pada kisa"],e:"Pada kiša."},
    {t:"type",q:"Say: Nothing special.",a:["ništa posebno","nista posebno"],e:"Ništa posebno."},
    {t:"mc",q:"'Ne mogu se žaliti' means:",o:["I can't complain","I don't want to talk","I'm not well","I can't come"],a:0,e:"A modest 'I'm doing fine'."},
    {t:"type",q:"React: Really?",a:["stvarno","fakat"],e:"Stvarno? or Fakat?"}
  ]
},
{
  id:"s7", title:"Opinions and disagreeing", sub:"Mišljenje",
  goal:"Say what you think, push back politely, and hold your own in a real conversation.",
  dialogue:[
    ["A","Mislim da je Split ljepši od Zagreba.","I think Split is nicer than Zagreb."],
    ["B","Stvarno? Ja se ne slažem.","Really? I disagree."],
    ["A","Zašto?","Why?"],
    ["B","Zagreb ima više toga. Kafići, koncerti…","Zagreb has more going on. Cafés, concerts…"],
    ["A","Imaš pravo, ali more je more.","You're right, but the sea is the sea."],
    ["B","To je istina.","That's true."],
    ["A","Svakome svoje.","To each their own."]
  ],
  blocks:[
    {h:"Saying what you think", lines:[
      ["Mislim da…","I think that…"],
      ["Po meni…","In my opinion…"],
      ["Čini mi se da…","It seems to me that…"],
      ["Siguran sam da…","I'm sure that… (m)"],
      ["Nisam siguran.","I'm not sure. (m)"],
      ["Ovisi.","It depends."]
    ]},
    {h:"Agreeing", lines:[
      ["Slažem se.","I agree."],
      ["Imaš pravo.","You're right."],
      ["To je istina.","That's true."],
      ["Točno tako.","Exactly."],
      ["I ja mislim tako.","I think so too."]
    ]},
    {h:"Disagreeing without a fight", lines:[
      ["Ne slažem se.","I disagree."],
      ["Nisam siguran u to.","I'm not sure about that."],
      ["Možda, ali…","Maybe, but…"],
      ["Razumijem te, ali…","I understand you, but…"],
      ["Ja to vidim drugačije.","I see it differently."],
      ["Svakome svoje.","To each their own."]
    ]},
    {h:"Liking and not liking", lines:[
      ["Sviđa mi se.","I like it."],
      ["Ne sviđa mi se.","I don't like it."],
      ["Volim…","I love…"],
      ["Mrzim…","I hate…"],
      ["Nije loše.","Not bad."],
      ["Baš mi je super.","I really love it."]
    ]}
  ],
  tips:"<b>Mislim da</b> is your safest opener for any opinion. Unlike English, you can never drop the <em>da</em>.<br><br><b>Croatians disagree openly and it isn't rude.</b> A flat <em>Ne slažem se</em> is normal and won't offend anyone. Softening it endlessly can actually read as evasive.<br><br><b>Liking works backwards.</b> <em>Sviđa mi se</em> literally means <em>it is pleasing to me</em> — the thing is the subject, not you. So for plural things it becomes <em>Sviđaju mi se</em>.",
  drills:[
    {t:"type",q:"Say: I think that's a good idea.",a:["mislim da je to dobra ideja"],e:"Mislim da je to dobra ideja."},
    {t:"type",q:"Say: I disagree.",a:["ne slažem se","ne slazem se"],e:"Ne slažem se."},
    {t:"mc",q:"'Svakome svoje' means:",o:["Everyone is wrong","To each their own","All of us agree","Nobody knows"],a:1,e:"A polite way to close a difference of opinion."},
    {t:"type",q:"Say: You're right.",a:["imaš pravo","imas pravo"],e:"Imaš pravo."},
    {t:"mc",q:"'I like these books' =",o:["Sviđa mi se ove knjige","Sviđaju mi se ove knjige","Volim se ove knjige","Sviđam ove knjige"],a:1,e:"Plural thing → sviđaju."},
    {t:"type",q:"Say: It depends.",a:["ovisi"],e:"Ovisi."}
  ]
},
{
  id:"s8", title:"Talking about yourself", sub:"O sebi",
  goal:"Answer the questions everyone asks: family, school, work, hobbies — without freezing.",
  dialogue:[
    ["A","Imaš li braće i sestara?","Do you have brothers and sisters?"],
    ["B","Imam jednu sestru. Mlađa je od mene.","I have one sister. She's younger than me."],
    ["A","A čime se baviš?","And what do you do?"],
    ["B","Idem u srednju školu. Zadnja godina.","I'm in high school. Final year."],
    ["A","Znaš li već što ćeš studirati?","Do you know what you'll study yet?"],
    ["B","Razmišljam o ekonomiji.","I'm thinking about economics."],
    ["A","Super. A u slobodno vrijeme?","Nice. And in your free time?"],
    ["B","Volim sport i učim jezike.","I like sport and I learn languages."]
  ],
  blocks:[
    {h:"Family", lines:[
      ["Imaš li braće i sestara?","Do you have siblings?"],
      ["Imam brata i sestru.","I have a brother and a sister."],
      ["Jedinac sam / Jedinica sam.","I'm an only child. (m / f)"],
      ["Stariji je od mene.","He's older than me."],
      ["Živim s roditeljima.","I live with my parents."],
      ["Baka mi je iz Hrvatske.","My grandma is from Croatia."]
    ]},
    {h:"School and work", lines:[
      ["Čime se baviš?","What do you do?"],
      ["Idem u školu.","I go to school."],
      ["Studiram…","I study…"],
      ["Radim u…","I work at…"],
      ["Zadnja mi je godina.","It's my final year."],
      ["Želim studirati…","I want to study…"]
    ]},
    {h:"Free time", lines:[
      ["U slobodno vrijeme…","In my free time…"],
      ["Volim čitati.","I like reading."],
      ["Bavim se sportom.","I do sport."],
      ["Sviram gitaru.","I play guitar."],
      ["Gledam serije.","I watch series."],
      ["Učim hrvatski.","I'm learning Croatian."]
    ]},
    {h:"Where you live", lines:[
      ["Odakle si?","Where are you from?"],
      ["Živim u…","I live in…"],
      ["Rođen sam u… / Rođena sam u…","I was born in… (m / f)"],
      ["Tu sam cijeli život.","I've been here my whole life."],
      ["Preselili smo se prije dvije godine.","We moved two years ago."]
    ]}
  ],
  tips:"<b>Prepare three sentences about yourself and drill them until they're automatic.</b> Who you are, what you do, why you're learning Croatian. You'll be asked all three within five minutes of meeting anyone, and having them ready means you start every conversation sounding better than you are.<br><br><b>Čime se baviš?</b> is broader than <em>what's your job</em> — it covers studies, hobbies, whatever you're into. Safe to ask anyone.<br><br><b>Croatians will ask about family early.</b> It isn't nosy, it's normal.",
  drills:[
    {t:"type",q:"Say: I have one sister.",a:["imam jednu sestru"],e:"Imam jednu sestru."},
    {t:"type",q:"Say: I'm learning Croatian.",a:["učim hrvatski","ucim hrvatski"],e:"Učim hrvatski."},
    {t:"mc",q:"'Čime se baviš?' asks:",o:["Where do you live?","What are you into?","How old are you?","Who are you with?"],a:1,e:"Covers work, study and hobbies."},
    {t:"type",q:"Say: I live with my parents.",a:["živim s roditeljima","zivim s roditeljima"],e:"Živim s roditeljima."},
    {t:"mc",q:"A woman says 'I was born in Split':",o:["Rođen sam u Splitu","Rođena sam u Splitu","Rođeno sam u Splitu","Rodila u Splitu"],a:1,e:"Feminine takes rođena."},
    {t:"type",q:"Say: In my free time I like reading.",a:["u slobodno vrijeme volim čitati","u slobodno vrijeme volim citati"],e:"U slobodno vrijeme volim čitati."}
  ]
},
{
  id:"s9", title:"Getting around", sub:"Snalaženje",
  goal:"Directions, tickets, transport — and what to do when you're lost.",
  dialogue:[
    ["A","Oprostite, kako da dođem do Trga?","Excuse me, how do I get to the square?"],
    ["B","Idite ravno pa skrenite desno.","Go straight, then turn right."],
    ["A","Je li daleko?","Is it far?"],
    ["B","Ne, pet minuta pješke.","No, five minutes on foot."],
    ["A","A gdje mogu kupiti kartu za tramvaj?","And where can I buy a tram ticket?"],
    ["B","Na kiosku, tamo iza ugla.","At the kiosk, round the corner there."],
    ["A","Puno hvala!","Thanks a lot!"],
    ["B","Nema na čemu.","You're welcome."]
  ],
  blocks:[
    {h:"Asking the way", lines:[
      ["Kako da dođem do…?","How do I get to…?"],
      ["Gdje je…?","Where is…?"],
      ["Je li daleko?","Is it far?"],
      ["Možete li mi pokazati na karti?","Can you show me on the map?"],
      ["Izgubio sam se. / Izgubila sam se.","I'm lost. (m / f)"],
      ["Jesam li na dobrom putu?","Am I going the right way?"]
    ]},
    {h:"Directions you'll hear", lines:[
      ["Ravno","Straight ahead"],
      ["Lijevo / Desno","Left / Right"],
      ["Skrenite desno.","Turn right."],
      ["Prvo lijevo.","First left."],
      ["Iza ugla","Round the corner"],
      ["Preko puta","Opposite"],
      ["Pored banke","Next to the bank"],
      ["Pet minuta pješke","Five minutes on foot"]
    ]},
    {h:"Tickets and transport", lines:[
      ["Jednu kartu, molim.","One ticket, please."],
      ["Kada polazi vlak za Split?","When does the train to Split leave?"],
      ["S kojeg perona?","From which platform?"],
      ["Koliko traje put?","How long does the journey take?"],
      ["Je li ovo pravi autobus?","Is this the right bus?"],
      ["Gdje trebam izaći?","Where should I get off?"]
    ]},
    {h:"If it goes wrong", lines:[
      ["Propustio sam autobus.","I missed the bus. (m)"],
      ["Vlak kasni.","The train is late."],
      ["Ne znam gdje sam.","I don't know where I am."],
      ["Možete li mi pomoći, molim vas?","Could you help me, please?"]
    ]}
  ],
  tips:"<b>Ask for directions in a shop, not on the street.</b> Someone standing behind a counter has time and isn't going anywhere. People rushing past often give a quick answer you won't catch.<br><br><b>Buy tram tickets at a kiosk</b> before boarding — they're cheaper than on board, and you must validate them in the machine when you get on.<br><br><b>If you catch nothing of the answer,</b> say <em>Možete li pokazati?</em> and offer your phone map. Pointing beats a perfect sentence.",
  drills:[
    {t:"type",q:"Ask: How do I get to the square?",a:["kako da dođem do trga","kako da dodem do trga"],e:"Kako da dođem do Trga?"},
    {t:"mc",q:"'Skrenite desno' means:",o:["Go straight","Turn right","Turn left","Stop here"],a:1,e:"desno = right."},
    {t:"type",q:"Say (male): I'm lost.",a:["izgubio sam se"],e:"Izgubio sam se."},
    {t:"type",q:"Ask: Is it far?",a:["je li daleko","jel daleko"],e:"Je li daleko?"},
    {t:"mc",q:"'S kojeg perona?' asks about:",o:["The price","The platform","The time","The driver"],a:1,e:"peron = platform."},
    {t:"type",q:"Ask: Where should I get off?",a:["gdje trebam izaći","gdje trebam izaci"],e:"Gdje trebam izaći?"}
  ]
},
{
  id:"s10", title:"When something's wrong", sub:"Problemi",
  goal:"Complain politely, ask for help, and handle the moments where your Croatian matters most.",
  dialogue:[
    ["A","Oprostite, mislim da ovo nije moja narudžba.","Excuse me, I don't think this is my order."],
    ["B","Oh, ispričavam se. Što ste naručili?","Oh, my apologies. What did you order?"],
    ["A","Naručio sam juhu, ne salatu.","I ordered soup, not salad."],
    ["B","Odmah ću zamijeniti.","I'll swap it right away."],
    ["A","Hvala vam.","Thank you."],
    ["B","Nema problema, žao mi je zbog toga.","No problem, sorry about that."]
  ],
  blocks:[
    {h:"Complaining politely", lines:[
      ["Oprostite, mislim da…","Excuse me, I think that…"],
      ["Ovo nije ono što sam naručio.","This isn't what I ordered. (m)"],
      ["Mislim da je greška u računu.","I think there's a mistake in the bill."],
      ["Možete li provjeriti?","Could you check?"],
      ["Ne radi.","It's not working."],
      ["Pokvareno je.","It's broken."]
    ]},
    {h:"Asking for help", lines:[
      ["Trebam pomoć.","I need help."],
      ["Možete li mi pomoći?","Can you help me?"],
      ["Ne znam što da radim.","I don't know what to do."],
      ["Koga da pitam?","Who should I ask?"],
      ["Gdje je najbliža ljekarna?","Where's the nearest pharmacy?"]
    ]},
    {h:"Not feeling well", lines:[
      ["Ne osjećam se dobro.","I don't feel well."],
      ["Boli me glava.","I have a headache."],
      ["Boli me trbuh.","My stomach hurts."],
      ["Trebam liječnika.","I need a doctor."],
      ["Alergičan sam na… / Alergična sam na…","I'm allergic to… (m / f)"],
      ["Imam temperaturu.","I have a fever."]
    ]},
    {h:"Emergencies", lines:[
      ["Upomoć!","Help!"],
      ["Zovite hitnu!","Call an ambulance!"],
      ["Zovite policiju!","Call the police!"],
      ["Ukrali su mi torbu.","My bag has been stolen."],
      ["Izgubio sam putovnicu.","I've lost my passport. (m)"]
    ]}
  ],
  tips:"<b>Oprostite, mislim da…</b> is the whole trick to complaining in Croatian. It turns an accusation into an observation, and people respond well to it.<br><br><b>Boljeti works backwards.</b> <em>Boli me glava</em> literally means <em>the head hurts me</em> — the body part is the subject. So it's <em>Bole me noge</em> for legs, plural.<br><br><b>Emergency number in Croatia is 112.</b> Worth knowing before you need it.",
  drills:[
    {t:"type",q:"Say: I don't feel well.",a:["ne osjećam se dobro","ne osjecam se dobro"],e:"Ne osjećam se dobro."},
    {t:"type",q:"Say: I have a headache.",a:["boli me glava"],e:"Boli me glava — literally 'the head hurts me'."},
    {t:"mc",q:"Politest way to start a complaint:",o:["Ovo je pogrešno!","Oprostite, mislim da…","Zašto ste to napravili?","Ne valja."],a:1,e:"Softens it into an observation."},
    {t:"type",q:"Say: I need help.",a:["trebam pomoć","trebam pomoc"],e:"Trebam pomoć."},
    {t:"mc",q:"Emergency number in Croatia:",o:["911","112","999","100"],a:1,e:"112 across the EU."},
    {t:"type",q:"Say: It's not working.",a:["ne radi"],e:"Ne radi."}
  ]
},
{
  id:"s11", title:"Telling a story", sub:"Pričanje",
  goal:"Say what happened. Ordering events is what turns sentences into conversation.",
  dialogue:[
    ["A","Kako je bilo na moru?","How was it at the coast?"],
    ["B","Bilo je super! Prvo smo išli u Split.","It was great! First we went to Split."],
    ["A","I onda?","And then?"],
    ["B","Onda smo uzeli trajekt za Hvar.","Then we took the ferry to Hvar."],
    ["A","Koliko ste ostali?","How long did you stay?"],
    ["B","Tjedan dana. Na kraju nismo htjeli otići.","A week. In the end we didn't want to leave."],
    ["A","Vjerujem!","I bet!"]
  ],
  blocks:[
    {h:"Ordering events", lines:[
      ["Prvo…","First…"],
      ["Onda… / Zatim…","Then…"],
      ["Poslije toga…","After that…"],
      ["Na kraju…","In the end…"],
      ["Odjednom…","Suddenly…"],
      ["Dok smo…","While we were…"]
    ]},
    {h:"When it happened", lines:[
      ["Jučer","Yesterday"],
      ["Prošli tjedan","Last week"],
      ["Prošle godine","Last year"],
      ["Prije dva dana","Two days ago"],
      ["Kad sam bio mali / bila mala","When I was little (m / f)"],
      ["Nedavno","Recently"]
    ]},
    {h:"Reacting to a story", lines:[
      ["I onda?","And then?"],
      ["Stvarno?","Really?"],
      ["Ma daj!","No way!"],
      ["Vjerujem.","I bet."],
      ["Kako je bilo?","How was it?"],
      ["Šteta.","That's a shame."]
    ]},
    {h:"Saying how it was", lines:[
      ["Bilo je super.","It was great."],
      ["Bilo je grozno.","It was awful."],
      ["Bilo je zanimljivo.","It was interesting."],
      ["Nikad neću zaboraviti.","I'll never forget it."],
      ["Bilo je prvi put.","It was the first time."]
    ]}
  ],
  tips:"<b>Prvo, onda, na kraju</b> will carry a whole story on their own. Even with shaky grammar, sequencing words make you easy to follow — and following is what listeners actually need.<br><br><b>Remember the past tense agrees with you.</b> A man says <em>išao sam</em>, a woman says <em>išla sam</em>. Drill your own form until it's automatic; you'll use it in every story you ever tell.<br><br><b>I onda?</b> is how you show you're listening. Say it and the other person keeps going — which is free practice for you.",
  drills:[
    {t:"type",q:"Say (female): I went to Split.",a:["išla sam u split","isla sam u split"],e:"Išla sam u Split."},
    {t:"type",q:"Say: It was great.",a:["bilo je super"],e:"Bilo je super."},
    {t:"mc",q:"Which orders a story correctly?",o:["Na kraju, onda, prvo","Prvo, onda, na kraju","Onda, prvo, na kraju","Prvo, na kraju, onda"],a:1,e:"First, then, in the end."},
    {t:"type",q:"Ask: How was it?",a:["kako je bilo"],e:"Kako je bilo?"},
    {t:"mc",q:"A man says 'I was in Zagreb':",o:["Bila sam u Zagrebu","Bio sam u Zagrebu","Bili smo u Zagrebu","Bilo je u Zagrebu"],a:1,e:"Male speaker: bio sam."},
    {t:"type",q:"Encourage them to continue: And then?",a:["i onda"],e:"I onda?"}
  ]
},
{
  id:"s12", title:"Being polite", sub:"Pristojnost",
  goal:"Thanks, apologies, compliments and invitations — the social oil of every language.",
  dialogue:[

/* ============================================================
   STATE + STORAGE
   ============================================================ */
const Store = (()=>{
  const mem = {};
  let LS = null;
  try{ const t="__pl"; window.localStorage.setItem(t,"1"); window.localStorage.removeItem(t); LS = window.localStorage; }catch(e){ LS = null; }
  const CS = (typeof window!=="undefined" && window.storage && typeof window.storage.get==="function") ? window.storage : null;
  const mode = LS ? "local" : CS ? "claude" : "none";
  return {
    mode, persistent: mode!=="none",
    async get(k){
      if(LS){ try{ const v = LS.getItem(k); if(v!=null) return JSON.parse(v); }catch(e){} }
      if(CS){ try{ const r = await CS.get(k); if(r) return JSON.parse(r.value); }catch(e){} }
      return mem[k] ?? null;
    },
    async set(k,v){
      mem[k] = v;
      if(LS){ try{ LS.setItem(k, JSON.stringify(v)); return; }catch(e){} }
      if(CS){ try{ await CS.set(k, JSON.stringify(v)); }catch(e){} }
    },

const $  = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const esc = s => String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm = s => String(s).toLowerCase().trim()
  .replace(/[.,!?;:]/g,"").replace(/\s+/g," ")
  .replace(/č/g,"c").replace(/ć/g,"c").replace(/š/g,"s").replace(/ž/g,"z").replace(/đ/g,"d");
// One or two stray letters is a typo, not a failure to know the answer.
// Accept it, but show the exact spelling so the right form is what sticks.
function editDistance(a, b){
  if(a === b) return 0;
  const m = a.length, n = b.length;
  if(Math.abs(m - n) > 2) return 99;
  let prev = Array.from({length: n + 1}, (_, i) => i);
  for(let i = 1; i <= m; i++){
    const cur = [i];
    for(let j = 1; j <= n; j++){
      cur[j] = Math.min(prev[j] + 1, cur[j-1] + 1, prev[j-1] + (a[i-1] === b[j-1] ? 0 : 1));
    }
    prev = cur;
  }
  return prev[n];
}
/* Exact spelling, every ending must be right (plaži ≠ plažu). Two things are
   forgiven: missing accents (č ć š ž đ → c c s z d) and word order. */
function checkTyped(input, accepted){
  const bag = s => norm(s).split(" ").filter(Boolean).sort().join(" ");
  const bagAcc = s => String(s).toLowerCase().replace(/[.,!?;:…"'„“”]/g, "").split(/\s+/).filter(Boolean).sort().join(" ");
  const v = bag(input);
  if(!v) return { ok:false, typo:false };
  for(const a of accepted){
    if(bag(a) === v){
      // right answer — but if the accents were left off, show the proper spelling
      const accents = bagAcc(input) !== bagAcc(a) && /[čćšžđ]/i.test(a);
      return { ok:true, typo:accents, meant:a };
    }
  }
  return { ok:false, typo:false };
}

      || VOICES.find(v => /^hr/i.test(v.lang))
      || VOICES.find(v => /^(bs|sr|sl)/i.test(v.lang))     // very close neighbours
      || VOICES.find(v => /^(pl|cs|sk)/i.test(v.lang))     // Slavic, imperfect but not English

const VOICES_NATURAL = [

const ttsVoice = () => S.voice === "Puck" ? "Fenrir" : VOICES_NATURAL.some(v => v[0] === S.voice) ? S.voice : "Kore";
const TTS_INFLIGHT = new Map();                          // one request per sentence, even if tapped twice
function ttsClip(text, voice, only){
  voice = voice || ttsVoice();
  const k = voice + "|" + text + (only ? "|only" : "");
  if(!TTS_INFLIGHT.has(k)) TTS_INFLIGHT.set(k, ttsClipFetch(text, voice, only).finally(() => TTS_INFLIGHT.delete(k)));
  return TTS_INFLIGHT.get(k);
}
async function ttsClipFetch(text, voice, only){
  const key = voice === "Kore" ? "/tts/" + encodeURIComponent(text) : "/tts/" + voice + "/" + encodeURIComponent(text);
  let c = null;
  try{ c = await caches.open("nauci-tts"); const hit = await c.match(key); if(hit) return await hit.blob(); }catch(e){}
  const r = await fetch("/api/tts", { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify(only ? { text, voice, only: true } : { text, voice }) });
  if(!r.ok) throw new Error("TTS " + r.status);
  const fallback = r.headers.get("X-Fallback-Voice");
  const blob = await r.blob();
  if(!blob.size || !/audio/.test(blob.type || r.headers.get("content-type") || "")) throw new Error("TTS not audio");
  if(!fallback){ try{ if(c) await c.put(key, new Response(blob, { headers:{ "Content-Type":"audio/wav" } })); }catch(e){} }
  return blob;
}
async function speakNatural(text, only){
  const my = ++TTS.seq;
  try{ if(window.speechSynthesis) speechSynthesis.cancel(); }catch(e){}
  const a = ttsAudio(); try{ a.pause(); }catch(e){}
  const t = setTimeout(() => { if(my === TTS.seq) ttsLoading(true); }, 700);
  try{
    const blob = await ttsClip(text, null, only);
    if(my !== TTS.seq) return true;                       // you tapped something else meanwhile
    if(a.dataset.url) URL.revokeObjectURL(a.dataset.url);
    a.dataset.url = URL.createObjectURL(blob);
    a.src = a.dataset.url;
    a.playbackRate = S.slowAudio ? 0.75 : 1;
    try{ a.preservesPitch = true; }catch(e){}
    await a.play();
    return true;
  }finally{ clearTimeout(t); if(my === TTS.seq) ttsLoading(false); }
}

const TTSQ = { list: [], busy: false, seen: new Set(), t: null };
function ttsPrefetchPage(){

    texts.forEach(t => { TTSQ.seen.add(ttsVoice() + "|" + t); TTSQ.list.push(t); });

async function ttsPump(){
  if(TTSQ.busy) return; TTSQ.busy = true;
  while(TTSQ.list.length){
    const t = TTSQ.list.shift();
    try{ await ttsClip(t, null, true); }catch(e){}         // only clips that already exist — never uses up the daily allowance
    await new Promise(r => setTimeout(r, 300));

}
function speak(text){
  text = String(text || "").trim(); if(!text) return;
  TTS.last = text;

    speakNatural(text, only).catch(err => {

async function askClaude(system, messages){

async function askGemini(system, messages, maxTokens, key, model){
  const body = {
    system_instruction: { parts:[{ text: system }] },
    contents: messages.map(m => ({
      role: m.role === "assistant" ? "model" : "user",
      parts: [{ text: m.content }]
    })),
    generationConfig: {
      maxOutputTokens: Math.max(2048, maxTokens || 2048),
      temperature: 0.85,
      thinkingConfig: { thinkingBudget: 0 }
    }
  };
  const url = "https://generativelanguage.googleapis.com/v1beta/models/" +
              encodeURIComponent(model || GMODEL) + ":generateContent";
  const send = async payload => fetch(url, {
    method:"POST",
    headers:{ "Content-Type":"application/json", "x-goog-api-key": key || GKEY },
    body: JSON.stringify(payload)
  });

  let res = await send(body);
  if(res.status === 400){                       // some models reject thinkingConfig
    const b2 = JSON.parse(JSON.stringify(body));
    delete b2.generationConfig.thinkingConfig;
    res = await send(b2);
  }
  if(!res.ok){
    let msg = "";
    try{ const j = await res.json(); msg = (j.error && j.error.message) || ""; }catch(e){}
    if(res.status === 400 && /API key not valid/i.test(msg)) throw new Error("BADKEY");
    if(res.status === 403) throw new Error("BADKEY");
    if(res.status === 404) throw new Error("NOMODEL");
    if(res.status === 429) throw new Error("RATE");
    throw new Error("Gemini " + res.status + (msg ? ": " + msg : ""));
  }
  const d = await res.json();
  const c = (d.candidates || [])[0];
  const txt = (((c || {}).content || {}).parts || []).map(p => p.text || "").join("");
  if(!txt.trim()){
    const fr = c && c.finishReason;
    throw new Error(fr === "MAX_TOKENS" ? "The reply got cut off. Try again."
                  : fr === "SAFETY"     ? "Gemini blocked the reply."
                  : "Empty reply from Gemini.");
  }
  return txt.trim();
}

const PROXY = "/api/chat";
let PROXY_OK = null;   // null = untested, true = live, false = not usable
let DIAG = null;       // what the health check actually found

async function probe(live){
  // Informational only. The health check tells us what's wrong when it can,
  // but an older function build has no ping endpoint — that's not a failure,
  // so we never rule the proxy out on anything except 404 or no response.
  try{
    const r = await fetch(PROXY + "?ping=1" + (live ? "&live=1" : ""));
    if(r.status === 404){
      DIAG = { deployed:false, key:false, origin:false, http:404 };
      PROXY_OK = false; paintGear(); return;
    }
    let j = null;
    try{ j = await r.json(); }catch(e){}
    if(j && j.ok === true && typeof j.keyConfigured === "boolean"){
      DIAG = { deployed:true, known:true, key:!!j.keyConfigured, origin:!!j.originAllowed,
               origins:j.originsConfigured || [], http:r.status,
               works: typeof j.keyWorks === "boolean" ? j.keyWorks : null,
               problem: j.keyProblem || "" };
    }else{
      // function is alive but predates ?ping — status unknown, so let the real call decide
      DIAG = { deployed:true, known:false, key:null, origin:null, http:r.status };
    }
  }catch(e){
    DIAG = { deployed:false, key:false, origin:false, http:0 };
    PROXY_OK = false;
  }
  paintGear();
}

const AI_TIMEOUT = 45000;

async function askProxy(system, messages, maxTokens){
  let res;
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), AI_TIMEOUT);
  try{
    res = await fetch(PROXY, {
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ system, messages, maxTokens: maxTokens || 2048 }),
      signal: ctrl.signal
    });
  }catch(e){
    clearTimeout(timer);
    if(e && e.name === "AbortError") throw new Error("TIMEOUT");
    throw new Error("NOPROXY");                     // offline, or opened as a local file
  }finally{ clearTimeout(timer); }

  if(res.status === 404){ throw new Error("NOPROXY:404"); }

  let data = null, raw = "";
  try{ raw = await res.text(); data = JSON.parse(raw); }
  catch(e){ throw new Error("BADRESP:" + res.status + ":" + raw.slice(0,120).replace(/\s+/g," ")); }

  if(!res.ok){
    if(res.status === 429) throw new Error(data.error || "RATE");
    if(res.status === 500) throw new Error("NOKEY");
    if(res.status === 403) throw new Error("ORIGIN");
    if(res.status === 405) throw new Error("OLDFN");
    throw new Error("HTTP " + res.status + " — " + (data.error || "no detail"));
  }
  if(!data || !data.text) throw new Error("Empty reply.");
  PROXY_OK = true;
  return data.text.trim();
}

// Keep the last N turns verbatim and cap total characters. The system prompt
// carries the persona, so older turns cost tokens without adding much.
const HISTORY_TURNS = 10;
const HISTORY_CHARS = 6000;

function trimHistory(hist, maxTurns, maxChars){
  maxTurns = maxTurns || HISTORY_TURNS;
  maxChars = maxChars || HISTORY_CHARS;

  // Drop anything with no text — an empty turn makes Gemini reject the
  // whole request — then collapse same-speaker runs so roles alternate.
  const clean = [];
  for(const m of hist){
    if(!m || typeof m.hr !== "string" || !m.hr.trim()) continue;
    const last = clean[clean.length - 1];
    if(last && last.who === m.who){ last.hr += "\n\n" + m.hr.trim(); continue; }
    clean.push({ who: m.who, hr: m.hr.trim() });
  }

  let out = clean.slice(-maxTurns);
  while(out.length && out[0].who !== "me") out.shift();          // open on a learner turn
  if(!out.length) out = clean.filter(m => m.who === "me").slice(-1);

  const size = m => m.hr.length;
  let total = out.reduce((n, m) => n + size(m), 0);
  while(out.length > 2 && total > maxChars){
    total -= size(out.shift());
    while(out.length && out[0].who !== "me") total -= size(out.shift());
  }
  return out;
}

function historyForApi(hist){
  return trimHistory(hist).map(m => m.who === "me"
    ? { role:"user", content: m.hr }
    : { role:"assistant", content: taggedFrom(m) });
}

/* ---- tag-delimited replies: the Croatian arrives first, so it can render
        while the rest is still generating ---- */
function taggedFrom(m){
  let s = `<r>${m.hr || ""}</r>`;
  if(m.tr) s += `<t>${m.tr}</t>`;
  (m.sugg || []).forEach(x => {
    const hr = typeof x === "string" ? x : (x.hr || "");
    const en = typeof x === "string" ? "" : (x.en || "");
    if(hr) s += `<s>${hr} | ${en}</s>`;
  });
  return s;
}

function parseTagged(buf){
  const grab = t => {
    const m = buf.match(new RegExp("<" + t + ">([\\s\\S]*?)(?:</" + t + ">|$)"));
    if(!m) return "";
    // Mid-stream the closing tag arrives a character at a time, so strip any
    // half-received "<", "</" or "</r" before showing it.
    return m[1].replace(/<\/?[a-z]?$/i, "").trim();
  };
  const sugg = [];
  const re = /<s>([\s\S]*?)<\/s>/g;
  let m;
  while((m = re.exec(buf))){
    const [hr, en] = m[1].split("|").map(x => (x || "").trim());
    if(hr) sugg.push({ hr, en: en || "" });
  }
  const corr = grab("c");
  let fix = null;
  if(corr){
    const [fixed, note] = corr.split("::").map(x => (x || "").trim());
    if(fixed) fix = { fixed, note: note || "" };
  }
  return { reply: grab("r"), translation: grab("t"), correction: fix, suggestions: sugg };
}

// Streams the reply, calling onText() with the Croatian so far.
async function askProxyStream(system, messages, onText, maxTokens){
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), AI_TIMEOUT);
  let res;
  try{
    res = await fetch(PROXY, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ system, messages, maxTokens: maxTokens || 2048, stream: true }),
      signal: ctrl.signal
    });
  }catch(e){
    clearTimeout(timer);
    if(e && e.name === "AbortError") throw new Error("TIMEOUT");
    throw new Error("NOPROXY");
  }

  if(res.status === 404 || res.status === 405){ clearTimeout(timer); throw new Error("NOSTREAM"); }
  if(!res.ok){
    clearTimeout(timer);
    let d = null;
    try{ d = await res.json(); }catch(e){}
    if(res.status === 429) throw new Error((d && d.error) || "RATE");
    if(res.status === 500) throw new Error("NOKEY");
    if(res.status === 403) throw new Error("ORIGIN");
    throw new Error((d && d.error) || ("HTTP " + res.status));
  }
  if(!res.body){ clearTimeout(timer); throw new Error("NOSTREAM"); }

  const reader = res.body.getReader();
  const dec = new TextDecoder();
  let buf = "", lastShown = "";
  try{
    for(;;){
      const { done, value } = await reader.read();
      if(done) break;
      buf += dec.decode(value, { stream: true });
      const partial = parseTagged(buf).reply;
      if(partial && partial !== lastShown){ lastShown = partial; onText(partial); }
    }
  }finally{ clearTimeout(timer); }

  const out = parseTagged(buf);
  if(!out.reply) throw new Error("Empty reply.");
  return out;
}

function parseJSON(txt){

  const a = t.indexOf("{"), b = t.lastIndexOf("}");
  const c = t.indexOf("["), d = t.lastIndexOf("]");
  if(c > -1 && (c < a || a === -1)) t = t.slice(c, d+1); else if(a > -1) t = t.slice(a, b+1);

}

  if(/EMPTY/.test(m)) return `<div class="err"><b>Gemini sent back an empty reply.</b> Try again.</div>`;
