{
  id:28, sec:3, title:"Must, can, may, should", sub:"Moram, mogu, smijem, trebam",
  goal:"Say what you have to, can, may and should do — and the sentences with no 'who' at all, like 'I'm cold'.",
  grammar:[
    {h:"Verb + infinitive",
     b:"These verbs take a second verb in its <b>-ti / -ći</b> form:<br><b>moći</b> — can · <b>morati</b> — must · <b>htjeti</b> — want · <b>smjeti</b> — be allowed · <b>znati</b> — know how<br><br><b>Mogu doći.</b> — I can come.<br><b>Moram ići.</b> — I have to go.<br><b>Smijem li ući?</b> — May I come in?<br><b>Znam plivati.</b> — I can (know how to) swim.<br><br>morati: moram, moraš, mora, moramo, morate, moraju<br>smjeti: smijem, smiješ, smije, smijemo, smijete, smiju"},
    {h:"trebati — need, should",
     b:"<b>Trebam pomoć.</b> or <b>Treba mi pomoć.</b> — I need help. (the second is the dative pattern from Unit {u11})<br><b>Trebam ići.</b> — I need to go.<br><b>Ne trebaš doći.</b> — You don't need to come.<br><b>Trebao bih ići.</b> / <b>Trebala bih ići.</b> — I should go. (Unit {u16})"},
    {h:"don't have to ≠ mustn't",
     b:"This one trips English speakers:<br><b>Ne moram</b> = I <b>don't have to</b> (it's optional)<br><b>Ne smijem</b> = I <b>mustn't</b> / I'm not allowed<br><br><b>Ne moraš doći.</b> — You don't have to come.<br><b>Ne smiješ pušiti ovdje.</b> — You mustn't smoke here."},
    {h:"In the past and future",
     b:"They work like any verb (Units {u14}–{u15}):<br><b>Morao sam ići.</b> / <b>Morala sam ići.</b> — I had to go.<br><b>Nisam mogao doći.</b> — I couldn't come.<br><b>Htjela sam reći…</b> — I wanted to say…<br><b>Morat ću raditi.</b> — I'll have to work.<br><b>Moći ću doći.</b> — I'll be able to come."},
    {h:"Sentences with no 'who'",
     b:"Some sentences have no subject at all. The person who feels it goes in the <b>dative</b>:<br><b>Hladno je.</b> — It's cold. → <b>Hladno mi je.</b> — I'm cold.<br><b>Vruće mi je.</b> — I'm hot.<br><b>Dosadno mi je.</b> — I'm bored. (careful: <em>Dosadan sam</em> = I'm boring!)<br><b>Žao mi je.</b> — I'm sorry.<br><b>Kasno je.</b> — It's late."}
  ],
  vocab:[["morati","must / have to"],["moći","can"],["smjeti","be allowed"],["trebati","need / should"],["znati","know (how)"],
    ["hladno","cold (it's…)"],["vruće","hot (it's…)"],["dosadno","boring (it's…)"],["kasno","late"],["rano","early"]],
  phrases:[["Moram ići.","I have to go."],["Smijem li ući?","May I come in?"],["Ne moraš.","You don't have to."],
    ["Hladno mi je.","I'm cold."],["Žao mi je.","I'm sorry."]],
  drills:[
    {t:"type",q:"Say: I have to go.",a:["moram ići"],e:"Moram ići."},
    {t:"mc",q:"'Ne moram' means…",o:["I don't have to","I mustn't"],a:0,e:"Mustn't is ne smijem."},
    {t:"mc",q:"'You mustn't smoke here' =",o:["Ne moraš pušiti ovdje.","Ne smiješ pušiti ovdje."],a:1,e:"smjeti = be allowed."},
    {t:"type",q:"Say: I'm cold.",a:["hladno mi je"],e:"Hladno mi je."},
    {t:"mc",q:"'Smijem li ući?' means…",o:["May I come in?","Can I swim?"],a:0,e:"ući = come in."},
    {t:"type",q:"Say (male): I had to work.",a:["morao sam raditi"],e:"Morao sam raditi."}
  ]
},
{
  id:33, sec:3, title:"When I've done it — future II", sub:"Futur drugi",
  goal:"Talk about future 'when' and 'if' the Croatian way: Kad budem imao vremena… / Kad dođem…",
  grammar:[
    {h:"Why there's a second future",
     b:"After <b>kad</b> (when) and <b>ako</b> (if) talking about the future, Croatian does <b>not</b> use ću. It uses <b>budem + the past form (-o / -la / -li)</b>:<br><br><b>Kad budem imao vremena, nazvat ću Anu.</b> — When I have time, I'll call Ana.<br><br>English does the same trick — it says <em>when I have</em>, not <em>when I will have</em>. Croatian just has its own form for it."},
    {h:"The forms",
     b:"budem, budeš, bude, budemo, budete, budu + the past form (-o / -la / -li, Unit {u14}):<br><br><b>kad budem došao / došla</b> — when I come<br><b>ako bude padala kiša</b> — if it rains<br><b>kad budemo imali novca</b> — when we have money"},
    {h:"The easy way: a perfective in the present",
     b:"With a perfective verb (Unit {u17}) you can skip budem and just use the present — and most people do:<br><br><b>Kad dođem kući, nazvat ću Anu.</b> — When I get home, I'll call Ana.<br><b>Ako stigneš rano, javi se.</b> — If you get there early, let me know.<br><b>Čim stignem, nazvat ću mamu.</b> — As soon as I arrive, I'll call Mom.<br><br>This is the rule from Unit {u17}: a 'done' verb in the present only appears after kad / ako / čim — here's where it lives."},
    {h:"kad or ako?",
     b:"<b>kad</b> = when — you're sure it'll happen<br><b>ako</b> = if — maybe it will, maybe not<br><br><b>Kad dođeš u Zagreb, javi se.</b> — When you come to Zagreb (it's planned)…<br><b>Ako dođeš u Zagreb, javi se.</b> — If you ever come to Zagreb…"}
  ],
  vocab:[["kad","when"],["ako","if"],["čim","as soon as"],["nazvati","to call (pf)"],["stići","to arrive (pf)"],
    ["javiti se","to get in touch (pf)"],["kiša","rain"],["vrijeme","time / weather"]],
  phrases:[["Kad budem imao vremena…","When I have time… (m)"],["Kad dođem kući, javit ću se.","When I get home, I'll let you know."],
    ["Ako bude padala kiša, ostajemo kod kuće.","If it rains, we're staying home."],["Čim stignem, nazvat ću mamu.","As soon as I arrive, I'll call Mom."]],
  drills:[
    {t:"mc",q:"After kad talking about the future, Croatian uses…",o:["budem + the past form, or a 'done' verb in the present","ću + infinitive"],a:0,e:"Never kad ću."},
    {t:"type",q:"A man says: when I have time",a:["kad budem imao vremena","kada budem imao vremena"],e:"Kad budem imao vremena."},
    {t:"mc",q:"'Kad dođem' means…",o:["When I come / get there","When I came"],a:0,e:"Perfective present = future here."},
    {t:"mc",q:"Which is correct?",o:["Kad ću doći, nazvat ću Anu.","Kad dođem, nazvat ću Anu."],a:1,e:"No ću after kad."},
    {t:"mc",q:"'ako' means…",o:["if","when"],a:0,e:"kad = when."},
    {t:"type",q:"budem → the oni form:",a:["budu"],e:"budu."}
  ]
},
{
  id:18, sec:4, title:"My, your, his, her", sub:"Posvojne zamjenice",
  goal:"Say what belongs to whom — and learn svoj, which English has no equivalent for.",
  grammar:[
    {h:"They agree with the thing owned, not the owner",
     b:"<table><tr><th></th><th>m</th><th>f</th><th>n</th></tr><tr><td class='cs'>my</td><td class='hr'>moj</td><td class='hr'>moja</td><td class='hr'>moje</td></tr><tr><td class='cs'>your (ti)</td><td class='hr'>tvoj</td><td class='hr'>tvoja</td><td class='hr'>tvoje</td></tr><tr><td class='cs'>his</td><td class='hr'>njegov</td><td class='hr'>njegova</td><td class='hr'>njegovo</td></tr><tr><td class='cs'>her</td><td class='hr'>njezin</td><td class='hr'>njezina</td><td class='hr'>njezino</td></tr><tr><td class='cs'>our</td><td class='hr'>naš</td><td class='hr'>naša</td><td class='hr'>naše</td></tr><tr><td class='cs'>your (vi)</td><td class='hr'>vaš</td><td class='hr'>vaša</td><td class='hr'>vaše</td></tr><tr><td class='cs'>their</td><td class='hr'>njihov</td><td class='hr'>njihova</td><td class='hr'>njihovo</td></tr></table><b>moj</b> auto (m) · <b>moja</b> kuća (f) · <b>moje</b> pivo (n)<br><br>So a woman says <em>moj brat</em> and a man says <em>moja sestra</em> — the ending follows the noun, never the speaker."},
    {h:"They decline too",
     b:"Like adjectives, through all seven cases:<br>Vidim <b>tvoju</b> sestru. (A, f)<br>Idem s <b>mojim</b> prijateljem. (I, m)<br>U <b>našoj</b> kući. (L, f)<br>Knjiga <b>moga</b> brata. (G, m)"},
    {h:"svoj — the one English lacks",
     b:"When the owner is the <b>subject of the sentence</b>, Croatian uses <b>svoj</b> instead of moj/tvoj/njegov.<br><br><b>Volim svoju sestru.</b> — I love my sister.<br><b>On voli svoju sestru.</b> — He loves <em>his own</em> sister.<br><b>On voli njegovu sestru.</b> — He loves <em>someone else's</em> sister.<br><br>That last pair is a real difference in meaning, not a style choice. With <em>ja</em> and <em>ti</em>, using moj/tvoj instead of svoj is tolerated. With <em>on/ona/oni</em>, it changes who you mean."},
    {h:"Whose?",
     b:"<b>čiji / čija / čije</b> — whose<br><b>Čiji</b> je ovo auto? · <b>Čija</b> je ova torba? · <b>Čije</b> je ovo?"}
  ],
  vocab:[["moj","my"],["tvoj","your (ti)"],["njegov","his"],["njezin","her"],["naš","our"],
    ["vaš","your (vi)"],["njihov","their"],["svoj","one's own"],["čiji","whose"],
    ["torba","bag"],["ključ","key"],["novčanik","wallet"],["mobitel","mobile phone"],
    ["naočale","glasses (pl)"],["sat","watch"],["kaput","coat"],["cipele","shoes (pl)"]],
  phrases:[["Ovo je moja kuća.","This is my house."],["Gdje je tvoj mobitel?","Where's your phone?"],
    ["Volim svoju obitelj.","I love my family."],["Čiji je ovo ključ?","Whose key is this?"],
    ["Naša škola je velika.","Our school is big."],["Izgubio sam svoj novčanik.","I lost my wallet. (m)"]],
  drills:[
    {t:"mc",q:"A man says 'my sister':",o:["moj sestra","moja sestra","moje sestra","moju sestra"],a:1,e:"It agrees with sestra (f), not the speaker."},
    {t:"mc",q:"'He loves his own sister' =",o:["On voli njegovu sestru","On voli svoju sestru","On voli moju sestru","On voli sestru njegovu"],a:1,e:"svoj = the subject's own."},
    {t:"type",q:"Ask: Whose key is this?",a:["čiji je ovo ključ","ciji je ovo kljuc"],e:"Čiji je ovo ključ?"},
    {t:"mc",q:"'On voli njegovu sestru' means:",o:["He loves his own sister","He loves someone else's sister","He loves her sister only","It's ungrammatical"],a:1,e:"njegov points away from the subject."},
    {t:"type",q:"Say: This is my house.",a:["ovo je moja kuća","ovo je moja kuca"],e:"Ovo je moja kuća."},
    {t:"mc",q:"'our school' =",o:["naš škola","naša škola","naše škola","našu škola"],a:1,e:"škola is feminine → naša."}
  ]
},
{
  id:19, sec:4, title:"This, that, and adjectives", sub:"Pokazne zamjenice i pridjevi",
  goal:"Point at things, describe them, and get the agreement right every time.",
  grammar:[
    {h:"Three levels of 'that'",
     b:"<b>ovaj / ova / ovo</b> — this, near me<br><b>taj / ta / to</b> — that, near you<br><b>onaj / ona / ono</b> — that over there, far from both<br><br>English has two; Croatian has three. <em>Taj</em> is the one you'll use most in conversation.<br><br><b>Ovaj</b> auto je moj. · <b>Ta</b> knjiga je dobra. · <b>Ono</b> tamo je muzej."},
    {h:"Adjectives agree in gender, number and case",
     b:"<b>velik</b> grad · <b>velika</b> kuća · <b>veliko</b> more<br><b>veliki</b> gradovi · <b>velike</b> kuće · <b>velika</b> mora<br><br>And they change with the case: <em>Imam <b>veliku</b> kuću</em> (A) · <em>U <b>velikoj</b> kući</em> (L) · <em>S <b>velikim</b> psom</em> (I)."},
    {h:"Definite and indefinite forms",
     b:"Masculine adjectives have two forms:<br><b>Indefinite</b> (short): <em>velik grad</em> — a big city, describing<br><b>Definite</b> (long, -i): <em>veliki grad</em> — the big city, identifying<br><br>The definite form is also used after ovaj/taj/onaj and in fixed names: <em>Novi Zagreb</em>, <em>Stari grad</em>.<br><br>In everyday speech the definite form is winning — most people say <em>veliki</em> in both cases. Don't lose sleep over it."},
    {h:"Common adjective pairs",
     b:"velik / malen · dobar / loš · nov / star · mlad / star · lijep / ružan<br>dug / kratak · visok / nizak · jeftin / skup · brz / spor · lak / težak<br>topao / hladan · čist / prljav · pun / prazan · sretan / tužan"}
  ],
  vocab:[["ovaj","this"],["taj","that"],["onaj","that over there"],["velik","big"],["malen","small"],
    ["dobar","good"],["loš","bad"],["nov","new"],["star","old"],["mlad","young"],["lijep","beautiful"],
    ["ružan","ugly"],["dug","long"],["kratak","short"],["visok","tall"],["nizak","low / short"],
    ["jeftin","cheap"],["skup","expensive"],["brz","fast"],["spor","slow"],["težak","heavy / hard"],
    ["lak","light / easy"],["topao","warm"],["hladan","cold"],["čist","clean"],["prljav","dirty"]],
  phrases:[["Ovaj auto je moj.","This car is mine."],["Ta knjiga je jako dobra.","That book is very good."],
    ["Imam veliku kuću.","I have a big house."],["Ovo je preskupo.","This is too expensive."],
    ["Vrijeme je lijepo danas.","The weather is nice today."]],
  drills:[
    {t:"mc",q:"'that book' (near you) =",o:["ovaj knjiga","ta knjiga","ono knjiga","onaj knjiga"],a:1,e:"knjiga is feminine, near listener → ta."},
    {t:"mc",q:"Which is correct?",o:["veliko more","velika more","veliki more","velik more"],a:0,e:"more is neuter."},
    {t:"type",q:"Say: with a big dog",a:["s velikim psom"],e:"Instrumental: s velikim psom."},
    {t:"mc",q:"How many levels of 'this/that' does Croatian have?",o:["One","Two","Three","Four"],a:2,e:"ovaj, taj, onaj."},
    {t:"mc",q:"'in the big house' =",o:["u velika kuća","u veliku kuću","u velikoj kući","u velikom kući"],a:2,e:"Locative feminine: -oj / -i."},

{
  id:20, sec:4, title:"Bigger, best, quickly", sub:"Komparativ i prilozi",
  goal:"Compare things and describe how actions happen.",
  grammar:[
    {h:"Comparative",
     b:"Add <b>-iji</b> (or <b>-ji</b>) to the adjective:<br>jeftin → jeftin<b>iji</b> · lijep → ljep<b>ši</b> · brz → br<b>ži</b><br><br>Then use <b>od</b> + genitive, or <b>nego</b> + nominative:<br>Zagreb je <b>veći od</b> Splita.<br>Ovo je <b>bolje nego</b> ono."},
    {h:"The irregulars you'll actually use",
     b:"dobar → <b>bolji</b> (better)<br>loš → <b>gori</b> (worse)<br>velik → <b>veći</b> (bigger)<br>malen → <b>manji</b> (smaller)<br>dug → <b>duži</b> (longer)<br>lijep → <b>ljepši</b> (more beautiful)<br><br><b>Superlative:</b> just add <b>naj-</b> to the comparative.<br><b>naj</b>bolji, <b>naj</b>veći, <b>naj</b>ljepši, <b>naj</b>manji"},
    {h:"Adverbs",
     b:"Most adverbs are just the <b>neuter</b> form of the adjective:<br>brz → <b>brzo</b> (quickly) · dobar → <b>dobro</b> (well) · loš → <b>loše</b> (badly) · lijep → <b>lijepo</b> (nicely)<br><br>Govori <b>brzo</b>. — He speaks quickly.<br>Govori <b>dobro</b> hrvatski. — He speaks Croatian well.<br><br>Adverbs never change form — no gender, no case. A rest for once."},
    {h:"Degree words",
     b:"<b>jako / vrlo</b> — very · <b>malo</b> — a bit · <b>previše</b> — too much · <b>dovoljno</b> — enough<br><b>skoro / gotovo</b> — almost · <b>uopće ne</b> — not at all · <b>baš</b> — really<br><br>Or the prefix <b>pre-</b> for 'too': <em>preskup</em> (too expensive), <em>prevelik</em> (too big)."}
  ],

{
  id:31, sec:4, title:"First, second — dates and ages", sub:"Redni brojevi i datumi",
  goal:"Say first, second, third; give the date and your birthday; say how old you are; and use dvoje, oboje for groups.",
  grammar:[
    {h:"First, second, third",
     b:"prvi, drugi, treći, četvrti, peti, šesti, sedmi, osmi, deveti, deseti … dvadeseti … stoti<br><br>They're adjectives, so they copy the noun (Unit {u19}):<br><b>prvi</b> dan · <b>prva</b> kava · <b>prvo</b> pivo<br><b>Treći put sam ovdje.</b> — It's my third time here.<br><b>zadnji</b> — last · <b>sljedeći</b> — next"},
    {h:"Dates",
     b:"<b>Koji je danas datum?</b> — What's the date today?<br><b>Danas je dvadeset drugi listopada.</b> — Today is the 22nd of October.<br><br>Day = ordinal, month = <b>genitive</b>. The month names shorten:<br>siječanj → siječnja · veljača → veljače · ožujak → ožujka · travanj → travnja · svibanj → svibnja · lipanj → lipnja · srpanj → srpnja · kolovoz → kolovoza · rujan → rujna · listopad → listopada · studeni → studenoga · prosinac → prosinca<br><br><b>On</b> a date, the day goes in the genitive too: <b>petog svibnja</b> — on the 5th of May.<br>Written: <b>5. 5.</b> — with dots."},
    {h:"How old are you?",
     b:"<b>Koliko imaš godina?</b> — How old are you? (literally: how many years do you have?)<br><br>The number rule from Unit {u9} decides the ending:<br>ending in 1 → <b>godinu</b>: Imam dvadeset jednu godinu.<br>ending in 2–4 → <b>godine</b>: Imam dvadeset dvije godine.<br>5 and up → <b>godina</b>: Imam dvadeset pet godina.<br><br>Born: <b>Rođen sam / Rođena sam 2008. godine.</b> (How to say the year: Unit {u39}.)"},
    {h:"dvoje, troje, oboje — groups",
     b:"For mixed groups and for children, Croatian uses special numbers:<br><b>dvoje</b> (two), <b>troje</b> (three), <b>četvero</b> (four), <b>oboje</b> (both)<br><b>Imam dvoje djece.</b> — I have two kids.<br><b>nas troje</b> — the three of us<br><br><b>oba</b> (m/n) / <b>obje</b> (f) — both: <b>oba brata</b> · <b>obje sestre</b>"}
  ],
  vocab:[["prvi","first"],["drugi","second / other"],["treći","third"],["zadnji","last"],["sljedeći","next"],
    ["datum","date"],["godina","year"],["rođendan","birthday"],["dvoje","two (group)"],["oboje","both (people)"]],

{
  id:39, sec:4, title:"Counting things — the full picture", sub:"Brojevi i slaganje",
  goal:"Count anything correctly: big numbers, numbers with describing words and verbs, money, 'about ten', 'twice', halves and quarters.",
  grammar:[
    {h:"Big numbers: only the last word counts — except 11–19",
     b:"The rule from Unit {u9}: <b>1</b> → normal · <b>2–4</b> → genitive singular · <b>5+</b> → genitive plural.<br><br>With bigger numbers, only the <b>last word</b> decides:<br>dvadeset <b>jedan</b> stol · dvadeset <b>dva</b> stola · dvadeset <b>pet</b> stolova · sto <b>tri</b> kave<br><br>But <b>11–19 always take the 5+ form</b> — they end in -naest, not in a 1–4 word:<br><b>jedanaest stolova</b> · <b>dvanaest kava</b> · <b>četrnaest dana</b><br><br>And jedan matches the thing: dvadeset <b>jedna</b> kava · dvadeset <b>jedno</b> pivo."},
    {h:"With describing words",
     b:"The describing word follows the same rule:<br><b>1:</b> jedan <b>velik</b> stol · jedna <b>nova</b> kuća · jedno <b>hladno</b> pivo<br><b>2–4:</b> dva <b>velika</b> stola · tri <b>nove</b> kuće · četiri <b>hladna</b> piva<br><b>5+:</b> pet <b>velikih</b> stolova · šest <b>novih</b> kuća<br><br>So after 2–4: masculine / neuter → <b>-a</b>, feminine → <b>-e</b>. After 5+: always <b>-ih</b>."},
    {h:"With verbs",
     b:"<b>1</b> → singular: <b>Jedan čovjek čeka.</b><br><b>2–4</b> → plural: <b>Dva čovjeka čekaju.</b> · <b>Tri žene čekaju.</b><br><b>5+</b> → <b>singular!</b> <b>Pet ljudi čeka.</b><br><br>In the past:<br><b>Došla su dva čovjeka.</b> (2–4 masculine → -la)<br><b>Došle su tri žene.</b><br><b>Došlo je pet ljudi.</b> (5+ → neuter singular -lo)<br><br>It sounds odd at first, but it's right. You'll also hear <em>Pet ljudi su došli</em> in casual speech — understood, just not standard."},
    {h:"Money: euros and cents",
     b:"Croatia uses the <b>euro</b> (since 2023):<br>jedan <b>euro</b> · dva <b>eura</b> · pet <b>eura</b> (the 5+ form is also eura)<br>jedan <b>cent</b> · dva <b>centa</b> · pet <b>centi</b><br><br><b>Koliko košta? — Deset eura.</b><br><b>Pet eura i pedeset centi.</b> / <b>Pet i pol eura.</b><br><b>Platit ću karticom.</b> — I'll pay by card. · <b>Može gotovina?</b> — Is cash OK?<br><br>Older people sometimes still talk about <b>kune</b>, the money before the euro."},
    {h:"About ten, twice, half",
     b:"<b>About</b> a number: add <b>-ak</b>: <b>desetak</b> (about ten), <b>dvadesetak</b>, <b>petnaestak</b>, <b>stotinjak</b> (about a hundred) + genitive plural: <b>desetak ljudi</b> · <b>dvadesetak minuta</b><br><br><b>Times:</b> <b>jednom</b> / jedanput (once) · <b>dvaput</b> (twice) · <b>triput</b> · <b>puno puta</b> (many times) · <b>dvaput tjedno</b> (twice a week)<br><br><b>Parts:</b> <b>pola</b> (half) — pola sata · <b>četvrt</b> (quarter) — četvrt sata · <b>trećina</b> (a third) · <b>polovica</b> (half, as a share) · <b>deset posto</b> (10%)<br><br><b>Decimals</b> use a comma: 2,5 = <b>dva zarez pet</b>."}
  ],
  vocab:[["euro","euro"],["cent","cent"],["gotovina","cash"],["kartica","card"],["desetak","about ten"],
    ["dvaput","twice"],["triput","three times"],["jednom","once"],["pola","half"],["četvrt","quarter"],
    ["trećina","a third"],["posto","percent"],["zarez","comma / decimal point"]],
  phrases:[["Koliko košta? — Deset eura.","How much is it? — Ten euros."],["Pet eura i pedeset centi.","Five euros fifty."],
    ["Platit ću karticom.","I'll pay by card."],["pola sata","half an hour"],["desetak ljudi","about ten people"],["dvaput tjedno","twice a week"]],
  drills:[
    {t:"mc",q:"12 tables =",o:["dvanaest stola","dvanaest stolova"],a:1,e:"11–19 take the 5+ form."},
    {t:"mc",q:"three new houses =",o:["tri nove kuće","tri novih kuća"],a:0,e:"2–4 + feminine → -e."},
    {t:"mc",q:"'Five people came' =",o:["Pet ljudi je došlo.","Pet ljudi su došao."],a:0,e:"5+ → neuter singular."},
    {t:"type",q:"Say: ten euros",a:["deset eura"],e:"deset eura."},
    {t:"type",q:"Say: half an hour",a:["pola sata"],e:"pola sata."},
    {t:"mc",q:"'desetak ljudi' means…",o:["about ten people","exactly ten people"],a:0,e:"-ak = about."}
  ]
},
{
  id:21, sec:4, title:"Short pronouns and se", sub:"Zamjenice i povratni glagoli",
  goal:"Stop repeating nouns, and handle the little word se that's attached to a hundred verbs.",
  grammar:[
    {h:"Long and short forms",
     b:"Most pronouns have a stressed long form and an unstressed short one. <b>The short one is normal</b>; the long one is for emphasis or after prepositions.<br><table><tr><th></th><th>A long</th><th>A short</th><th>D short</th></tr><tr><td class='cs'>me</td><td class='hr'>mene</td><td class='hr'>me</td><td class='hr'>mi</td></tr><tr><td class='cs'>you</td><td class='hr'>tebe</td><td class='hr'>te</td><td class='hr'>ti</td></tr><tr><td class='cs'>him/it</td><td class='hr'>njega</td><td class='hr'>ga</td><td class='hr'>mu</td></tr><tr><td class='cs'>her</td><td class='hr'>nju</td><td class='hr'>je / ju</td><td class='hr'>joj</td></tr><tr><td class='cs'>us</td><td class='hr'>nas</td><td class='hr'>nas</td><td class='hr'>nam</td></tr><tr><td class='cs'>them</td><td class='hr'>njih</td><td class='hr'>ih</td><td class='hr'>im</td></tr></table>Vidim <b>ga</b>. — I see him.<br>Daj <b>mi</b> <b>ga</b>. — Give it to me.<br>Za <b>mene</b>. — For me. (long form after a preposition)"},
    {h:"Reflexive verbs",
     b:"A huge number of Croatian verbs carry <b>se</b>. Sometimes it's genuinely reflexive, often it just belongs to the verb:<br><br><b>zvati se</b> — to be called · <b>osjećati se</b> — to feel<br><b>sviđati se</b> — to please · <b>bojati se</b> — to fear<br><b>smijati se</b> — to laugh · <b>šaliti se</b> — to joke<br><b>sjećati se</b> — to remember · <b>nadati se</b> — to hope<br><b>odmarati se</b> — to rest · <b>tuširati se</b> — to shower<br><b>vidjeti se</b> — to see each other · <b>družiti se</b> — to hang out<br><br>Learn the <em>se</em> as part of the word, like the <em>to</em> in English infinitives."},
    {h:"se also makes things impersonal",
     b:"<b>Kako se kaže…?</b> — How does one say…?<br><b>Ovdje se ne puši.</b> — No smoking here.<br><b>Govori se hrvatski.</b> — Croatian is spoken.<br><br>This is how Croatian handles what English does with <em>you</em>, <em>one</em>, or the passive."},
    {h:"sebe / sam sebi",
     b:"For genuine reflexive emphasis: <b>sebe, sebi, sobom</b><br><em>Kupio sam <b>sebi</b> knjigu.</em> — I bought myself a book.<br><em>Govori o <b>sebi</b>.</em> — He talks about himself."}
  ],
  vocab:[["zvati se","to be called"],["osjećati se","to feel"],["bojati se","to fear"],
    ["smijati se","to laugh"],["šaliti se","to joke"],["sjećati se","to remember"],
    ["nadati se","to hope"],["odmarati se","to rest"],["družiti se","to hang out"],
    ["dogoditi se","to happen"],["čuditi se","to be surprised"],["žuriti se","to hurry"],
    ["me","me (short)"],["te","you (short)"],["ga","him / it"],["je","her"],["ih","them"]],
  phrases:[["Vidim ga.","I see him."],["Daj mi ga.","Give it to me."],
    ["Kako se osjećaš?","How do you feel?"],["Ne sjećam se.","I don't remember."],
    ["Ovdje se ne puši.","No smoking here."],["Žurim se.","I'm in a hurry."],
    ["Vidimo se!","See you!"]],
  drills:[
    {t:"type",q:"Say: I see him.",a:["vidim ga"],e:"Vidim ga."},
    {t:"mc",q:"Which is right after a preposition?",o:["za me","za mene","za mi","za ja"],a:1,e:"Long form after prepositions: za mene."},
    {t:"type",q:"Say: I don't remember.",a:["ne sjećam se","ne sjecam se"],e:"Ne sjećam se."},
    {t:"mc",q:"'Kako se kaže?' means:",o:["How does he say?","How does one say?","How do you say to yourself?","How is he called?"],a:1,e:"se makes it impersonal."},
    {t:"type",q:"Ask: How do you feel? (informal)",a:["kako se osjećaš","kako se osjecas"],e:"Kako se osjećaš?"},
    {t:"mc",q:"Why does 'zvati se' have se?",o:["It's reflexive emphasis","It's simply part of the verb","It's plural","It's a typo"],a:1,e:"The se belongs to the verb; it can't be dropped."}
  ]
},

{
  id:22, sec:5, title:"Word order and little words", sub:"Red riječi i enklitike",
  goal:"The single thing that most separates a learner's Croatian from a native's.",
  grammar:[
    {h:"The second-position rule",
     b:"Unstressed words — <b>sam si je smo ste su · ću ćeš će · bih bi · me te ga je joj mu ih im · se · li</b> — cluster in <b>second position</b> in the clause.<br><br>✓ Radio <b>sam</b>. ✓ Jučer <b>sam</b> radio. ✓ U Zagrebu <b>sam</b> radio.<br>✗ <b>Sam</b> radio. ✗ Jučer radio <b>sam</b>.<br><br>Whatever you put first, the cluster follows immediately after it."},
    {h:"They come in a fixed order",
     b:"When several stack up, this is the sequence:<br><br><b>li → sam/si/smo/ste/su · ću/ćeš… · bih/bi… → mi/ti/mu/joj/nam → me/te/ga/je → se → je (biti)</b><br><br>Dao <b>mi ga je</b>. — He gave it to me.<br>Kako <b>ti se</b> sviđa? — How do you like it?<br>Jučer <b>sam ga</b> vidio. — I saw him yesterday.<br>Ne bih <b>ti to</b> rekao. — I wouldn't tell you that.<br><br>Read the cluster as one glued-together chunk that slots in after the first word. You can be perfect on cases and still sound foreign if these sit wrong."},
    {h:"Otherwise word order is free",
     b:"Because the endings carry the grammar, you can reorder for emphasis:<br><b>Ana voli Marka.</b> — neutral<br><b>Marka voli Ana.</b> — it's Marko she loves<br><b>Voli Ana Marka.</b> — she does love him<br><br>All grammatical, all meaning the same basic thing. The last position tends to carry the new information."},
    {h:"The je exception",
     b:"<b>je</b> (from biti) goes <em>last</em> in the cluster, except it swaps with <b>se</b>:<br>Vidio <b>ga je</b>. — He saw him.<br>Vratio <b>se je</b> → in practice: <b>vratio se</b>. (je usually drops after se)"}
  ],
  vocab:[["dakle","so / therefore"],["ipak","still / after all"],["zapravo","actually"],
    ["uglavnom","mostly"],["barem","at least"],["čak","even"],["tek","only just"],
    ["upravo","just now / exactly"],["odmah","immediately"],["opet","again"],
    ["također","also"],["osim","except"],["prema","towards"],["iako","although"]],
  phrases:[["Dao mi ga je.","He gave it to me."],["Kako ti se sviđa?","How do you like it?"],
    ["Jučer sam ga vidio.","I saw him yesterday. (m)"],["Ne bih ti to rekao.","I wouldn't tell you that. (m)"],
    ["Vidio sam je.","I saw her. (m)"]],
  drills:[
    {t:"mc",q:"Which is correct?",o:["Sam ga vidio.","Ga sam vidio.","Vidio sam ga.","Vidio ga sam."],a:2,e:"Clitics go second, in order: sam then ga... actually here 'vidio' is first, so 'sam ga' follows."},
    {t:"mc",q:"Correct order in 'He gave it to me':",o:["Dao je mi ga.","Dao mi ga je.","Dao ga mi je.","Dao je ga mi."],a:1,e:"Dative before accusative, je last."},
    {t:"mc",q:"Where do the little words (sam, ga, se…) sit?",o:["First","Second","Last","Anywhere"],a:1,e:"Second place in the sentence."},
    {t:"type",q:"Say: How do you like it? (informal)",a:["kako ti se sviđa","kako ti se svida"],e:"Kako ti se sviđa?"},
    {t:"mc",q:"Why is 'Ana voli Marka' still clear if reordered?",o:["Word order is fixed","Endings carry the grammar","Croatian has articles","It isn't clear"],a:1,e:"The -a on Marka marks the object."},
    {t:"mc",q:"Which comes first in a cluster?",o:["se","je","mi","li"],a:3,e:"li → ću/bih → dative → accusative → se → je."}
  ]
},
{
  id:36, sec:5, title:"Why the order moves around", sub:"Red riječi u govoru",
  goal:"Understand the sentences that don't follow who → does → what — and start making them yourself.",
  grammar:[
    {h:"Old info first, new info last",
     b:"Croatian puts what you're both already talking about <b>first</b>, and the <b>new, important part last</b>.<br><br><em>Tko je došao?</em> — Who came?<br>→ <b>Došao je Marko.</b> — Marko is the news, so he goes last.<br><br><em>Što je Marko napravio?</em> — What did Marko do?<br>→ <b>Marko je otišao.</b> — now 'left' is the news.<br><br><em>Kada počinje film?</em> → <b>Film počinje u osam.</b><br><br>That's why the same words come out in different orders: it depends on what the other person already knows. English does this with voice stress; Croatian does it with order."},
    {h:"Verb first: something happens or exists",
     b:"When you announce that something exists or happens, the verb often comes <b>first</b> and the 'who' after it:<br><b>Ima jedan problem.</b> — There's a problem.<br><b>Pada kiša.</b> — It's raining. (literally: falls rain)<br><b>Došla je zima.</b> — Winter's here.<br><b>Zvala te mama.</b> — Mom called you.<br><b>Zove se Ana.</b> — Her name is Ana.<br><br>English needs 'there is' or 'it' to do this. Croatian just starts with the verb."},
    {h:"Questions: the 'who' goes after the verb",
     b:"After a question word, a full subject usually goes <b>after</b> the verb:<br><b>Gdje radi tvoj brat?</b> — Where does your brother work?<br><b>Kada počinje film?</b> — When does the film start?<br><b>Koliko košta ova jakna?</b> — How much is this jacket?<br><b>Kako se zove tvoja sestra?</b> — What's your sister's name?<br><br>English flips the order with 'does'. Croatian flips it by moving the subject to the end."},
    {h:"The thing first, for contrast",
     b:"To set one thing against another, put it <b>first</b>:<br><b>Kavu ne pijem, ali čaj pijem.</b> — Coffee I don't drink, but tea I do.<br><b>Ovo ne razumijem.</b> — This (bit) I don't understand.<br><b>Tebe nisam vidio.</b> — It's you I didn't see.<br><br>The meaning doesn't change, only the emphasis. The endings still say who did what (Unit {u8}) — that's what makes the moving possible."},
    {h:"Feelings: the person often goes first",
     b:"In the dative sentences (Unit {u11}, Unit {u28}), people often start with the long form of the person to stress it:<br><b>Meni se sviđa.</b> — I like it (as for me…).<br><b>Meni je hladno, a tebi?</b> — I'm cold — what about you?<br><b>Ani je dosadno.</b> — Ana's bored.<br><br><b>meni</b> and <b>tebi</b> are the long forms of mi and ti. Without the emphasis the short form sits second as usual: <b>Sviđa mi se.</b> · <b>Hladno mi je.</b>"},
    {h:"The little words reshape everything",
     b:"Because sam, ću, mi, ti, ga, se must sit second (Unit {u22}), whatever you put first decides where everything else goes:<br><b>Ja ću ti to sutra reći.</b><br><b>Sutra ću ti to reći.</b><br><b>Reći ću ti to sutra.</b><br>All three mean 'I'll tell you tomorrow'. Only the first word changed, and <b>ću ti</b> followed it.<br><br><b>Tip:</b> when a sentence looks scrambled, find the little words. The chunk in front of them is where the sentence starts, and the rest unpacks from there."}
  ],
  vocab:[["počinjati","to start (ongoing)"],["padati","to fall"],["kiša","rain"],["zima","winter"],["problem","problem"],
    ["jakna","jacket"],["meni","to me (long form)"],["tebi","to you (long form)"]],
  phrases:[["Pada kiša.","It's raining."],["Ima jedan problem.","There's a problem."],["Zvala te mama.","Mom called you."],
    ["Gdje radi tvoj brat?","Where does your brother work?"],["Meni je hladno, a tebi?","I'm cold, and you?"]],
  drills:[
    {t:"mc",q:"Natural answer to 'Tko je došao?'",o:["Došao je Marko.","Je došao Marko."],a:0,e:"The news (Marko) goes last; je can't start."},
    {t:"type",q:"Say: Her name is Ana.",a:["zove se ana","ona se zove ana"],e:"Zove se Ana."},
    {t:"build",q:"Make: Where does your sister live?",w:["gdje","živi","tvoja","sestra"],a:["Gdje živi tvoja sestra?"],e:"Subject after the verb."},
    {t:"mc",q:"'Ovo ne razumijem' — why does ovo come first?",o:["To stress 'this'","Because it's a question"],a:0,e:"First = contrast."},
    {t:"build",q:"Make: Mom called you.",w:["zvala","te","mama"],a:["Zvala te mama.","Mama te zvala."],e:"Verb first is very common here."},
    {t:"mc",q:"The end of a Croatian sentence usually holds…",o:["the new information","the subject"],a:0,e:"New info last."}
  ]
},
{
  id:23, sec:5, title:"Joining sentences", sub:"Veznici",
  goal:"Stop speaking in short bursts. Connectors are what turn phrases into conversation.",
  grammar:[
    {h:"The basic joiners",
     b:"<b>i</b> and · <b>a</b> and/but (contrast) · <b>ali</b> but · <b>ili</b> or<br><b>pa</b> so, and then · <b>te</b> and (formal) · <b>nego</b> but rather<br><br><em>Ja radim, <b>a</b> ona uči.</em> — I work, and she studies. (contrasting)<br><em>Volim kavu, <b>ali</b> ne pijem je navečer.</em><br><br>The <b>i / a</b> difference: <em>i</em> just adds, <em>a</em> sets two things against each other."},
    {h:"da — the workhorse",
     b:"<b>da</b> means <em>that</em>, and it's everywhere:<br><em>Mislim <b>da</b> je dobro.</em> — I think that it's good.<br><em>Znam <b>da</b> dolaziš.</em> — I know you're coming.<br><em>Nadam se <b>da</b> ćeš doći.</em> — I hope you'll come.<br><br>Unlike English, <b>you can't drop it</b>. <em>Mislim je dobro</em> is wrong.<br><br><b>da</b> also replaces the infinitive: <em>Želim <b>da</b> dođeš.</em> — I want you to come."},
    {h:"Cause, time and condition",
     b:"<b>jer</b> / <b>zato što</b> — because<br><b>ako</b> — if (real condition)<br><b>kad(a)</b> — when<br><b>dok</b> — while / until<br><b>iako</b> — although<br><b>zato</b> — that's why<br><b>prije nego</b> — before · <b>nakon što</b> — after<br><br><em>Ne idem <b>jer</b> sam umoran.</em><br><em><b>Ako</b> imaš vremena, dođi.</em><br><em><b>Kad</b> sam bio mali, živio sam u Splitu.</em><br><em><b>Iako</b> je hladno, idem van.</em>"},
    {h:"koji — which, who, that",
     b:"<b>koji / koja / koje</b> links a description to a noun, and it takes the case its own part of the sentence needs:<br><em>Čovjek <b>koji</b> govori…</em> — The man who is speaking… (subject)<br><em>Knjiga <b>koju</b> čitam…</em> — The book that I'm reading… (object)<br><em>Grad u <b>kojem</b> živim…</em> — The city I live in… (locative)<br><br>Gender comes from the noun it refers back to; case comes from its job in the new clause."}
  ],
  vocab:[["i","and"],["a","and / but"],["ali","but"],["ili","or"],["pa","so / then"],
    ["da","that"],["jer","because"],["zato što","because"],["ako","if"],["kad","when"],
    ["dok","while"],["iako","although"],["zato","that's why"],["koji","which / who"],
    ["osim toga","besides"],["na primjer","for example"],["s druge strane","on the other hand"]],
  phrases:[["Mislim da je to dobra ideja.","I think that's a good idea."],
    ["Ne idem jer sam umoran.","I'm not going because I'm tired. (m)"],
    ["Ako imaš vremena, dođi.","If you have time, come."],

  drills:[

    {t:"mc",q:"Can you drop 'da' like English drops 'that'?",o:["Yes, always","No, never","Only in questions","Only in the past"],a:1,e:"da is obligatory in Croatian."},
    {t:"mc",q:"'The book that I'm reading' =",o:["Knjiga koji čitam","Knjiga koja čitam","Knjiga koju čitam","Knjiga kojoj čitam"],a:2,e:"It's the object of čitam → accusative koju."},
    {t:"mc",q:"Difference between 'i' and 'a'?",o:["No difference","i adds, a contrasts","a is formal","i is past tense"],a:1,e:"a sets two things against each other."},

{
  id:24, sec:5, title:"Sound changes", sub:"Glasovne promjene",
  goal:"Understand why endings sometimes reshape the word — so irregular forms stop looking random.",
  grammar:[
    {h:"Palatalizacija — k, g, h → č, ž, š",
     b:"Before certain endings, these three consonants soften:<br>ruka → ru<b>č</b>ica · knjiga → knji<b>ž</b>ica · duh → du<b>š</b>a<br>vojnik → vojni<b>č</b>e (vocative) · Bog → Bo<b>ž</b>e<br><br>You'll see it constantly in vocatives and diminutives."},
    {h:"Sibilarizacija — k, g, h → c, z, s",
     b:"Before <b>-i</b>, usually in masculine plurals and the dative/locative of feminines:<br>vojnik → vojni<b>c</b>i · knjiga → knji<b>z</b>i (D/L) · siromah → siroma<b>s</b>i<br>ruka → ru<b>c</b>i · noga → no<b>z</b>i<br><br>This is why <em>u knjizi</em> looks nothing like <em>knjiga</em>."},
    {h:"Jotacija — consonant + j merge",
     b:"t + j → <b>ć</b> · d + j → <b>đ</b> · s + j → <b>š</b> · z + j → <b>ž</b> · l + j → <b>lj</b> · n + j → <b>nj</b><br><br>brat + ja → bra<b>ć</b>a · mlad + ji → mla<b>đ</b>i · visok + ji → vi<b>š</b>i<br><br>This is where comparatives get their shape."},
    {h:"Nepostojano a — the vanishing a",
     b:"Some words have an <b>a</b> that appears in the nominative and disappears everywhere else:<br>p<b>a</b>s → psa, psu, psom<br>ot<b>a</b>c → oca, ocu<br>dobar → dobr<b>og</b>, dobr<b>a</b><br>Amerikan<b>a</b>c → Amerikanca<br><br>Once you spot the pattern, dozens of 'irregular' words become regular."},
    {h:"L → O at the end of words",
     b:"Word-final <b>l</b> became <b>o</b>. That's why the past forms look the way they do:<br>čita<b>l</b> → čita<b>o</b> · radi<b>l</b> → radi<b>o</b> · bi<b>l</b> → bi<b>o</b><br>But the feminine keeps the l: čita<b>la</b>, radi<b>la</b>, bi<b>la</b>.<br><br>The old l comes back when an ending is added: posa<b>o</b> (work) → pos<b>l</b>a · misa<b>o</b> (thought) → mis<b>l</b>i · pepe<b>o</b> (ash) → pepe<b>l</b>a."}
  ],

    {t:"mc",q:"Why is it 'psa' and not 'pasa'?",o:["Palatalizacija","Jotacija","Nepostojano a","L→O"],a:2,e:"The a in pas vanishes in other cases."},

  grammar:[

    {h:"Little and lovely: diminutives",
     b:"Croatians love making things small and cosy:<br><b>-ić</b> (m): pas → <b>psić</b> (puppy) · stol → <b>stolić</b><br><b>-ica</b> (f): kava → <b>kavica</b> · kuća → <b>kućica</b> · ruka → <b>ručica</b><br><b>-ce</b> (n): pivo → <b>pivce</b> · selo → <b>selce</b><br><br>It's about warmth more than size: <b>Idemo na kavicu?</b> — Fancy a coffee? is what friends actually say."},
    {h:"From doing to things: -nje, -telj, -ač",
     b:"<b>-nje</b> turns a verb into the activity: plivati → <b>plivanje</b> (swimming) · čitati → <b>čitanje</b> · kuhati → <b>kuhanje</b> · učiti → <b>učenje</b><br><b>Volim plivanje.</b> — I love swimming.<br><br>People who do it: učiti → <b>učitelj</b> · voziti → <b>vozač</b> (driver) · pjevati → <b>pjevač</b> (singer) · kuhati → <b>kuhar</b> (cook)"},
    {h:"Adjectives from places and people",
     b:"From places: <b>-ski / -čki</b>: Hrvatska → <b>hrvatski</b> · Split → <b>splitski</b> · Zagreb → <b>zagrebački</b> · more → <b>morski</b><br>From time: dan → <b>dnevni</b> · noć → <b>noćni</b> · godina → <b>godišnji</b><br><br>From people (Croatian has no 's): <b>-in</b> for -a words, <b>-ov / -ev</b> for the rest:<br>Ana → <b>Anin</b> · mama → <b>mamin</b> · tata → <b>tatin</b> · Marko → <b>Markov</b> · brat → <b>bratov</b><br>They agree like moj: <b>Anin</b> brat · <b>Anina</b> kuća · <b>Markov</b> auto"},
    {h:"Why the spelling jumps: ije / je, and matching sounds",
     b:"Standard Croatian writes <b>ije</b> in a long syllable and <b>je</b> (or e) in a short one — so one word can switch:<br>riječ → <b>rječnik</b> (dictionary) · rijeka → <b>rječica</b> · lijep → <b>ljepši</b> · dijete → <b>djeca</b> · vrijeme → <b>vremena</b><br><br>And when a vowel disappears (Unit {u24}), the consonant next to it changes to match the next sound — Croatian spells it how it's said:<br>sladak → <b>slatka</b> · težak → <b>teška</b> · vrabac → <b>vrapca</b><br><br>You don't need to apply these rules — just recognise why the word looks different."}

 {u:18, g:{h:"Ana's, Marko's — Anin, Markov",

 {u:19, g:{h:"Describing words in every case",
   b:"Describing words have one set of endings — this table covers them all:<table><tr><th></th><th>m / n</th><th>f</th></tr><tr><td class='cs'>N</td><td class='hr'>dobar (dobri) · dobro</td><td class='hr'>dobra</td></tr><tr><td class='cs'>G</td><td class='hr'>dobrog(a)</td><td class='hr'>dobre</td></tr><tr><td class='cs'>D / L</td><td class='hr'>dobrom(u)</td><td class='hr'>dobroj</td></tr><tr><td class='cs'>A</td><td class='hr'>dobar · dobrog* · dobro</td><td class='hr'>dobru</td></tr><tr><td class='cs'>I</td><td class='hr'>dobrim</td><td class='hr'>dobrom</td></tr></table>* alive → dobrog: <b>Imam dobrog psa.</b><br><br>Plural, all genders: G <b>dobrih</b> · D / L / I <b>dobrim(a)</b><br>After soft consonants it's -eg / -em: <b>vrućeg</b> · <b>našem</b><br><br><b>kod dobrog prijatelja</b> · <b>u dobroj kući</b> · <b>s dobrim ljudima</b>"},

 {u:20, g:{h:"More, less, faster",

 {u:21, g:{h:"Every pronoun, every case",
   b:"The full set — short forms in brackets are the everyday ones:<table><tr><th></th><th>G / A</th><th>D / L</th><th>I</th></tr><tr><td class='cs'>ja</td><td class='hr'>mene (me)</td><td class='hr'>meni (mi)</td><td class='hr'>mnom</td></tr><tr><td class='cs'>ti</td><td class='hr'>tebe (te)</td><td class='hr'>tebi (ti)</td><td class='hr'>tobom</td></tr><tr><td class='cs'>on / ono</td><td class='hr'>njega (ga)</td><td class='hr'>njemu (mu)</td><td class='hr'>njim</td></tr><tr><td class='cs'>ona</td><td class='hr'>nje / nju (je)</td><td class='hr'>njoj (joj)</td><td class='hr'>njom</td></tr><tr><td class='cs'>mi</td><td class='hr'>nas</td><td class='hr'>nama (nam)</td><td class='hr'>nama</td></tr><tr><td class='cs'>vi</td><td class='hr'>vas</td><td class='hr'>vama (vam)</td><td class='hr'>vama</td></tr><tr><td class='cs'>oni</td><td class='hr'>njih (ih)</td><td class='hr'>njima (im)</td><td class='hr'>njima</td></tr></table>After o, u, na (locative) always use the long form: <b>o meni</b> · <b>o njemu</b>.<br>ona has two long forms: <b>nje</b> for the genitive (kod nje) and <b>nju</b> for the accusative (za nju)."},

 {u:29, g:{h:"Verbs that pick a case",
   b:"Some verbs don't take the plain accusative. Learn them with their case:<br><b>+ genitive:</b> bojati se (be afraid of) · sjećati se (remember) — <b>Bojim se pasa.</b> (I'm afraid of dogs) · <b>Sjećaš li se Ane?</b> (Do you remember Ana?)<br><b>+ dative:</b> pomagati (help) · vjerovati (believe) · javiti se (get in touch) — <b>Vjerujem ti.</b> (I believe you) · <b>Javi se mami.</b> (Get in touch with Mom!)<br><b>s + instrumental:</b> razgovarati s (talk with) · igrati se s (play with) — <b>Razgovaram s Anom.</b><br><b>na + accusative:</b> misliti na (think of) — <b>Mislim na Anu.</b><br><b>čekati</b> takes a plain accusative — no word for 'for': <b>Čekam autobus.</b>"},

 {u:23, g:{h:"što as 'that' / 'what' mid-sentence",

 {u:8, g:{h:"The odd ones",
   b:"Most words follow the endings table. These are the ones that catch people out.<br><br><b>1 · The disappearing a</b> (alive words):<table><tr><th>basic</th><th>accusative</th></tr><tr><td class='hr'>pas (dog)</td><td class='hr'>psa</td></tr><tr><td class='hr'>otac (father)</td><td class='hr'>oca</td></tr><tr><td class='hr'>mačak (tomcat)</td><td class='hr'>mačka</td></tr></table><b>2 · Men's words ending in -a → -u</b>, like feminine words: tata → <b>tatu</b> · Luka → <b>Luku</b> · kolega → <b>kolegu</b><br><br><b>3 · Masculine words ending in -o / -e:</b> alive → <b>-a</b>: Marko → <b>Marka</b> · Hrvoje → <b>Hrvoja</b>. A thing → no change: auto → <b>auto</b>. (kino, pivo, selo are neuter, so no change either.)<br><br><b>4 · Never change in the accusative:</b> feminine words ending in a consonant (noć, obitelj, stvar, ljubav) · girls' names not ending in -a (Kim) · every neuter word, even dijete, ime, vrijeme.<br><br><b>5 · Two special ones:</b> čovjek (person) → <b>čovjeka</b> (normal alive -a) · kći (daughter) → <b>kćer</b>: <em>Imam kćer.</em><br><br><b>In the plural:</b> ljudi (people) → <b>ljude</b>: <em>Vidim ljude.</em> · djeca (children) acts like a feminine -a word → <b>djecu</b>: <em>Volim djecu.</em>"},

 {u:10, g:{h:"The odd ones",
   b:"<b>1 · k, g, h → c, z, s</b>, but only in feminine -a words:<table><tr><th>basic</th><th>locative</th></tr><tr><td class='hr'>ruka (hand)</td><td class='hr'>u ruci</td></tr><tr><td class='hr'>noga (leg)</td><td class='hr'>na nozi</td></tr><tr><td class='hr'>knjiga (book)</td><td class='hr'>u knjizi</td></tr></table>Masculine words keep their letter: u <b>parku</b> · o <b>Marku</b> · na <b>otoku</b>. Family words and names keep it too: o <b>baki</b> · o <b>Luki</b>.<br><br><b>2 · The disappearing a:</b> pas → o <b>psu</b> · otac → o <b>ocu</b> · posao → na <b>poslu</b><br><br><b>3 · Words that grow:</b> dijete → o <b>djetetu</b> · ime → o <b>imenu</b> · vrijeme → o <b>vremenu</b> (about the weather)<br><br><b>4 · Men's words ending in -a → -i:</b> tata → o <b>tati</b> · Luka → o <b>Luki</b><br><br><b>5 · Feminine consonant words → -i:</b> o <b>obitelji</b> · o <b>ljubavi</b> · kći → o <b>kćeri</b>. Girls' names not ending in -a don't change: o <b>Kim</b>.<br><br><b>6 · Countries in -ska / -čka / -ška → -oj:</b> u <b>Hrvatskoj</b> · u <b>Njemačkoj</b><br><br><b>7 · radio adds a j:</b> na <b>radiju</b><br><br><b>In the plural:</b> ljudi → o <b>ljudima</b> · djeca → o <b>djeci</b> (djeca acts like a feminine -a word)."},

 {u:11, g:{h:"The odd ones",
   b:"The dative has the <b>same odd ones as the locative</b>, because the endings are the same:<table><tr><th>basic</th><th>dative</th></tr><tr><td class='hr'>knjiga</td><td class='hr'>knjizi</td></tr><tr><td class='hr'>pas</td><td class='hr'>psu</td></tr><tr><td class='hr'>otac</td><td class='hr'>ocu</td></tr><tr><td class='hr'>dijete</td><td class='hr'>djetetu</td></tr><tr><td class='hr'>tata</td><td class='hr'>tati</td></tr><tr><td class='hr'>kći</td><td class='hr'>kćeri</td></tr></table>• k, g, h → c, z, s only in feminine -a words. Family words and names keep their letter: <b>baki</b> · <b>Luki</b><br>• Masculine names in -o / -e take the normal -u: <b>Marku</b> · <b>Hrvoju</b><br>• Girls' names not ending in -a don't change: <em>Pišem Kim.</em><br><br><b>In the plural:</b> ljudi → <b>ljudima</b> · djeca → <b>djeci</b>: <em>Kupujem poklon djeci.</em> — I'm buying the children a present."},

 {u:12, g:{h:"The odd ones",
   b:"<b>1 · -em instead of -om</b> after soft consonants and c:<table><tr><th>basic</th><th>instrumental</th></tr><tr><td class='hr'>prijatelj</td><td class='hr'>s prijateljem</td></tr><tr><td class='hr'>muž (husband)</td><td class='hr'>s mužem</td></tr><tr><td class='hr'>otac</td><td class='hr'>s ocem</td></tr></table>(otac also drops its a.)<br><br><b>2 · The disappearing a:</b> pas → s <b>psom</b> · mačak → s <b>mačkom</b><br><br><b>3 · Words that grow:</b> dijete → s <b>djetetom</b> · ime → s <b>imenom</b> · vrijeme → s <b>vremenom</b> (over time)<br><br><b>4 · Feminine consonant words → -i</b> (or -ju): s <b>obitelji</b> · s <b>ljubavlju</b> · kći → s <b>kćeri</b><br><br><b>5 · Men's words ending in -a → -om</b>, like feminine words: s <b>tatom</b> · s <b>Lukom</b><br><br><b>6 · Girls' names not ending in -a don't change:</b> s <b>Kim</b><br><br><b>In the plural:</b> ljudi → s <b>ljudima</b> · djeca → s <b>djecom</b>: <em>Idem s djecom.</em>"},
