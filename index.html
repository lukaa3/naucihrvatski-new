<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nauči hrvatski</title>
<!-- home-screen app: icon, full screen, works offline -->
<link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials">
<meta name="theme-color" content="#08152F">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Nauči hrvatski">
<script>
  if("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost"))
    addEventListener("load", () => navigator.serviceWorker.register("/sw.js").catch(() => {}));
</script>
<script type="module">
  import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
  window.__sbCreate = createClient;
  window.dispatchEvent(new Event("sb-ready"));
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;0,700;0,800;1,400;1,700&family=Karla:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap&subset=latin,latin-ext" rel="stylesheet">
<style>
:root{
  --deep:#08152F;
  --deep-2:#102344;
  --deep-3:#193561;
  --stone:#EAF0FA;
  --stone-dim:#93A6C4;
  --dim:#93A6C4;
  --olive:#3FB98A;
  --madder:#E0362F;
  --brass:#6BA6FF;
  --line:rgba(234,240,250,.13);
  --line-2:rgba(234,240,250,.24);
  --display:'Alegreya', Georgia, 'Times New Roman', serif;
  --body:'Karla', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --mono:'Space Mono', ui-monospace, Menlo, monospace;
  --r:14px;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--deep);
  color:var(--stone);
  font-family:var(--body);
  font-size:16px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(900px 500px at 82% -8%, rgba(107,166,255,.13), transparent 60%),
    radial-gradient(700px 600px at 6% 104%, rgba(224,54,47,.08), transparent 62%);
}
h1,h2,h3,h4{font-family:var(--display);font-weight:800;line-height:1.15;margin:0;letter-spacing:-.01em}
p{margin:0 0 .8em}
a{color:var(--brass)}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
input,textarea,select{font-family:inherit;font-size:inherit}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px;border-radius:6px}

/* ---------- shell ---------- */
.shell{position:relative;z-index:1;display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh;max-width:1240px;margin:0 auto}

.rail{
  border-right:1px solid var(--line);
  padding:26px 18px 40px;
  position:sticky;top:0;height:100vh;overflow-y:auto;
  display:flex;flex-direction:column;gap:22px;
}
.brand{display:block;text-decoration:none;color:inherit}
.brand .mark{font-family:var(--display);font-size:30px;font-weight:800;letter-spacing:-.02em}
.brand .mark em{font-style:italic;color:var(--brass)}
.brand .tag{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--stone-dim);margin-top:2px}

.nav{display:flex;flex-direction:column;gap:2px}
.nav button{
  display:flex;align-items:baseline;gap:9px;width:100%;text-align:left;
  background:none;border:0;border-radius:10px;padding:9px 11px;
  color:var(--stone-dim);transition:background .15s,color .15s;
}
.nav button .hr{font-family:var(--display);font-size:17px;font-weight:700;color:inherit}
.nav button .en{font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.6}
.nav button:hover{background:rgba(107,166,255,.10);color:var(--stone)}
.nav button[aria-current="true"]{background:var(--deep-2);color:var(--stone)}
.nav button[aria-current="true"] .hr{color:var(--brass)}

.rail-foot{margin-top:auto;font-size:12px;color:var(--stone-dim);line-height:1.5}
.stat-row{display:flex;gap:14px;margin-bottom:12px}
.stat{flex:1}
.stat b{display:block;font-family:var(--mono);font-size:19px;color:var(--brass);font-weight:700}
.stat span{font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--stone-dim)}

.main{padding:30px 34px 90px;min-width:0}

/* ---------- pleter (signature) ---------- */
.board{width:100%;height:20px;display:block;border-radius:3px;overflow:hidden}
.board rect{transition:fill .35s}

/* ---------- page head ---------- */
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--brass);margin-bottom:8px}
.page-h{font-size:clamp(30px,4.4vw,44px);margin-bottom:6px}
.page-h i{color:var(--brass);font-style:italic}
.lede{color:var(--stone-dim);max-width:60ch;margin-bottom:24px}

/* ---------- cards ---------- */
.card{background:var(--deep-2);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.card + .card{margin-top:14px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}

.kicker{font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--stone-dim);margin-bottom:10px}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;gap:8px;justify-content:center;
  background:var(--madder);border:1px solid var(--madder);color:#fff;
  padding:10px 18px;border-radius:999px;font-weight:600;font-size:15px;
  transition:transform .12s, filter .15s;
}
.btn:hover{filter:brightness(1.1)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;border-color:var(--line-2);color:var(--stone)}
.btn.ghost:hover{background:rgba(107,166,255,.12)}
.btn.brass{background:var(--brass);border-color:var(--brass);color:#05132B}
.btn.sm{padding:6px 13px;font-size:13.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}

.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{
  background:transparent;border:1px solid var(--line-2);color:var(--stone-dim);
  padding:5px 12px;border-radius:999px;font-size:13.5px;transition:.15s;
  line-height:1.25;text-align:center;
}
.c2{display:block;font-size:10px;opacity:.62;font-style:italic;letter-spacing:.01em;margin-top:1px}
.btn .c2{opacity:.75;font-size:10px}
.chip:hover{color:var(--stone);border-color:var(--stone-dim)}
.chip[aria-pressed="true"]{background:var(--brass);border-color:var(--brass);color:#05132B;font-weight:600}

/* ---------- word rows ---------- */
.wordlist{display:grid;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.word{display:flex;align-items:center;gap:12px;background:var(--deep-2);padding:9px 13px}
.word .hr{font-family:var(--display);font-size:19px;font-weight:700;min-width:150px}
.word .en{color:var(--stone-dim);flex:1;font-size:14.5px}
.word .note{font-size:12px;color:var(--brass);opacity:.85;font-style:italic}
.spk{background:none;border:0;color:var(--stone-dim);padding:3px 5px;border-radius:6px;line-height:1}
body.novoice .spk{opacity:.4}
.spk:hover{color:var(--brass);background:rgba(107,166,255,.14)}
.save{background:none;border:0;color:var(--stone-dim);padding:3px 5px;font-size:13px}
.save:hover{color:var(--brass)}
.save[aria-pressed="true"]{color:var(--brass)}

/* ---------- tables ---------- */
table{width:100%;border-collapse:separate;border-spacing:0;font-size:14.5px;overflow:hidden;border-radius:12px}
th,td{text-align:left;padding:9px 13px;border-bottom:1px solid var(--line)}
thead th, tr:first-child th{
  background:linear-gradient(180deg, rgba(107,166,255,.16), rgba(107,166,255,.06));
  font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--brass);font-weight:700;
  border-bottom:1px solid rgba(107,166,255,.3);
}
tbody tr:nth-child(even) td, tr:nth-child(even) td{background:rgba(234,240,250,.025)}
tr:last-child td{border-bottom:0}
tr:hover td{background:rgba(107,166,255,.07)}
td.hr{font-family:var(--display);font-size:17.5px;font-weight:600;color:var(--stone)}
td.cs{font-family:var(--mono);font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--brass);
  white-space:nowrap;background:rgba(107,166,255,.07);font-weight:700}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--deep)}
.tblwrap table{border-radius:0}

/* grammar explanation blocks inside a unit */
.card h3{color:var(--stone)}
.card > div[style*="font-size:15px"] b{color:var(--brass)}
.gsec{display:flex;align-items:center;gap:11px;margin:0 0 12px}
.gsec .n{flex:none;width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:13px;font-weight:700;background:rgba(107,166,255,.14);color:var(--brass)}
.gsec h3{font-size:19px;margin:0;line-height:1.2}

/* ---------- vocab packs ---------- */
.pack{background:var(--deep-2);border:1px solid var(--line);border-radius:var(--r);padding:16px;
  cursor:pointer;transition:.15s}
.pack:hover{border-color:var(--brass);transform:translateY(-2px);background:var(--deep-3)}
.pack b{font-family:var(--display);font-size:19px;display:block;line-height:1.2}
.pack span{font-size:12.5px;color:var(--stone-dim)}
.pack .n{font-family:var(--mono);font-size:11px;color:var(--brass);margin-top:7px;display:block;letter-spacing:.06em}

/* ---------- daily challenge ---------- */
.daily .dword{font-family:var(--display);font-size:34px;font-weight:800;line-height:1.1;margin:2px 0}
.daily.won{border-color:rgba(63,185,138,.4)}
.dmean{margin-top:10px;padding:10px 12px;border-radius:10px;background:rgba(107,166,255,.08);
  border:1px solid rgba(107,166,255,.2);font-size:14px;line-height:1.5}
.dmean b{color:var(--brass)}
.unlocked{margin-top:12px;font-size:13.5px;font-weight:600;color:var(--olive)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal-h{font-size:10.5px;text-align:center;color:var(--stone-dim);letter-spacing:.06em;text-transform:uppercase;padding-bottom:3px}
.cal-d{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border-radius:8px;
  font-family:var(--mono);font-size:12.5px;background:rgba(234,240,250,.04);color:var(--stone-dim);border:1.5px solid transparent}
.cal-d.half{background:rgba(107,166,255,.24);color:var(--stone)}
.cal-d.full{background:var(--olive);color:#05132B;font-weight:700}
.cal-d.today{border-color:var(--brass)}
.cal-d.future{opacity:.35}
.cal-key{display:inline-block;width:11px;height:11px;border-radius:3px;vertical-align:-1px;margin-right:4px;background:rgba(234,240,250,.04)}
.cal-key.full{background:var(--olive)} .cal-key.half{background:rgba(107,166,255,.24)} .cal-key.today{border:1.5px solid var(--brass)}

.countdown{margin-top:8px;font-size:13.5px;color:var(--stone-dim);display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.countdown b{font-family:var(--mono);color:var(--brass);font-size:14px}
.cd-dot{width:7px;height:7px;border-radius:50%;background:var(--olive);box-shadow:0 0 8px var(--olive);animation:cdp 2s ease-in-out infinite}
@keyframes cdp{50%{opacity:.35}}

.savebar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 16px;padding:10px 14px;border-radius:11px;
  font-size:14px;background:rgba(224,54,47,.12);border:1px solid rgba(224,54,47,.4)}
.savebar.warn{background:rgba(107,166,255,.1);border-color:rgba(107,166,255,.35)}

.cstats{display:flex;gap:10px;flex-wrap:wrap}
.cstat{flex:1;min-width:90px;text-align:center;padding:12px 8px;border:1px solid var(--line);border-radius:12px;background:var(--deep)}
.cstat b{display:block;font-family:var(--mono);font-size:26px;line-height:1.1}
.cstat b small{font-size:14px;color:var(--stone-dim)}
.cstat span{font-size:11.5px;color:var(--stone-dim);letter-spacing:.04em}
.boxdots{display:inline-flex;gap:3px;margin-right:8px;vertical-align:1px}
.boxdots i{width:6px;height:6px;border-radius:50%;background:var(--line-2)}
.boxdots i.on{background:var(--brass)}
details.card > summary{list-style:none}
details.card > summary::-webkit-details-marker{display:none}

/* ---------- learning path ---------- */
.secthead{display:flex;align-items:center;gap:13px;margin:28px 0 6px;padding:12px 16px;
  background:linear-gradient(90deg, rgba(107,166,255,.13), rgba(107,166,255,.02));
  border:1px solid var(--line);border-radius:12px}
.secthead .bar{flex:none;width:5px;height:36px;border-radius:3px}
.secthead h3{font-size:21px;margin:0}
.secthead .sub{font-size:11px;color:var(--stone-dim);letter-spacing:.13em;text-transform:uppercase}
.secthead .cnt{margin-left:auto;font-family:var(--mono);font-size:13px;color:var(--brass);font-weight:700;
  background:rgba(107,166,255,.12);border:1px solid rgba(107,166,255,.28);padding:4px 11px;border-radius:999px}

.path{position:relative;padding:18px 0 10px}
.path::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:3px;margin-left:-1.5px;
  background:linear-gradient(180deg, rgba(107,166,255,.35), rgba(107,166,255,.10));border-radius:2px}

.node{position:relative;display:flex;align-items:center;gap:14px;margin:16px 0;width:50%}
.node.l{margin-right:auto;flex-direction:row-reverse;text-align:right;padding-right:34px}
.node.r{margin-left:auto;padding-left:34px}
.node button{all:unset;cursor:pointer;display:contents}
.node .lbl{flex:1;min-width:0;background:var(--deep-2);border:1px solid var(--line);
  border-radius:12px;padding:11px 15px;transition:.15s}
.node .lbl b{display:block;font-family:var(--display);font-size:17px;font-weight:700;line-height:1.25;color:var(--stone)}
.node .lbl span{font-size:12px;color:var(--stone-dim)}
.node:not(.locked):hover .lbl{border-color:var(--brass);background:var(--deep-3)}
.node.cur .lbl{border-color:var(--brass);background:rgba(107,166,255,.10)}
.node.done .lbl{border-color:rgba(63,185,138,.35)}

.dotbig{position:absolute;top:50%;width:52px;height:52px;margin-top:-26px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:700;font-size:17px;
  border:3px solid var(--deep);background:var(--deep-2);transition:transform .15s}
.node.l .dotbig{right:-26px}
.node.r .dotbig{left:-26px}
.node:not(.locked):hover .dotbig{transform:scale(1.09)}
.node.open .dotbig{border:3px solid currentColor}
.node.done .dotbig{color:#05132B;box-shadow:0 0 14px rgba(63,185,138,.35)}
.node.cur .dotbig{box-shadow:0 0 0 5px rgba(107,166,255,.22), 0 0 22px rgba(107,166,255,.45)}
.node.locked{opacity:.45}
.node.locked .dotbig{background:transparent;border:2px solid var(--line-2);color:var(--stone-dim)}
.node.locked .lbl{background:transparent;border-style:dashed}

@media (max-width:700px){
  .path::before{left:26px}
  .node,.node.l,.node.r{width:100%;margin:13px 0;padding:0 0 0 62px;flex-direction:row;text-align:left}
  .node .lbl{width:100%}
  .node.l .dotbig,.node.r .dotbig{left:0;right:auto}
}

/* ---------- practical lessons ---------- */
.skillcard{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--deep-2);
  border:1px solid var(--line);border-radius:var(--r);padding:15px 18px;margin-bottom:9px;transition:.15s}
.skillcard:hover{border-color:var(--brass);transform:translateX(3px)}
.skillcard .num{flex:none;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:15px;font-weight:700;border:2px solid var(--line-2);color:var(--stone-dim)}
.skillcard.done .num{background:var(--olive);border-color:var(--olive);color:#05132B}
.skillcard .t{font-family:var(--display);font-size:19px;font-weight:700;display:block;line-height:1.2}
.skillcard .s{font-size:12.5px;color:var(--stone-dim)}

.dlg{display:grid;gap:9px;margin-top:4px}
.dline{display:flex;gap:11px;align-items:flex-start}
.dline .who{flex:none;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:11px;font-weight:700;background:var(--deep-3);color:var(--brass);margin-top:2px}
.dline.b .who{background:rgba(224,54,47,.2);color:var(--madder)}
.dline .say{flex:1;min-width:0}
.dline .cro{font-family:var(--display);font-size:17.5px;line-height:1.4}
.dline .eng{font-size:13px;color:var(--stone-dim);font-style:italic}

/* ---------- unit list ---------- */
.unit{
  display:flex;align-items:center;gap:16px;width:100%;text-align:left;
  background:var(--deep-2);border:1px solid var(--line);border-radius:var(--r);
  padding:15px 18px;margin-bottom:9px;transition:.15s;
}
.unit:hover{border-color:var(--line-2);transform:translateX(3px)}
.unit .ord{
  font-family:var(--display);font-style:italic;font-size:14px;color:var(--brass);
  min-width:62px;border-right:1px solid var(--line);padding-right:12px;line-height:1.2;
}
.unit .ord b{display:block;font-style:normal;font-family:var(--mono);font-size:20px;font-weight:700}
.unit .body{flex:1;min-width:0}
.unit .t{font-family:var(--display);font-size:21px;font-weight:700}
.unit .s{font-size:13px;color:var(--stone-dim)}
.unit .tick{color:var(--olive);font-size:19px}

/* ---------- chat ---------- */
.chat{display:flex;flex-direction:column;gap:12px;min-height:280px;max-height:56vh;overflow-y:auto;padding-right:4px}
.msg{max-width:88%;padding:12px 15px;border-radius:14px;font-size:15.5px}
.msg.bot{background:var(--deep-3);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px}
.msg.me{background:rgba(224,54,47,.18);border:1px solid rgba(224,54,47,.45);align-self:flex-end;border-bottom-right-radius:4px}
.msg .cro{font-family:var(--display);font-size:18px;line-height:1.45}
.msg .tr{font-size:13.5px;color:var(--stone-dim);margin-top:5px;font-style:italic}
.fix{margin-top:9px;padding:9px 11px;border-left:3px solid var(--olive);background:rgba(63,185,138,.12);border-radius:0 8px 8px 0;font-size:13.5px}
.fix b{color:var(--olive)}
.composer{display:flex;gap:9px;margin-top:14px}
.composer input{
  flex:1;background:var(--deep);border:1px solid var(--line-2);color:var(--stone);
  padding:12px 15px;border-radius:999px;font-size:16px;
}
.composer input::placeholder{color:var(--stone-dim);opacity:.65}
.hintbar{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.hintbar button{background:rgba(107,166,255,.13);border:1px solid rgba(107,166,255,.35);color:var(--brass);
  padding:6px 13px;border-radius:14px;font-size:13.5px;line-height:1.3;text-align:left}
.hintbar button .c2{display:block;font-size:10.5px;opacity:.75;font-style:italic;color:var(--stone-dim);margin-top:1px}
.hintbar button:hover{background:rgba(107,166,255,.24)}

/* ---------- quiz ---------- */
.q{font-family:var(--display);font-size:23px;font-weight:700;margin-bottom:14px;line-height:1.35}
.opts{display:grid;gap:8px}
.opt{
  text-align:left;background:var(--deep);border:1px solid var(--line-2);color:var(--stone);
  padding:12px 16px;border-radius:11px;font-size:16px;transition:.13s;
}
.opt:hover:not(:disabled){border-color:var(--brass)}
.opt.right{border-color:var(--olive);background:rgba(63,185,138,.18)}
.opt.wrong{border-color:var(--madder);background:rgba(224,54,47,.16)}
.answer{
  width:100%;background:var(--deep);border:1px solid var(--line-2);color:var(--stone);
  padding:12px 16px;border-radius:11px;font-size:18px;font-family:var(--display);
}
.verdict{margin-top:13px;padding:12px 14px;border-radius:10px;font-size:14.5px}
.tts-pill{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:60;background:var(--ink-2,#132036);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-size:13.5px;box-shadow:0 6px 20px rgba(0,0,0,.35)}
.review .rv{padding:11px 0;border-top:1px solid var(--line)}
.review[data-only="no"] .rv-ok{display:none}
.review .rv-q{font-size:15px;display:flex;gap:7px;align-items:baseline}

.gloss{

}
.gloss b{font-family:var(--display);font-size:16px;color:var(--brass);display:block}

}

.note b{color:var(--brass)}
.pill{display:inline-block;font-family:var(--mono);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;padding:3px 9px;border:1px solid var(--line-2);border-radius:999px;color:var(--stone-dim)}

hr.rule{border:0;border-top:1px solid var(--line);margin:22px 0}

.crn:hover{color:var(--brass)}
.cdel:hover{color:var(--madder)}
.cdel.armed{color:var(--madder);border:1px solid var(--madder);font-size:11.5px;padding:3px 8px}

/* ---------- settings modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(4,10,24,.76);backdrop-filter:blur(3px);z-index:80;display:flex;align-items:center;justify-content:center;padding:18px}
.modal{background:var(--deep-2);border:1px solid var(--line-2);border-radius:18px;max-width:520px;width:100%;max-height:88vh;overflow-y:auto;padding:26px;box-shadow:0 24px 70px rgba(0,0,0,.6)}
.modal h2{font-size:26px;margin-bottom:4px}
.field{width:100%;background:var(--deep);border:1px solid var(--line-2);color:var(--stone);padding:11px 14px;border-radius:11px;font-family:var(--mono);font-size:13px}
.field:focus{border-color:var(--brass)}
select.field{font-family:var(--body);font-size:15px}
.gear{background:none;border:1px solid var(--line);color:var(--stone-dim);border-radius:9px;padding:5px 11px;font-size:12.5px;margin-top:10px}
.gear:hover{color:var(--brass);border-color:var(--brass)}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:1px}
.view{animation:fade .28s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
/* never let the page scroll sideways — wide bits (the tab bar, tables) scroll inside themselves instead */
html,body{max-width:100%;overflow-x:hidden}
@supports (overflow:clip){ html,body{overflow-x:clip} }
.tblwrap{max-width:100%;overflow-x:auto}
.composer input{min-width:0;width:100%}

#main div:not(.tblwrap) > table{display:block;max-width:100%;overflow-x:auto}

/* grammar steps */

.stepcheck{border-color:rgba(107,166,255,.45)}
</style>

{

  grammar:[

     b:"Every letter has exactly one sound, always. No silent letters, no <em>ough</em> problems. Learn the letters once and you can pronounce any word you ever see.<br><br><b>The five that don't look like English:</b><br><b>c</b> = ts (ca<em>ts</em>) — <em>cesta</em> is TSES-ta<br><b>j</b> = y (<em>y</em>es) — <em>ja</em> is YAH<br><b>š</b> = sh · <b>ž</b> = the s in mea<em>s</em>ure · <b>h</b> = raspy, like Ba<em>ch</em><br><br><b>č vs ć:</b> č is hard (chur<em>ch</em>), ć is soft and lighter. Croatians hear the difference; foreigners mostly don't at first, and mixing them up won't stop you being understood.<br><br><b>Dž, Lj, Nj are single letters</b> — dž like <em>j</em>udge, lj like mi<em>lli</em>on, nj like ca<em>ny</em>on."},

{

    {h:"ti or vi — decide before you open your mouth",
     b:"<b>ti</b> = one person you know: friends, classmates, family, anyone your age.<br><b>vi</b> = a stranger, an older person, a teacher, a waiter, a shop assistant. Also any group.<br><br>Kako <b>si</b>? (ti) · Kako <b>ste</b>? (vi)<br>Kako se <b>zoveš</b>? (ti) · Kako se <b>zovete</b>? (vi)<br><br>With an adult you don't know: <b>vi</b>. Croatians will often say <em>možemo na ti</em> — we can switch to ti — when they want to drop it."},

     b:"Croatian usually gives you several options. Here are the everyday ones, roughly casual to formal:<table><tr><th>meaning</th><th>options</th></tr><tr><td class='cs'>hi</td><td class='hr'>Bok · Ej · Dobar dan</td></tr><tr><td class='cs'>bye</td><td class='hr'>Bok · Vidimo se · Doviđenja</td></tr><tr><td class='cs'>how are you</td><td class='hr'>Kako si? · Kako ide? · Što ima? · Kako ste?</td></tr><tr><td class='cs'>I'm fine</td><td class='hr'>Dobro sam · Ne mogu se žaliti · Ide</td></tr><tr><td class='cs'>thanks</td><td class='hr'>Hvala · Hvala ti · Hvala puno · Hvala lijepa</td></tr><tr><td class='cs'>you're welcome</td><td class='hr'>Nema na čemu · Nema frke · Molim</td></tr><tr><td class='cs'>sorry</td><td class='hr'>Oprosti · Oprostite · Žao mi je · Pardon</td></tr><tr><td class='cs'>yes / no</td><td class='hr'>Da · Aha · Može &nbsp;/&nbsp; Ne · Neću</td></tr></table>You only need <b>one</b> of each to get by. The rest are there so you recognise them when they come at you — which is most of what listening actually is.<br><br><b>Bok</b> and <b>Dobar dan</b> alone will carry you through any first conversation."},
    {h:"Greetings by time of day",
     b:"<b>Bok</b> — hi AND bye, informal, the one you'll use most<br><b>Dobro jutro</b> — until about 10am<br><b>Dobar dan</b> — the safe neutral one, all day<br><b>Dobra večer</b> — evening<br><b>Laku noć</b> — only when someone is going to bed<br><b>Doviđenja</b> — polite goodbye · <b>Vidimo se</b> — see you<br><br><em>Bok</em> to a stranger in a shop is slightly casual but fine. <em>Dobar dan</em> is never wrong."},

  ],

    {t:"mc",q:"'Laku noć' is used when?",o:["Arriving in the evening","Someone is going to bed","Any time after 6pm","Leaving a shop"],a:1,e:"It means good night as in sleep well, not a greeting."},
    {t:"type",q:"Ask a friend where they're from.",a:["odakle si"],e:"Odakle si?"}

{
  id:3, sec:1, title:"Biti — am, are, is", sub:"Glagol biti",
  goal:"Build real sentences, ask yes-no questions, and say what things are not.",
  grammar:[
    {h:"The pronouns, and why you'll drop them",
     b:"<b>ja</b> I · <b>ti</b> you · <b>on</b> he · <b>ona</b> she · <b>ono</b> it<br><b>mi</b> we · <b>vi</b> you (pl/formal) · <b>oni</b> they (m/mixed) · <b>one</b> they (f)<br><br>The verb ending already says who, so the pronoun is optional and usually left out. <em>Umoran sam</em> is normal; <em>Ja sam umoran</em> adds emphasis — <em>I'm</em> tired, as opposed to you."},
    {h:"Two present tenses of biti",
     b:"<b>Short:</b> sam, si, je, smo, ste, su — the everyday form. It <b>can never start a sentence</b>.<br><b>Long:</b> jesam, jesi, jest, jesmo, jeste, jesu — starts questions, gives emphatic answers.<br><br>Ana <b>je</b> ovdje. · <b>Jesi</b> li umoran? — <b>Jesam</b>.<br><br><b>Negative:</b> nisam, nisi, nije, nismo, niste, nisu — one word, never <em>ne sam</em>."},
    {h:"Asking yes-no questions",
     b:"Two ways, both using the little word <b>li</b>, which always sits second:<br><b>Jesi li</b> ti student? — Are you a student?<br><b>Je li</b> ovo kava? — Is this coffee? (often heard as <em>jel'</em>)<br><br>Or just raise your intonation: <em>Ti si student?</em> Common in speech."},
    {h:"Adjectives change with the speaker",
     b:"Croatian words change ending by gender. <em>Unit {u4} teaches the whole system</em> — for now you only need one piece of it: <b>a word describing you takes your own gender.</b> Men keep the plain form, women add <b>-a</b>.<br><br>Umoran sam (m) / Umorna sam (f) — I'm tired<br>Gladan sam / Gladna sam — I'm hungry<br>Sretan sam / Sretna sam — I'm happy<br><br>Learn your own form now; you'll say these constantly."}
  ],
  vocab:[["student / studentica","student m/f"],["učenik / učenica","pupil m/f"],
    ["prijatelj / prijateljica","friend m/f"],["umoran / umorna","tired"],["gladan / gladna","hungry"],
    ["žedan / žedna","thirsty"],["sretan / sretna","happy"],["tužan / tužna","sad"],
    ["bolestan / bolesna","ill"],["ovdje","here"],["tamo","there"],["ovo","this"],["to","that"],
    ["sada","now"],["danas","today"],["jako","very"],["malo","a little"]],
  phrases:[["Ja sam Amerikanac / Amerikanka.","I'm American m/f."],
    ["Nisam odavde.","I'm not from around here."],["Jesi li ti student?","Are you a student?"],
    ["Je li ovo tvoje?","Is this yours?"],["Ona nije kod kuće.","She isn't at home."],
    ["Mi smo prijatelji.","We are friends."],["Jako sam umoran.","I'm very tired. (m)"]],
  drills:[
    {t:"type",q:"Say (male speaker): I am tired.",a:["umoran sam","ja sam umoran"],e:"Umoran sam."},
    {t:"mc",q:"Which sentence is correct?",o:["Sam student.","Ja sam student.","Student sam ja jesam.","Je sam student."],a:1,e:"The short form sam can never open a sentence."},
    {t:"type",q:"Say (male): I'm not hungry.",a:["nisam gladan","ja nisam gladan"],e:"Nisam gladan — the 'not' form is one word."},
    {t:"mc",q:"Complete: ___ li ti gladan?",o:["Je","Jesi","Si","Nisi"],a:1,e:"Second person: jesi, plus li."},
    {t:"mc",q:"A woman says she's hungry:",o:["Gladan sam","Gladna sam","Gladno sam","Gladni sam"],a:1,e:"Feminine adjectives take -a."},
    {t:"type",q:"Say: We are friends.",a:["mi smo prijatelji","smo prijatelji"],e:"Mi smo prijatelji."}
  ]
},
{
  id:4, sec:1, title:"Gender and plurals", sub:"Rod i množina",
  goal:"Tell m/f/n apart at a glance — everything in the case system depends on this.",
  grammar:[
    {h:"You can usually see the gender",
     b:"Every noun is <b>masculine</b>, <b>feminine</b> or <b>neuter</b>, and the <b>last letter</b> usually tells you which:<br><b>Muški (m)</b> — ends in a consonant: <em>grad, stol, prijatelj</em><br><b>Ženski (f)</b> — ends in <b>-a</b>: <em>žena, knjiga, kava</em><br><b>Srednji (n)</b> — ends in <b>-o</b> or <b>-e</b>: <em>more, selo, pivo</em><br><br><b>The exceptions worth memorising:</b> <b>noć, stvar, ljubav, riječ, večer, sol, krv, misao</b> end in consonants but are <b>feminine</b>. Mostly abstract nouns.<br><br><b>People: their real gender wins.</b> A man is masculine even if the word or name ends in -a or -o: <em>tata, Luka, Nikola, Marko, Ivo</em>. A woman is feminine whatever her name ends in: <em>Ana, Kim, Ellen</em>.<br><b>Careful — two separate things:</b> the <b>ending</b> decides how the word itself changes, but the <b>real gender</b> decides every word around it. <em>Luka</em> ends in -a, so when endings start changing (from Unit {u8}) it changes like žena — but he's a man, so the words that describe him are masculine: <em>Luka je <b>umoran</b></em> (not umorna) · <em>Tata je <b>gladan</b></em>. He isn't feminine; he just borrows the -a endings.<br><b>People are never neuter</b> — the one exception is <b>dijete</b> (child).<br><br><b>Most people-words have a male and a female version:</b> <em>prijatelj / prijateljica</em> (friend) · <em>student / studentica</em> · <em>susjed / susjeda</em> (neighbour) · <em>Hrvat / Hrvatica</em>. Use the one that matches the person."},
    {h:"Plurals",
     b:"<b>masculine → add -i</b> · <b>feminine -a → -e</b> · <b>neuter -o / -e → -a</b><br>stol → stolovi · žena → žene · selo → sela · more → mora<br><br><b>Masculine details:</b><br>• One-syllable words add <b>-ov-</b> first: grad → grad<b>ov</b>i, stol → stol<b>ov</b>i. After soft consonants (č ć š ž đ j lj nj) it's <b>-ev-</b>: muž → muž<b>ev</b>i.<br>• Longer words just add -i: prijatelj → prijatelj<b>i</b>. (Amerikanac → Amerikanc<b>i</b>: the a before the last letter drops — Unit {u8} explains.)<br>• Words ending in <b>-k, -g, -h</b> turn that letter into <b>c, z, s</b> before the -i: učenik → učeni<b>ci</b>, dječak → dječa<b>ci</b>.<br><br><b>Feminine words ending in a consonant</b> (noć, stvar) add <b>-i</b>: noć → noći, stvar → stvari.<br><br><b>A mixed group</b> of men and women uses the <b>masculine</b> plural: <em>prijatelji</em> = friends (boys, or boys and girls); <em>prijateljice</em> = only girls."},
    {h:"Irregular plurals you'll meet immediately",
     b:"<b>čovjek → ljudi</b> (person → people)<br><b>dijete → djeca</b> (child → children; djeca behaves as feminine singular!)<br><b>brat → braća</b> · <b>vrata</b> is always plural (door)<br><b>oko → oči</b> (eye) · <b>uho → uši</b> (ear)"},
    {h:"There are no articles",
     b:"No <em>a</em>, no <em>the</em>. <em>Ovo je knjiga</em> means both <em>This is a book</em> and <em>This is the book</em>. <em>Auto je ovdje</em> = <em>A car is here</em> or <em>The car is here</em>. Don't try to translate <em>the</em> — there's nothing to translate it into."}
  ],
  vocab:[["grad","city"],["selo","village"],["kuća","house"],["stan","flat"],["soba","room"],
    ["stol","table"],["stolica","chair"],["prozor","window"],["vrata","door (pl only)"],
    ["knjiga","book"],["more","sea"],["otok","island"],["planina","mountain"],["rijeka","river"],
    ["pas","dog"],["mačka","cat"],["dijete","child (pl djeca)"],["čovjek","person (pl ljudi)"],
    ["noć","night (f)"],["stvar","thing (f)"],["riječ","word (f)"]],
  phrases:[["Ovo je velika kuća.","This is a big house."],["Gradovi su lijepi.","The cities are beautiful."],
    ["Hrvatska ima tisuću otoka.","Croatia has a thousand islands."],["Imam dva psa.","I have two dogs."],
    ["Djeca su u školi.","The children are at school."]],
  drills:[
    {t:"mc",q:"What gender is 'noć'?",o:["masculine","feminine","neuter"],a:1,e:"Feminine, despite the consonant ending."},
    {t:"type",q:"Plural of 'knjiga':",a:["knjige"],e:"knjige"},
    {t:"type",q:"Plural of 'grad':",a:["gradovi"],e:"gradovi — one-syllable masculine inserts -ov-."},
    {t:"mc",q:"Plural of 'čovjek':",o:["čovjeci","čovjekovi","ljudi","čovjeke"],a:2,e:"Fully irregular: ljudi."},
    {t:"mc",q:"What gender is 'stol'?",o:["masculine","feminine","neuter"],a:0,e:"Ends in a consonant → masculine."},
    {t:"type",q:"Plural of 'selo':",a:["sela"],e:"sela — neuter takes -a."}
  ]
},
{
  id:5, sec:1, title:"Present tense", sub:"Prezent",
  goal:"Conjugate any regular verb plus the handful of irregulars you'll use hourly.",
  grammar:[
    {h:"Three patterns, one system",
     b:"Look at the <em>ja</em> form. It ends <b>-am</b>, <b>-im</b>, or <b>-em</b>, and that decides everything else.<table><tr><th></th><th>-am imati</th><th>-im raditi</th><th>-em pisati</th></tr><tr><td class='cs'>ja</td><td class='hr'>imam</td><td class='hr'>radim</td><td class='hr'>pišem</td></tr><tr><td class='cs'>ti</td><td class='hr'>imaš</td><td class='hr'>radiš</td><td class='hr'>pišeš</td></tr><tr><td class='cs'>on/ona</td><td class='hr'>ima</td><td class='hr'>radi</td><td class='hr'>piše</td></tr><tr><td class='cs'>mi</td><td class='hr'>imamo</td><td class='hr'>radimo</td><td class='hr'>pišemo</td></tr><tr><td class='cs'>vi</td><td class='hr'>imate</td><td class='hr'>radite</td><td class='hr'>pišete</td></tr><tr><td class='cs'>oni</td><td class='hr'>imaju</td><td class='hr'>rade</td><td class='hr'>pišu</td></tr></table>After the first letter the endings are identical: -m, -š, —, -mo, -te, then -ju / -e / -u."},
    {h:"The irregulars",
     b:"<table><tr><th></th><th>ići go</th><th>moći can</th><th>htjeti want</th></tr><tr><td class='cs'>ja</td><td class='hr'>idem</td><td class='hr'>mogu</td><td class='hr'>hoću</td></tr><tr><td class='cs'>ti</td><td class='hr'>ideš</td><td class='hr'>možeš</td><td class='hr'>hoćeš</td></tr><tr><td class='cs'>on</td><td class='hr'>ide</td><td class='hr'>može</td><td class='hr'>hoće</td></tr><tr><td class='cs'>mi</td><td class='hr'>idemo</td><td class='hr'>možemo</td><td class='hr'>hoćemo</td></tr><tr><td class='cs'>vi</td><td class='hr'>idete</td><td class='hr'>možete</td><td class='hr'>hoćete</td></tr><tr><td class='cs'>oni</td><td class='hr'>idu</td><td class='hr'>mogu</td><td class='hr'>hoće</td></tr></table>Also: <b>jesti</b> → jedem · <b>piti</b> → pijem · <b>spavati</b> → spavam · <b>vidjeti</b> → vidim"},
    {h:"There's no 'I am doing'",
     b:"Croatian has one present tense. <b>Radim</b> covers <em>I work</em>, <em>I am working</em>, and <em>I do work</em>. Don't look for a continuous form — there isn't one."},
    {h:"Negation, and the double negative rule",
     b:"Put <b>ne</b> in front as a separate word: <em>Ne radim danas.</em><br>Only three fuse: <b>nisam</b>, <b>nemam</b>, <b>neću</b>.<br><br>Where English says <em>I don't know anything</em>, Croatian says <em>I don't know nothing</em> — and that's correct:<br><b>Ne znam ništa.</b> — I don't know anything (ništa = nothing)<br><b>Nikad ne idem tamo.</b> — I never go there (nikad = never)<br><b>Nitko nije ovdje.</b> — Nobody is here (nitko = nobody)<br>Dropping the <em>ne</em> is the mistake."}
  ],
  vocab:[["imati","to have"],["raditi","to work / do"],["govoriti","to speak"],["učiti","to learn"],
    ["znati","to know"],["misliti","to think"],["živjeti","to live"],["gledati","to watch"],
    ["slušati","to listen"],["čitati","to read"],["pisati","to write"],["jesti","to eat"],
    ["piti","to drink"],["ići","to go"],["moći","can"],["htjeti","to want"],["trebati","to need"],
    ["voljeti","to love"],["razumjeti","to understand"],["spavati","to sleep"],["kupiti","to buy"]],
  phrases:[["Učim hrvatski.","I'm learning Croatian."],["Ne znam.","I don't know."],
    ["Što radiš?","What are you doing?"],["Idem u školu.","I'm going to school."],
    ["Možeš li mi pomoći?","Can you help me?"],["Ne razumijem ništa.","I don't understand anything."],
    ["Volim hrvatsku glazbu.","I love Croatian music."]],
  drills:[
    {t:"type",q:"Conjugate: mi + raditi",a:["radimo"],e:"radimo"},
    {t:"type",q:"Say: I'm learning Croatian.",a:["učim hrvatski","ja učim hrvatski"],e:"Učim hrvatski."},
    {t:"mc",q:"Which means 'I can't'?",o:["Ne mogu","Nemogu","Nisam moći","Ne možem"],a:0,e:"Ne mogu — two words."},
    {t:"type",q:"Say: I don't know anything.",a:["ne znam ništa"],e:"Ne znam ništa — double negative required."},
    {t:"mc",q:"oni + ići =",o:["ide","idu","idete","idemo"],a:1,e:"idu"},
    {t:"mc",q:"'Radim' can mean:",o:["Only 'I work'","Only 'I am working'","Both","Neither"],a:2,e:"One present tense covers both."}
  ]
},
{
  id:37, sec:1, title:"Guessing the present tense", sub:"Obitelji glagola",
  goal:"Get from the dictionary form (-ti) to the form you actually say, for the verb groups that change more than usual.",
  grammar:[
    {h:"The dictionary form vs. the one you say",
     b:"Dictionaries list verbs in the <b>-ti</b> form (the infinitive), but you speak with the <b>ja</b> form. Most verbs follow the three patterns from Unit {u5}:<br>čitati → <b>čitam</b> · raditi → <b>radim</b> · pisati → <b>pišem</b><br><br>Some groups change a bit more. The trick is to learn every new verb as a <b>pair</b>, the way you'd learn a plural:<br><b>piti – pijem</b> · <b>jesti – jedem</b> · <b>kupovati – kupujem</b><br><br>Once you know the ja form, the rest is the usual -m, -š, —, -mo, -te, -ju / -e / -u."},
    {h:"-ovati, -ivati → -ujem",
     b:"Every verb ending in <b>-ovati</b> or <b>-ivati</b> swaps it for <b>-uj-</b>:<table><tr><th></th><th>kupovati (buy)</th><th>putovati (travel)</th></tr><tr><td class='cs'>ja</td><td class='hr'>kupujem</td><td class='hr'>putujem</td></tr><tr><td class='cs'>ti</td><td class='hr'>kupuješ</td><td class='hr'>putuješ</td></tr><tr><td class='cs'>on / ona</td><td class='hr'>kupuje</td><td class='hr'>putuje</td></tr><tr><td class='cs'>mi</td><td class='hr'>kupujemo</td><td class='hr'>putujemo</td></tr><tr><td class='cs'>vi</td><td class='hr'>kupujete</td><td class='hr'>putujete</td></tr><tr><td class='cs'>oni</td><td class='hr'>kupuju</td><td class='hr'>putuju</td></tr></table>Also: doručkovati → <b>doručkujem</b> (have breakfast) · pokazivati → <b>pokazujem</b> (show) · darivati → <b>darujem</b> (give as a gift)<br><br><b>Što kupuješ?</b> — What are you buying? · <b>Sutra putujem.</b> — I'm travelling tomorrow."},
    {h:"pisati → pišem: the sound changes",
     b:"In a group of <b>-ati</b> verbs the last consonant changes in every present form:<br>s → š: pisati → <b>pišem</b><br>z → ž: kazati → <b>kažem</b> (say)<br>k → č: plakati → <b>plačem</b> (cry) · skakati → <b>skačem</b> (jump)<br>g → ž: pomagati → <b>pomažem</b> (help)<br>h → š: mahati → <b>mašem</b> (wave)<br><br>The change stays in every person: pišem, pišeš, piše, pišemo, pišete, <b>pišu</b>."},
    {h:"Two small groups: -nuti and -im",
     b:"<b>-nuti → -nem:</b> krenuti → <b>krenem</b> (set off) · maknuti → <b>maknem</b> (move) · okrenuti → <b>okrenem</b> (turn)<br><br><b>Some -ati / -jati verbs take -im:</b> mostly after ž, č or j:<br>držati → <b>držim</b> (hold) · trčati → <b>trčim</b> (run) · ležati → <b>ležim</b> (lie down) · bojati se → <b>bojim se</b> (be afraid) · stajati → <b>stojim</b> (stand)<br><br>And all the <b>-jeti</b> verbs take -im: vidjeti → <b>vidim</b> · živjeti → <b>živim</b> · voljeti → <b>volim</b>"},
    {h:"The ones to just learn",
     b:"These don't follow a pattern — but they're so common you'll know them in a week:<table><tr><th>-ti form</th><th>ja</th><th>oni</th></tr><tr><td class='cs'>jesti (eat)</td><td class='hr'>jedem</td><td class='hr'>jedu</td></tr><tr><td class='cs'>piti (drink)</td><td class='hr'>pijem</td><td class='hr'>piju</td></tr><tr><td class='cs'>uzeti (take)</td><td class='hr'>uzmem</td><td class='hr'>uzmu</td></tr><tr><td class='cs'>dati (give)</td><td class='hr'>dam</td><td class='hr'>daju</td></tr><tr><td class='cs'>sjesti (sit down)</td><td class='hr'>sjednem</td><td class='hr'>sjednu</td></tr><tr><td class='cs'>doći (come)</td><td class='hr'>dođem</td><td class='hr'>dođu</td></tr><tr><td class='cs'>otići (leave)</td><td class='hr'>odem</td><td class='hr'>odu</td></tr><tr><td class='cs'>naći (find)</td><td class='hr'>nađem</td><td class='hr'>nađu</td></tr><tr><td class='cs'>spavati (sleep)</td><td class='hr'>spavam</td><td class='hr'>spavaju</td></tr></table>For <b>reći</b> (say), people normally use <b>kažem</b> from kazati in the present."}
  ],
  vocab:[["kupovati","to buy"],["putovati","to travel"],["doručkovati","to have breakfast"],["pokazivati","to show"],
    ["kazati","to say"],["plakati","to cry"],["pomagati","to help"],["krenuti","to set off"],["držati","to hold"],
    ["trčati","to run"],["ležati","to lie down"],["uzeti","to take"],["dati","to give"],["sjesti","to sit down"]],
  phrases:[["Što kupuješ?","What are you buying?"],["Sutra putujem.","I'm travelling tomorrow."],["Što pišeš?","What are you writing?"],
    ["Trčim svaki dan.","I run every day."],["Ne znam što kažeš.","I don't know what you're saying."]],
  drills:[
    {t:"type",q:"ja + kupovati",a:["kupujem"],e:"-ovati → -ujem."},
    {t:"type",q:"oni + putovati",a:["putuju"],e:"putuju."},
    {t:"type",q:"ja + pisati",a:["pišem"],e:"s → š."},
    {t:"mc",q:"'kažem' comes from…",o:["kazati","kažati"],a:0,e:"z → ž."},
    {t:"type",q:"ja + držati",a:["držim"],e:"After ž → -im."},
    {t:"type",q:"ja + uzeti",a:["uzmem"],e:"Just learn it."}
  ]
},
{
  id:6, sec:1, title:"Asking questions", sub:"Pitanja",
  goal:"Ask anything. This is the single fastest way to keep a conversation alive when your vocabulary runs out.",
  grammar:[
    {h:"The question words",
     b:"<b>tko?</b> who · <b>što?</b> what · <b>gdje?</b> where · <b>kamo?</b> where to · <b>odakle?</b> where from<br><b>kada?</b> when · <b>kako?</b> how · <b>zašto?</b> why · <b>koliko?</b> how much/many<br><b>koji?</b> which · <b>čiji?</b> whose · <b>kakav?</b> what kind of<br><br>Croatian uses <b>tko</b> and <b>što</b> — not <em>ko</em> and <em>šta</em>."},
    {h:"A few question phrases to memorise whole",
     b:"Croatian question words change their ending depending on the job they're doing in the sentence — the case system, which you'll learn properly in the next section. You don't need to understand it yet.<br><br>For now, learn these four as <b>fixed phrases</b>, the way you'd learn a single word:<br><br><b>S kim?</b> — With whom?<br><em>S kim ideš?</em> — Who are you going with?<br><br><b>O čemu?</b> — About what?<br><em>O čemu govoriš?</em> — What are you talking about?<br><br><b>Od koga?</b> — From whom?<br><em>Od koga je to?</em> — Who is that from?<br><br><b>Kome?</b> — To whom?<br><em>Kome pišeš?</em> — Who are you writing to?<br><br>Why they look different from <em>tko</em> and <em>što</em> will make complete sense once you've done Section 2. Until then, treat them as vocabulary."},
    {h:"koji, čiji and kakav change with the thing you're asking about",
     b:"These three copy the gender of the noun, exactly like an adjective. The three forms are always <b>masculine / feminine / neuter</b>, in that order:<table><tr><th></th><th>m</th><th>f</th><th>n</th></tr><tr><td class='cs'>which</td><td class='hr'>koji</td><td class='hr'>koja</td><td class='hr'>koje</td></tr><tr><td class='cs'>whose</td><td class='hr'>čiji</td><td class='hr'>čija</td><td class='hr'>čije</td></tr><tr><td class='cs'>what kind of</td><td class='hr'>kakav</td><td class='hr'>kakva</td><td class='hr'>kakvo</td></tr></table>Pick the form by the noun you are asking about:<br><br><b>Koji</b> auto? — Which car? <em>(auto, masculine)</em><br><b>Koja</b> knjiga? — Which book? <em>(knjiga, feminine)</em><br><b>Koje</b> pivo? — Which beer? <em>(pivo, neuter)</em><br><br><b>Čiji</b> je ovo auto? — Whose car is this?<br><b>Čija</b> je ovo torba? — Whose bag is this?<br><b>Kakvo</b> je vrijeme? — What is the weather like? <em>(vrijeme, neuter)</em><br><br>Not sure of a noun's gender? The ending tells you: consonant = masculine, <b>-a</b> = feminine, <b>-o</b> or <b>-e</b> = neuter."},
    {h:"Yes-no questions",
     b:"There's one pattern, not three: take the verb and put <b>li</b> right after it. <b>li</b> is the question marker — it has no English translation, it just signals that this is a yes/no question.<br><br><b>With any ordinary verb — verb + li:</b><br><b>Ideš li?</b> — Are you going?<br><b>Imaš li kruha?</b> — Do you have any bread?<br><b>Govorite li engleski?</b> — Do you speak English?<br><b>Možeš li mi pomoći?</b> — Can you help me?<br><br><b>With <em>biti</em> (to be), use the long form + li.</b> This is where <em>je li</em> and <em>jesi li</em> both come from — the same construction, different person:<table><tr><th>person</th><th>question</th><th>meaning</th></tr><tr><td class='cs'>ja</td><td class='hr'>jesam li</td><td>am I</td></tr><tr><td class='cs'>ti</td><td class='hr'>jesi li</td><td>are you</td></tr><tr><td class='cs'>on / ona / ono</td><td class='hr'>je li</td><td>is he / she / it</td></tr><tr><td class='cs'>mi</td><td class='hr'>jesmo li</td><td>are we</td></tr><tr><td class='cs'>vi</td><td class='hr'>jeste li</td><td>are you (formal / plural)</td></tr><tr><td class='cs'>oni</td><td class='hr'>jesu li</td><td>are they</td></tr></table><b>Jesi li</b> umoran? — Are you tired?<br><b>Je li</b> ovo tvoje? — Is this yours?<br><b>Jeste li</b> spremni? — Are you ready? (formal)<br><br>So yes — <b>jesi li</b> is completely correct. Use it when the subject is <em>you</em>; <em>je li</em> when the subject is he, she or it.<br><br><b>What about <em>da li</em>?</b> <em>Da li ideš?</em> also means <em>Are you going?</em> and you will hear it constantly. It is understood everywhere, but Croatian style guides prefer <b>Ideš li?</b> — <em>da li</em> is more associated with Serbian usage. Recognise it, but produce <em>Ideš li?</em><br><br><b>Or just raise your voice:</b> <em>Ideš?</em> Completely normal in speech."},
    {h:"The survival questions",
     b:"Memorise these word for word. They keep a conversation alive when nothing else will:<br><br><b>Što znači to?</b> — What does that mean?<br><b>Kako se kaže … na hrvatskom?</b> — How do you say … in Croatian?<br><b>Možete li ponoviti?</b> — Could you repeat that?<br><b>Možete li govoriti sporije?</b> — Could you speak more slowly?<br><b>Gdje je…?</b> — Where is…?<br><b>Koliko košta?</b> — How much does it cost?<br><b>Ne razumijem.</b> — I do not understand."}
  ],
  vocab:[["tko","who"],["što","what"],["gdje","where"],["kamo","where to"],["odakle","where from"],
    ["kada","when"],["kako","how"],["zašto","why"],["zato što","because"],["koliko","how much"],
    ["koji","which"],["čiji","whose"],["kakav","what kind of"],["možda","maybe"],
    ["naravno","of course"],["stvarno","really"],["znači","means"],["pitanje","question"],["odgovor","answer"]],
  phrases:[["Što znači to?","What does that mean?"],
    ["Kako se kaže „apple\" na hrvatskom?","How do you say 'apple' in Croatian?"],
    ["Gdje je zahod?","Where is the toilet?"],["Koliko košta?","How much does it cost?"],
    ["S kim ideš?","Who are you going with?"],["O čemu govoriš?","What are you talking about?"],
    ["Zašto ne?","Why not?"],["Čiji je ovo auto?","Whose car is this?"]],
  drills:[

    {t:"mc",q:"'Who are you going with?' =",o:["Tko ideš?","S kim ideš?","Koga ideš?","Čime ideš?"],a:1,e:"S kim — learn it as a fixed phrase for now; the ending is explained in Section 2."},
    {t:"mc",q:"Ask a friend: Are you tired?",o:["Je li umoran?","Jesi li umoran?","Da umoran?","Umoran li?"],a:1,e:"The subject is you, so jesi li."},

    {t:"type",q:"Ask: Where is the toilet? (zahod)",a:["gdje je zahod"],e:"Gdje je zahod?"}
